<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Dual — HTML 프로토타입 데모</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- #122 (v0.4.7): 화면은 여전히 이 한 문서다. data-screen 은 S.phase(menu/setup/play/over) 와 타이틀 화면을 비추는 표시 상태이며
     새 문서·새 창·라우터가 아니다 — #128 "새 문서 로드당 1회" 튜토리얼 경계는 그대로다. -->
<div id="app" data-screen="title" data-prep="roster">
  <div id="titleScreen">
    <div class="kick">POCKET STRATEGY</div>
    <div class="logo">DIGIT<br>DUEL</div>
    <div class="titleArt" aria-hidden="true"><i></i><i class="b"></i><i></i><i></i><i></i><i class="q">?</i><i></i><i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i><i></i><i class="q">?</i><i></i><i class="a"></i><i></i><i></i><i></i></div>
    <div class="tag">정체를 숨기고, 한 수 앞을 읽다.</div>
    <div id="acctPanel" aria-live="polite"></div>
    <button class="primary big" type="button" onclick="uiStart()">시작 →</button>
  </div>
  <div id="appBar">
    <button id="btnBack" class="backBtn" type="button" onclick="uiBack()">←</button>
    <h1><span class="brand">DIGIT DUEL</span> <small id="phaseLabel"></small></h1>
    <button id="btnDrawerSide" class="barBtn" type="button" onclick="uiDrawer('side')">상세</button>
    <button id="btnDrawerLog" class="barBtn" type="button" onclick="uiDrawer('log')">기록</button>
  </div>
  <div id="toasts"></div>
  <div id="screenBody">
    <div id="left" class="panel">
      <div id="boardWrap"><div id="board"></div></div>
    </div>
    <div id="boardInfo"></div>
    <div id="right">
      <div id="drawerHead"><span id="drawerTitle"></span><button type="button" onclick="uiDrawer(null)">닫기</button></div>
      <div class="panel" id="sidePanel"></div>
      <details class="drawer" id="drawerLog"><summary>📜 공개 기록</summary><div class="drawerBody"><div id="log"></div></div></details>
      <details class="drawer" id="drawerMetrics"><summary>📊 경기 지표</summary><div class="drawerBody"><div id="metrics" style="font-size:12px;color:var(--dim)"></div></div></details>
    </div>
  </div>
  <div id="actionDock"><div class="row" id="turnBar"></div></div>
  <div id="drawerScrim" onclick="uiDrawer(null)"></div>
</div>
<div id="overlay" class="overlay hidden"><div class="box" id="overlayBox"></div></div>
<!-- #106 연출 배너 오버레이 (게임 모달 z50 위 · 튜토리얼 z60 아래) — 표시 전용, 규칙 상태 무관.
     #126: 결과 연출의 파편·섬광은 #fxFx 안에서만 만들어지며 난수를 쓰지 않는다 (인덱스 계산 고정). -->
<div id="fxBanner" class="hidden" role="status" aria-live="polite"><div id="fxFx" aria-hidden="true"></div><div class="fxBox"><div id="fxTitle"></div><div id="fxSub"></div></div></div>
<!-- #26 상황 도움말·튜토리얼 모달 — #260(CJ 2026-09-27)으로 제품 진입점·자동 표시·경기 중 도움말은 없다. 모듈은 회귀 검사용으로만 남는다 -->
<div id="tutHint" class="hidden" role="status" aria-live="polite"></div>
<div id="tutOverlay" class="hidden" aria-hidden="true"><div id="tutBox" role="dialog" aria-modal="true" aria-labelledby="tutTitle" aria-describedby="tutBody" tabindex="-1"></div></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui-overlays.js"></script>
  <script src="js/network.js"></script>
  <script src="js/account.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/bootstrap.js"></script>
</body>
</html>
