<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Dual — HTML 프로토타입 데모</title>
<style>
  :root{
    --bg:#12151c; --panel:#1c2130; --panel2:#242b3d; --line:#333c52;
    --txt:#e8ecf5; --dim:#8a93a8; --accent:#5b8cff; --danger:#ff5b6e; --ok:#4fd88a;
    --zoneA:#2a3350; --zoneB:#502a33; --forest:#1f3a2a; --mid:#2a2f3d;
    --fire:#ff7a4d; --water:#4da3ff; --grass:#5fd06b; --lightning:#ffd84d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px;}
  #app{display:flex; gap:12px; padding:12px; max-width:1200px; margin:0 auto;}
  h1{font-size:16px; margin-bottom:6px;}
  h2{font-size:14px; margin:8px 0 4px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;}
  #left{flex:0 0 auto;}
  #right{flex:1; min-width:300px; display:flex; flex-direction:column; gap:10px;}
  /* board */
  #board{display:grid; grid-template-columns:repeat(7,52px); grid-auto-rows:52px; gap:2px; user-select:none;}
  .cell{position:relative; border:1px solid #2a3040; border-radius:4px; background:var(--mid);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cell.zA{background:var(--zoneA);} .cell.zB{background:var(--zoneB);}
  .cell.forest{background:var(--forest);}
  .cell.hl-move{outline:2px solid var(--accent); outline-offset:-2px;}
  .cell.hl-attack{outline:2px solid var(--danger); outline-offset:-2px;}
  .cell.hl-sel{outline:2px solid #fff; outline-offset:-2px;}
  .cell .trace{position:absolute; top:1px; right:2px; font-size:11px;}
  .pc{width:42px; height:42px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; border:2px solid #0008; line-height:1.05; text-align:center;}
  .pc.own{box-shadow:0 0 0 2px #ffffff33;}
  .pc.p0{background:#33406e;} .pc.p1{background:#6e3340;}
  .pc.hiddenId{background:#3a4152;}
  .pc .el{font-size:9px; font-weight:normal;}
  .el-fire{color:var(--fire);} .el-water{color:var(--water);} .el-grass{color:var(--grass);} .el-lightning{color:var(--lightning);}
  .pc.immob{border-color:var(--danger);}
  .badge{display:inline-block; padding:1px 6px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); font-size:12px; margin:1px;}
  button{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px;}
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.35; cursor:default;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  #log{height:170px; overflow-y:auto; font-size:12px; line-height:1.5; color:var(--dim);}
  #log .imp{color:var(--txt);}
  #log .sys{color:var(--accent);}
  .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0;}
  /* overlays */
  .overlay{position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:50;}
  .overlay .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; max-width:560px; width:92%;
    max-height:92vh; overflow-y:auto;}
  .hidden{display:none !important;}
  /* battle */
  .fighter{display:flex; gap:10px; align-items:center; background:var(--panel2); border-radius:8px; padding:8px; margin:4px 0;}
  .hpbar{height:10px; background:#333; border-radius:5px; overflow:hidden; width:180px;}
  .hpbar>div{height:100%; background:var(--ok);}
  .dmgbar{height:6px; background:#333; border-radius:3px; overflow:hidden; width:180px; margin-top:2px;}
  .dmgbar>div{height:100%; background:var(--danger);}
  .status{font-size:11px; color:var(--dim);}
  #battleLog{height:120px; overflow-y:auto; font-size:12px; background:#0006; border-radius:6px; padding:6px; margin:6px 0; line-height:1.5;}
  .tray{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
  .trayItem{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; border:1px solid var(--line); border-radius:6px; cursor:pointer;}
  .trayItem.sel{border-color:#fff;}
  small{color:var(--dim);}
  table.mini{font-size:12px; border-collapse:collapse;}
  table.mini td{border:1px solid var(--line); padding:2px 6px;}
</style>
</head>
<body>
<div id="app">
  <div id="left" class="panel">
    <h1>Digit Dual <small id="phaseLabel"></small></h1>
    <div id="board"></div>
    <div class="row" id="turnBar"></div>
  </div>
  <div id="right">
    <div class="panel" id="sidePanel"></div>
    <div class="panel"><h2>로그</h2><div id="log"></div></div>
    <div class="panel"><h2>지표 (GDD-12 연동 스캐폴드)</h2><div id="metrics" style="font-size:12px;color:var(--dim)"></div></div>
    <div class="panel" style="font-size:11px;color:var(--dim)">
      기준: GDD-13 v0.7 확정 규칙 · 수치는 [DATA] 전투 수치 v0.1 제안값(승인 전 임시) ·
      간소화: 공용 스킬 일괄 선택, 대리 출전 순차 블라인드, 후퇴-탐색 금지 미구현, 제한 시간 미구현(60턴 제한만), 마지막 목격 칸 미표시(A/B는 v0.3.0)
    </div>
  </div>
</div>
<div id="overlay" class="overlay hidden"><div class="box" id="overlayBox"></div></div>

<script>
"use strict";
/* ===== 상수 — [DATA] 전투 수치 v0.1 제안값 (승인 전 임시) ===== */
const COLS=7, ROWS=13;
const BAL={
  minion:{hp:100,atk:22,skill:35,cd:2},
  ally:{hp:100,atk:16}, king:{hp:100,atk:16},
  captured:{hp:100,atk:20,skill:30,cd:2},
  advMult:1.3, disMult:0.75,
  burnPct:0.05, burnRounds:2, weakenPct:0.2, weakenHits:2,
  shieldPct:0.15, healPct:0.10, absorbCapPct:0.30, evadeReduce:0.3,
  commonHealPct:0.15, commonCd:2,
  maxRounds:6, maxTurns:60,
  itemPerBattle:2, itemPerRound:1, invMax:5, ballStart:3,
  captureAtkFailPct:0.25,
  eventsPerForest:3,
  itemHealPct:0.20
};
const ELEMS=["fire","water","grass","lightning"];
const ELEM_KO={fire:"불",water:"물",grass:"풀",lightning:"번개"};
const BEATS={fire:"grass",grass:"lightning",lightning:"water",water:"fire"}; // D1 제안: 불→풀→번개→물→불
const TYPE_KO={minion:"하수인",bomb:"폭탄",ally:"동료",trap:"함정",king:"왕",captured:"포획"};
const SKILL_KO={fire:"화염탄",water:"물대포",grass:"넝쿨 흡수",lightning:"낙뢰"};
const COMMON={evade:{ko:"회피 태세",desc:"다음 피격 30% 감소"}, heal:{ko:"응급 처치",desc:"HP 15% 회복"}};
const ITEMS={potion:{ko:"회복약",desc:"HP 20% 회복"}, cool:{ko:"쿨링수",desc:"스킬 쿨타임 초기화"}, cure:{ko:"해독제",desc:"상태이상 해제"}};
const PNAME=["P1(하단·청)","P2(상단·적)"];

/* ===== 상태 ===== */
let S=null;
function newGame(){
  S={
    phase:"setup", setupPlayer:0, current:0, turnCount:0,
    pieces:[], events:[], inv:[[],[]], balls:[BAL.ballStart,BAL.ballStart],
    commonSkillChoice:["evade","evade"],
    traces:[new Set(), new Set()],
    selected:null, mainUsed:false, battlesUsed:0,
    movedPiece:null, contactSet:[], firstBattleWonByMover:false,
    tempReveal:new Set(),
    battle:null, winner:null,
    metrics:{battles:0,judged:0,ties:0,pushes:0,searches:0,captures:0,captureFails:0,
             bombHitsMinion:0,bombClearedByVip:0,kingForestTurns:0,battleRefusals:0,
             attackerWins:0,defenderWins:0,kingStandoff:0},
    log:[]
  };
  // 말 생성 — P0: 11~13행(하단·화면 아래), P1: 1~3행
  for(const p of [0,1]){
    for(let i=0;i<6;i++) S.pieces.push(mkPiece(p,"minion",ELEMS[i%4]));
    for(let i=0;i<3;i++) S.pieces.push(mkPiece(p,"bomb"));
    for(let i=0;i<2;i++) S.pieces.push(mkPiece(p,"ally"));
    for(let i=0;i<2;i++) S.pieces.push(mkPiece(p,"trap"));
    S.pieces.push(mkPiece(p,"king"));
  }
  genEvents();
}
let PID=1;
function mkPiece(owner,type,element){
  const b = BAL[type]||{};
  return {id:PID++, owner, type, element:element||null,
    hp:b.hp||1, maxHp:b.hp||1, atk:b.atk||0, skillAtk:b.skill||0,
    cd:0, cdCommon:0, common:null,
    r:0,c:0, placed:false, revealed:false, alive:true,
    immobile:0, cap:null, /* 포획 하수인 {element,hp,maxHp,atk,skillAtk,cd} */
    // 전투 중 임시 상태
    burn:0, burnBy:null, weaken:0, shield:0, absorbed:0, shock:false, evadeCharge:false};
}
function genEvents(){
  S.events=[];
  for(const [rows,fid] of [[[4,5],0],[[9,10],1]]){
    const cells=[];
    for(const r of rows) for(let c=1;c<=COLS;c++) cells.push([r,c]);
    shuffle(cells);
    const kinds=shuffle(["item","item","recruit"]); // 양쪽 숲 동일 예산
    for(let i=0;i<BAL.eventsPerForest;i++)
      S.events.push({r:cells[i][0], c:cells[i][1], kind:kinds[i], consumed:false});
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== 유틸 ===== */
const alivePieces=()=>S.pieces.filter(p=>p.alive&&p.placed);
const at=(r,c)=>alivePieces().find(p=>p.r===r&&p.c===c);
const inForest=p=>(p.r>=4&&p.r<=5)||(p.r>=9&&p.r<=10);
const zoneOf=p=> p===0 ? [11,12,13] : [1,2,3];
const adj=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
function adjEnemies(p){return alivePieces().filter(e=>e.owner!==p.owner&&adj(p,e));}
function visibleTo(viewer,e){ // 위치 가시성
  if(e.owner===viewer) return true;
  if(!inForest(e)) return true;
  if(S.tempReveal.has(e.id)) return true;
  return alivePieces().some(m=>m.owner===viewer&&adj(m,e)); // 인접 일시 공개
}
function idLabel(viewer,p){
  if(p.owner===viewer||p.revealed) return TYPE_KO[p.type]+(p.element?"·"+ELEM_KO[p.element]:"");
  return "?";
}
function addLog(msg,cls){S.log.push({msg,cls:cls||""}); renderLog();}
function pct(n){return Math.round(n*100)+"%";}

/* ===== 렌더 ===== */
const $=id=>document.getElementById(id);
function render(){
  $("phaseLabel").textContent = S.phase==="setup" ? `— 배치: ${PNAME[S.setupPlayer]}`
    : S.phase==="play" ? `— ${PNAME[S.current]} 턴 ${S.turnCount+1}/${BAL.maxTurns}` : S.phase==="over"?"— 종료":"";
  renderBoard(); renderSide(); renderTurnBar(); renderMetrics();
}
function renderBoard(){
  const bd=$("board"); bd.innerHTML="";
  const viewer = S.phase==="setup"?S.setupPlayer:S.current;
  for(let r=1;r<=ROWS;r++) for(let c=1;c<=COLS;c++){
    const cell=document.createElement("div");
    cell.className="cell"+(r<=3?" zA":r<=5?" forest":r<=8?"":r<=10?" forest":" zB");
    cell.dataset.r=r; cell.dataset.c=c;
    // 흔적 (내 지식만)
    const ev=S.events.find(e=>e.r===r&&e.c===c&&!e.consumed);
    if(ev&&S.traces[viewer].has(ev.r+"_"+ev.c)){const t=document.createElement("span");t.className="trace";t.textContent="🔍";cell.appendChild(t);}
    const p=at(r,c);
    if(p&&visibleTo(viewer,p)){
      const chip=document.createElement("div");
      const known = p.owner===viewer||p.revealed;
      chip.className="pc p"+p.owner+(p.owner===viewer?" own":"")+(known?"":" hiddenId")+(p.immobile>0?" immob":"");
      chip.innerHTML = known
        ? `<span>${TYPE_KO[p.type]}</span>`+(p.element?`<span class="el el-${p.element}">${ELEM_KO[p.element]}</span>`:"")
          +(p.owner===viewer&&(p.type==="minion"||p.cap)?`<span class="el">${p.hp}</span>`:(p.revealed?`<span class="el">${p.hp}</span>`:""))
        : "?";
      cell.appendChild(chip);
    }
    // 하이라이트
    if(S.selected){
      const s=S.selected;
      if(S.phase==="setup"&&s.tray&&zoneOf(S.setupPlayer).includes(r)&&!at(r,c)) cell.classList.add("hl-move");
      if(S.phase==="play"&&!s.tray){
        if(s.id&&p&&p.id===s.id) cell.classList.add("hl-sel");
        if(canMoveTo(s,r,c)) cell.classList.add("hl-move");
        if(p&&p.owner!==s.owner&&adj(s,p)&&visibleTo(viewer,p)&&canBattle(s,p)) cell.classList.add("hl-attack");
      }
    }
    cell.onclick=()=>onCell(r,c);
    bd.appendChild(cell);
  }
}
function canMoveTo(p,r,c){
  if(S.phase!=="play"||S.mainUsed||p.owner!==S.current) return false;
  if(p.type==="bomb"||p.type==="trap") return false;
  if(p.immobile>0) return false;
  if(Math.abs(p.r-r)+Math.abs(p.c-c)!==1) return false;
  const o=at(r,c);
  if(o&&o.owner===p.owner) return false;
  if(o&&visibleTo(S.current,o)) return false; // 보이는 적 칸으로 이동 불가(전투로만)
  return true; // 빈 칸 또는 숨은 적(충돌 처리)
}
function canBattle(att,def){
  if(S.phase!=="play"||att.owner!==S.current||S.battlesUsed>=2) return false;
  if(att.type==="bomb"||att.type==="trap") return false;
  if(att.type==="king"&&def.type==="king") return false; // 왕 vs 왕 불가침
  if(S.battlesUsed===1){ // 연속 전투 조건
    if(!S.firstBattleWonByMover||!att.alive||att!==S.movedPiece) return false;
    if(!S.contactSet.includes(def.id)) return false;
  }
  return true;
}
function renderTurnBar(){
  const tb=$("turnBar"); tb.innerHTML="";
  if(S.phase!=="play") return;
  const mk=(txt,fn,dis,cls)=>{const b=document.createElement("button");b.textContent=txt;b.onclick=fn;b.disabled=!!dis;if(cls)b.className=cls;tb.appendChild(b);};
  mk("주 행동 생략",()=>{S.mainUsed=true;addLog(`${PNAME[S.current]} 주 행동 생략`);render();},S.mainUsed);
  // 탐색 버튼: 선택 말이 흔적 칸 위
  const sel=S.selected&&!S.selected.tray?S.selected:null;
  const ev=sel?S.events.find(e=>e.r===sel.r&&e.c===sel.c&&!e.consumed&&S.traces[S.current].has(e.r+"_"+e.c)):null;
  mk("탐색",()=>doSearch(sel,ev),!(sel&&ev&&!S.mainUsed&&sel.owner===S.current));
  mk("턴 종료",endTurn,false,"primary");
}
function renderSide(){
  const sp=$("sidePanel");
  if(S.phase==="setup"){renderSetup(sp);return;}
  if(S.phase==="over"){
    sp.innerHTML=`<h2>경기 종료</h2><p style="font-size:18px;margin:8px 0">${S.winner===null?"무승부 (60턴 도달)":PNAME[S.winner]+" 승리! 🏆"}</p>
    <button class="primary" onclick="location.reload()">새 경기</button>`;
    return;
  }
  const p=S.current;
  let h=`<h2>${PNAME[p]}</h2>
  <div class="row"><span class="badge">몬스터볼 ${S.balls[p]}</span>
  <span class="badge">아이템 ${S.inv[p].length}/${BAL.invMax}</span>
  <span class="badge">전투 ${S.battlesUsed}/2</span>
  <span class="badge">${S.mainUsed?"주 행동 완료":"주 행동 가능"}</span></div>
  <div class="row">${S.inv[p].map(i=>`<span class="badge">${ITEMS[i].ko}</span>`).join("")||"<small>아이템 없음</small>"}</div>`;
  if(S.selected&&!S.selected.tray){
    const s=S.selected;
    h+=`<h2>선택: ${idLabel(p,s)}</h2><div class="status">HP ${s.hp}/${s.maxHp}${s.type==="minion"?` · 스킬 쿨 ${s.cd} · 공용(${COMMON[s.common].ko}) 쿨 ${s.cdCommon}`:""}${s.immobile>0?` · 이동 불가 ${s.immobile}턴`:""}${s.cap?` · 포획 하수인(${ELEM_KO[s.cap.element]}) HP ${s.cap.hp}`:""}</div>
    <small>이동: 파란 칸 · 전투: 빨간 칸 클릭</small>`;
  } else h+=`<small>자기 말을 클릭해 선택하세요.</small>`;
  sp.innerHTML=h;
}
function renderSetup(sp){
  const p=S.setupPlayer;
  const mine=S.pieces.filter(x=>x.owner===p);
  const unplaced=mine.filter(x=>!x.placed);
  let h=`<h2>${PNAME[p]} 비공개 배치 (${14-unplaced.length}/14)</h2>
  <small>말을 클릭 → 자기 진영 칸 클릭. 배치된 말 클릭 시 회수. 하수인의 [속성]을 눌러 변경.</small>
  <div class="tray">`;
  for(const x of unplaced){
    h+=`<div class="trayItem ${S.selected&&S.selected.id===x.id?"sel":""}" onclick="selTray(${x.id})">
      <div class="pc p${p}"><span>${TYPE_KO[x.type]}</span>${x.element?`<span class="el el-${x.element}">${ELEM_KO[x.element]}</span>`:""}</div>
      ${x.type==="minion"?`<button style="font-size:10px;padding:1px 4px" onclick="event.stopPropagation();cycleElem(${x.id})">속성</button>`:""}
    </div>`;
  }
  h+=`</div><div class="row"><b>공용 스킬(하수인 전체):</b>`;
  for(const k of Object.keys(COMMON))
    h+=`<label><input type="radio" name="cs" ${S.commonSkillChoice[p]===k?"checked":""} onchange="S.commonSkillChoice[${p}]='${k}'"> ${COMMON[k].ko}<small> ${COMMON[k].desc}</small></label>`;
  h+=`</div><div class="row">
    <button onclick="autoPlace()">무작위 배치</button>
    <button onclick="clearPlace()">전체 회수</button>
    <button class="primary" onclick="setupDone()" ${unplaced.length?"disabled":""}>배치 완료</button></div>`;
  sp.innerHTML=h;
}
function renderLog(){
  const el=$("log");
  el.innerHTML=S.log.slice(-60).map(l=>`<div class="${l.cls}">${l.msg}</div>`).join("");
  el.scrollTop=el.scrollHeight;
}
function renderMetrics(){
  const m=S.metrics;
  $("metrics").innerHTML=`턴 ${S.turnCount} · 전투 ${m.battles} (판정 ${m.judged}·동률 ${m.ties}) · 공격측 승 ${m.attackerWins}/방어측 승 ${m.defenderWins} · 밀어내기 ${m.pushes} · 탐색 ${m.searches} · 포획 ${m.captures}(실패 ${m.captureFails}) · 폭탄: 하수인 소모 ${m.bombHitsMinion}/VIP 제거 ${m.bombClearedByVip} · 왕 숲 체류 ${m.kingForestTurns}턴 · 왕 대치 차단 ${m.kingStandoff}`;
}

/* ===== 배치 ===== */
window.selTray=id=>{S.selected={tray:true,id}; render();};
window.cycleElem=id=>{const x=S.pieces.find(p=>p.id===id); x.element=ELEMS[(ELEMS.indexOf(x.element)+1)%4]; render();};
window.autoPlace=()=>{
  const p=S.setupPlayer, rows=zoneOf(p);
  const cells=[]; for(const r of rows) for(let c=1;c<=COLS;c++) cells.push([r,c]);
  shuffle(cells); let i=0;
  for(const x of S.pieces.filter(x=>x.owner===p)){ if(!x.placed){const [r,c]=cells.find(([r,c],idx)=>!at(r,c)); x.r=r;x.c=c;x.placed=true;} }
  S.selected=null; render();
};
window.clearPlace=()=>{for(const x of S.pieces.filter(x=>x.owner===S.setupPlayer)){x.placed=false;} S.selected=null; render();};
window.setupDone=()=>{
  const p=S.setupPlayer;
  for(const x of S.pieces.filter(x=>x.owner===p&&x.type==="minion")) x.common=S.commonSkillChoice[p];
  S.selected=null;
  if(p===0){S.setupPlayer=1; handoff(PNAME[1]+" 배치", render);}
  else {S.phase="play"; S.current=0; startTurn(); handoff(PNAME[0]+" 턴 시작", render);}
};

/* ===== 턴 진행 ===== */
function startTurn(){
  S.mainUsed=false; S.battlesUsed=0; S.movedPiece=null; S.contactSet=[]; S.firstBattleWonByMover=false;
  S.selected=null; S.tempReveal.clear();
  addLog(`— ${PNAME[S.current]} 턴 ${S.turnCount+1} —`,"sys");
}
function endTurn(){
  // 이동 금지 감소 (자기 턴 종료 기준)
  for(const x of alivePieces()) if(x.owner===S.current&&x.immobile>0) x.immobile--;
  // 지표: 왕 숲 체류
  for(const k of alivePieces()) if(k.type==="king"&&inForest(k)) S.metrics.kingForestTurns++;
  // 전투 회피 지표: 전투 가능했는데 0회
  if(S.battlesUsed===0 && alivePieces().some(x=>x.owner===S.current&&adjEnemies(x).length&&x.type!=="bomb"&&x.type!=="trap")) S.metrics.battleRefusals++;
  S.turnCount++;
  if(S.turnCount>=BAL.maxTurns){S.phase="over";S.winner=null;addLog("60턴 도달 — 무승부","imp");render();return;}
  S.current=1-S.current; startTurn();
  handoff(PNAME[S.current]+" 턴 시작", render);
}
function onCell(r,c){
  if(S.phase==="setup"){
    const p=at(r,c);
    if(S.selected&&S.selected.tray&&zoneOf(S.setupPlayer).includes(r)&&!p){
      const x=S.pieces.find(z=>z.id===S.selected.id); x.r=r;x.c=c;x.placed=true; S.selected=null; render(); return;
    }
    if(p&&p.owner===S.setupPlayer){p.placed=false; S.selected=null; render();}
    return;
  }
  if(S.phase!=="play"||S.battle) return;
  const p=at(r,c);
  if(p&&p.owner===S.current){S.selected=p; render(); return;}
  const s=S.selected&&!S.selected.tray?S.selected:null;
  if(!s) return;
  if(p&&p.owner!==S.current&&adj(s,p)&&visibleTo(S.current,p)){ if(canBattle(s,p)) initBattle(s,p); return; }
  if(canMoveTo(s,r,c)) doMove(s,r,c);
}
function doMove(p,r,c){
  const hidden=at(r,c); // 숨은 적 (visible이면 이동 불가 처리됨)
  S.mainUsed=true;
  if(hidden){ // 숲 충돌: 직전 칸 정지 + 양측 일시 공개
    S.tempReveal.add(hidden.id); S.tempReveal.add(p.id);
    S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
    addLog(`${PNAME[p.owner]} 이동 중 숨은 말과 충돌! 위치가 일시 공개되었습니다.`,"imp");
    render(); return;
  }
  p.r=r; p.c=c;
  S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
  // 이벤트 칸 흔적
  const ev=S.events.find(e=>e.r===r&&e.c===c&&!e.consumed);
  if(ev){S.traces[p.owner].add(ev.r+"_"+ev.c); addLog("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)","imp");}
  render();
}

/* ===== 탐색·이벤트·포획 ===== */
function doSearch(p,ev){
  S.mainUsed=true; ev.consumed=true; S.metrics.searches++;
  addLog(`${PNAME[p.owner]} 숲 이벤트 발생`,"imp");
  addLog(`(상대 화면) 상대가 숲 이벤트를 발생시켰습니다.`);
  if(ev.kind==="item"){
    if(p.type==="ally"||p.type==="king"){
      const k=shuffle(Object.keys(ITEMS).slice())[0];
      if(S.inv[p.owner].length<BAL.invMax){S.inv[p.owner].push(k); modal(`<h2>아이템 획득</h2><p>${ITEMS[k].ko} — ${ITEMS[k].desc}</p>`,[["확인",close]]);}
      else modal(`<h2>인벤토리 가득</h2><p>아이템을 획득하지 못했습니다 (최대 ${BAL.invMax}).</p>`,[["확인",close]]);
    } else modal(`<h2>이벤트 소모</h2><p>하수인은 아이템을 획득할 수 없습니다.</p>`,[["확인",close]]);
  } else { // recruit: 공용 하수인
    if(p.type==="minion"){
      const other=p.common==="evade"?"heal":"evade";
      modal(`<h2>공용 하수인 발견</h2><p>이 하수인의 공용 스킬을 교체할까요?<br>현재: ${COMMON[p.common].ko} → ${COMMON[other].ko}(${COMMON[other].desc})</p>`,
        [["교체",()=>{p.common=other;close();render();}],["유지",close]]);
    } else if(p.cap){ modal(`<h2>공용 하수인 발견</h2><p>이미 포획 하수인을 보유 중입니다 (각 1개 제한).</p>`,[["확인",close]]); }
    else captureModal(p);
  }
  render();
}
function captureModal(p){
  const b=S.balls[p.owner];
  const opt=(name,cost,rate,risk,fn)=>`<div class="fighter"><b>${name}</b><small>볼 ${cost} · 성공 ${rate}${risk?" · "+risk:""}</small>
    <button ${b<cost?"disabled":""} onclick="window.__cap('${fn}')">시도</button></div>`;
  window.__cap=mode=>{
    const cost=mode==="safe"?2:1; S.balls[p.owner]-=cost;
    const roll=Math.random();
    const ok= mode==="safe" || (mode==="risky"&&roll<0.5) || (mode==="attack"&&roll<0.7);
    if(ok){
      const el=shuffle(ELEMS.slice())[0], cb=BAL.captured;
      p.cap={element:el,hp:cb.hp,maxHp:cb.hp,atk:cb.atk,skillAtk:cb.skill,cd:0,common:S.commonSkillChoice[p.owner],cdCommon:0};
      S.metrics.captures++;
      modal(`<h2>포획 성공!</h2><p>포획 하수인(${ELEM_KO[el]}) 확보 — 대리 출전 가능</p>`,[["확인",close]]);
    } else {
      S.metrics.captureFails++;
      let extra="";
      if(mode==="attack"){const d=Math.round(p.maxHp*BAL.captureAtkFailPct); p.hp=Math.max(1,p.hp-d); extra=`<br>탐색 말이 최대 HP 25% 피해 (HP ${p.hp})`;}
      modal(`<h2>포획 실패</h2><p>공용 하수인이 사라졌습니다.${extra}</p>`,[["확인",close]]);
    }
    render();
  };
  modal(`<h2>포획 시도 (몬스터볼 ${b})</h2><small>공격 포획 실패 시 최대 HP 25% 피해 경고!</small>
    ${opt("안전 포획",2,"100%","", "safe")}${opt("위험 포획",1,"50%","실패 시 소멸","risky")}${opt("공격 포획",1,"70%","실패 시 소멸+HP 25% 피해","attack")}`,
    [["포기",close]]);
}

/* ===== 전투 ===== */
function initBattle(att,def){
  // 폭탄
  if(def.type==="bomb"){
    S.battlesUsed++; S.metrics.battles++;
    def.alive=false;
    if(att.type==="minion"){att.alive=false; S.metrics.bombHitsMinion++;
      addLog(`💥 폭탄 발동! 공격한 말과 폭탄이 모두 제거되었습니다.`,"imp");}
    else {S.metrics.bombClearedByVip++;
      addLog(`💥 폭탄 발동! 폭탄만 제거되고 공격한 말은 생존했습니다. (정체 비공개 유지)`,"imp");}
    afterBattle(att,null,false); return;
  }
  // 함정
  if(def.type==="trap"){
    S.battlesUsed++; S.metrics.battles++;
    def.alive=false; att.immobile=2;
    addLog(`🪤 함정 발동! 함정은 제거되고 대상 말은 소유자 기준 2턴 이동 불가. (정체 비공개 유지)`,"imp");
    afterBattle(att,null,false); render(); return;
  }
  // 대리 출전 절차 (동료·왕 — 왕 전투 절차 준용)
  const needA=(att.type==="ally"||att.type==="king"), needD=(def.type==="ally"||def.type==="king");
  if(needA||needD){
    vipChoice(att,def,needA,needD);
    return;
  }
  startRounds(att,def,att,def);
}
function vipChoice(att,def,needA,needD){
  const choices={};
  const ask=(side,piece,next)=>{
    if(!(piece.type==="ally"||piece.type==="king")||!piece.cap){choices[side]="body"; next(); return;}
    modal(`<h2>🔒 ${PNAME[piece.owner]}만 확인 (상대는 시선 회피)</h2>
      <p>${TYPE_KO[piece.type]} 출전 선택 — 어느 쪽이 패배해도 ${piece.type==="king"?"경기 패배":"동료·포획 하수인 동시 제거"}입니다.</p>`,
      [["본체 출전",()=>{choices[side]="body";close();next();}],
       [`포획 하수인(${ELEM_KO[piece.cap.element]}) 출전`,()=>{choices[side]="cap";close();next();}]]);
  };
  ask("A",att,()=>ask("D",def,()=>{
    att.revealed=true; def.revealed=true; // 절차상 정체 공개
    const fa=choices.A==="cap"?att.cap:att, fd=choices.D==="cap"?def.cap:def;
    const aIsBody=(att.type==="ally"||att.type==="king")&&choices.A!=="cap";
    const dIsBody=(def.type==="ally"||def.type==="king")&&choices.D!=="cap";
    if(aIsBody&&dIsBody){ doPush(att,def); return; } // Q2-b C안: 양측 본체 → 밀어내기
    modal(`<h2>출전 공개</h2><p>공격: ${fa===att?idLabel(2,att):"포획 하수인("+ELEM_KO[fa.element]+")"} vs 방어: ${fd===def?idLabel(2,def):"포획 하수인("+ELEM_KO[fd.element]+")"}</p>`,
      [["전투 시작",()=>{close();startRounds(att,def,fa,fd);}]]);
  }));
}
function doPush(att,def){
  S.battlesUsed++; S.metrics.battles++; S.metrics.pushes++;
  const dr=def.r-att.r, dc=def.c-att.c, nr=def.r+dr, nc=def.c+dc;
  let msg;
  if(nr<1||nr>ROWS||nc<1||nc>COLS||at(nr,nc)) msg="밀 수 없는 위치 — 제자리 유지.";
  else {def.r=nr; def.c=nc; msg=`방어자가 1칸 밀려났습니다 (${nr}행 ${nc}열).`;}
  addLog(`🤜 양측 본체 출전 → 밀어내기! ${msg}`,"imp");
  modal(`<h2>밀어내기 (Q2-b)</h2><p>양측 모두 본체로 출전해 전투 대신 위치 판정. ${msg}</p>`,[["확인",()=>{close();afterBattle(att,null,false);render();}]]);
}
function startRounds(attP,defP,fa,fd){
  S.battlesUsed++; S.metrics.battles++;
  attP.revealed=true; defP.revealed=true;
  S.battle={attP,defP,fa,fd,round:1,phase:0/*0=선공,1=후공*/,
    recA:0,recD:0, itemsA:0,itemsD:0, itemRoundA:false,itemRoundD:false, lastItemA:null,lastItemD:null, blog:[]};
  resetBattleTemps(fa); resetBattleTemps(fd);
  battleModal();
}
function resetBattleTemps(f){f.burn=0;f.burnBy=null;f.weaken=0;f.shield=0;f.absorbed=0;f.shock=false;f.evadeCharge=false;}
function actorOfPhase(){
  const B=S.battle;
  let firstIsAtt = B.round%2===1; // 라운드마다 선공 교대, 1R=개시자
  // 감전: 해당 라운드 대상 강제 후공
  const fa=B.fa, fd=B.fd;
  if(firstIsAtt && fa.shock) firstIsAtt=false;
  if(!firstIsAtt && fd.shock) firstIsAtt=true;
  return B.phase===0 ? (firstIsAtt?"A":"D") : (firstIsAtt?"D":"A");
}
function battleModal(){
  const B=S.battle; if(!B) return;
  const side=actorOfPhase(), f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const ownerP=side==="A"?B.attP.owner:B.defP.owner;
  const fmt=(f,piece,rec,oppMax)=>{
    const nm=(f===piece)?TYPE_KO[piece.type]+(piece.element?"·"+ELEM_KO[piece.element]:""):"포획 하수인·"+ELEM_KO[f.element];
    return `<div class="fighter"><div><b>${nm}</b> <small>(${PNAME[piece.owner]})</small>
      <div class="hpbar"><div style="width:${Math.max(0,f.hp/f.maxHp*100)}%"></div></div>
      <div class="dmgbar"><div style="width:${Math.min(100,rec/oppMax*100)}%"></div></div>
      <div class="status">HP ${f.hp}/${f.maxHp} · 가한 유효 피해 ${rec} (${pct(Math.min(1,rec/oppMax))})
      ${f.shield?` · 🛡${f.shield}`:""}${f.burn?` · 🔥화상${f.burn}R`:""}${f.weaken?` · 💧약화${f.weaken}`:""}${f.shock?" · ⚡감전":""}${f.evadeCharge?" · 회피":""}</div></div></div>`;
  };
  const canSkill=f.skillAtk&&f.cd===0, canCommon=f.common&&f.cdCommon===0;
  const usedItems=side==="A"?B.itemsA:B.itemsD, itemRound=side==="A"?B.itemRoundA:B.itemRoundD, lastItem=side==="A"?B.lastItemA:B.lastItemD;
  let itemBtns=S.inv[ownerP].map((k,i)=>
    `<button ${usedItems>=BAL.itemPerBattle||itemRound||k===lastItem?"disabled":""} onclick="window.__useItem(${i})">${ITEMS[k].ko}</button>`).join("");
  modal(`<h2>⚔️ 전투 — 라운드 ${B.round}/${BAL.maxRounds} · ${side==="A"?"공격측":"방어측"} 차례</h2>
    ${fmt(B.fa,B.attP,B.recA,B.fd.maxHp)}${fmt(B.fd,B.defP,B.recD,B.fa.maxHp)}
    <div id="battleLog">${B.blog.slice(-14).join("<br>")}</div>
    <div class="row"><b>${PNAME[ownerP]}:</b>
      <button onclick="window.__act('basic')">기본 공격 ${f.atk}</button>
      <button ${canSkill?"":"disabled"} onclick="window.__act('skill')">${f.element?SKILL_KO[f.element]:"스킬"} ${f.skillAtk||""}${f.cd?` (쿨${f.cd})`:""}</button>
      <button ${canCommon?"":"disabled"} onclick="window.__act('common')">${f.common?COMMON[f.common].ko:""}${f.cdCommon?` (쿨${f.cdCommon})`:""}</button>
    </div>
    <div class="row"><small>보너스 아이템(라운드당 1·전투당 2·연속 동일 불가):</small> ${itemBtns||"<small>없음</small>"}</div>`,
    []);
  window.__useItem=i=>{
    const k=S.inv[ownerP][i]; S.inv[ownerP].splice(i,1);
    if(side==="A"){B.itemsA++;B.itemRoundA=true;B.lastItemA=k;} else {B.itemsD++;B.itemRoundD=true;B.lastItemD=k;}
    if(k==="potion"){const h=Math.round(f.maxHp*BAL.itemHealPct); f.hp=Math.min(f.maxHp,f.hp+h); B.blog.push(`🧪 회복약 +${h}`);}
    if(k==="cool"){f.cd=0; B.blog.push("🧪 쿨링수 — 스킬 쿨 초기화");}
    if(k==="cure"){f.burn=0;f.weaken=0;f.shock=false; B.blog.push("🧪 해독제 — 상태이상 해제");}
    battleModal();
  };
  window.__act=kind=>{
    if(kind==="common"){
      if(f.common==="evade"){f.evadeCharge=true; B.blog.push(`${sideName(side)} 회피 태세`);}
      else {const h=Math.round(f.maxHp*BAL.commonHealPct); f.hp=Math.min(f.maxHp,f.hp+h); B.blog.push(`${sideName(side)} 응급 처치 +${h}`);}
      f.cdCommon=BAL.commonCd;
    } else {
      const isSkill=kind==="skill";
      let dmg=isSkill?f.skillAtk:f.atk;
      if(isSkill) f.cd=BAL.minion.cd;
      if(f.weaken>0){dmg=Math.round(dmg*(1-BAL.weakenPct)); f.weaken--;}
      if(f.element&&opp.element){
        if(BEATS[f.element]===opp.element) dmg=Math.round(dmg*BAL.advMult);
        else if(BEATS[opp.element]===f.element) dmg=Math.round(dmg*BAL.disMult);
      }
      if(isSkill&&f.element==="grass"){ // 넝쿨 흡수: 저피해 + 보호막/회복
        dmg=Math.round(dmg*0.6);
        f.shield=Math.round(f.maxHp*BAL.shieldPct);
        f.hp=Math.min(f.maxHp,f.hp+Math.round(f.maxHp*BAL.healPct));
        B.blog.push(`${sideName(side)} 보호막·회복 획득`);
      }
      if(opp.evadeCharge){dmg=Math.round(dmg*(1-BAL.evadeReduce)); opp.evadeCharge=false; B.blog.push("상대가 회피 태세로 피해 감소");}
      // 보호막 흡수 (판정 인정 상한 30%)
      let absorbed=Math.min(dmg,opp.shield); opp.shield-=absorbed;
      let hpDmg=dmg-absorbed;
      const actual=Math.min(hpDmg,opp.hp); opp.hp-=actual;
      const capLeft=Math.max(0,Math.round(opp.maxHp*BAL.absorbCapPct)-opp.absorbed);
      const freeAbsorb=Math.min(absorbed,capLeft); opp.absorbed+=freeAbsorb;
      const counted=actual+(absorbed-freeAbsorb);
      addRec(side,counted,opp);
      B.blog.push(`${sideName(side)} ${isSkill?(f.element?SKILL_KO[f.element]:"스킬"):"기본 공격"} → ${dmg} 피해${absorbed?` (흡수 ${absorbed})`:""} · 유효 ${counted}`);
      // 상태이상 부여 (동일 상태 중복 불가)
      if(isSkill&&f.element==="fire"&&!opp.burn){opp.burn=BAL.burnRounds; opp.burnBy=side; B.blog.push("🔥 화상 부여");}
      if(isSkill&&f.element==="water"&&!opp.weaken){opp.weaken=BAL.weakenHits; B.blog.push("💧 약화 부여");}
      if(isSkill&&f.element==="lightning"&&!opp.shock){opp.shock=true; B.blog.push("⚡ 감전 — 다음 라운드 후공");}
    }
    if(checkDeath()) return;
    nextPhase();
  };
}
function sideName(s){return s==="A"?"공격측":"방어측";}
function addRec(side,amount,opp){
  const B=S.battle;
  if(side==="A") B.recA=Math.min(B.fd.maxHp,B.recA+amount);
  else B.recD=Math.min(B.fa.maxHp,B.recD+amount);
}
function nextPhase(){
  const B=S.battle;
  if(B.phase===0){B.phase=1; battleModal(); return;}
  // 라운드 종료: 화상 틱, 쿨 감소, 감전 해제, 아이템 라운드 리셋
  for(const [f,side] of [[B.fa,"A"],[B.fd,"D"]]){
    if(f.burn>0){const d=Math.min(f.hp,Math.round(f.maxHp*BAL.burnPct)); f.hp-=d; f.burn--;
      addRec(f.burnBy,d,f); B.blog.push(`🔥 ${sideName(side)} 화상 피해 ${d}`);
      if(checkDeath()) return;}
    if(f.cd>0)f.cd--; if(f.cdCommon>0)f.cdCommon--;
    f.shock=false;
  }
  B.itemRoundA=false; B.itemRoundD=false;
  B.round++;
  if(B.round>BAL.maxRounds){judge(); return;}
  B.phase=0; battleModal();
}
function checkDeath(){
  const B=S.battle;
  if(B.fd.hp<=0){finishBattle("A","즉사"); return true;}
  if(B.fa.hp<=0){finishBattle("D","즉사"); return true;}
  return false;
}
function judge(){
  const B=S.battle; S.metrics.judged++;
  const ra=B.recA/B.fd.maxHp, rd=B.recD/B.fa.maxHp;
  if(ra>rd) finishBattle("A",`판정 ${pct(ra)} vs ${pct(rd)}`);
  else if(rd>ra) finishBattle("D",`판정 ${pct(rd)} vs ${pct(ra)}`);
  else {S.metrics.ties++; finishBattle("D","동률 — 방어자 승");}
}
function finishBattle(winSide,how){
  const B=S.battle;
  const winP=winSide==="A"?B.attP:B.defP, loseP=winSide==="A"?B.defP:B.attP;
  const loseF=winSide==="A"?B.fd:B.fa;
  if(winSide==="A")S.metrics.attackerWins++; else S.metrics.defenderWins++;
  // 패자 처리
  let msg;
  if(loseF===loseP){ // 본체 패배
    loseP.alive=false;
    msg=`${TYPE_KO[loseP.type]} 패배(${how}) — 제거`;
  } else { // 포획 하수인 패배 → 본체 동시 처리
    loseP.cap=null; loseP.alive=false;
    msg=`포획 하수인 패배(${how}) — ${TYPE_KO[loseP.type]} 동시 ${loseP.type==="king"?"패배":"제거"}`;
  }
  addLog(`⚔️ 전투 종료: ${PNAME[winP.owner]} 승 — ${msg}`,"imp");
  // 상태이상 해제(전투 종료), HP·쿨 유지
  resetAfter(B.fa); resetAfter(B.fd);
  const attacker=B.attP;
  S.battle=null; close();
  if(loseP.type==="king"){S.phase="over"; S.winner=winP.owner; render(); return;}
  afterBattle(attacker, winSide==="A"?attacker:null, winSide==="A"&&attacker.alive);
  render();
}
function resetAfter(f){f.burn=0;f.burnBy=null;f.weaken=0;f.shield=0;f.absorbed=0;f.shock=false;f.evadeCharge=false;}
function afterBattle(attacker,winner,attackerWonAlive){
  if(S.battlesUsed===1 && attacker===S.movedPiece && attackerWonAlive) S.firstBattleWonByMover=true;
  else if(S.battlesUsed===1) S.firstBattleWonByMover=false;
  render();
}

/* ===== 모달·핸드오프 ===== */
function modal(html,buttons){
  $("overlayBox").innerHTML=html+`<div class="row" id="obBtns"></div>`;
  const ob=$("obBtns");
  for(const [txt,fn] of buttons){const b=document.createElement("button"); b.textContent=txt; b.onclick=fn; b.className="primary"; ob.appendChild(b);}
  $("overlay").classList.remove("hidden");
}
function close(){$("overlay").classList.add("hidden");}
function handoff(title,after){
  modal(`<h2>🔄 기기를 넘기세요</h2><p style="margin:10px 0">${title}</p><small>상대는 화면을 보지 마세요.</small>`,
    [["확인 — 시작",()=>{close();after();}]]);
}
