<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Dual — HTML 프로토타입 데모</title>
<style>
  :root{
    --bg:#12151c; --panel:#1c2130; --panel2:#242b3d; --line:#333c52;
    --txt:#e8ecf5; --dim:#8a93a8; --accent:#5b8cff; --danger:#ff5b6e; --ok:#4fd88a;
    --zoneA:#2a3350; --zoneB:#502a33; --forest:#1f3a2a; --mid:#2a2f3d;
    --fire:#ff7a4d; --water:#4da3ff; --grass:#5fd06b; --lightning:#ffd84d;
    --heal:#4fd88a; --guard:#4da3ff; --buff:#ffd84d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px;}
  #app{display:flex; gap:12px; padding:12px; max-width:1200px; margin:0 auto;}
  h1{font-size:16px; margin-bottom:6px;}
  h2{font-size:14px; margin:8px 0 4px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;}
  #left{flex:0 0 auto; position:relative;}
  #toasts{position:absolute; top:44px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; z-index:40; pointer-events:none; width:max-content; max-width:92%;}
  .toast{background:#000d; border:1px solid var(--line); border-radius:8px; padding:6px 14px; font-size:12px; color:var(--txt); animation:toastFade 2.2s forwards;}
  @keyframes toastFade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0}}
  #right{flex:1; min-width:300px; display:flex; flex-direction:column; gap:10px;}
  #board{display:grid; grid-template-columns:repeat(7,52px); grid-auto-rows:52px; gap:2px; user-select:none;}
  .cell{position:relative; border:1px solid #2a3040; border-radius:4px; background:var(--mid);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cell.zA{background:var(--zoneA);} .cell.zB{background:var(--zoneB);}
  .cell.forest{background:var(--forest);}
  .cell.hl-move{outline:2px solid var(--accent); outline-offset:-2px;}
  .cell.hl-attack{outline:2px solid var(--danger); outline-offset:-2px;}
  .cell.hl-sel{outline:2px solid #fff; outline-offset:-2px;}
  .cell .trace{position:absolute; top:1px; right:2px; font-size:11px;}
  /* #36 추측 이모지: 물음표 자리에 뷰어 전용 반투명 표시 — 실제 공개 말과 구별 (점선 테두리·opacity .5) */
  .pc.memo-guess{border-style:dashed; border-color:#fff8;}
  .pc.memo-guess .guess{font-size:20px; opacity:.5; line-height:1;}
  .memo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0;}
  .memo-opt{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:12px; min-height:56px;}
  .memo-opt .ico{font-size:22px; line-height:1;}
  .memo-opt[aria-pressed="true"]{background:var(--accent); border-color:#fff; box-shadow:0 0 0 1px #fff8; color:#fff;}
  .memo-opt:focus-visible{outline:2px solid #fff; outline-offset:1px;}
  /* #89 말 컨테이너: 48×48 라운드 사각(내부 44 = 아이콘 32 + 간격 1 + 정보 행 11, 겹침 없음). 칸 52px는 불변이며 각 변 1px 여백이 남는다 */
  .pc{width:48px; height:48px; border-radius:12px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:11px; font-weight:bold; border:2px solid #0008; line-height:1.05; text-align:center; overflow:hidden;}
  .pc.own{box-shadow:inset 0 0 0 2px #ffffff33;} /* #89 inset — 48+2+2=52 는 칸 내부 50px 을 넘으므로 바깥 그림자를 쓰지 않는다 */
  .pc.p0{background:#33406e;} .pc.p1{background:#6e3340;}
  .pc.hiddenId{background:#3a4152;}
  /* #89 종 아이콘: native 32×32 도트를 1:1 표시 (보간 대신 최근접 확대 요청 — CSS px 정수가 선명도를 보장하지는 않는다) */
  .pc .icon{width:32px; height:32px; object-fit:contain; image-rendering:pixelated; display:block;}
  .pc .face{width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1;}
  .pc .face .nm{max-width:32px;}
  /* #89 글리프 폴백: 플랫폼에 그 이모지 글리프가 없을 때(예: 일부 Windows 의 🪤) 같은 뜻의 짧은 텍스트로 되돌린다 */
  .pc .face .sym.ng{font-size:11px; font-weight:bold; line-height:1.05;}
  .pc .info .sym.ng{font-size:9px;}
  .pc.memo-guess .guess.ng{font-size:11px; font-weight:bold;}
  /* #89 정보 행: 아이콘 아래 별도 한 줄 — 원소 기호 + 현재 HP. 아이콘 영역(32×32)을 덮지 않는다 */
  .pc .info{height:11px; line-height:11px; font-size:10px; font-weight:normal; max-width:44px; display:flex; align-items:center; justify-content:center; gap:2px; white-space:nowrap;}
  .pc .info .sym{font-size:10px; line-height:1;}
  .pc .nm{font-size:9px; max-width:40px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rosterCard{display:flex; flex-direction:column; gap:1px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
    cursor:pointer; font-size:10px; background:var(--panel2); color:var(--dim);}
  .rosterCard b{font-size:12px;}
  .rosterCard.on{border-color:#fff; box-shadow:0 0 0 1px #fff5;}
  /* #89 하수인 설명창 일러스트: 512 원본을 192로 축소 표시 (일반 일러스트이므로 pixelated 미적용 — 브라우저 보간 축소가 정상) */
  .rosterArt{display:flex; justify-content:center; margin:2px 0 8px;}
  .rosterArt img{width:192px; height:192px; object-fit:contain; border-radius:8px; background:#0003;}
  /* #89 일러스트 두 단계 모두 실패: 같은 자리·같은 크기의 대체 표시 (모달 레이아웃이 튀지 않는다) */
  .rosterArt.fb{width:192px; height:192px; margin:2px auto 8px; align-items:center; border-radius:8px; background:#0003; color:var(--dim); font-size:12px; text-align:center;}
  /* 규격 5.1: 화면 높이가 부족하면 128~160px. Saturn 1차 QA(#89) 수정 — 이 @media 규칙은 반드시 .rosterArt.fb 뒤에 온다:
     .rosterArt.fb 와 @media 안의 .rosterArt.fb 는 특이성이 같아(0,2,0) 소스 순서로 승자가 정해진다. 앞에 두면 짧은 화면에서 대체상자가 192로 커지고 버튼이 밀린다 */
  @media (max-height:700px){ .rosterArt img,.rosterArt.fb{width:128px; height:128px;} }
  .el-fire{color:var(--fire);} .el-water{color:var(--water);} .el-grass{color:var(--grass);} .el-lightning{color:var(--lightning);}
  .pc.immob{border-color:var(--danger);}
  /* ===== #106 턴 흐름·연출 (v0.4.4 turn-flow 계약 3·4·5장) — 표시 계층 전용 ===== */
  .pc.healing{box-shadow:0 0 0 2px var(--heal), 0 0 12px var(--heal); animation:healPulse 1.6s ease-in-out infinite;} /* 회복 자세: 소유자 화면 항상, 상대 화면은 공개 말만 (H8) */
  @keyframes healPulse{0%,100%{box-shadow:0 0 0 2px var(--heal),0 0 6px var(--heal)}50%{box-shadow:0 0 0 2px var(--heal),0 0 16px var(--heal)}}
  .pc.fx-ghost{opacity:.9; animation:ghostBoom 1.2s ease-out forwards;} /* 폭발 표시 유지(hold): 규칙상 이미 제거된 말을 연출이 끝날 때까지 그린다 */
  @keyframes ghostBoom{0%{filter:brightness(2.2)}60%{filter:brightness(1.4)}100%{opacity:.15; filter:brightness(.6)}}
  .cell.fx-boom{animation:cellBoom 1.2s ease-out;} .cell.fx-boom::after{content:"💥"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; pointer-events:none; animation:boomPop 1.2s ease-out forwards;}
  @keyframes cellBoom{0%{background:#ffd84d; box-shadow:0 0 30px #ff7a4d}30%{background:#ff7a4d}100%{}}
  @keyframes boomPop{0%{transform:scale(.4); opacity:1}40%{transform:scale(1.4); opacity:1}100%{transform:scale(1.1); opacity:0}}
  .cell.fx-trap{animation:trapBlink 1.2s;} .cell.fx-trap::after{content:"🪤"; position:absolute; top:-6px; right:-4px; font-size:18px; pointer-events:none;}
  @keyframes trapBlink{0%,20%,40%{outline:3px solid var(--danger); outline-offset:-3px}10%,30%,100%{outline:3px solid transparent}}
  #fxBanner{position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center; background:#000a; pointer-events:auto;}
  #fxBanner.nodim{background:transparent;} /* 폭발·함정: 보드를 보여 주면서 입력만 막는다 */
  #fxBanner .fxBox{text-align:center; padding:22px 34px; border-radius:14px; background:#0b0e14e8; border:1px solid var(--line); box-shadow:0 10px 40px #000c; max-width:92vw; animation:bannerIn .35s ease-out;}
  #fxBanner.nodim .fxBox{display:none;}
  @keyframes bannerIn{0%{transform:scale(.7); opacity:0}100%{transform:scale(1); opacity:1}}
  #fxTitle{font-size:34px; font-weight:bold; line-height:1.25;}
  #fxSub{font-size:15px; color:var(--dim); margin-top:8px; line-height:1.5; white-space:pre-line;}
  #fxBanner.count #fxTitle{font-size:84px; line-height:1;} #fxBanner.count .fxBox{background:transparent; border:none; box-shadow:none;}
  #fxBanner.result #fxTitle{font-size:40px; color:var(--buff);} #fxBanner.result.lose #fxTitle{color:var(--danger);}
  #fxBanner.contact #fxTitle{color:var(--danger);} #fxBanner.bt #fxTitle{color:var(--fire);} #fxBanner.mine #fxTitle{color:var(--accent);}
  body.fx-lock #board, body.fx-lock #turnBar button:not(.danger), body.fx-lock #overlayBox button{pointer-events:none;} /* 잠금 중 클릭 차단 — 기권만 허용 */
  /* 전투 4카테고리 메뉴·HP/방어막 바 */
  .bmenu{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0;}
  .bmenu button{font-size:15px; padding:12px 6px; font-weight:bold;}
  .bsub{margin:6px 0;}
  .bsub .row{gap:6px;}
  .bsub small{display:block; margin:2px 0 4px;}
  .shbar{height:5px; background:#222; border-radius:3px; overflow:hidden; width:180px; margin-top:2px;}
  .shbar>div{height:100%; background:var(--guard); transition:width .35s;} /* #125: HP 바 전환(.35s)은 아래 .hpbar>div 한 곳에서 — BAL.fx.barStep 과 같은 값 */
  #msgBox.big{font-size:18px; font-weight:bold; text-align:center;}
  @media (max-width:480px){ .bmenu button{font-size:13px; padding:10px 4px;} #fxTitle{font-size:26px;} #fxBanner.count #fxTitle{font-size:64px;} }
  .badge{display:inline-block; padding:1px 6px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); font-size:12px; margin:1px;}
  button{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px;}
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.35; cursor:default;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.big{font-size:16px; padding:12px 20px;}
  button.danger{border-color:var(--danger); color:var(--danger);}
  #log{height:170px; overflow-y:auto; font-size:12px; line-height:1.5; color:var(--dim);}
  #log .imp{color:var(--txt);}
  #log .sys{color:var(--accent);}
  #log .ai{color:#c9a25b;}
  .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0;}
  .overlay{position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:50;}
  .overlay .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; max-width:560px; width:92%;
    max-height:92vh; overflow-y:auto;}
  .hidden{display:none !important;}
  .fighter{display:flex; gap:10px; align-items:center; background:var(--panel2); border-radius:8px; padding:8px; margin:4px 0; position:relative;}
  .hpbar{height:10px; background:#333; border-radius:5px; overflow:hidden; width:180px;}
  .hpbar>div{height:100%; background:var(--ok); transition:width .35s;} /* #125 (종전 #106 5.5 = .6s): 약 0.35초 (BAL.fx.barStep 350). damageFx 1200 안에서 방어막 350 + HP 350 = 700ms, 여유 500ms */
  .dmgfloat{position:absolute; right:14px; top:2px; font-weight:bold; font-size:15px; pointer-events:none; animation:floatUp 1s ease-out forwards; text-shadow:0 1px 2px #000;}
  .dmgfloat .neg{color:var(--danger);}
  .dmgfloat .pos{color:var(--ok);}
  .dmgfloat .abs{color:var(--water); font-size:12px;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
  .dmgbar{height:6px; background:#333; border-radius:3px; overflow:hidden; width:180px; margin-top:2px;}
  .dmgbar>div{height:100%; background:var(--danger);}
  .status{font-size:11px; color:var(--dim);}
  #battleLog{height:120px; overflow-y:auto; font-size:12px; background:#0006; border-radius:6px; padding:6px; margin:6px 0; line-height:1.5;}
  /* 전투 스테이지 (포켓몬식 개편 — #6) */
  #bstage{position:relative; height:200px; border-radius:8px; margin:6px 0; overflow:hidden;
    background:linear-gradient(160deg,#1a2030,#242b3d); transition:box-shadow .3s;}
  .btok{position:absolute; width:88px; height:88px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:26px; border:3px solid #0006; box-shadow:0 4px 14px #0008; transition:opacity .6s;}
  .btok small{font-size:12px; color:#fffd; font-weight:bold;}
  .btok.tok-me{bottom:14px; left:30px;} .btok.tok-op{top:14px; right:30px;}
  /* #89 하수인 전투 도트: 원형 배경·테두리를 없애고 128×128 스프라이트 + 아래 그림자만 남긴다 (규격 6.2).
     자산이 없는 왕·동료·포획 하수인은 위의 원형 이모지 토큰을 그대로 쓴다 — 좁은 폭 겹침을 피하려 art 토큰만 안쪽 여백을 줄인다 */
  .btok.art{width:128px; height:auto; border-radius:0; border:none; background:none; box-shadow:none;}
  .btok.art.tok-me{left:8px;} .btok.art.tok-op{right:8px;}
  .btok .bsprite{width:128px; height:128px; object-fit:contain; image-rendering:pixelated; display:block;
    filter:drop-shadow(0 6px 5px #0009);}
  /* #121 계약 9 — 전투 버프 3종의 표시. **현재 전투원 토큰 주변**에만 붙는 CSS 효과이고, 한 전투 동안만 유지된다.
     규칙·난수·상태와 무관한 표시 계층 전용이며 3D·새 아트·화면 플로우 변경은 없다 (계약 범위). */
  .btok.buff-power{box-shadow:0 0 0 3px var(--danger), 0 0 18px var(--danger); animation:buffPower 1.1s ease-in-out infinite;}
  @keyframes buffPower{0%,100%{box-shadow:0 0 0 3px var(--danger),0 0 10px var(--danger)}50%{box-shadow:0 0 0 4px var(--danger),0 0 24px var(--danger)}}
  .btok.buff-power::before{content:"💪"; position:absolute; left:-6px; top:-6px; font-size:16px; pointer-events:none;}
  .btok.buff-escape{animation:buffWind 1.4s linear infinite;} /* 바람: 좌우로 흔들리는 기류 */
  @keyframes buffWind{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .btok.buff-escape::before{content:"🏃"; position:absolute; right:-6px; top:-6px; font-size:16px; pointer-events:none; animation:buffWindIco 1.4s linear infinite;}
  @keyframes buffWindIco{0%,100%{opacity:.55}50%{opacity:1}}
  .btok.buff-time{box-shadow:0 0 0 3px var(--acc), 0 0 16px var(--acc);}
  .btok.buff-time::after{content:"🧭"; position:absolute; right:-6px; bottom:-6px; font-size:16px; pointer-events:none; animation:buffTime 2.4s linear infinite;}
  @keyframes buffTime{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  .btok.shake{animation:bshake .5s;}
  @keyframes bshake{0%,100%{margin-left:0}20%{margin-left:-8px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:3px}}
  .btok.ko{opacity:0;}
  #bstage.sigblink{animation:sigblink .7s;}
  @keyframes sigblink{0%,100%{box-shadow:none}25%{box-shadow:inset 0 0 0 4px #fff8, inset 0 0 60px #ffd84d55}55%{box-shadow:inset 0 0 0 2px #fff5}}
  .btok .dmgfloat{left:50%; top:-18px; right:auto; margin-left:-18px;}
  #msgBox{min-height:46px; background:#000a; border:1px solid var(--line); border-radius:6px; padding:8px 10px;
    font-size:14px; line-height:1.6; margin:6px 0;}
  .tray{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
  .trayItem{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; border:1px solid var(--line); border-radius:6px; cursor:pointer;}
  .trayItem.sel{border-color:#fff;}
  small{color:var(--dim);}
  a.simlink{color:var(--dim); font-size:11px; text-decoration:underline; cursor:pointer;}
  /* ===== #26 튜토리얼 모달·상황 도움말 (게임 모달 #overlay z50 위 z60 · 도움말은 z45로 게임 모달 아래) ===== */
  .tutBtn{width:26px; height:26px; padding:0; border-radius:50%; font-size:14px; font-weight:bold; margin-left:6px; vertical-align:middle; line-height:1;}
  #tutOverlay{position:fixed; inset:0; background:#000d; display:flex; align-items:center; justify-content:center; z-index:60; padding:12px;}
  #tutBox{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 16px 14px; width:100%; max-width:420px;
    max-height:92vh; max-height:92dvh; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; outline:none;
    /* #42 카드 레이아웃 간격·크기는 이 변수들로만 관리 (절대좌표 없음). 폭·높이가 모자라면 auto-fit 열 수가 줄고 박스 내부 세로 스크롤로 reflow */
    --tut-gap:8px; --tut-card-pad:10px; --tut-card-min:220px; --tut-vis-h:80px; --tut-fs:14px; --tut-lh:1.55; --tut-h3:14px;}
  #tutBox:focus-visible{box-shadow:0 0 0 2px var(--accent);}
  .tut-head{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--dim);}
  #tutTitle{font-size:19px; text-align:center; margin:0; line-height:1.3;}
  #tutBox>*{flex-shrink:0;} /* 내용이 max-height를 넘으면 카드를 찌그러뜨리지 않고 박스 내부 스크롤 */
  /* ===== #42 장면 = 단계별 (1)~(n) 독립 카드 격자. 카드 = 번호 배지 · 제목 · 그림(공간 도형만 소형 SVG/DOM) · 결과 · 설명(DOM 자연 줄바꿈) ===== */
  .tut-scene{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--tut-card-min)),1fr)); gap:var(--tut-gap); align-items:stretch; min-width:0;}
  .tut-banner{grid-column:1/-1; justify-self:center; background:var(--zoneB); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:13px; font-weight:bold; text-align:center; overflow-wrap:anywhere;}
  .tut-card{display:flex; flex-direction:column; gap:6px; min-width:0; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:var(--tut-card-pad);}

<script>
"use strict";
/* ===== 상수 — [DATA] 전투 수치 v0.1 제안값 (승인 전 임시) ===== */
const COLS=7, ROWS=13;
const BAL={
  minion:{hp:100,atk:22,skill:35,cd:2},

  shieldPct:0.15, healPct:0.10, absorbCapPct:0.30,
  maxRounds:6, maxTurns:60, simMaxTurns:500, dmgVar:0.2,
  /* #121 (v0.4.7 계약 2.1·2.3): 시작 자원 회복약·쿨링수·해독제 각 1 · 공용 볼 2 · 보유 상한 전부 해제.

  shockProb:0.5, // #96 (v0.4.4 §4): 감전 부여 확률 — 일반 번개 효과기·레거시 비지속형 번개만. 잔류장·레거시 지속형은 100% 유지 (테스트는 statusProb와 함께 1로 고정)
  eventsPerForest:3, // #121 계약 1.1: 구역당 **정확히 3개** — itemGift·battleBuff·recruit 각 1개 (종전 #12 의 3~4개 무작위 추첨을 대체)
  ballMax:Infinity, nextBuffPct:0.15, /* #121 계약 2.1: 볼 보유 상한 해제. nextBuffPct 는 계약 1.3 으로 **탐색에서 더는 얻을 수 없다** —
     상수·계산 경로(f.atkBuff)는 남기고 생성만 끊었다 (지금 이 값을 켜는 경로는 없다) */
  enemyCapProb:0.7, // #12: 적 하수인 포획 성공률
  fleeProb:0.5, // #13: 도망 성공률 (자기 HP<50% 시 시도 가능)
  teleMax:Infinity, // #14 → #114 (v0.4.5 CJ 원문 "기존 2회 → 무제한"): 경기당 횟수 제한 해제. 사용 위치(상대 진영 진입)·주 행동 1회 소모·강제 접촉·전투 횟수 사전 차단·취소는 그대로. teleUsed 는 지표(teleports)와 함께 계속 기록한다
  enemyCapHp:70, // #20: 전투 중 적 하수인 포획(finishByCapture) 예비 하수인 시작 HP (maxHP 100 유지) — 숲 공용 포획(tryCapture)은 100/100
  itemHealPct:0.20,
  /* #121 계약 3 — 전투 버프 패키지 3종. 플레이어별 한 전투 1개, 아이템 회계와 별도, 무료 보너스 행동 */
  buffTimeRounds:3,   // 🧭 시간의 수호자: 그 전투만 양측 최대 3라운드 (BAL.maxRounds 전역은 불변 — S.battle.maxRounds 로만 처리)
  reaperRound:6,      // 💀 사신의 낫 봉인 해제 라운드 (자기 행동 차례 · 내 HP 비율 strict 열세 조건과 AND)
  witchEffects:2,     // 🕯 마녀의 장난: 4효과 중 서로 다른 2개 (균등 6조합 · 공유 rand 1회)
  aiDelay:650, simDelay:60, aiEps:0.08,
  aiStrongBudgetMs:120, aiStrongTopK:14, aiStrongReplyCap:36, // #21 5단: 판단 시간 상한·2-ply 후보 상한·상대 응수 상한
  healPostPct:0.05, // #106 (T2, CJ 최종): 회복 자세 — 각 플레이어 턴 종료마다 최대 HP 5% (나·상대 한 쌍 = 10%), 상한 maxHp, 정수 반올림
  /* #106 연출 시간(ms) — 계약 3.4 고정 상수. 모든 연출 시간은 이 표 한 곳에서만 읽는다. 규칙·난수와 무관한 표시 계층 전용이며
     헤드리스·sim(fxLive() false)에서는 전부 0 으로 취급된다. autoEnd: 자동 턴 종료 발화(4.6) 스위치 — 헤드리스 하네스는 기존 회귀 호환을 위해 끄고 전용 테스트에서 켠다
     #125 (v0.4.7 CJ 결정 — 2026-09-09): 전시성 배너·연출 그룹 12키(turnBanner·contactBanner·explosion·trapFx·roundBanner·skillFx·damageFx·itemFx·
     captureFx·fleeFx·judgeBanner·pushBanner)를 2000 → 1200ms 로 내린다. 이것은 "2000 일괄 치환"이 아니다 — resultBanner(2500)·countStep(1000)·
     roundEndFx(1000)·msgStep(600)·autoEndGrace(1000)·watchdog(1000)·BAL.aiDelay(650)은 범위 밖이라 그대로 둔다.

  fx:{turnBanner:1200,contactBanner:1200,explosion:1200,trapFx:1200,countStep:1000,roundBanner:1200,skillFx:1200,damageFx:1200,itemFx:1200,
      captureFx:1200,fleeFx:1200,resultBanner:2500,judgeBanner:1200,pushBanner:1200,roundEndFx:1000,msgStep:600,autoEndGrace:1000,watchdog:1000,autoEnd:true,
      barStep:350} /* 5.5 HP·방어막 바 너비 전환 시간(= CSS .hpbar>div/.shbar>div transition .35s). 방어막이 먼저 줄고 HP 바는 barStep 뒤에 시작해 둘 다 damageFx 안에서 끝난다.
     #125: damageFx 가 2000→1200 으로 줄면 종전 600+600=1200 은 damageFx 와 같아 여유가 0 이다(단계가 그룹 경계에 붙는다). barStep 과 CSS 두 바 전환을
     함께 350ms 로 내려 합 700ms, damageFx 안 여유 500ms 를 확보한다. 방어막→HP 순서·표시값·입력 잠금 계약은 불변. 불변식: 2*barStep ≤ damageFx */
};
/* ===== #21 시드 가능한 RNG — 게임 로직의 모든 난수는 rand()를 경유. setSeed(n)로 결정적 재현, setSeed(null)로 Math.random 복귀 ===== */
let RNG=null; // null → Math.random (테스트 하네스의 Math.random 오버라이드와 호환)
function rand(){return RNG?RNG():Math.random();}
function mulberry32(a){return function(){a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}
function setSeed(seed){RNG=(seed===null||seed===undefined)?null:mulberry32(Number(seed)>>>0); return RNG;}
window.setSeed=setSeed;

const WINTYPE_KO={king:"왕 제거",edge:"끝줄 승리",resign:"기권",draw:"무승부",wipe:"전멸"};
/* #36 추측 메모 선택지 — 저장은 key(안정 문자열)만, 표시는 emoji·ko. 순서 = 팝업 표시 순서 */
const MEMO_OPTS=[{key:"king",emoji:"👑",ko:"왕"},{key:"ally",emoji:"🤝",ko:"동료"},{key:"minion_fire",emoji:"🔥",ko:"불 하수인"},{key:"minion_grass",emoji:"🌿",ko:"풀 하수인"},
  {key:"minion_water",emoji:"💧",ko:"물 하수인"},{key:"minion_lightning",emoji:"⚡",ko:"전기 하수인"},{key:"bomb",emoji:"💣",ko:"폭탄"},{key:"trap",emoji:"🪤",ko:"함정"}];
const memoOpt=key=>MEMO_OPTS.find(o=>o.key===key)||null;
const SKILL_KO={fire:"화염탄",water:"물대포",grass:"넝쿨 흡수",lightning:"낙뢰"};
/* ===== 기술 4슬롯 체계 (GDD-16 v1.0 3장) — 속성 공격기 12종 + 공용 보조기 6종 + 시그니처 5종 ===== */
const SKILL_ATK_BASE=22; // 위력 스케일 기준: 최종 위력 = 기술 위력 × (종 atk / 22), 사사오입

function reaperWhy(side){
  const B=S.battle; if(!B) return "전투 중에만 사용할 수 있습니다";
  const f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const cap=battleMaxRounds();
  if(cap<BAL.reaperRound) return `이 전투는 ${cap}라운드까지입니다 — 봉인 해제 불가`; // 시간의 수호자 3R 전투
  if(B.round<BAL.reaperRound) return `${BAL.reaperRound}라운드부터 (현재 ${B.round}R) — 봉인`;
  const mine=f.hp/f.maxHp, theirs=opp.hp/opp.maxHp;
  if(!(mine<theirs)) return `내 HP 비율 ${pct(mine)} — 상대 ${pct(theirs)} 보다 낮아야 합니다`;
  return null;
}
/* 이 슬롯을 지금 실제로 쓸 수 있는가 — 쿨 + 기술 고유 게이트. 사람 UI·AI·기본 공격 폴백이 모두 이 한 함수를 본다 */

  if(!f.skills||f.cds[i]>0) return false;
  const sk=SKILLS[f.skills[i]];
  if(sk&&sk.reaper) return reaperWhy(side)===null;
  return true;
}

function aiRecruitSlot(p,alt){

}

function artDirOfFighter(pf,piece){

/* 플랫폼 글리프 지원 확인 — 일부 환경에는 최신 이모지 글리프가 어떤 설치 폰트에도 없어 빈 네모(두부)로 그려진다.
   실측(Windows 10 19045 · Chrome): 🪤(U+1FAA4)는 sans-serif · "Segoe UI Emoji" · Apple/Noto 를 모두 얹은 스택에서 폭이 두부와 같다 —
   즉 CSS 폰트 스택으로는 해결되지 않는 폰트 커버리지 문제다. 기호 계약은 그대로 두고, 그릴 수 없는 기호만 현행 텍스트 라벨로 되돌린다.
   측정이 불가능한 환경(canvas 없음)에서는 "지원함"으로 본다 — 기본 계약은 이모지다. */
const GLYPH={cache:{},font:'16px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif',NOTDEF:"\u{10FFFD}"};
function glyphOk(ch){
  if(!ch) return false;
  if(ch in GLYPH.cache) return GLYPH.cache[ch];

  try{
    const cv=document.createElement("canvas"), c=cv.getContext&&cv.getContext("2d");
    if(c&&c.measureText&&c.getImageData){

      c.font=GLYPH.font;
      const w=c.measureText(ch).width, tw=c.measureText(GLYPH.NOTDEF).width;

      if(w>0&&tw>0&&Math.abs(w-tw)<0.01){
        const px=s=>{ c.clearRect(0,0,cv.width,cv.height); c.fillStyle="#fff"; c.textBaseline="top"; c.font=GLYPH.font;

        const a=px(ch), b=px(GLYPH.NOTDEF);
        let same=a.length===b.length;
        for(let i=0;same&&i<a.length;i++) if(a[i]!==b[i]) same=false;
        ok=!same;
      }
    }

}

function canMoveTo(p,r,c){
  if(S.phase!=="play"||S.mainUsed||p.owner!==S.current) return false;
  if(p.type==="trap") return false; // 함정은 상시 고정 (GDD-13 4.5 개정 — 폭탄만 이동 상시화)
  if(p.immobile>0) return false;
  const d=Math.abs(p.r-r)+Math.abs(p.c-c);
  if(d!==1){
    // BT 이동 강화: 직선 2칸 (폭탄 포함·함정 제외, 출발·경유·도착이 원정 구역이면 불가)
    if(d!==2||(p.r!==r&&p.c!==c)||!isBurning()) return false;
    if(expedZone(p.owner,p.r)||expedZone(p.owner,(p.r+r)/2)||expedZone(p.owner,r)) return false;
    const m=at((p.r+r)/2,(p.c+c)/2);
    if(m&&visibleTo(p.owner,m)) return false; // 경유 칸의 보이는 말 차단 (숨은 적 충돌은 doMove가 해석)
  }
  const o=at(r,c);
  if(o&&o.owner===p.owner) return false;
  if(o&&visibleTo(p.owner,o)) return false;
  return true;
}
function canBattle(att,def){
  if(S.phase!=="play"||att.owner!==S.current||S.battlesUsed>=2) return false;
  if(att.type==="bomb"||att.type==="trap") return false;
  if(att.type==="king"&&def.type==="king"){return false;} // 왕 vs 왕 불가침
  if(S.forcedTargets&&S.forcedTargets.length&&(att!==S.movedPiece||!S.forcedTargets.includes(def.id))) return false; // T1: 강제 대상 외 전투 봉쇄
  if(S.battlesUsed===1){
    // #14: 텔레포트 스왑 둘째 말의 승계 강제 전투는 연쇄(첫 전투 승리) 조건 면제
    const forcedOk=S.forcedTargets&&S.forcedTargets.length&&att===S.movedPiece&&S.forcedTargets.includes(def.id);
    if(!forcedOk){
      if(!S.firstBattleWonByMover||!att.alive||att!==S.movedPiece) return false;
      if(!S.contactSet.includes(def.id)) return false;
    }
  }
  return true;
}

  mk("🌿 회복",()=>netAction({t:"heal",id:sel?sel.id:null}),!(sel&&canHeal(sel))); // #106 T2 회복 주 행동 — 자기 말 선택·하수인/동료/왕 (#114: 만피 말도 '기다리기'로 지정 가능)
  const forced=S.forcedTargets&&S.forcedTargets.length>0;
  /* #114 CJ 선택 A: 평소 [주 행동 생략]·[턴 종료] 버튼은 없다 — 할 수 있는 행동이 없으면 자동으로 넘어간다(autoEndCheck).
     주 행동을 마친 뒤 선택 전투가 남아 있을 때만 "싸우지 않고 종료" 를 표시해 기존 전투 선택권을 유지한다. 강제 대상이 남으면 표시하지 않는다 */
  if(S.mainUsed&&!forced&&!S.forcedQueue.length&&!S.teleport&&!fxLocked()&&$("overlay").classList.contains("hidden")&&optionalBattleLeft()) mk("싸우지 않고 종료",()=>netAction({t:"endTurn"}),false,"primary");
  mk("기권",confirmResign,false,"danger");
  if(forced){const s=document.createElement("span");s.className="badge";s.textContent="⚔️ 강제 전투 대상 선택";tb.appendChild(s);}
  if(aiTurn){const s=document.createElement("span");s.className="badge";s.textContent=(NET.mode&&!isAI(S.current))?"🌐 상대 턴 진행 중…":"🤖 AI 행동 중…";tb.appendChild(s);}

  // #20 플레이어별 핵심 행동 (합산과 이중 집계 정합: 각 키의 [0]+[1] = 합산)
  const per=[0,1].map(p=>`<div style="margin-top:3px"><b>${pname(p)}</b>${p===m.firstPlayer?" (선공)":""}${S.phase==="over"&&S.winner===p?" 🏆승자":""}: `+

/* #20 지표 저장용 스냅샷 (합산 + 플레이어별 + 승자·선공·승리 유형) — 헤드리스·리포트 공용 */

function beginPlay(){

/* ===== 배치 ===== */
window.selTrayCore=id=>{S.selected={tray:true,id}; render();};
window.toggleRosterCore=rid=>{ // 로스터 선택 토글 — 중복 불가·최대 6종, 변경 시 하수인 회수 후 스탯 재주입

  for(const x of S.pieces.filter(x=>x.owner===p&&x.type==="minion")) x.placed=false;

};
window.rosterInfo=rid=>{ // 로스터 정보 팝업 — [선택하기]/[선택 해제]는 toggleRoster와 동일 동작 (6/6·중복 불가 유지)
  const rd=ROSTER.find(r=>r.id===rid); if(!rd) return;
  const on=S.roster[S.setupPlayer].includes(rid);
  const slots=archSkills(rd.arch,rd.element);

  }).join("");
  netLocalModal(); // 로스터 정보 팝업은 로컬 전용 — 선택 확정(toggleRoster)만 동기화
  // #89 설명창 일러스트: 자기 로스터를 고르는 화면이므로 정보 은닉 대상이 아니다 (규격 5.3). 512 원본을 192로 축소 표시하고 실패 시 png → 숨김
  const rdir=rd.element+"_"+rd.arch;
  const rart=ART_DIR_SET.has(rdir)?`<div class="rosterArt"><img src="${artUrl(rdir,"portrait.webp")}" alt="${rd.name} 일러스트" width="192" height="192" onerror="artPortraitFail(this,'${rdir}')"></div>`:"";
  modal(`<h2 class="el-${rd.element}">${rd.name}</h2>${rart}
    <div class="row"><span class="badge el-${rd.element}">${ELEM_KO[rd.element]}</span><span class="badge">${ARCH_KO[rd.arch]}형</span>${on?`<span class="badge">✔ 선택됨</span>`:""}</div>
    <div class="status" style="margin:6px 0">HP ${rd.hp} · 공격 ${rd.atk} (기술 위력 = 표기 위력 × 공격/${SKILL_ATK_BASE})</div>
    ${rows}`,
    [[on?"선택 해제":"선택하기",()=>{close(); toggleRoster(rid);}],["닫기",close]]);
};
function fillRosterRandom(p){ // 미선택분을 무작위 종으로 채움 (중복 없음)
  const rest=shuffle(ROSTER.filter(r=>!S.roster[p].includes(r.id)).map(r=>r.id));
  while(S.roster[p].length<6) S.roster[p].push(rest.pop());
  applyRoster(p);
}
window.autoPlaceCore=()=>{
  const p=S.setupPlayer, rows=zoneOf(p);
  if(S.roster[p].length<6) fillRosterRandom(p);
  const cells=[]; for(const r of rows) for(let c=1;c<=COLS;c++) cells.push([r,c]);
  shuffle(cells);
  for(const x of S.pieces.filter(x=>x.owner===p&&!x.placed)){
    const cell=cells.find(([r,c])=>!at(r,c)); x.r=cell[0];x.c=cell[1];x.placed=true;
  }
  S.selected=null; render();
};
window.clearPlaceCore=()=>{for(const x of S.pieces.filter(x=>x.owner===S.setupPlayer)){x.placed=false;} S.selected=null; render();};
window.setupDoneCore=()=>{
  const p=S.setupPlayer;
  if(S.roster[p].length!==6||S.pieces.some(x=>x.owner===p&&!x.placed)){
    showToast("로스터 6종 선택과 14개 배치를 모두 완료하세요."); return;}
  S.selected=null;
  if(NET.preparing){ // 온라인: 내 배치 캡처 → 매칭 큐 진입 (게임은 매칭 후 공유 시드로 재생성)
    NET.mySetup={roster:S.roster[0].slice(), pos:S.pieces.filter(x=>x.owner===0).map(x=>[x.r,x.c])};
    NET.queued=true; render(); netConnect(); return;
  }
  if(S.mode==="pvp"){
    if(p===0){S.setupPlayer=1; handoff(pname(1)+" 배치", render);}
    else beginPlay();
  } else { // pve: 인간(0) 배치 완료 → AI 배치
    aiAutoPlace(1);
    addLog("AI 배치 완료.","ai");
    beginPlay();
  }
};

/* ===== 턴 진행 ===== */
function startTurn(){
  S.mainUsed=false; S.battlesUsed=0; S.movedPiece=null; S.contactSet=[]; S.firstBattleWonByMover=false;
  S.forcedTargets=[]; S.teleport=null; S.forcedQueue=[];
  S.selected=null; S.tempReveal.clear();
  for(const v of [0,1]) for(const id in S.memos[v]) // #11: 제거된 말의 메모 정리
    if(!S.pieces.some(x=>x.id===Number(id)&&x.alive&&x.placed)) delete S.memos[v][id];
  const tmsg=`— ${pname(S.current)} 턴 ${S.turnCount+1} —`;
  addLog(tmsg,"sys"); showToast(tmsg,"sys");
  if(isBurning()&&!S.metrics.btReached){ // BT 진입 1회 고지
    S.metrics.btReached=true; S.metrics.btEnterTurn=S.turnCount+1;
    S.btBannerDue=true; // #106 T9: "버닝타임입니다!" 배너를 턴 배너보다 먼저 1회 (turnBannerFx 가 소비 — 표시 전용·송신 없음)
    const bt="🔥 버닝 타임! 직선 2칸 이동 강화 개시 (폭탄 포함·함정 제외)";
    addLog(bt,"imp"); showToast(bt);
    if(S.mode!=="sim") tutHint("burning"); // #26 버닝 타임 첫 진입 1회 도움말 (게임 상태 무변경)
  }
}
/* ===== #106 T2 회복 주 행동 (CJ 최종 2026-09-08) =====
   지정 = 주 행동 소모, 자세는 재지정 없이 지속. 틱은 전역 플레이어 턴 종료(endTurn) 한 곳에서 양 플레이어의 자세 말 전부에 +round(maxHp×5%),
   상한 maxHp, 같은 turn 이중 틱 방지(S.healTickTurn). 지정 시점 즉시 회복 없음. 그 말의 이동·탐색·텔레포트·전투(공격·방어·폭탄·함정·밀어내기)·도망 교환은 자세를 해제한다.
   만피 도달은 자세를 풀지 않는다(회복량 0). 대상은 보드의 하수인·동료·왕(예비·폭탄·함정 제외), 지정 가능 조건은 현재 HP < 최대 HP. rand() 소비 없음 */
function healTargetOk(p){ return !!p&&p.alive&&p.placed&&(p.type==="minion"||p.type==="ally"||p.type==="king"); }
function canHeal(p){
  if(S.phase!=="play"||S.mainUsed||!p||p.owner!==S.current||!healTargetOk(p)) return false;
  if(S.teleport||S.fleePick||(S.forcedTargets&&S.forcedTargets.length)) return false;
  return !p.healing; // #114 (CJ 선택 A 동반 제안): 만피 말도 회복 자세 지정 가능 — "움직이지 않고 기다리기" 수단. 만피 틱은 회복량 0 (자세 유지)
}
function healVisibleTo(viewer,p){ return viewer===2||p.owner===viewer||p.revealed; } // H8: 미공개 상대 말의 회복은 표시·로그에 싣지 않는다
function doHeal(p){
  if(!canHeal(p)) return false;
  S.mainUsed=true; p.healing=true; met(p.owner,"heals"); S.selected=null;
  const v=humanViewer();
  if(S.mode==="sim"||healVisibleTo(v,p)){ const m=`🌿 ${idLabel(v,p)} 회복 자세 시작 (턴마다 최대 HP ${pct(BAL.healPostPct)})`; addLog(m,"imp"); if(!isAI(p.owner)) showToast(m); }
  else addLog("상대가 말 회복 행동을 했습니다.","imp"); // 미공개 말: 대상·위치 비공개 (중립 문구)
  render();
  return true;
}
function healBreak(p){ if(p&&p.healing){ p.healing=false; const v=humanViewer(); if(S.mode==="sim"||healVisibleTo(v,p)) addLog(`🌿 ${idLabel(v,p)} 회복 자세 해제`); } }
function healTick(){ // endTurn 에서 turn++ 직전 1회 — 양 플레이어의 자세 말 전부
  if(S.healTickTurn===S.turnCount) return; S.healTickTurn=S.turnCount;
  const v=humanViewer();
  for(const p of alivePieces()){ if(!p.healing||!healTargetOk(p)) continue;
    const gain=Math.min(Math.round(p.maxHp*BAL.healPostPct),p.maxHp-p.hp);
    if(gain>0){ p.hp+=gain; met(p.owner,"healHp",gain); }
    if(S.mode==="sim"||healVisibleTo(v,p)) addLog(gain>0?`🌿 ${idLabel(v,p)} HP +${gain} (회복 자세)`:`🌿 ${idLabel(v,p)} 최대 HP — 회복 자세 유지`);

}
function endTurn(){
  if(S.phase!=="play"||S.battle||S.fleePick||S.teleport) return;

  if(S.forcedTargets&&S.forcedTargets.length){ // T1: 강제 전투 미이행 시 턴 종료 불가
    if(!isAI(S.current)){showToast("⚔️ 강제 전투 대상과 전투해야 턴을 마칠 수 있습니다."); return;}
    S.forcedTargets=[]; S.forcedQueue=[]; // AI 안전장치 (이행 불가 상태 해소)
  }
  for(const x of alivePieces()) if(x.owner===S.current&&x.immobile>0) x.immobile--;
  // #20 정확도: 왕 숲 체류는 자기 턴 종료 시 자기 왕만 1회 집계 (양측 턴마다 이중 집계하던 오류 수정)
  for(const k of alivePieces()) if(k.owner===S.current&&k.type==="king"&&inForest(k)) met(S.current,"kingForestTurns");
  // #20 오탐 제거: 실제 canBattle 가능(보이는 대상·전투 규칙 충족)한 인접 대상이 있었는데 전투하지 않은 경우만 회피로 집계
  if(S.battlesUsed===0 && alivePieces().some(x=>x.owner===S.current&&adjEnemies(x).some(e=>visibleTo(S.current,e)&&canBattle(x,e)))) met(S.current,"battleRefusals");
  healTick(); // #106 4.2.2: 강제 전투 잔여 확인 → immobile 감소 → 지표 → 회복 틱 → turn++ → 교대
  S.turnCount++;
  if(S.mode==="sim"&&S.turnCount>=BAL.simMaxTurns){gameOver(null,"draw");
    const dmsg=`${BAL.simMaxTurns}턴 도달 — 무승부`; addLog(dmsg,"imp"); showToast(dmsg); render(); return;}
  S.current=1-S.current; startTurn();

}
/* ===== #106 T7 자동 턴 종료 (4.6) — 행동자 클라이언트만 발화하는 '입력 액션'. 조건: 플레이 중·전투 없음·모달/오버레이 없음·텔레포트 선택 아님·
   강제 대상/queue 없음·주 행동 완료·canBattle 가능한 가시 인접 적 없음·연출 idle. 주 행동 전 특례: 가능한 주 행동이 하나도 없으면 생략을 자동 적용 후 재평가.
   BAL.fx.autoEndGrace 뒤 발화하며 그 사이 입력(FX.inputSeq)이 있으면 재평가. 수신 측(온라인 비행동자)·AI 턴은 절대 발화하지 않는다 */
function humanActorNow(){
  if(!S||S.phase!=="play"||S.battle||S.fleePick||isAI(S.current)) return false; // #114: 도망 교환 선택 중(소유자가 상대일 수 있음)에는 행동자도 자동 종료하지 않는다
  if(NET.mode&&(S.current!==NET.me||NET.replaying)) return false;
  return true;
}
function optionalBattleLeft(){ return alivePieces().some(x=>x.owner===S.current&&adjEnemies(x).some(e=>visibleTo(S.current,e)&&canBattle(x,e))); }
function anyMainActionLeft(){
  if(S.mainUsed) return false;
  const me=S.current;
  for(const p of alivePieces().filter(x=>x.owner===me)){
    if(canHeal(p)) return true;
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
    if(ev&&canSearchPiece(p)) return true;
    if(p.type!=="trap"&&p.immobile===0) for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]) for(const k of (isBurning()?[1,2]:[1])){
      const r=p.r+dr*k, c=p.c+dc*k; if(r<1||r>ROWS||c<1||c>COLS) continue; if(canMoveTo(p,r,c)) return true; }
  }
  if(teleportAvailable(me)&&S.teleUsed[me]<BAL.teleMax&&alivePieces().filter(x=>x.owner===me&&x.immobile===0).length>=2) return true;
  return false;
}
function autoEndReady(){
  if(!BAL.fx.autoEnd||!humanActorNow()||fxLocked()) return null;
  if(TUT.open||S.teleport||(S.forcedTargets&&S.forcedTargets.length)||(S.forcedQueue&&S.forcedQueue.length)) return null;
  try{ if(!$("overlay").classList.contains("hidden")) return null; }catch(e){ return null; }
  if(!S.mainUsed) return anyMainActionLeft()?null:"skip";
  return optionalBattleLeft()?null:"end";
}
function autoEndCheck(){
  const what=autoEndReady(); if(!what){ FX.auto=null; return; }
  if(FX.auto&&FX.auto.turn===S.turnCount&&FX.auto.gen===FX.gen&&FX.auto.what===what) return; // 이미 예약됨
  const tk={gen:FX.gen,turn:S.turnCount,what,input:FX.inputSeq,game:S}; FX.auto=tk;
  setTimeout(()=>{
    if(FX.auto!==tk||FX.gen!==tk.gen||S!==tk.game||S.turnCount!==tk.turn) return; // 오래된 예약
    FX.auto=null;
    if(FX.inputSeq!==tk.input){ autoEndCheck(); return; } // 그 사이 입력이 있었으면 재평가
    if(autoEndReady()!==what) { autoEndCheck(); return; }
    if(what==="skip"){ showToast("가능한 주 행동이 없습니다 — 주 행동을 생략합니다."); netAction({t:"skipMain"}); return; }
    showToast("할 수 있는 행동이 없어 턴을 종료합니다.");
    netAction({t:"endTurn",auto:true}); // auto 표식은 액션 프레임에 실려 양 클라이언트가 같은 지표(autoEnds)를 기록한다
  }, fxLive()?(BAL.fx.autoEndGrace||0):0);
}
function confirmResign(){
  if(S.phase!=="play"||isAI(S.current)) return;
  if(NET.mode&&S.current!==NET.me) return; // 온라인: 자기 턴에만 기권
  const game=S, turn=S.turnCount;
  netLocalModal(); // 확인 모달은 로컬 전용 — 확정만 동기화
  modal(`<h2>🏳️ 기권</h2><p>정말 기권하시겠습니까?</p>`,
    [["기권 확정",()=>{if(S!==game||S.turnCount!==turn) return; close(); netAction({t:"resign"});}],
     ["취소",close]]);
}
function onCellCore(r,c){ // 원본 셀 클릭 로직 — 온라인은 onCell 래퍼가 동기화 후 호출
  if(S.phase==="setup"){
    const p=at(r,c);
    if(S.selected&&S.selected.tray&&zoneOf(S.setupPlayer).includes(r)&&!p){
      const x=S.pieces.find(z=>z.id===S.selected.id); x.r=r;x.c=c;x.placed=true; S.selected=null; render(); return;
    }
    if(p&&p.owner===S.setupPlayer){p.placed=false; S.selected=null; render();}
    return;
  }
  if(S.phase!=="play"||S.battle) return;
  if(S.fleePick){ // #114 도망 교환: 소유자(S.current 와 다를 수 있음)의 후방 후보 클릭 → 교환 → 밀기. 그 외 클릭은 무시 (온라인은 netAction 이 소유자 외 입력을 이미 거부)
    const q=at(r,c); if(q&&S.fleePick.cands.includes(q.id)&&!isAI(S.fleePick.owner)) fleeResolve(q.id);
    return;
  }
  if(isAI(S.current)) return;
  const p=at(r,c);
  if(S.teleport){ // #14 스왑형: 자기 말 2개 선택 → 위치 교환
    if(S.teleport.stage===1){ if(p&&p.owner===S.current&&p.immobile===0){S.teleport={stage:2,piece:p}; render();} return; }
    if(p&&p.id===S.teleport.piece.id){ S.teleport={stage:1,piece:null}; render(); } // 첫 말 재클릭 — 선택 취소
    else if(p&&p.owner===S.current&&p.immobile===0){ doTeleportSwap(S.teleport.piece,p); }
    return;
  }
  if(p&&forcedPickOk(p)){ initBattle(S.movedPiece,p); return; } // T1: 강제 대상 직접 클릭 (#106: 이동한 말이 폭탄이어도 대상 선택 가능)
  if(p&&p.owner===S.current){S.selected=p; render(); return;}
  const s=S.selected&&!S.selected.tray?S.selected:null;
  /* #104: 상대 말 분기는 행위자(S.current) 시점의 가시성으로 결정한다 — 뷰어(humanViewer) 시점이 아니다.
     온라인에서 같은 {t:"cell"} 을 상대 클라이언트가 재생할 때 뷰어는 그 말의 주인이라 항상 "보이는" 말이 되어, 행위자에게는 숨은 말(중앙을 넘어
     내 쪽 숲에 비인접 은신)이 있는 칸으로의 BT 2칸 이동이 행위자 쪽에서는 충돌 처리(경유 칸 정지·일시 공개·강제 전투)되고 상대 쪽에서는 메모 분기로
     빠져 적용되지 않아 양측 S 가 영구 분기했다. 행위자 클라이언트·핫시트·PVE 는 humanViewer()===S.current 라 동작이 같다. */
  if(p&&p.owner!==S.current&&visibleTo(S.current,p)){
    if(s&&adj(s,p)&&canBattle(s,p)){ initBattle(s,p); return; } // 전투 대상 지정 경로
    memoModal(p); return; // #11: 그 외 상대 말 클릭 — 추측 메모
  }
  if(!s) return;
  if(canMoveTo(s,r,c)) doMove(s,r,c);
}
/* #21 공개 관측 기억: 상대(관측자)가 볼 수 있는 상태에서 일어난 BT 이전 이동만 기록 — 숨은 숲 내부 이동은 사람에게 보이지 않으므로 AI도 알 수 없다 */
function observeMove(p,visBefore){
  if(isBurning()) return; // '함정 아님' 추론은 BT 이전 이동만 유효 (기존 movedPreBT 의미 유지)
  const obs=1-p.owner;
  if(visBefore||visibleTo(obs,p)) S.aiSeenMoved[obs].add(p.id);
}
/* #106 4.4.2 접촉 적격 (applyForced 후보 산출): 이동·텔레포트·숲 충돌로 새로 인접한 상대. 폭탄은 직접 접촉 시 발동(하수인·동료·왕·폭탄·함정 모두 대상),
   함정은 여전히 수동, 왕 vs 왕 불가침. 그 밖은 canBattle 규칙(전투 횟수 등) 그대로. 능동 클릭 경로(canBattle)는 폭탄 공격 불가를 유지한다 */
function contactEligible(att,def){
  if(att.type==="trap") return false;
  if(att.type==="bomb") return S.phase==="play"&&att.owner===S.current&&S.battlesUsed<2;
  return canBattle(att,def);
}
function forcedPickOk(def){ // 강제 대상 클릭·AI 이행: 이동한 말이 폭탄이면 canBattle 대신 접촉 적격으로 판정
  if(!(S.forcedTargets&&S.forcedTargets.length&&S.movedPiece&&S.forcedTargets.includes(def.id))) return false;
  return S.movedPiece.type==="bomb"?contactEligible(S.movedPiece,def):canBattle(S.movedPiece,def);
}
function doMove(p,r,c){
  S.mainUsed=true; p.movedEver=true; healBreak(p); // #106: 이동은 회복 자세 해제 (숲 충돌 정지 포함)
  S.contactKind="move";
  if(!isBurning()) p.movedPreBT=true; // 실제 이동 이력(엔진 내부 사실) — AI 추론은 공개 관측 기억(aiSeenMoved)만 사용 (#21 누수 제거)
  if(p.type==="bomb") met(p.owner,"bombMoves"); // #20 폭탄 이동 카운터
  const visBefore=visibleTo(1-p.owner,p); // #21 이동 전 관측 가능 여부
  const pr=p.r, beforeAdj=new Set(adjEnemies(p).map(e=>e.id)); // T1: 이동 전 인접 집합
  if(Math.abs(p.r-r)+Math.abs(p.c-c)===2){ // BT 2칸: 1칸째부터 단계 해석 → 충돌 규칙 자연 적용
    const mr=(p.r+r)/2, mc=(p.c+c)/2;
    if(at(mr,mc)){ r=mr; c=mc; } // 경유 칸의 숨은 말 → 그 칸 진입 시도로 전환
    else { p.r=mr; p.c=mc; }
  }
  const hidden=at(r,c);
  if(hidden){ // 숲 충돌: 직전 칸 정지 + 양측 일시 공개
    S.tempReveal.add(hidden.id); S.tempReveal.add(p.id);
    observeMove(p,visBefore); // 충돌 공개 → 이동 목격
    S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id); S.contactKind="collision";
    const cmsg=`${pname(p.owner)} 이동 중 숨은 말과 충돌! 위치가 일시 공개되었습니다.`;
    addLog(cmsg,"imp"); showToast(cmsg);
    if(p.type==="minion"&&zoneOf(1-p.owner).includes(p.r)&&!zoneOf(1-p.owner).includes(pr)) met(p.owner,"minionInvades");
    if(applyForced(p,beforeAdj)) return;
    render(); return;
  }
  p.r=r; p.c=c;
  observeMove(p,visBefore); // #21 이동 후 보이면 목격
  S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
  if(p.type==="minion"&&zoneOf(1-p.owner).includes(r)&&!zoneOf(1-p.owner).includes(pr)) met(p.owner,"minionInvades"); // 지표: 하수인 적진 진입
  if(checkKingReach()) return;
  const ev=S.events.find(e=>e.r===r&&e.c===c&&!e.consumed);
  if(ev){S.traces[p.owner].add(ev.r+"_"+ev.c);
    if(!isAI(p.owner)){addLog("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)","imp");
      showToast("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)");}}
  if(applyForced(p,beforeAdj)) return;
  render();
}
/* T1 강제 전투: 이동·텔레포트로 새로 인접한 적과는 반드시 전투 (canBattle 불가 조합 제외 — 왕vs왕 등, 폭탄·함정 포함) */
function applyForced(p,beforeAdj,list){
  S.forcedTargets=[];
  if(!list) list=adjEnemies(p).filter(e=>!beforeAdj.has(e.id)&&contactEligible(p,e)).map(e=>e.id); // #106: 폭탄 직접 접촉 포함
  if(!list.length) return false;
  S.forcedTargets=list;
  if(list.length===1){
    const def=alivePieces().find(e=>e.id===list[0]);
    const fmsg=p.type==="bomb"?"💣 신규 인접 — 폭탄 접촉 발동!":"⚔️ 신규 인접 — 강제 전투!";
    addLog(fmsg,"imp"); showToast(fmsg);
    contactBannerFx(p,null); // #106 4.3.1: 접촉 배너 (상황 문구는 initBattle 이 이어 붙인다)
    render();
    if(!isAI(p.owner)&&def) initBattle(p,def); // 사람: 확인 없이 즉시 개시 (왕·동료는 기존 모달 흐름) · AI: aiStep이 최우선 개시
    return true;
  }
  S.selected=p;
  const fmsg=`⚔️ 강제 전투 — 신규 인접 대상 ${list.length}개 중 하나를 선택하세요.`;
  addLog(fmsg,"imp"); if(!isAI(p.owner)) showToast(fmsg);
  contactBannerFx(p,viewerIsOwner(p.owner)?"여러 말과 접촉하였습니다. 어떤 말을 선택하시겠습니까?":"상대가 접촉한 말 중 하나를 고르고 있습니다"); // 상황 1 — 배너 뒤 잠금 해제, 클릭 선택(시간 제한 없음)
  render();
  return true;
}
/* #14 텔레포트 스왑형: 자기 말이 상대 진영에 있는 동안, 주 행동으로 자기 말 2개의 위치를 교환 (왕·폭탄·함정 포함).
   경기당 플레이어별 BAL.teleMax(2)회 · 교환된 두 말 모두 신규 인접 검사→강제 전투 · movedPreBT 미기록 유지 */
function teleportAvailable(p){
  return S.phase==="play"&&alivePieces().some(x=>x.owner===p&&zoneOf(1-p).includes(x.r));
}
/* #18 강제 전투 적격 (연쇄 규칙 무관 — 텔레포트 강제 전투는 첫 전투 승리 조건 면제): 폭탄·함정은 공격 불가, 왕 vs 왕 불가침 */
function forcedEligible(att,def){
  if(att.type==="trap") return false; // #106: 폭탄은 텔레포트 도착·숲 충돌로 새로 인접해도 발동한다 (스왑 사전 차단 계산에도 포함)
  if(att.type==="king"&&def.type==="king") return false;
  return true;
}
/* #18 스왑 후 새로 인접할 적격 적 목록: p가 (r,c)로 이동했을 때, 기존 인접(before)이 아닌 적 */
function newAdjAt(p,r,c,before){
  return alivePieces().filter(e=>e.owner!==p.owner&&adj({r,c},e)&&!before.has(e.id)&&forcedEligible(p,e)).map(e=>e.id);
}
/* #18 스왑 사전 검사: 새 강제 전투 수가 남은 전투 슬롯(턴당 2회)을 초과하면 실행 전에 차단 (조용한 누락 금지) */
function teleportSwapBlock(a,b){
  const beforeA=new Set(adjEnemies(a).map(e=>e.id)), beforeB=new Set(adjEnemies(b).map(e=>e.id));
  const need=(newAdjAt(a,b.r,b.c,beforeA).length?1:0)+(newAdjAt(b,a.r,a.c,beforeB).length?1:0);
  const remain=Math.max(0,2-S.battlesUsed);
  if(need>remain) return `새 강제 전투 ${need}회 > 남은 전투 ${remain}회 (턴당 최대 2회)`;
  return null;
}
function doTeleportSwap(a,b){
  if(S.teleUsed[S.current]>=BAL.teleMax) return false; // 2회 제한 방어
  const block=teleportSwapBlock(a,b);
  if(block){ // #18: 실행 전 차단 + 이유 안내 (텔레포트 횟수·주 행동 미소모)
    const bmsg=`🌀 텔레포트 스왑 차단 — ${block}`;
    addLog(bmsg,"imp"); if(!isAI(S.current)) showToast(bmsg);
    if(S.teleport) S.teleport={stage:1,piece:null};
    S.selected=null; render(); return false;
  }
  const beforeA=new Set(adjEnemies(a).map(e=>e.id)), beforeB=new Set(adjEnemies(b).map(e=>e.id));
  S.mainUsed=true; met(S.current,"teleports"); S.teleUsed[S.current]++; S.teleport=null; S.selected=null;
  healBreak(a); healBreak(b); S.contactKind="tele"; // #106: 텔레포트 교환은 두 말의 회복 자세 해제
  const ar=a.r, ac=a.c; a.r=b.r; a.c=b.c; b.r=ar; b.c=ac; // movedEver/movedPreBT 미설정 — 걷는 이동이 아님 (폭탄 재배치 위장 유지)
  if(S.mode==="pve"&&a.owner===0){addLog(`🌀 텔레포트 스왑: ${idLabel(0,a)} ↔ ${idLabel(0,b)}`,"imp"); showToast("🌀 텔레포트 완료");}
  else {addLog("상대가 텔레포트를 사용했습니다","imp"); showToast("상대가 텔레포트를 사용했습니다");} // 대상·위치 비공개 (중립 문구)
  for(const p of [a,b]){ // 도착 칸 이벤트 흔적
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed);
    if(ev){S.traces[p.owner].add(ev.r+"_"+ev.c);
      if(!isAI(p.owner)){addLog("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)","imp");}}
  }
  if(checkKingReach()) return true; // 왕 포함 스왑 — 끝줄 도달 즉시 승리
  // #18: 두 말의 강제 전투를 독립 queue에 적재 — 첫 전투의 결과(승·패·도주)와 무관하게 게임이 끝나지 않으면 둘째 실행
  S.forcedQueue=[];
  for(const [p,before] of [[a,beforeA],[b,beforeB]]){
    const list=adjEnemies(p).filter(e=>!before.has(e.id)&&forcedEligible(p,e)).map(e=>e.id);
    if(list.length) S.forcedQueue.push({pid:p.id,targets:list});
  }
  if(!drainForcedQueue(true)) render();
  return true;
}
/* #18 강제 전투 queue 소비: 대기 항목 하나를 꺼내 forcedTargets로 승격. 전투 종료 지점(승·패·포획·도주·폭탄·함정·밀어내기)마다 호출.
   autoStart: 사람·단일 대상이면 즉시 개시(스왑 직후) / false면 대상 표시만(전투 연출 종료 직후 — 클릭으로 개시).
   대상·말 소멸이나 전투 횟수 소진으로 이행 불가하면 반드시 로그로 면제 사유를 남긴다 (조용한 누락 금지). */
function drainForcedQueue(autoStart){
  if(S.fleePick) return false;
  if(!S.forcedQueue) S.forcedQueue=[];
  while(S.forcedQueue.length&&S.phase==="play"&&!S.battle&&!(S.forcedTargets&&S.forcedTargets.length)){
    const n=S.forcedQueue.shift();
    const p=alivePieces().find(x=>x.id===n.pid);
    if(!p){ addLog("⚔️ 강제 전투 면제 — 해당 말이 제거되었습니다.","imp"); continue; }
    if(S.battlesUsed>=2){ addLog("⚔️ 강제 전투 면제 — 이번 턴 전투 횟수(2회)를 모두 사용했습니다.","imp"); if(!isAI(p.owner)) showToast("⚔️ 강제 전투 면제 — 전투 횟수 소진"); continue; }
    const list=adjEnemies(p).filter(e=>n.targets.includes(e.id)&&forcedEligible(p,e)).map(e=>e.id);
    if(!list.length){ addLog("⚔️ 강제 전투 면제 — 신규 인접 대상이 사라졌습니다.","imp"); continue; }
    S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
    if(autoStart){ applyForced(p,null,list); return true; }
    S.forcedTargets=list; S.selected=p;
    const fmsg=list.length===1?"⚔️ 텔레포트 스왑 — 남은 말도 강제 전투! (빨간 표시 대상을 클릭)":`⚔️ 텔레포트 스왑 — 남은 말도 강제 전투! 대상 ${list.length}개 중 하나를 선택하세요.`;
    addLog(fmsg,"imp"); if(!isAI(p.owner)) showToast(fmsg);
    S.contactKind="again"; contactBannerFx(p,viewerIsOwner(p.owner)?"남은 말의 접촉 대상(빨간 표시)을 클릭하세요":"상대가 남은 접촉 대상을 고르고 있습니다"); // #106 4.5 "추가 접촉" 배너 (보드 복귀 뒤 순서)
    return true;
  }
  return false;
}
/* #20 경기 종료 공통: 승자(null=무승부)·승리 유형·종료 턴을 지표에 저장 */
function gameOver(winner,type){
  S.phase="over"; S.winner=winner; S.metrics.endTurn=S.turnCount; S.metrics.winType=type; S.metrics.winner=winner;
  /* Saturn REVISE P2: 기권·왕 제거·전멸 등 **경기 종료**는 전투 한가운데서도 일어난다. 그때 전투 객체가 남아 있으면
     전투 회계(buffA/buffD·maxRounds)와 전투원 버프 플래그(powerBuff·fleeFree)가 그대로 남는다.
     #121 계약 3.1 "전투가 끝나면 즉시 정리"는 승패·판정·도망·적 포획뿐 아니라 이 경로에도 적용된다.
     **쓰지 않은 패키지 재고(S.pkgs)는 건드리지 않는다** — 그것은 새 게임에서만 초기화된다. */
  if(S.battle){ try{ resetAfter(S.battle.fa); resetAfter(S.battle.fd); }catch(e){}
    S.battle=null;
    /* Saturn 추가 P2: **살아 있던 전투를 여기서 걷어냈을 때만** 열린 전투 모달을 닫는다.
       상태만 지우고 화면을 그대로 두면 전투창이 남아 buff-power 같은 CSS 애니메이션이 무한히 돌고,
       낡은 모달이 계속 입력 면으로 남는다 (계약 3.1 "전투가 끝나면 즉시 정리"는 표시까지 포함한다).
       정상 승패·판정·도망·적 포획은 이 지점에 오기 전에 이미 S.battle 을 비우고 battleEndFx 가 결과 연출 뒤 닫으므로
       그 경로의 결과 표시는 건드리지 않는다 — 여기 닫기는 연출 없이 끝난 경로(기권 등) 전용이다. */
    try{ close(); }catch(e){}
    /* overlay 의 .hidden 은 display:none !important 라 닫기만 해도 CSS 애니메이션은 멈춘다.
       그래도 **낡은 전투창 마크업을 남기지 않는다** — 버프 클래스가 DOM 에 남아 있으면 이후 어떤 표시 변경에서
       되살아날 여지가 생기고, 종료 상태의 화면에 죽은 입력 면이 남는다. 이 경로(연출 없이 끝난 종료)에서만 비운다. */
    try{ const ob=$("overlayBox"); if(ob) ob.innerHTML=""; }catch(e){}
    try{ fxReleaseAll(); }catch(e){} } // 남은 연출 큐·잠금도 함께 해제 (무한 애니메이션·입력 잠금 잔존 방지)
  S.recruit=null; // 선택 대기 상태도 남기지 않는다
}
/* T4 전멸 패배: 하수인 6+동료 2 전원 사망 → 즉시 패배. 말 제거가 발생하는 모든 지점 후 호출 */
function checkWipe(){
  if(S.phase!=="play") return false;
  for(const p of [0,1]){
    if(!S.pieces.some(x=>x.owner===p&&x.alive&&x.placed&&(x.type==="minion"||x.type==="ally"))){
      gameOver(1-p,"wipe");
      const msg=`💀 ${pname(p)} 전투 가능 말 전멸 — ${pname(1-p)} 승리!`;
      addLog(msg,"imp"); showToast(msg); render(); return true;
    }
  }
  return false;
}

/* 왕 끝줄 도달 즉시 승리 (GDD-13 4.1 개정) — 왕 위치가 바뀌는 모든 지점 직후 호출 */
function checkKingReach(){
  if(S.phase!=="play") return false;
  const k=alivePieces().find(p=>p.type==="king"&&((p.owner===0&&p.r===1)||(p.owner===1&&p.r===ROWS)));
  if(!k) return false;
  k.revealed=true;
  gameOver(k.owner,"edge");
  const msg=`👑 왕이 적진 최후방에 도달 — ${pname(k.owner)} 승리!`;
  addLog(msg,"imp"); showToast(msg); render();
  return true;
}

/* ===== 탐색·이벤트·포획 ===== */
/* #20 탐색 실행 가능 말 — GDD 역할대로 하수인·동료·왕만. 폭탄·함정은 흔적 발견·칸 점유는 가능하나 탐색 실행 불가 (cap·버프 사장 방지) */
function canSearchPiece(p){return !!p&&(p.type==="minion"||p.type==="ally"||p.type==="king");}
function doSearch(p,ev){
  if(!canSearchPiece(p)){ if(!isAI(p.owner)) showToast("폭탄·함정은 탐색할 수 없습니다."); return false; }
  if(!ev||ev.consumed||ev.r!==p.r||ev.c!==p.c) return false;
  S.mainUsed=true; ev.consumed=true; met(p.owner,"searches"); healBreak(p); // #106: 탐색은 회복 자세 해제
  const ai=isAI(p.owner), own=p.owner;
  /* GDD-13 4.7 그대로: 공용 로그에는 **종류·보유량을 남기지 않는다**. 어떤 패키지가 나왔는지는 소유자 전용 모달·토스트로만 알린다
     (#121 계약 4.8·9 비공개 — 상대는 "숲 이벤트 발생"만 본다) */
  const smsg=ai?`상대가 숲 이벤트를 발생시켰습니다.`:`${pname(own)} 숲 이벤트 발생`;
  addLog(smsg, ai?"":"imp"); showToast(smsg);
  if(p.type==="minion") met(own,"minionSearches"); // #12·#20: 하수인 탐색 (구 '하수인 이벤트')
  /* #121 계약 1.1 이후 이벤트는 3종뿐이다. itemGift·battleBuff 는 **그 자리에서 재고 +1** 로 끝나고(필수 선택 없음),
     개봉(내용 선택)은 전투 중 가방에서 한다(계약 2.2·3.1). recruit 만 탐색 자리에서 필수 선택이 이어진다. */
  if(ev.kind==="itemGift"||ev.kind==="battleBuff"){
    S.pkgs[own][ev.kind]++; // 보유 상한 없음 (계약 2.1)
    /* #129 계약 8: itemGift·battleBuff 는 **필수 선택이 없다** → 확인 클릭을 한 번 더 요구하지 않는다.
       결과 연출 1.2초를 보여 주고 그 끝점에서 종료 조건을 재평가한다. 내용 선택(개봉)은 전투 중 가방에서 따로 한다. */
    const ko=EVENT_KO[ev.kind];
    if(!ai&&S.mode!=="sim"&&viewerIsOwner(own)) tutHint("pkg"); // #26·#121: 패키지를 처음 받을 때 1회 (소유자 화면만)
    searchFinalize(own,`📦 ${ko} 획득!`,`보유 ${S.pkgs[own][ev.kind]}개`);
    return true;
  }
  /* 알 수 없는 종류(옛 저장 상태·테스트 픽스처의 폐기된 kind)는 **아무 보상 없이** 칸만 소모하고 종료 경로로 보낸다.
     else 로 흘려보내면 폐기된 종류가 포획·교체 화면을 열어 계약 1.1 의 "3종뿐"을 깨뜨린다. */
  if(ev.kind!=="recruit"){ searchFinalize(own,"🌿 아무것도 없었다",""); return true; }
  /* #121 계약 4·6 recruit — 기술 교체 / 하수인 포획 / 포기.
     계약 6 "후보 고정": 포획 후보 종은 **탐색 중 한 번** ROSTER 20종 균등으로 뽑고, 모달을 다시 그리거나 포획 방법을 바꿔도
     재추첨하지 않는다. 그래서 여기서 rand 를 **딱 1회** 쓴다 (계약 4.2 "제안 표시 자체는 난수를 쓰지 않는다" — 제안 3종은 고정 목록). */
  S.recruit={owner:own,pieceId:p.id,species:ROSTER[Math.floor(rand()*ROSTER.length)].id,
    stage:"root",skill:null,targetId:null,recvId:null,token:(S.recruitToken=(S.recruitToken||0)+1)};
  if(ai){ aiRecruitResolve(own,p); return true; }
  if(S.mode!=="sim"&&viewerIsOwner(own)) tutHint("recruit"); // #26·#121: 기술 교체·포획 화면이 처음 열릴 때 1회
  recruitModal(); render(); return true;
}
/* #121 계약 4.2: 교체 대상은 **최초 로스터로 배치된 보드 위 하수인 6명**이다. 개인 포획(cap)·예비(reserve)는 이 화면의 대상이 아니다.
   죽은 말도 목록에 보이되 비활성이므로 살아 있는지는 걸러내지 않고 그대로 돌려준다 (순서 = 생성 순서로 안정적). */
function rosterMinions(own){ return S.pieces.filter(x=>x.owner===own&&x.type==="minion"); }
/* #121 계약 6: 포획 수령 말 — 살아 있고 배치된 동료·왕 중 포획 슬롯(cap)이 빈 말. 탐색한 말이 하수인이어도 된다 */
function capReceivers(own){ return alivePieces().filter(x=>x.owner===own&&(x.type==="ally"||x.type==="king")&&!x.cap); }
/* 현재 recruit 상태가 아직 유효한가 — 늦은 콜백·새 게임·턴 교대·말 사망 방어 */
function recruitState(){
  const R=S&&S.recruit; if(!R) return null;
  const p=S.pieces.find(x=>x.id===R.pieceId);
  if(!p||!p.alive||!p.placed||R.owner!==S.current) return null;
  return {R,p,rd:ROSTER.find(r=>r.id===R.species)};
}
/* #121 계약 4·6 탐색 보상 선택 화면 — 단계별로 다시 그린다. 온라인은 modal() 래퍼가 소유자만 조작하게 하고
   버튼 인덱스를 중계하며, 비소유자에게는 원문을 **한 번도 쓰지 않고** 대기 화면만 그린다(계약 4.8 비공개).
   확정 전에는 어떤 슬롯도 건드리지 않는다 (계약 4.2-7). */
function recruitModal(){
  const st=recruitState(); if(!st){ close(); return; }
  const {R,p,rd}=st, own=R.owner;
  /* 동기화 모달의 버튼은 modal() 래퍼가 {t:"modal",seq,i} 로 이미 중계한다 — 콜백에서 netAction 을 겹쳐 부르면
     로컬이 두 프레임을 보내고 원격이 같은 선택을 두 번 적용한다. 그래서 **코어를 직접** 부른다 (PD 검토 3). */
  const btn=(label,step,i)=>[label,()=>window.__recruitCore(step,i)];
  const skCard=(sid,head,extra)=>{ const sk=SKILLS[sid];
    return `<div class="fighter"><b>${head} ${skillNameKo(sid,null)}</b><small>${sk.cls?`<span class="badge">${SKILL_CLS_KO[sk.cls]} 분류</span> `:sk.el?`<span class="badge el-${sk.el}">${ELEM_KO[sk.el]}</span> `:""}${SKILL_TIER_KO[sk.tier]||SKIND_KO[sk.kind]} · 위력 ${sk.pow?sk.pow:"-"} · 쿨 ${sk.reaper?"봉인":sk.cd}<br>${sk.desc}${extra||""}</small></div>`; };
  if(R.stage==="root"){
    const recv=capReceivers(own);
    modal(`<h2>🌿 숲에서 무언가를 찾았다</h2><p>기술을 배우거나, 공용 하수인을 포획할 수 있습니다.<br><small>포기해도 이 칸은 다시 쓸 수 없습니다.</small></p>
      <div class="fighter"><b>📘 기술 교체</b><small>신규 공용 기술 3종 중 하나를 직접 골라, 내 최초 하수인 6명 중 살아 있는 말의 4슬롯 어디든 바꿉니다.</small></div>
      <div class="fighter"><b>🔴 하수인 포획</b><small>${recv.length?`동료·왕 중 포획 슬롯이 빈 말 ${recv.length}기가 받을 수 있습니다 (보유 볼 ${S.balls[own]})`:"<b>포획 슬롯이 빈 동료·왕이 없습니다 — 포획 불가</b>"}</small></div>`,
      [btn("📘 기술 교체","skills",0)].concat(recv.length?[btn("🔴 하수인 포획","cap",0)]:[]).concat([btn("포기","giveup",0)]));

  if(R.stage==="skill"){

       여기서는 "내 6명 중 아직 그 기술이 없는 말이 한 명도 없으면" 그 제안을 비활성으로 표시한다 */

    modal(`<h2>📘 배울 기술 선택</h2><p>하나를 고르세요.<br><small>같은 말에 같은 기술을 두 번 장착할 수 없습니다.</small></p>
      ${NEW_SKILLS.map((sid,i)=>skCard(sid,`${i+1}.`,openFor(sid)?"":" <b>· 내 모든 하수인이 이미 보유</b>")).join("")}`,
      NEW_SKILLS.map((sid,i)=>openFor(sid)?btn(`${i+1}. ${SKILLS[sid].ko}`,"skill",i):[`${i+1}. ${SKILLS[sid].ko} (보유)`,null,true])
        .concat([btn("← 뒤로","back",0),btn("포기","giveup",0)]));

    const ms=rosterMinions(own);
    const row=(m,i)=>{ const dead=!m.alive||!m.placed, has=m.skills&&m.skills.includes(R.skill);
      return `<div class="fighter"><b>${i+1}. ${m.name||TYPE_KO.minion}${m.element?` <span class="badge el-${m.element}">${ELEM_KO[m.element]}</span>`:""}</b>
        <small>${dead?"<b>제거됨 — 선택 불가</b>":`HP ${m.hp}/${m.maxHp} · 공 ${m.atk} · 기술 ? ? ? ?`}${has?" · <b>이미 이 기술 보유</b>":""}</small></div>`; };
    modal(`<h2>📘 ${SKILLS[R.skill].ko} — 대상 말</h2><p>이 기술을 배울 말을 고르세요. 고르면 그 말의 4슬롯이 보입니다.</p>
      ${ms.map(row).join("")}`,
      ms.map((m,i)=>{ const sel=m.alive&&m.placed&&m.skills&&!m.skills.includes(R.skill);
        const why=(!m.alive||!m.placed)?"제거됨":"이미 보유";
        return sel?btn(`${i+1}. ${m.name||"하수인"}`,"target",i)
                 :[`${i+1}. ${m.name||"하수인"} (${why})`,null,true]; })
        .concat([btn("← 뒤로","back",0),btn("포기","giveup",0)]));

  }
  if(R.stage==="slot"){
    const m=S.pieces.find(x=>x.id===R.targetId);

      m.skills.map((sid,i)=>btn(`슬롯 ${i+1} 교체 (${SKILLS[sid].ko})`,"slot",i))
        .concat([btn("← 뒤로","back",0),btn("포기","giveup",0)]));

  if(R.stage==="capRecv"){

        <small>${rd?`HP ${rd.hp} · 공 ${rd.atk} · 기술 ${archSkills(rd.arch,rd.element).map(s=>SKILLS[s].ko).join("·")} — 이 종의 수치·기술 그대로 합류합니다`:""}<br>받을 말: ${recv?TYPE_KO[recv.type]:"-"}</small></div>
      <small>공격 포획 실패 시 <b>탐색 말</b>이 최대 HP 25% 피해!</small>
      ${opt("안전 포획",2,"100%","")}${opt("위험 포획",1,"50%","실패 시 소멸")}${opt("공격 포획",1,"70%","실패 시 소멸 + 탐색 말 HP 25% 피해")}`,
      [["안전 포획 (볼 2)",b>=2?()=>window.__recruitCore("mode",0):null,b<2],
       ["위험 포획 (볼 1)",b>=1?()=>window.__recruitCore("mode",1):null,b<1],
       ["공격 포획 (볼 1)",b>=1?()=>window.__recruitCore("mode",2):null,b<1],
       btn("← 뒤로","back",0),btn("포기","giveup",0)]);

  close();
}
const CAP_MODES=["safe","risky","attack"]; // 순서 고정 — UI·AI·온라인 인덱스 중계 공용
/* 탐색 보상 선택의 단일 적용기 — 온라인은 netAction("recruit") 으로 양측이 같은 순서로 이 함수를 탄다.
   난수는 쓰지 않는다(후보 종은 탐색 시점에 고정, 제안 3종은 고정 목록) — 단 포획 판정(tryCapture)만 rand 1회를 쓴다. */
window.__recruitCore=(step,i)=>{
  const st=recruitState(); if(!st){ close(); return; }
  const {R,p,rd}=st, own=R.owner;
  // #129 계약 8: 포기도 "선택이 끝난" 상태다 — 결과 연출 1.2초 뒤 같은 종료 경로를 탄다 (이벤트 소모는 되돌리지 않는다)
  if(step==="giveup"){ searchFinalize(own,"🌿 아무것도 얻지 않았다","이벤트 칸은 소모되었습니다"); return; }
  if(step==="back"){
    R.stage=(R.stage==="slot")?"target":(R.stage==="target")?"skill":(R.stage==="capMode")?"capRecv":"root";
    if(R.stage==="target") R.targetId=null; if(R.stage==="skill") R.skill=null; if(R.stage==="capRecv") R.recvId=null;
    recruitModal(); return;
  }
  if(step==="skills"){ R.stage="skill"; recruitModal(); return; }
  if(step==="cap"){ if(!capReceivers(own).length) return; R.stage="capRecv"; recruitModal(); return; }
  if(step==="skill"){ const sid=NEW_SKILLS[i]; if(!sid) return; R.skill=sid; R.stage="target"; recruitModal(); return; }
  if(step==="target"){
    const ms=rosterMinions(own), m=ms[i];
    if(!m||!m.alive||!m.placed||!m.skills||!R.skill||m.skills.includes(R.skill)) return; // 불법 선택 차단 (늦은 콜백·수신 프레임 포함)
    R.targetId=m.id; R.stage="slot"; recruitModal(); return;
  }
  if(step==="slot"){
    const m=S.pieces.find(x=>x.id===R.targetId);
    if(!m||!m.alive||!m.skills||i<0||i>3||!R.skill||m.skills.includes(R.skill)) return;
    /* 계약 4.2-7 확정: 남은 쿨(cds[i])은 **그대로 승계**하고(초기화 금지), 그 슬롯의 공개 기록만 지운다 → 다시 비공개 */
    m.skills[i]=R.skill;
    if(m.revealedSkills) m.revealedSkills=m.revealedSkills.filter(x=>x!==i);
    const ko=SKILLS[R.skill].ko;
    searchFinalize(own,`📘 ${ko} 습득!`,`${m.name||"하수인"} 슬롯 ${i+1} (남은 쿨 ${m.cds[i]} 승계)`);
    return;
  }
  if(step==="recv"){
    const recv=capReceivers(own)[i]; if(!recv) return;
    R.recvId=recv.id; R.stage="capMode"; recruitModal(); return;
  }
  if(step==="mode"){
    const mode=CAP_MODES[i]; if(!mode) return;
    const recv=S.pieces.find(x=>x.id===R.recvId);
    if(!recv||!recv.alive||recv.cap) return;                       // 수령 자격 재검사
    if(S.balls[own]<(mode==="safe"?2:1)) return;                   // 비용 재검사
    const r=tryCapture(p,mode,recv,rd);
    if(r.ok) searchFinalize(own,`🔴 포획 성공!`,`${rd?rd.name:"공용 하수인"} — ${TYPE_KO[recv.type]}의 대리 출전 가능`,"captureFx");
    else searchFinalize(own,`🔴 포획 실패`,r.dmg?`공용 하수인 소멸 · 탐색 말 HP ${r.dmg} 피해 (HP ${p.hp})`:"공용 하수인이 사라졌다","captureFx");
    return;
  }
};
/* #129 계약 7 — 탐색 완료 전용 종료 경로.
   1) 탐색 시점에 mainUsed·consumed 는 이미 세웠지만 **필수 선택이 끝날 때까지** 턴을 종료하지 않는다 (위 분기들이 모달을 띄운 채 기다린다).
   2) 선택이 끝나면 결과·획득 연출을 1.2초(계약 8의 itemFx·captureFx) 보여 주고 **그 끝점에서** 종료 조건을 다시 평가한다.
      fxWhenIdle 은 fxIdle 의 대기 콜백 단계에서 실행되고 그 단계는 전역 autoEndCheck() **앞**이므로, 전역 autoEndGrace(1000ms)가
      걸리기 전에 이 경로가 먼저 판정한다 → "추가 1000ms 유예 없이" (계약 7-3).
   3) 선택 전투가 남아 있으면 autoEndReady() 가 null 이라 종료하지 않고 기존 전투 선택·"싸우지 않고 종료"가 그대로 유지된다 (계약 7-4).
   금지 사항 준수: 전역 close() 에 endTurn 을 붙이지 않았고, 전역 BAL.fx.autoEndGrace 는 다른 경로를 위해 그대로 남겨 둔다. */
/* #121 계약 4.8·10 비공개 + #129 계약 8 — 탐색 완료 공통 출구.
   owner 전용 내용(획득 종류·습득 기술·대상 말·포획 종·수령 말)은 **소유자 화면에만** 그린다. 상대 화면에는 같은 길이의
   중립 배너를 띄운다 — 연출 시간·규칙 상태·난수는 양측 동일하고 달라지는 것은 표시 문구뿐이다(표시 계층 전용).
   온라인 비소유자는 물론 PVE 의 AI 탐색에서도 사람 화면에 종류가 새지 않는다 (viewerIsOwner 가 둘을 함께 처리한다). */
function searchFinalize(owner,title,sub,fxKey){
  const tk={gen:FX.gen,game:S,turn:S.turnCount,cur:S.current,seq:(S.searchEndSeq=(S.searchEndSeq||0)+1)};
  S.recruit=null; close();
  const done=()=>{ if(FX.gen!==tk.gen||S!==tk.game||S.turnCount!==tk.turn||S.current!==tk.cur) return; // 새 게임·턴 교대·행동자 교대 → 무효
    if(S.searchEndSeq!==tk.seq) return;           // 더 최신 탐색 완료가 있다 — 이 콜백은 버린다 (정확히 한 번)
    S.searchEndSeq=tk.seq+0.5;                    // 같은 완료로 두 번 발화하지 않는다
    searchEndCheck(); };
  const mine=owner===null||owner===undefined||viewerIsOwner(owner);
  if(title) fxPlay({key:fxKey||"itemFx",kind:"banner",
    title:mine?title:"🌿 숲 이벤트",                       // 비소유자: 종류·대상·기술을 말하지 않는 중립 문구
    sub:mine?(sub||""):"상대가 숲에서 무언가를 마쳤습니다."}); // 계약 9: 탐색 결과·획득 연출도 1.2초 (양측 같은 길이)
  if(mine&&title) showToast(title+(sub?` · ${sub}`:""));   // 상세는 소유자 전용 토스트로만
  fxWhenIdle(done);
  render();
  return true;
}
function searchEndCheck(){
  if(!BAL.fx.autoEnd) return;                 // 자동 턴 종료 스위치가 꺼진 환경(기존 헤드리스 회귀)은 종전 동작 유지
  if(autoEndReady()!=="end") return;           // 잠금·모달·강제 전투·텔레포트·남은 선택 전투 → 종료하지 않는다
  FX.auto=null;                                // 전역 grace 예약을 흡수 (이중 종료 방지)
  showToast("탐색을 마쳤습니다 — 턴을 종료합니다.");
  netAction({t:"endTurn",auto:true});          // auto 표식으로 양 클라이언트가 같은 지표(autoEnds)를 기록
}
/* #121 계약 6 숲 포획 — 종전(#20)은 속성만 무작위이고 수치는 공용 100/20/30·표준형 템플릿이었다. 이제 **ROSTER 20종 균등**으로
   뽑힌 종의 HP·최대 HP·ATK·기술 수치·CD·4기술·아트 정체를 **그대로** 적용한다 → HP 85~120 · ATK 18~25 의 종별 편차가 생긴다.
   · `rd` 는 doSearch 에서 **이미 고정**된 후보 종이다 (모달 재렌더·방법 변경으로 재추첨하지 않는다 — 계약 6 "후보 고정").
   · `recv` 는 포획 슬롯이 빈 동료·왕이고, `p` 는 탐색을 실행한 말이다. **공격 포획 실패 반동은 p** 가 받는다 (수령 말이 아니다).
   · 기술 배열은 복사본으로 만든다 (archSkills 가 새 배열을 돌려주므로 원본 공유가 없다). cds 는 0, 공개 기록은 빈 배열.
   · 난수는 성공 판정 roll 1회뿐이다 (종 추첨은 탐색 시점에 이미 소비).
   · 전투 중 적 포획(finishByCapture → 예비)의 HP 70/최대 100·장착 기술 승계 규격은 **이번 요청 밖이라 그대로** 둔다. */
function tryCapture(p,mode,recv,rd){
  const own=p.owner, target=recv||p;
  const cost=mode==="safe"?2:1; S.balls[own]-=cost;
  const roll=rand();
  const ok= mode==="safe" || (mode==="risky"&&roll<0.5) || (mode==="attack"&&roll<0.7);
  if(ok){
    const sp=rd||ROSTER[0];
    target.cap={element:sp.element,hp:sp.hp,maxHp:sp.hp,atk:sp.atk,skillAtk:sp.skill,cd:0,cdMax:sp.cd,
      skills:archSkills(sp.arch,sp.element),cds:[0,0,0,0],revealedSkills:[],
      /* #121 계약 6 "그 종 그대로" — **rosterId 까지 유지한다** (PD 정정 msg_e29871f3b018).
         기술 ID 만 같고 실제 동작이 표준형으로 바뀌면 "그대로"가 아니다. rosterId 가 있으면 archOf(f) 가 그 종의 아키타입을
         돌려주므로, 엔진이 아키타입을 읽는 모든 지점(skillParamsOf 파생 지속시간·계수, 레거시 상태 부여의 지속형 100%,
         finishByCapture 의 arch 승계, AI 슬롯 정책)이 **그 종의 실제 값**을 본다.
         artRosterId 는 아트 정체(표시)용으로 그대로 둔다 — 두 필드의 역할을 합치지 않는다.
         전투 중 적 포획(finishByCapture → 예비)은 계약 6 "범위 밖"이므로 종전대로 rosterId 를 붙이지 않고 공용 규격 70/100 을 쓴다. */
      rosterId:sp.id,artRosterId:sp.id};
    met(own,"captures");
    return {ok:true,el:sp.element,rd:sp,recv:target};
  }
  met(own,"captureFails");
  let dmg=0;
  if(mode==="attack"){dmg=Math.round(p.maxHp*BAL.captureAtkFailPct); p.hp=Math.max(1,p.hp-dmg);} // 반동은 탐색 말 p (최소 1 남김)
  return {ok:false,dmg};
}

/* #106 폭발 연출 (4.4.1): 규칙은 이미 적용됐고(alive=false) 표시만 유지(hold) — 제거된 말은 폭발이 끝날 때 사라진다. 헤드리스는 즉시 */
function explosionFx(pieces){
  const hold=pieces.map(p=>({piece:p,r:p.r,c:p.c}));
  fxPlay({key:"explosion",kind:"boom",dim:false,cells:hold.map(h=>[h.r,h.c]),cellCls:"fx-boom",hold});
}
function trapFxPlay(trap,victim){ fxPlay({key:"trapFx",kind:"trap",dim:false,cells:[[trap.r,trap.c],[victim.r,victim.c]],cellCls:"fx-trap",hold:[{piece:trap,r:trap.r,c:trap.c}]}); }
function initBattle(att,def){
  const forced=S.forcedTargets&&S.forcedTargets.length&&S.forcedTargets.includes(def.id);
  if(forced){S.forcedTargets=[]; met(att.owner,"forcedBattles");} // T1: 강제 이행
  situationFx(att,def); // #106 4.3.1 상황 2: 6상황 문구 (강제·선택 전투 공통) → 해결
  healBreak(att); healBreak(def); // #106: 전투 참여(공격·방어·폭탄·함정)는 회복 자세 해제 — 틱보다 먼저
  if(att.type==="bomb"){ bombAttack(att,def); return; } // #106 4.4.2 폭탄 직접 접촉 발동
  if(def.type==="bomb"){
    S.battlesUsed++; met(att.owner,"battles");
    def.alive=false;
    if(att.type==="minion"){att.alive=false; met(def.owner,"bombHitsMinion"); // #20: 폭탄 소유자 기준
      addLog(`💥 폭탄 발동! 공격한 말과 폭탄이 모두 제거되었습니다.`,"imp");
      showToast(`💥 폭탄 발동! 공격한 말과 폭탄이 모두 제거되었습니다.`);
      explosionFx([def,att]);}
    else {met(def.owner,"bombClearedByVip");
      addLog(`💥 폭탄 발동! 폭탄만 제거되고 공격한 말은 생존했습니다. (정체 비공개 유지)`,"imp");
      showToast(`💥 폭탄 발동! 폭탄만 제거되고 공격한 말은 생존했습니다. (정체 비공개 유지)`);
      explosionFx([def]);}
    if(checkWipe()) return; // T4: 폭탄 동귀 후 전멸 판정
    afterBattle(att,false); return;
  }
  if(def.type==="trap"){
    S.battlesUsed++; met(att.owner,"battles"); met(def.owner,"trapTriggers"); // #20: 함정 발동은 함정 소유자 기준
    def.alive=false; att.immobile=2;
    def.revealed=true; att.revealed=true; // #106 T4 (CJ 최종): 함정과 걸린 말 모두 정체 공개 — 그 밖의 말은 공개 대상 비확대
    const tmsg=`🪤 함정 발동! ${idLabel(2,att)} 정체 공개 · 2턴 이동 불가 (함정 제거)`;
    addLog(tmsg,"imp"); showToast(tmsg);
    trapFxPlay(def,att);
    afterBattle(att,false); render(); return;
  }
  const needA=(att.type==="ally"||att.type==="king"), needD=(def.type==="ally"||def.type==="king");
  if(needA||needD){ vipChoice(att,def); return; }
  startRounds(att,def,att,def);
}
/* #106 4.4.2 폭탄 직접 접촉 발동 (CJ 최종 — GDD-13 4.5 "폭탄 이동은 강제 전투 미유발" 대체):
   상황 4 하수인 → 폭탄·하수인 모두 제거 / 상황 5 동료·왕 → 폭탄만 제거(상대 생존·비공개 유지) / 상황 6 폭탄·함정 → 아무 일 없음(양쪽 유지·비공개).
   전투 1회 계산(battlesUsed·battles·forcedBattles 는 initBattle 에서)·bombContacts. 발동 기회는 1회 소모 — 같은 턴 재선택 없음. revealed 는 세우지 않는다 */
function bombAttack(bomb,def){
  S.battlesUsed++; met(bomb.owner,"battles"); met(bomb.owner,"bombContacts");
  if(def.type==="minion"){
    bomb.alive=false; def.alive=false; met(bomb.owner,"bombHitsMinion");
    const m=`💥 폭탄 접촉 발동! 폭탄과 상대 하수인이 함께 제거되었습니다.`; addLog(m,"imp"); showToast(m);
    explosionFx([bomb,def]);
    if(checkWipe()) return;
  } else if(def.type==="ally"||def.type==="king"){
    bomb.alive=false; met(bomb.owner,"bombClearedByVip");
    const m=`💥 폭탄 접촉 발동! 상대 말이 폭탄을 제거했습니다 — 상대 말 생존 (정체 비공개 유지)`; addLog(m,"imp"); showToast(m);
    explosionFx([bomb]);
    if(checkWipe()) return;
  } else { // #114 상황 6 (CJ 원문): 폭탄 → 폭탄/함정 — 제거·공개 없이 양측 한 칸씩 밀기 (함정도 강제 밀기·재배치 대상, 스스로 이동은 계속 불가)
    const m=`💣 폭탄이 상대 폭탄·함정과 접촉 — 아무 일도 일어나지 않습니다. 말을 한칸씩 밀어냅니다. (양쪽 유지 · 정체 비공개)`; addLog(m,"imp"); showToast(m);
    pushResolve(bomb,def,{who:bomb.owner});
    if(S.phase!=="play") return;
  }
  afterBattle(bomb,false); render();
}
function vipChoice(att,def){
  const vip=x=>x.type==="ally"||x.type==="king";
  if(vip(att)&&vip(def)){ // #114 상황 8 (CJ 원문): 동료/왕 ↔ 동료/왕은 포획 하수인 보유와 무관하게 전투 없이 밀기 — 출전 선택·정체 공개·제거 없음
    addLog("🤜 동료·왕끼리 접촉 — 아무 일도 일어나지 않습니다. 말을 한칸씩 밀어냅니다. (양측 정체 비공개)","imp");
    doPush(att,def); return;
  }
  const choices={};
  const ask=(side,piece,next)=>{
    const res=(!piece.cap&&S.reserve[piece.owner])?S.reserve[piece.owner]:null; // #12: cap 없고 예비(포획 하수인) 있으면 대리 출전 가능
    if(!(piece.type==="ally"||piece.type==="king")||(!piece.cap&&!res)){choices[side]="body"; next(); return;}
    const useRes=()=>{piece.cap=S.reserve[piece.owner]; S.reserve[piece.owner]=null;}; // 사용 시 reserve 소모 → 해당 전투원의 cap
    if(isAI(piece.owner)){if(res)useRes(); choices[side]="cap"; next(); return;} // AI: 보유 시 항상 대리 (진짜 비공개 선택)
    netModalOwner(piece.owner); // 온라인: 이 비공개 선택의 주인은 해당 말 소유자 (방어자 포함)
    modal(`<h2>🔒 ${pname(piece.owner)}만 확인${S.mode==="pvp"&&!NET.mode?" (상대는 시선 회피)":""}</h2>
      <p>${TYPE_KO[piece.type]} 출전 선택 — 어느 쪽이 패배해도 ${piece.type==="king"?"경기 패배":"동료·포획 하수인 동시 제거"}입니다.</p>`,
      [["본체 출전",()=>{choices[side]="body";close();next();}],
       res?[`예비 하수인(${ELEM_KO[res.element]}) HP ${res.hp}/${res.maxHp} 대리 출전`,()=>{useRes();choices[side]="cap";close();next();}]
          :[`포획 하수인(${ELEM_KO[piece.cap.element]}) HP ${piece.cap.hp}/${piece.cap.maxHp} 출전`,()=>{choices[side]="cap";close();next();}]]);
  };
  ask("A",att,()=>ask("D",def,()=>{
    att.revealed=true; def.revealed=true;
    const fa=choices.A==="cap"?att.cap:att, fd=choices.D==="cap"?def.cap:def;
    const aIsBody=(att.type==="ally"||att.type==="king")&&choices.A!=="cap";
    const dIsBody=(def.type==="ally"||def.type==="king")&&choices.D!=="cap";
    if(aIsBody&&dIsBody){ doPush(att,def); return; } // Q2-b C안
    const desc=`공격: ${fa===att?TYPE_KO[att.type]:"포획 하수인("+ELEM_KO[fa.element]+")"} vs 방어: ${fd===def?TYPE_KO[def.type]:"포획 하수인("+ELEM_KO[fd.element]+")"}`;
    if(S.mode==="sim"){ addLog("출전 공개 — "+desc,"ai"); startRounds(att,def,fa,fd); return; }
    modal(`<h2>출전 공개</h2><p>${desc}</p>`,[["전투 시작",()=>{close();startRounds(att,def,fa,fd);}]]);
  }));
}
/* ===== #114 (v0.4.5) 양측 밀기·재배치 — CJ 원문 "아무 일도 일어나지 않습니다. 말을 한칸씩 밀어냅니다" 개정 (docs/v0.4.5-analysis.md 3장 계약 1~4) =====
   pushResolve(att,def): 접촉 축(att→def)의 반대 방향으로 두 말을 각각 한 칸 민다 — 목적 칸이 보드 밖이거나 점유(숨은 말 포함)면 그 말은 제자리, 다른 말은 가능하면 이동
   (둘 다 밀리면 사이에 빈 칸 2개 = 맨해튼 거리 3). → 왕이 실제로 밀려 상대 끝줄에 닿으면 승리를 먼저 확정하고 후속 재배치를 중단한다.
   → 밀기 뒤 두 말이 여전히 붙어 있거나 어느 쪽이든 다른 적(숨은 말 포함)과 붙어 있으면 재배치(relocatePair). 안전한 조합이 없으면 밀기 결과를 유지하고
   그 접촉을 한 번 처리한 것으로 끝낸다(승인된 예외 — 추가 제거·승패를 만들지 않는다).
   밀기·재배치는 강제 이동이다: movedEver/movedPreBT/observeMove/흔적/강제 전투(forcedQueue)를 만들지 않는다 — 함정도 밀리고 재배치되지만 스스로 이동은 계속 불가.
   숨은 적 좌표·후보·제외 사유는 UI/로그에 싣지 않는다 (결과 위치에서의 간접 추론 가능성은 계약이 인정한 잔여). 난수 미소비 */
const PUSH_MSG="접촉 축을 따라 두 말을 각각 한 칸 밀어냅니다. (막힌 말은 제자리)";
const RELOC_MSG="각자의 말이 밀어낼 수 없는 상황입니다. 두 말을 재배치합니다.";
function pushPair(att,def){
  const dr=Math.sign(def.r-att.r), dc=Math.sign(def.c-att.c);
  const dT=[def.r+dr,def.c+dc], aT=[att.r-dr,att.c-dc]; // 목적 칸은 서로 다르고 두 말의 출발 칸과도 다르다 — 이동 순서에 결과가 의존하지 않는다
  const tryMove=(p,r,c)=>{ if(r<1||r>ROWS||c<1||c>COLS||at(r,c)) return false; p.r=r; p.c=c; return true; };
  const movedD=tryMove(def,dT[0],dT[1]), movedA=tryMove(att,aT[0],aT[1]);
  return {movedA,movedD};
}
function relocZone(o,r){ // 재배치 영역 우선순위: 0 자기 진영 → 1 자기 숲 → 2 중앙 광장 (그 밖 -1)
  if(zoneOf(o).includes(r)) return 0;
  if(o===0?(r>=9&&r<=10):(r>=4&&r<=5)) return 1;
  if(r>=6&&r<=8) return 2;
  return -1;
}
function relocCandidates(p,others){ // p 의 후보 칸 (두 말의 출발 칸은 비운 상태) — 빈 칸·다른 적(숨은 말 포함) 비인접. 고정 정렬: 영역 → 원위치 거리 → 자기 진영 방향 행 → 열
  const occ=new Set(others.map(x=>x.r+"_"+x.c)), en=others.filter(e=>e.owner!==p.owner), out=[];
  for(let r=1;r<=ROWS;r++) for(let c=1;c<=COLS;c++){
    const z=relocZone(p.owner,r); if(z<0||occ.has(r+"_"+c)) continue;
    if(en.some(e=>Math.abs(e.r-r)+Math.abs(e.c-c)===1)) continue;
    out.push({r,c,z,d:Math.abs(p.r-r)+Math.abs(p.c-c),back:p.owner===0?ROWS-r:r-1});
  }
  out.sort((a,b)=>a.z-b.z||a.d-b.d||a.back-b.back||a.c-b.c);
  return out;
}
function relocatePair(att,def){ // 두 목적지 조합 검토 — 단순 선착순으로 둘째 말의 자리를 막지 않는다. 조합 순위: 영역 합 → 거리 합 → att 후보 순위 → def 후보 순위
  const others=alivePieces().filter(x=>x!==att&&x!==def);
  const LA=relocCandidates(att,others), LD=relocCandidates(def,others);
  let best=null;
  for(let i=0;i<LA.length;i++) for(let j=0;j<LD.length;j++){
    const a=LA[i], d=LD[j];
    if(a.r===d.r&&a.c===d.c) continue;
    if(Math.abs(a.r-d.r)+Math.abs(a.c-d.c)===1) continue; // 두 말끼리도 붙지 않아야 한다
    const key=[a.z+d.z,a.d+d.d,i,j];
    if(!best||key[0]<best.key[0]||(key[0]===best.key[0]&&(key[1]<best.key[1]||(key[1]===best.key[1]&&(key[2]<best.key[2]||(key[2]===best.key[2]&&key[3]<best.key[3])))))) best={a,d,key};
  }
  if(!best) return false;
  att.r=best.a.r; att.c=best.a.c; def.r=best.d.r; def.c=best.d.c;
  return true;
}
function pushResolve(att,def,opts){ // 밀기 → 왕 끝줄 승리 → 재배치. 반환: true=처리됨. 전투 횟수는 부르는 쪽(doPush/bombAttack/도망)이 계산한다
  opts=opts||{};
  const who=opts.who!==undefined?opts.who:att.owner;
  healBreak(att); healBreak(def); // #106: 밀어내기도 전투 참여 — 회복 자세 해제
  if(!adj(att,def)) return false;
  met(who,"pushes");
  pushPair(att,def);
  addLog(`🤜 밀어내기! ${PUSH_MSG}`,"imp"); showToast(`🤜 밀어내기! ${PUSH_MSG}`);
  fxPlay({key:"pushBanner",kind:"banner",title:"밀어내기!",sub:PUSH_MSG}); // #106 5.6 배너 "밀어내기!" + 결과 문구 (#125: pushBanner 1.2초)
  if(checkKingReach()) return true; // 왕이 실제 밀려 상대 끝줄 도달 — 승리 먼저 확정, 재배치 중단
  const stuck=adj(att,def)||adjEnemies(att).length>0||adjEnemies(def).length>0; // 숨은 말 포함 (규칙 엔진 내부 판정)
  if(stuck){
    if(relocatePair(att,def)){ met(who,"relocations");
      addLog(`🔄 말 재배치! ${RELOC_MSG}`,"imp"); showToast(`🔄 말 재배치! ${RELOC_MSG}`);
      fxPlay({key:"pushBanner",kind:"banner",title:"🔄 말 재배치!",sub:RELOC_MSG}); }
    else addLog("🔄 재배치할 안전한 자리가 없어 밀기 결과를 유지합니다. (이 접촉은 처리 완료)","imp"); // 승인된 예외 — 추가 제거·승패 없음
  }
  return true;
}
function doPush(att,def){ // 동료/왕 ↔ 동료/왕 접촉 (전투 1회 계산)
  S.battlesUsed++; met(att.owner,"battles");
  pushResolve(att,def);
  if(S.phase!=="play") return;
  afterBattle(att,false); render();
}
function startRounds(attP,defP,fa,fd){
  S.battlesUsed++; met(attP.owner,"battles");
  attP.revealed=true; defP.revealed=true;
  healBreak(attP); healBreak(defP); // #106: 전투 참여 해제 (initBattle 경유가 아닌 직접 호출도 동일)
  S.battle={attP,defP,fa,fd,round:1,phase:0,
    recA:0,recD:0, itemsA:0,itemsD:0, itemRoundA:false,itemRoundD:false, lastItemA:null,lastItemD:null,
    ballThrowA:false, ballThrowD:false, // #12: 볼 투척 라운드당 1회
    blog:[], msgQ:[], dispHpA:fa.hp, dispHpD:fd.hp,
    /* #121 계약 3.1: 버프 회계는 **플레이어별 한 전투 1개**다. 어느 버프를 썼는지(표시·검증용)와 썼는지 여부를 side 별로 둔다.
       계약 3.3: maxRounds 는 **전투 인스턴스 값**이다 — 전역 BAL.maxRounds 는 건드리지 않는다 (null = 전역값 사용) */
    buffA:null, buffD:null, maxRounds:null};
  resetBattleTemps(fa); resetBattleTemps(fd);
  for(const [piece,f,sd] of [[attP,fa,"A"],[defP,fd,"D"]]) // #12 일시버프: 다음 전투 개시 시 소진·전투 내내 유지
    if(piece.nextBattleBuff){piece.nextBattleBuff=false; f.atkBuff=true;
      bmsg(`✨ ${fighterName(sd)} 일시 버프 — 이번 전투 공격 +${pct(BAL.nextBuffPct)}!`);}
  bmsg(`⚔️ ${fighterName("A")} vs ${fighterName("D")} — 전투 개시!`);
  battleModal();
}
function resetBattleTemps(f){f.burn=0;f.burnBy=null;f.weaken=0;f.shield=0;f.absorbed=0;f.shock=0;f.shockFresh=false;f.focusCharge=false;f.vulnMark=false;f.dmgCut=0;f.atkBuff=false;
  f.powerBuff=false;f.fleeFree=false;} // 쿨(cds)은 전투 간 유지 (HP와 동일) · #121 계약 3.1: 버프는 전투 간 이어지지 않는다
function actorOfPhase(){
  const B=S.battle;
  let firstIsAtt = B.round%2===1;
  if(firstIsAtt && B.fa.shock) firstIsAtt=false;
  if(!firstIsAtt && B.fd.shock) firstIsAtt=true;
  return B.phase===0 ? (firstIsAtt?"A":"D") : (firstIsAtt?"D":"A");
}
function stFx(side,f){ return {side,text:stIcons(f),shield:f.shield||0,max:f.maxHp}; } // #106 5.5: 상태 아이콘 + 방어막 바 값을 함께 실어 재생과 동기화
function battleModal(){
  const B=S.battle; if(!B) return;
  const side=actorOfPhase(), f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const ownerP=side==="A"?B.attP.owner:B.defP.owner;
  const aiActor=isAI(ownerP);
  const viewer=S.mode==="sim"?2:(S.mode==="pve"?0:NET.mode?NET.me:ownerP); // 기술 공개 기준 시점 (핫시트는 행동자·온라인은 내 화면 고정)
  const busy=B.msgQ.length>0||fxLocked(); // 메시지 재생·연출 대기 중 커맨드 비활성 (#106: 배너·카운트다운 잠금 포함)
  const mySide=S.mode==="pve"?(B.attP.owner===0?"A":"D"):NET.mode?(B.attP.owner===NET.me?"A":"D"):"A", topSide=mySide==="A"?"D":"A";
  const panel=sid=>{ // 전투원 정보 패널: 이름·아키타입/속성 배지·HP바·방어막 바(#106 5.5)·상태. "가한 유효 피해" 게이지는 HP 비율 판정(H1)과 달라 제거 — recA/recD 는 지표로만 기록
    const pf=sid==="A"?B.fa:B.fd, piece=sid==="A"?B.attP:B.defP;
    const rd=pf===piece&&piece.rosterId?ROSTER.find(x=>x.id===piece.rosterId):null;
    const dhp=B["dispHp"+sid]!==undefined?B["dispHp"+sid]:pf.hp; // 표시 HP (메시지 재생과 동기화)
    const dsh=B["dispSh"+sid]!==undefined?B["dispSh"+sid]:(pf.shield||0);
    return `<div class="fighter"><div>
      <b>${fighterName(sid)}</b> <small>(${pname(piece.owner)})</small>
      ${rd?`<span class="badge">${ARCH_KO[rd.arch]}</span>`:""}${pf.element?`<span class="badge el-${pf.element}">${ELEM_KO[pf.element]}</span>`:""}

      <div class="shbar" title="방어막"><div id="shfill-${sid}" style="width:${Math.max(0,Math.min(100,dsh/pf.maxHp*100))}%"></div></div>

      ${pf.skills?`<div class="status">${pf.skills.map((sid2,i)=>{
