/* #13 도망 실패 반격: 상대의 즉시 공격 1회 — 기본 행동 AI 선택 로직 재사용 (최고 위력 가용 공격 슬롯, 없으면 기본 공격) */
function fleeCounter(fleeSide){
  const B=S.battle; if(!B) return;
  const oSide=fleeSide==="A"?"D":"A", of=oSide==="A"?B.fa:B.fd;
  let slot=-1;
  if(of.skills)
    for(let i=0;i<4;i++){const sk=SKILLS[of.skills[i]];
      if(of.cds[i]===0&&sk.pow&&(slot<0||sk.pow>SKILLS[of.skills[slot]].pow)) slot=i;}
  execSlot(oSide,slot); // 도망 측 행동 소모로 처리 (nextPhase는 execSlot이 호출)
}
/* #13 도망 성공 후: 자기 후방 말과 위치 교환 선택 (생략 가능 · 신규 인접 강제 전투 미적용) */
function fleeSwapPrompt(piece){
  drainForcedQueue(false); // #18: 도주 성공으로 끝난 첫 전투 뒤에도 스왑 둘째 말의 강제 전투를 승격
  const done=()=>{render(); if(S.phase==="play"&&!S.battle&&isAI(S.current)) aiSchedule();};
  if(S.phase!=="play"||!piece.alive){done(); return;}
  const own=piece.owner;
  const dutyId=(S.forcedTargets&&S.forcedTargets.length&&S.movedPiece)?S.movedPiece.id:null; // 강제 전투 대기 말은 교환 대상에서 제외
  const rear=alivePieces().filter(x=>x.owner===own&&x.id!==piece.id&&x.id!==dutyId&&(own===0?x.r>piece.r:x.r<piece.r)); // 후방 = 자기 진영 방향으로 행이 더 뒤
  if(!rear.length){done(); return;}
  if(isAI(own)){ // AI: 폭탄>함정>하수인 순 우선 교환 (전선에 위장 말 배치)
    const pri={bomb:0,trap:1,minion:2,ally:3,king:4};
    const t=rear.sort((x,y)=>(pri[x.type]-pri[y.type])||(own===0?y.r-x.r:x.r-y.r))[0];
    fleeSwap(piece,t); done(); return;
  }
  const btns=rear.map(t=>[`${t.r}행 ${t.c}열 ${idLabel(own,t)}`,()=>{close();fleeSwap(piece,t);done();}]);
  btns.push(["교환 생략",()=>{close();done();}]);
  netModalOwner(own); // 온라인: 도망친 말의 소유자가 선택 (방어자일 수 있음)
  modal(`<h2>🏃 도망 성공 — 위치 교환</h2><p>후방의 자기 말과 위치를 교환할 수 있습니다. (신규 인접 강제 전투 미적용)</p>`,btns);
}
function fleeSwap(a,b){
  const ar=a.r, ac=a.c; a.r=b.r; a.c=b.c; b.r=ar; b.c=ac; // movedPreBT 미기록·강제 전투 미적용
  addLog(`🏃 도망 — 후방 말과 위치를 교환했습니다.`,"imp");
  checkKingReach();
}
function afterBattle(attacker,attackerWonAlive){
  if(S.battlesUsed===1) S.firstBattleWonByMover = (attacker===S.movedPiece && attackerWonAlive);
  drainForcedQueue(false); // #18: 스왑 둘째 말 강제 전투 — 독립 queue에서 승격 (승·패·포획 종료 공통)
  render();
  if(S.phase==="play"&&!S.battle&&isAI(S.current)) aiSchedule();
}

/* ===== AI (공정 관측 휴리스틱 — Phase 1) ===== */
function aiSchedule(){
  if(S.aiPending) return; S.aiPending=true;
  setTimeout(()=>{S.aiPending=false; aiStep();}, S.mode==="sim"?BAL.simDelay:BAL.aiDelay);
}
function aiScheduleBattle(){
  if(S.aiBattlePending) return; S.aiBattlePending=true;
  setTimeout(()=>{S.aiBattlePending=false; aiBattleAction();}, S.mode==="sim"?BAL.simDelay:BAL.aiDelay);
}
function aiStep(){
  if(!S||S.phase!=="play"||!isAI(S.current)||S.battle) return;
  const me=S.current;
  if(!S.mainUsed){ if(aiLevelOf(me)==="dan5") aiMainStrong(me); else aiMain(me); render(); aiSchedule(); return; } // #21 난이도 분기
  if(!(S.forcedTargets&&S.forcedTargets.length)) drainForcedQueue(false); // #18 안전장치
  if(S.forcedTargets&&S.forcedTargets.length){ // T1: 강제 전투 최우선 이행 (aiEvalBattles보다 우선)
    const att=S.movedPiece, def=att?alivePieces().find(e=>S.forcedTargets.includes(e.id)&&canBattle(att,e)):null;
    if(att&&def){ initBattle(att,def); return; }
    S.forcedTargets=[]; // 이행 불가 조합 방어 (크래시 방지)
    if(S.forcedQueue.length){ aiSchedule(); return; } // 다음 대기 항목 처리
  }
  const pick=aiLevelOf(me)==="dan5"?aiEvalBattlesStrong(me):aiEvalBattles(me);
  if(pick){ initBattle(pick.att,pick.def); if(!S.battle) return; return; } // 동기 해결은 afterBattle 훅이 재개
  endTurn();
}
/* T6 성격 프로파일: AI별 랜덤 가중치(0.6~1.4)·ε(0.05~0.15) — 게임당 고정, sim 양측 독립 생성 */
function aiProf(me){
  if(!S.aiProfile) S.aiProfile=[null,null];
  if(!S.aiProfile[me]){
    if(aiLevelOf(me)==="dan5") S.aiProfile[me]={aggression:1,capture:1,kingRush:1,caution:1,eps:0}; // #21 5단: 고정 프로파일·ε 무작위 없음
    else {
      const r=()=>0.6+rand()*0.8;
      S.aiProfile[me]={aggression:r(),capture:r(),kingRush:r(),caution:r(),eps:0.05+rand()*0.10};
    }
  }
  return S.aiProfile[me];
}
/* T6 전멸 회피: 전투 가능 말(하수인+동료) 2 이하면 신중 가중 강화 */
function aiCaution(me){
  const n=alivePieces().filter(x=>x.owner===me&&(x.type==="minion"||x.type==="ally")).length;
  return aiProf(me).caution*(n<=2?1.6:1);
}
/* 관측: AI는 visibleTo(me)·revealed·이동 이력(논리 추론)만 사용 */
function aiVisible(me){return alivePieces().filter(e=>e.owner!==me&&visibleTo(me,e));}
function aiThreatOf(me,e){ // 상대 말 위험도 추정 (공정: 비공개면 확률 기반)
  if(e.revealed){
    if(e.type==="bomb") return "bomb";
    if(e.type==="trap") return "trap";
    return "unit";
  }
  // 폭탄 이동 상시화(GDD-13 4.5): 이동 이력은 '함정 아님'만 증명 — 폭탄 후보는 남음
  // #21 누수 제거: 엔진 내부 movedPreBT가 아니라 관측자(me)가 실제로 목격한 이동 기억(aiSeenMoved)만 사용 — 숨은 숲 내부 이동은 미기록
  return aiSeenMoved(me,e) ? "unknownMoved" : "unknownStatic";
}
function aiSeenMoved(me,e){return S.aiSeenMoved&&S.aiSeenMoved[me]&&S.aiSeenMoved[me].has(e.id);}
/* 공개 정보(제거는 전부 공개 이벤트)·목격 이동 기반 폭탄·함정 확률 추정
   moved=true: 이동 목격 미공개 말 — 폭탄 후보만 / false: 이동 미목격 — 폭탄+함정 후보 */
function aiStaticRisk(me,moved){
  const opp=1-me;
  const bombsLeft=S.pieces.filter(p=>p.owner===opp&&p.type==="bomb"&&p.alive).length; // 제거는 공개 이벤트 → 잔여 수 공개 정보
  const trapsLeft=S.pieces.filter(p=>p.owner===opp&&p.type==="trap"&&p.alive).length;
  const pool=S.pieces.filter(p=>p.owner===opp&&p.alive&&p.placed&&!p.revealed&&(moved?aiSeenMoved(me,p):!aiSeenMoved(me,p))).length;
  return ((moved?0:trapsLeft*0.5)+bombsLeft)/Math.max(1,pool);
}
function aiMain(me){
  const prof=aiProf(me), caut=aiCaution(me);
  // ε-무작위 — T6 프로파일 기반 0.05~0.15
  if(rand()<prof.eps){ if(aiRandomMove(me)) return; }
  // 1. 흔적 위 말이 있으면 탐색 (#20: 하수인·동료·왕만 — 폭탄·함정은 탐색 실행 불가)
  for(const p of alivePieces().filter(p=>p.owner===me&&canSearchPiece(p))){
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
    if(ev){ doSearch(p,ev); addLog("🤖 AI 탐색 행동","ai"); return; }
  }
  // 2. 왕 안전: 인접 적 있으면 회피 이동
  const king=alivePieces().find(p=>p.owner===me&&p.type==="king");
  if(king&&adjEnemies(king).length&&king.immobile===0){
    const opts=aiMoveOptions(king).filter(([r,c])=>!at(r,c))
      .sort((a,b)=>aiCellDanger(me,a)-aiCellDanger(me,b));
    if(opts.length&&aiCellDanger(me,[king.r,king.c])>aiCellDanger(me,opts[0])){
      doMove(king,opts[0][0],opts[0][1]); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return;
    }
  }
  // 2.5 폭탄 이동 활용(간단 휴리스틱): BT 중 왕 비인접 폭탄을 왕 인접 빈 칸으로 호위 재배치
  if(isBurning()&&king){
    const holes=[[king.r+1,king.c],[king.r-1,king.c],[king.r,king.c+1],[king.r,king.c-1]]
      .filter(([r,c])=>r>=1&&r<=ROWS&&c>=1&&c<=COLS&&!at(r,c));
    for(const b of alivePieces().filter(x=>x.owner===me&&x.type==="bomb"&&x.immobile===0&&!adj(x,king)))
      for(const [r,c] of holes)
        if(canMoveTo(b,r,c)){ doMove(b,r,c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return; }
  }
  // 3. 강한 전투 기회가 있으면 주 행동 생략(위치 보존)
  const pick=aiEvalBattles(me,true);
  if(pick&&pick.score>=18){ S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략"); return; }
  // 4. 목적 이동: 동료·왕(볼 보유·포획 미보유) → 숲 / 하수인 → 전진 (공개된 적 왕은 추격)
  // 선봉 집중: 하수인 1기를 지정해 지속 전진 (이동권 분산으로 전선이 형성되지 않는 문제 방지)
  let vg=S.aiVanguard[me];
  if(!vg||!S.pieces.find(p=>p.id===vg&&p.alive&&p.immobile===0)){
    const vcands=alivePieces().filter(p=>p.owner===me&&p.type==="minion"&&p.immobile===0);
    vcands.sort((a,b)=>((me===1?b.r-a.r:a.r-b.r)*10+Math.abs(a.c-4)-Math.abs(b.c-4)));
    vg=S.aiVanguard[me]=vcands.length?vcands[0].id:null;
  }
  const hunt=aiVisible(me).find(e=>e.type==="king"&&e.revealed);
  const cands=[];
  for(const p of alivePieces().filter(p=>p.owner===me&&p.immobile===0&&p.type!=="bomb"&&p.type!=="trap")){
    for(const [r,c] of aiMoveOptions(p)){
      let sc=0;
      const fwd = me===1 ? (r-p.r) : (p.r-r); // 전진 방향
      if(p.type==="minion"){
        sc += fwd*6*prof.aggression + (4-Math.abs(c-4));
        if(p.id===vg) sc+=12; // 선봉 우선 이동권
        if(hunt){const dNow=Math.abs(p.r-hunt.r)+Math.abs(p.c-hunt.c), dNew=Math.abs(r-hunt.r)+Math.abs(c-hunt.c); sc+=(dNow-dNew)*12;}
      }
      if(p.type==="ally"&&(p.cap||S.balls[me]===0)){
        sc += fwd*5; // 포획 완료·볼 소진 동료는 후열 소탕(폭탄 제거) 전환
        if(hunt){const dNow=Math.abs(p.r-hunt.r)+Math.abs(p.c-hunt.c), dNew=Math.abs(r-hunt.r)+Math.abs(c-hunt.c); sc+=(dNow-dNew)*10;}
      } else if(p.type==="ally"||(p.type==="king"&&!adjEnemies(p).length)){
        const targetRows = me===1?[4,5]:[9,10];
        const dNow=Math.min(...targetRows.map(tr=>Math.abs(p.r-tr)));
        const dNew=Math.min(...targetRows.map(tr=>Math.abs(r-tr)));
        sc += (dNow-dNew)*8*prof.capture;
        if(p.type==="king") sc-=4; // 왕은 소극적으로
        if((r>=4&&r<=5)||(r>=9&&r<=10)) sc+=3*prof.capture; // 숲 내부 배회(흔적 발견)
      }
      if(p.type==="king"){ // 끝줄 도달 승리 (GDD-13 4.1 개정) — 안전 회피(위 2단계)가 항상 우선
        const goal=me===0?1:ROWS;
        if(r===goal) sc+=100*prof.kingRush; // 도달 = 즉시 승리
        sc+=(Math.abs(p.r-goal)-Math.abs(r-goal))*1.5*prof.kingRush; // 상대 진영 접근 소폭 가점
      }
      const fsc=aiForcedScore(me,p,r,c); // T6 강제 전투 예측: 불리한 신규 인접 회피·유리하면 적극
      if(fsc!==null) sc+=fsc*0.8;
      sc -= aiCellDanger(me,[r,c])*3*caut;
      sc += rand()*2;
      cands.push({p,r,c,sc});
    }
  }
  cands.sort((a,b)=>b.sc-a.sc);
  const tp=aiTeleportPick(me); // #14 텔레포트 스왑: 점수 기반으로 일반 이동과 경쟁 (남용 방지)
  if(tp&&tp.sc>(cands.length?cands[0].sc:0)&&doTeleportSwap(tp.a,tp.b)){ addLog("🤖 AI 주 행동","ai"); return; } // #18: 차단 시 일반 이동으로 대체
  if(cands.length){ const t=cands[0]; doMove(t.p,t.r,t.c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return; }
  S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략");
}
/* T6 강제 전투 예측: (r,c) 이동 시 새로 인접하게 될 보이는 적 중 최선 전투 기대 점수 (없으면 null) */
function aiForcedScore(me,p,r,c){
  let best=null;
  for(const e of aiVisible(me)){
    if(Math.abs(e.r-r)+Math.abs(e.c-c)!==1) continue;
    if(adj(p,e)) continue; // 기존 인접은 강제 대상 아님
    if(p.type==="king"&&e.type==="king") continue; // 왕 vs 왕 불가침 — 강제 미발동
    const s=aiBattlePairScore(me,p,e);
    if(best===null||s>best) best=s;
  }
  return best;
}
/* #14 텔레포트 스왑 판단: 침투 말↔왕(왕 러시 — 도착 칸 안전할 때)·위기 왕↔후방 스왑, 2회 제한 준수 */
function aiTeleportPick(me){
  if(S.mainUsed||!teleportAvailable(me)||S.teleUsed[me]>=BAL.teleMax) return null;
  const prof=aiProf(me), caut=aiCaution(me);
  const king=alivePieces().find(x=>x.owner===me&&x.type==="king"&&x.immobile===0);
  if(!king) return null;
  let best=null;
  // 1) 왕 러시: 적진 침투 말과 스왑 — 도착 칸 인접 위협 0일 때만 (kingRush 가중)
  const goal=me===0?1:ROWS;
  for(const p of alivePieces().filter(x=>x.owner===me&&x.id!==king.id&&x.immobile===0&&zoneOf(1-me).includes(x.r))){
    if(aiCellDanger(me,[p.r,p.c])>0||teleportSwapBlock(king,p)) continue; // #18: 슬롯 초과 스왑 후보 제외
    const sc=(20+(3-Math.abs(p.r-goal))*8)*prof.kingRush;
    if(!best||sc>best.sc) best={a:king,b:p,sc};
  }
  // 2) 위기 왕 구출: 인접 적 존재 시 자기 진영의 안전한 후방 말과 스왑
  if(adjEnemies(king).length){
    const rears=alivePieces().filter(x=>x.owner===me&&x.id!==king.id&&x.immobile===0
      &&zoneOf(me).includes(x.r)&&aiCellDanger(me,[x.r,x.c])===0&&!teleportSwapBlock(king,x)); // #18
    if(rears.length){const sc=24*caut; if(!best||sc>best.sc) best={a:king,b:rears[0],sc};}
  }
  return best;
}
function aiMoveOptions(p){
  const out=[];
  for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]])
    for(const k of (isBurning()?[1,2]:[1])){ // BT 중 직선 2칸 후보 포함
      const r=p.r+dr*k,c=p.c+dc*k;
      if(r<1||r>ROWS||c<1||c>COLS) continue;
      if(canMoveTo(p,r,c)) out.push([r,c]);
    }
  return out;
}
function aiCellDanger(me,[r,c]){ // 그 칸에 인접한 (보이는) 적 유닛 수
  return aiVisible(me).filter(e=>Math.abs(e.r-r)+Math.abs(e.c-c)===1&&aiThreatOf(me,e)!=="trap").length;
}
function aiRandomMove(me){
  const ps=shuffle(alivePieces().filter(p=>p.owner===me&&p.immobile===0&&p.type!=="bomb"&&p.type!=="trap"));
  for(const p of ps){ const o=aiMoveOptions(p); if(o.length){const [r,c]=o[Math.floor(rand()*o.length)]; doMove(p,r,c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return true;} }
  return false;
}
function aiEvalBattles(me,peek){
  let best=null;
  for(const att of alivePieces().filter(p=>p.owner===me)){
    for(const def of adjEnemies(att)){
      if(!visibleTo(me,def)) continue;
      if(!canBattle(att,def)) continue;
      const sc=aiBattlePairScore(me,att,def);
      if(!best||sc>best.score) best={att,def,score:sc};
    }
  }
  if(!best||best.score<6) return null;
  return peek?best:best;
}
/* T6: 전투 쌍 기대 점수 — aiEvalBattles·강제 전투 예측(aiForcedScore) 공용, 프로파일 가중 포함 */
function aiBattlePairScore(me,att,def){
  const prof=aiProf(me);
  const th=aiThreatOf(me,def);
  const pressure=(S.turnCount/BAL.maxTurns)*14; // 후반 공세 압력 (무승부 방지)
  let sc=0;
  if(th==="bomb"){ sc = (att.type==="ally") ? 30 : (att.type==="king"? -100 : -100); }
  else if(th==="trap"){ sc = att.type==="minion" ? -15 : -30; }
  else if(th==="unknownStatic"||th==="unknownMoved"){ // 비공개: 이동/미이동 풀별 폭탄·함정 확률 추정 후 계산된 위험 감수
    // 폭탄 트레이드는 하수인 1 ↔ 폭탄 1 교환(왕 호위 해체)이라 EV가 크게 나쁘지 않음
    const risk=aiStaticRisk(me,th==="unknownMoved");
    sc = att.type==="ally" ? 18+pressure
       : att.type==="king" ? -100
       : 8 - 18*risk + pressure;
  } else { // 유닛 (공개)
    if(def.type==="king") sc=45;
    else if(def.type==="ally") sc=25;
    else { sc=10;
      if(att.element&&def.element){
        if(BEATS[att.element]===def.element) sc+=20;
        else if(BEATS[def.element]===att.element) sc-=20;
      }
      sc += (att.hp-def.hp)/5;
    }
    if(att.type==="king") sc-=25; // 왕은 웬만하면 싸우지 않음
    if(att.type==="ally"&&!att.cap) sc-=15;
  }
  sc += att.hp/20;
  sc = sc>0 ? sc*prof.aggression : sc*aiCaution(me); // T6: 공세 점수×aggression·위험 페널티×caution(전멸 위기 강화)
  // 수비: 자기 최후방 행 인접(1칸 전 도달 위협) 적은 우선 제거 — 끝줄 승리 저지 (프로파일 무관)
  if(th!=="bomb"&&th!=="trap"&&Math.abs(def.r-(me===0?ROWS:1))<=1) sc+=40;
  return sc;
}
function aiBattleAction(){
  const B=S.battle; if(!B) return;
  const side=actorOfPhase(), f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const ownerP=side==="A"?B.attP.owner:B.defP.owner;
  if(!isAI(ownerP)) return;
  if(aiLevelOf(ownerP)==="dan5"){ aiBattleActionStrong(side); return; } // #21 5단 전투 행동 (기대치 기반)
  const prof=aiProf(ownerP), caut=aiCaution(ownerP); // T6 전투 성향 프로파일
  // 보너스 아이템 — 사용 임계 프로파일화 (신중할수록 일찍 회복)
  const usedItems=side==="A"?B.itemsA:B.itemsD, itemRound=side==="A"?B.itemRoundA:B.itemRoundD, lastItem=side==="A"?B.lastItemA:B.lastItemD;
  if(!itemRound&&usedItems<BAL.itemPerBattle){
    const inv=S.inv[ownerP];
    let use=-1;
    if(f.hp<f.maxHp*(0.25+0.15*caut)&&inv.includes("potion")&&lastItem!=="potion") use=inv.indexOf("potion");
    else if((f.burn||f.weaken)&&inv.includes("cure")&&lastItem!=="cure") use=inv.indexOf("cure");
    if(use>=0){ window.__useItem(use); return; } // 모달 재렌더 → 재스케줄
  }
  // #12 적 하수인 포획: 게이트 충족 시 확률적 투척 (capture 프로파일 가중)
  const oppPc=side==="A"?B.defP:B.attP, thrown=side==="A"?B.ballThrowA:B.ballThrowD;
  if(oppPc.type==="minion"&&opp.hp<opp.maxHp*0.3&&S.balls[ownerP]>0&&!S.reserve[ownerP]&&!thrown
     &&rand()<0.4+0.4*prof.capture){ window.__throwBall(); return; }
  // #13 도망: 동료·왕 본체 또는 열세 전투원 (caution 가중)
  const myPc=side==="A"?B.attP:B.defP;
  if(f.hp<f.maxHp*0.5){
    const vipBody=(myPc.type==="ally"||myPc.type==="king")&&f===myPc;
    const losing=f.hp/f.maxHp<opp.hp/opp.maxHp-0.15;
    if((vipBody||losing)&&rand()<(vipBody?0.5:0.25)*caut){ window.__flee(); return; }
  }
  // 행동 선택 — 4슬롯 점수화 (킬 가능>시그니처>효과기>안정기, 저HP 시 회복/방어) + T6 프로파일 가중·확률 혼합
  // 공정 관측: 자기 기술·상대의 공개 전투 정보(HP·보호막·상태·속성)만 사용, 상대 미공개 기술 미참조
  if(!f.skills){
    if(f.skillAtk&&f.cd===0&&rand()<0.5){ window.__act("skill"); return; } // 구형 경로 잔여
    window.__act("basic"); return;
  }
  const usable=f.skills.map((sid,i)=>({i,sk:SKILLS[sid]})).filter(x=>f.cds[x.i]===0);
  if(!usable.length){ window.__act("basic"); return; } // 전 슬롯 쿨 → 폴백 기본 공격
  const adv=f.element&&opp.element&&BEATS[f.element]===opp.element;
  const disadv=f.element&&opp.element&&BEATS[opp.element]===f.element;
  const mult=(adv?BAL.advMult:disadv?BAL.disMult:1)*(f.weaken>0?(1-BAL.weakenPct):1);
  const lowHp=f.hp<f.maxHp*(0.3+0.15*caut);
  const statusKey={fire:"burn",water:"weaken",lightning:"shock"}[f.element];
  const scored=usable.map(({i,sk})=>{
    let sc=0;
    if(sk.pow){ // 피해 기술
      const est=slotPow(f,sk)*mult*(f.focusCharge&&sk.kind==="attack"?1.2:1);
      sc=6+est/4;
      if(est*(1-BAL.dmgVar)>=opp.hp+opp.shield) sc=100; // 킬 가능 최우선
      else if(sk.kind==="sig") sc+=5;
      if(sk.status&&statusKey&&!opp[statusKey]) sc+=4;
      if(sk.bonusVsShield&&opp.shield>0) sc+=3;
      if(sk.bonusVsStatus&&(opp.burn||opp.weaken||opp.shock)) sc+=3;
      if(sk.selfVuln&&lowHp) sc-=6; // 저HP에 결정타 반동 위험
      sc*=prof.aggression;
    } else { // 보조기·불굴 진형
      if(sk.healPct) sc=lowHp?20+10*caut:2;
      else if(sk.shieldPct) sc=(lowHp?14:5)*(f.shield>0?0.3:1);
      else if(sk.dmgCut) sc=lowHp?10:3;
      else if(sk.focus) sc=(!f.focusCharge&&!lowHp)?7:1;
      else if(sk.coolAny) sc=f.cds.some((c,j)=>j!==i&&c>=2)?6:0.5;
      else if(sk.cleanse) sc=(f.burn||f.weaken||f.shock)?9:0.5;
      if(lowHp) sc*=caut;
    }
    return {i,sc:sc+rand()*3}; // T6 확률 혼합 유지 (결정적 패턴 해소)
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const pick=(scored.length>1&&rand()<0.10)?scored[1]:scored[0]; // ε 차선 혼합
  window.__act(pick.i);
}
function aiCapture(p){
  const b=S.balls[p.owner];
  const caut=aiCaution(p.owner); // T6: 신중할수록 공격 포획(실패 피해) 회피
  let mode=null;
  if(b>=2) mode="safe";
  else if(b===1&&p.hp>p.maxHp*Math.min(0.9,0.5*caut)) mode="attack";
  if(!mode) return; // 포기
  tryCapture(p,mode);
}
/* ===== #21 5단 — 탐색·추론 기반 강AI (공정 관측: 결정 시점에 고정한 가시 적 집합 V·revealed·공개 제거 집계·목격 이동 기억만 사용) =====
   구조: 후보 행동(이동·텔레포트 스왑·탐색·생략) → 1-ply 위치 평가(+강제 전투 기대치·공격 기회) → 상위 K 후보에 대해
   2-ply: 보이는 적의 최선 응수(공격·이동)로 내 평가가 얼마나 나빠지는지 감점 → 최종 = 0.4·1-ply + 0.6·최악 응수 후 평가.
   판단 시간 상한(BAL.aiStrongBudgetMs) 초과 시 남은 후보는 1-ply 순위로 처리. 반복 완화: 최근 이력 칸 복귀 감점. */
function aiLevelOf(p){return (S.aiLevel&&S.aiLevel[p])||"grade5";}
function aiUnitValue(x,me){ // 말 가치 (자기 말 또는 공개된 적 말) — 적의 포획 하수인 보유(cap)는 비공개 정보라 자기 말만 반영
  if(x.type==="king") return 200;
  if(x.type==="ally") return 40+(x.cap&&x.owner===me?25:0);
  if(x.type==="minion") return 26+(x.hp/x.maxHp)*24;
  if(x.type==="bomb") return 18;
  if(x.type==="trap") return 10;
  return 20;
}
function aiWinProb(att,def,me){ // 공개 스탯 기반 승률 추정 — 포획 하수인(cap) 출전은 자기 말(owner===me)만 가정, 적의 cap은 비공개
  const fa=(att.owner===me&&att.cap)?att.cap:att, fd=(def.owner===me&&def.cap)?def.cap:def;
  let p=0.5;
  if(fa.element&&fd.element){ if(BEATS[fa.element]===fd.element) p+=0.18; else if(BEATS[fd.element]===fa.element) p-=0.18; }
  p+=((fa.hp/fa.maxHp)-(fd.hp/fd.maxHp))*0.3;
  p+=((fa.atk||0)-(fd.atk||0))/60;
  if(!fa.skills&&(att.type==="king"||att.type==="ally")) p-=0.1; // 본체 출전은 기술 없음
  if(!fd.skills&&(def.type==="king"||def.type==="ally")) p+=0.1;
  if(att.nextBattleBuff) p+=0.05;
  return Math.max(0.08,Math.min(0.92,p));
}
/* 전투 기대치 (me 관점, 양수=유리): 미공개 적은 목격 이동 여부별 폭탄·함정 확률 혼합 */
function aiBattleEV(me,att,def){
  if(att.type==="bomb"||att.type==="trap") return null;
  if(att.type==="king"&&def.type==="king") return null; // 불가침
  const th=aiThreatOf(me,def), va=aiUnitValue(att,me);
  const bombEV=att.type==="minion"?-va+16:22, trapEV=-10;
  if(th==="bomb") return bombEV;
  if(th==="trap") return trapEV;
  const edgeGuard=Math.abs(def.r-(me===0?ROWS:1))<=1?45:0; // 끝줄 저지: 내 최후방 1칸 이내 적은 우선 제거 (왕 끝줄 승리 차단)
  const pressure=Math.min(1,S.turnCount/BAL.maxTurns)*8; // 후반 공세 압력 (무승부 방지)
  if(th==="unit"){
    const p=aiWinProb(att,def,me);
    let ev=p*(aiUnitValue(def,me)+(def.type==="king"?400:0))-(1-p)*va;
    if(att.type==="king"&&!att.cap) ev-=(1-p)*400; // 왕 본체 패배 = 경기 패배
    else ev+=4; // 선제 보너스: 인접 적은 어차피 다음 턴 나를 칠 수 있음 — 공격측 선공 이득
    return ev+edgeGuard+pressure;
  }
  const r=Math.min(1,aiStaticRisk(me,th==="unknownMoved")), trapShare=th==="unknownMoved"?0:0.35;
  const p=aiWinProb(att,{element:null,hp:100,maxHp:100,atk:22,type:"minion"},me);
  let unitEV=p*28-(1-p)*va;
  if(att.type==="king"&&!att.cap) unitEV-=(1-p)*400;
  return r*(bombEV*(1-trapShare)+trapEV*trapShare)+(1-r)*unitEV+edgeGuard*(att.type==="king"?0:1)+pressure;
}
/* 위치 평가 — V: 결정 시점 고정 가시 적 목록 (가상 이동 중 새로 인접해도 숨은 말은 절대 참조하지 않음) */
function aiEvalPos(me,V){
  const my=alivePieces().filter(x=>x.owner===me);
  const king=my.find(x=>x.type==="king");
  const units=V.filter(e=>!(e.revealed&&(e.type==="bomb"||e.type==="trap")));
  const dist=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c);
  let v=0;
  for(const x of my) v+=aiUnitValue(x,me);
  for(const e of S.pieces.filter(e=>e.owner!==me&&e.alive&&e.placed)) v-=e.revealed?aiUnitValue(e,me):28; // 잔여 수는 공개 정보(제거 공개), 정체는 공개 시만
  const goal=me===0?1:ROWS, last=me===0?ROWS:1;
  if(king){
    const danger=units.filter(e=>dist(e,king)===1).length, near=units.filter(e=>dist(e,king)===2).length;
    v-=danger*48+near*10;
    v+=my.filter(b=>b.type==="bomb"&&dist(b,king)===1).length*6;
    if(inForest(king)) v+=3;
    const dg=Math.abs(king.r-goal);
    if(dg===0) v+=1000;
    else v+=(12-dg)*(danger===0&&near===0?4:1);
    if(zoneOf(1-me).includes(king.r)&&danger) v-=40;
  }
  const eking=V.find(e=>e.type==="king"&&e.revealed);
  for(const e of units){ // 끝줄 저지: 내 최후방 접근 적은 큰 감점, 내 말이 붙어 있으면 완화
    const d=Math.abs(e.r-last);
    if(d<=2){ v-=(3-d)*18; if(d<=1){ v-=30; if(my.some(x=>x.type!=="bomb"&&x.type!=="trap"&&dist(x,e)===1)) v+=28; } }
  }
  for(const x of my){
    if(x.type==="minion"){ v+=(me===1?x.r:ROWS+1-x.r)*1.2+(4-Math.abs(x.c-4))*0.5; if(eking) v+=(10-Math.min(10,dist(x,eking)))*3; }
    if(x.type==="ally"){ if(eking) v+=(10-Math.min(10,dist(x,eking)))*2; }
    if(canSearchPiece(x)){
      const ev=S.events.find(e=>e.r===x.r&&e.c===x.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
      if(ev) v+=10;
      if((x.type==="ally"||x.type==="king")&&S.balls[me]>0&&!x.cap&&!S.reserve[me]){
        const df=Math.min(...(me===1?[4,5]:[9,10]).map(tr=>Math.abs(x.r-tr)));
        v+=(5-Math.min(5,df))*(x.type==="king"?0.8:2);
      }
    }
    if(x.type==="bomb"){ if(units.some(e=>e.type!=="king"&&dist(e,x)===1)) v+=5; if(x.revealed) v-=6; }
    if(x.type!=="bomb"&&x.type!=="trap"&&x.type!=="king") // 접촉 압력(불리한 인접은 감점) — 상세 응수는 2-ply가 처리
      for(const e of units) if(dist(x,e)===1){ const p=aiWinProb(x,e.revealed?e:{element:null,hp:100,maxHp:100,atk:22,type:"minion"},me); v+=(p-0.5)*10; }
  }
  v+=S.balls[me]*3+(S.reserve[me]?15:0)+S.inv[me].length*2;
  return v;
}
/* 2-ply: 보이는 적의 최선 응수(내 말 공격 또는 1칸 이동) 후 내 평가의 최악값 */
function aiWorstReply(me,V,deadline){
  const my=alivePieces().filter(x=>x.owner===me), occ=(r,c)=>my.some(x=>x.r===r&&x.c===c)||V.some(e=>e.r===r&&e.c===c);
  const base=aiEvalPos(me,V);
  let worst=base, n=0;
  for(const e of V){
    if(e.revealed&&(e.type==="bomb"||e.type==="trap")) continue;
    if(e.immobile>0) continue;
    for(const x of my){ // 공격 응수: 내 말 x를 e가 공격 (내 관점 EV 부호 반전은 x가 방어자)
      if(Math.abs(e.r-x.r)+Math.abs(e.c-x.c)!==1) continue;
      if(x.type==="bomb"||x.type==="trap") continue; // 적이 내 폭탄·함정을 치면 나에게 이득 → 최선 응수 아님
      if(e.type==="king"&&e.revealed&&x.type==="king") continue;
      const p=1-aiWinProb(e.revealed?e:{element:null,hp:100,maxHp:100,atk:22,type:"minion"},x,me);
      const harm=(1-p)*(aiUnitValue(x,me)+(x.type==="king"?400:0))-p*(e.revealed?aiUnitValue(e,me):28);
      worst=Math.min(worst,base-harm); n++;
    }
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ // 이동 응수
      const r=e.r+dr,c=e.c+dc; if(r<1||r>ROWS||c<1||c>COLS||occ(r,c)) continue;
      const or=e.r,oc=e.c; e.r=r;e.c=c;
      worst=Math.min(worst,aiEvalPos(me,V)); n++;
      e.r=or;e.c=oc;
      if(n>=BAL.aiStrongReplyCap||Date.now()>deadline) return worst;
    }
  }
  return worst;
}
function aiMainStrong(me){
  const t0=Date.now(), deadline=t0+BAL.aiStrongBudgetMs;
  const V=aiVisible(me); // 결정 시점 고정 가시 집합
  const my=alivePieces().filter(x=>x.owner===me);
  const hist=S.aiHist[me]||(S.aiHist[me]=[]);
  const cands=[];
  const virt=(fn)=>{ // 가상 적용 → 평가 → 복원
    const snap=my.map(x=>[x,x.r,x.c]); fn();
    const s=aiEvalPos(me,V);
    for(const [x,r,c] of snap){x.r=r;x.c=c;}
    return s;
  };
  const forcedGain=(p,before)=>{ // 이동 후 새로 인접한 보이는 적과의 강제 전투 기대치 (내가 대상 선택 → 최대) — 없으면 0
    let best=null;
    for(const e of V){ if(Math.abs(e.r-p.r)+Math.abs(e.c-p.c)!==1||before.has(e.id)) continue;
      const ev=aiBattleEV(me,p,e); if(ev===null) continue; if(best===null||ev>best) best=ev; }
    return best===null?0:best;
  };
  const attackOpp=()=>{ // 이동 후 가능한 최선 공격 기회(양수만, 0.8 가중)
    let best=0;
    for(const x of my) for(const e of V){ if(Math.abs(e.r-x.r)+Math.abs(e.c-x.c)!==1) continue;
      const ev=aiBattleEV(me,x,e); if(ev!==null&&ev>best) best=ev; }
    return best*0.8;
  };
  const adjIds=p=>new Set(V.filter(e=>Math.abs(e.r-p.r)+Math.abs(e.c-p.c)===1).map(e=>e.id));
  const hiddenLeft=S.pieces.filter(e=>e.owner!==me&&e.alive&&e.placed).length-V.length; // 아직 보이지 않는 적 말 수 (공개 정보: 총 잔여 − 가시)
  const unseenForestAdj=(r,c,mover)=>{ // (r,c)에 인접한 숲 칸 중 내 다른 말이 인접하지 않아 관측되지 않는 칸 수
    let n=0;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const fr=r+dr,fc=c+dc;
      if(fr<1||fr>ROWS||fc<1||fc>COLS||!inForest({r:fr,c:fc})) continue;
      if(my.some(x=>x!==mover&&Math.abs(x.r-fr)+Math.abs(x.c-fc)<=1)) continue;
      n++; }
    return n;
  };
  // 후보 1: 탐색
  for(const p of my.filter(canSearchPiece)){
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
    if(ev) cands.push({kind:"search",p,ev,s1:aiEvalPos(me,V)+14+attackOpp(),desc:"탐색"});
  }
  // 후보 2: 이동 (폭탄 포함·함정 제외 — canMoveTo가 규칙 처리)
  for(const p of my.filter(x=>x.immobile===0&&x.type!=="trap")){
    for(const [r,c] of aiMoveOptions(p)){
      const before=adjIds(p);
      let s1=virt(()=>{p.r=r;p.c=c;});
      { const or=p.r,oc=p.c; p.r=r;p.c=c; s1+=forcedGain(p,before)+attackOpp(); p.r=or;p.c=oc; } // 강제 전투 기대치·공격 기회
      if(hist.some(h=>h.id===p.id&&h.r===r&&h.c===c)) s1-=6; // 반복 완화
      if(p.type==="king"&&r===(me===0?1:ROWS)) s1+=1000;
      if(p.type==="king"&&hiddenLeft>0) s1-=unseenForestAdj(r,c,p)*22; // 왕: 도착 칸에 인접한 관측 불가 숲 칸마다 감점 (숨은 적 강제 전투 위험)
      cands.push({kind:"move",p,r,c,s1,desc:"이동"});
    }
  }
  // 후보 3: 텔레포트 스왑 — 왕↔침투 말(러시)·왕↔후방(구출)·폭탄↔전방 하수인(미끼) 상한 12
  if(teleportAvailable(me)&&S.teleUsed[me]<BAL.teleMax){
    const king=my.find(x=>x.type==="king"&&x.immobile===0);
    const pairs=[];
    if(king) for(const x of my.filter(x=>x.id!==king.id&&x.immobile===0)) pairs.push([king,x]);
    for(const b of my.filter(x=>x.type==="bomb"&&x.immobile===0)) for(const m of my.filter(x=>x.type==="minion"&&x.immobile===0&&zoneOf(1-me).includes(x.r))) pairs.push([b,m]);
    for(const [a,b] of pairs.slice(0,12)){
      const ba=adjIds(a), bb=adjIds(b);
      const s1=virt(()=>{const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac;})
        +(()=>{const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac; const g=forcedGain(a,ba)+forcedGain(b,bb)+attackOpp(); b.r=a.r;b.c=a.c; a.r=ar;a.c=ac; return g;})()
        -8; // 자원 소모 비용
      cands.push({kind:"tele",a,b,s1,desc:"텔레포트"});
    }
  }
  // 후보 4: 생략 (위치 보존)
  cands.push({kind:"skip",s1:aiEvalPos(me,V)+attackOpp()-2,desc:"생략"});
  for(const c of cands) c.s1+=rand()*0.5; // 동점 타이브레이크 (시드 재현 가능)
  cands.sort((a,b)=>b.s1-a.s1);
  // 2-ply: 상위 K 후보에 대해 최악 응수 반영
  const top=cands.slice(0,BAL.aiStrongTopK);
  for(const c of top){
    if(Date.now()>deadline){ c.s2=c.s1; continue; }
    const snap=my.map(x=>[x,x.r,x.c]);
    if(c.kind==="move"){c.p.r=c.r;c.p.c=c.c;}
    else if(c.kind==="tele"){const ar=c.a.r,ac=c.a.c; c.a.r=c.b.r;c.a.c=c.b.c; c.b.r=ar;c.b.c=ac;}
    const worst=aiWorstReply(me,V,deadline);
    for(const [x,r,c2] of snap){x.r=r;x.c=c2;}
    c.s2=0.4*c.s1+0.6*(worst+(c.s1-aiEvalPos(me,V))); // 최악 응수 후 평가에 내 행동의 즉시 이득(강제 전투·공격 기회)을 유지
  }
  top.sort((a,b)=>b.s2-a.s2);
  S.aiLastThinkMs=Date.now()-t0;
  for(const c of top){ // 실행 (텔레포트 차단 시 다음 후보)
    if(c.kind==="search"){ doSearch(c.p,c.ev); addLog("🤖 AI 탐색 행동","ai"); return; }
    if(c.kind==="move"){ hist.push({id:c.p.id,r:c.p.r,c:c.p.c}); if(hist.length>6) hist.shift();
      doMove(c.p,c.r,c.c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return; }
    if(c.kind==="tele"){ if(doTeleportSwap(c.a,c.b)){ addLog("🤖 AI 주 행동","ai"); return; } continue; }
    S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략"); return;
  }
  S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai");
}
/* 5단 전투 개시 선택: 기대치 기반 (canBattle·가시 대상만) */
function aiEvalBattlesStrong(me){
  let best=null;
  for(const att of alivePieces().filter(p=>p.owner===me))
    for(const def of adjEnemies(att)){
      if(!visibleTo(me,def)||!canBattle(att,def)) continue;
      const ev=aiBattleEV(me,att,def); if(ev===null) continue;
      if(!best||ev>best.score) best={att,def,score:ev};
    }
  return best&&best.score>2?best:null;
}
/* 5단 전투 중 행동: 킬 가능·피해 경쟁(누가 먼저 쓰러지는가) 기반으로 아이템·볼 투척·도망·기술을 결정 — 상대 미공개 기술은 참조하지 않고 공개 스탯(atk)·속성만 사용 */
function aiBattleActionStrong(side){
  const B=S.battle; if(!B) return;
  const f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const ownerP=side==="A"?B.attP.owner:B.defP.owner, myPc=side==="A"?B.attP:B.defP, oppPc=side==="A"?B.defP:B.attP;
  const adv=f.element&&opp.element&&BEATS[f.element]===opp.element, disadv=f.element&&opp.element&&BEATS[opp.element]===f.element;
  const mult=(adv?BAL.advMult:disadv?BAL.disMult:1)*(f.weaken>0?(1-BAL.weakenPct):1)*(f.atkBuff?1+BAL.nextBuffPct:1);
  const oAdv=opp.element&&f.element&&BEATS[opp.element]===f.element, oDis=opp.element&&f.element&&BEATS[f.element]===opp.element;
  const oppEst=(opp.atk||16)*(opp.skills?1.18:1)*(oAdv?BAL.advMult:oDis?BAL.disMult:1)*(opp.weaken>0?(1-BAL.weakenPct):1)*(f.dmgCut?1-f.dmgCut:1);
  const usable=f.skills?f.skills.map((sid,i)=>({i,sk:SKILLS[sid]})).filter(x=>f.cds[x.i]===0):[];
  const dmgOf=sk=>(sk?slotPow(f,sk):f.atk)*mult*(f.focusCharge&&sk&&sk.kind==="attack"?1.2:1);
  let bestDmg=f.atk*mult, bestSlot=-1;
  for(const {i,sk} of usable) if(sk.pow&&dmgOf(sk)>bestDmg){bestDmg=dmgOf(sk); bestSlot=i;}
  const killNow=bestDmg*(1-BAL.dmgVar)>=opp.hp+opp.shield;
  const toKillMe=Math.ceil(Math.max(1,f.hp)/Math.max(1,oppEst)), toKillOpp=Math.ceil((opp.hp+opp.shield)/Math.max(1,bestDmg));
  const losing=toKillMe<toKillOpp;
  // 아이템: 사망 위기면 회복약(다음 피격 생존), 상태이상이면 해독제
  const usedItems=side==="A"?B.itemsA:B.itemsD, itemRound=side==="A"?B.itemRoundA:B.itemRoundD, lastItem=side==="A"?B.lastItemA:B.lastItemD;
  if(!itemRound&&usedItems<BAL.itemPerBattle){
    const inv=S.inv[ownerP]; let use=-1;
    if(!killNow&&f.hp<=oppEst*1.25&&inv.includes("potion")&&lastItem!=="potion") use=inv.indexOf("potion");
    else if((f.burn||f.weaken||f.shock)&&inv.includes("cure")&&lastItem!=="cure"&&toKillOpp>1) use=inv.indexOf("cure");
    else if(!usable.length&&f.skills&&inv.includes("cool")&&lastItem!=="cool") use=inv.indexOf("cool");
    if(use>=0){ window.__useItem(use); return; }
  }
  // 볼 투척: 게이트 충족 시 포획(제거+예비 확보)이 킬보다 가치 큼 — 확정 킬이고 내 HP가 위험할 때만 킬 우선
  const thrown=side==="A"?B.ballThrowA:B.ballThrowD;
  if(oppPc.type==="minion"&&opp.hp<opp.maxHp*0.3&&S.balls[ownerP]>0&&!S.reserve[ownerP]&&!thrown&&(!killNow||f.hp>f.maxHp*0.6)){ window.__throwBall(); return; }
  // 도망: 본체 VIP가 죽을 위기이거나 열세 전투 (확정 킬 가능하면 안 함)
  if(f.hp<f.maxHp*0.5&&!killNow){
    const vipBody=(myPc.type==="ally"||myPc.type==="king")&&f===myPc;
    if((vipBody&&(losing||toKillMe<=1))||(losing&&toKillMe<=2)){ window.__flee(); return; }
  }
  if(!f.skills){ if(f.skillAtk&&f.cd===0){window.__act("skill");return;} window.__act("basic"); return; }
  if(!usable.length){ window.__act("basic"); return; }
  const statusKey={fire:"burn",water:"weaken",lightning:"shock"}[f.element];
  const lowHp=f.hp<=oppEst*1.5;
  const scored=usable.map(({i,sk})=>{
    let sc=0;
    if(sk.pow){
      const est=dmgOf(sk);
      sc=est/3;
      if(est*(1-BAL.dmgVar)>=opp.hp+opp.shield) sc=100;
      else if(est>=opp.hp+opp.shield) sc=60; // 분산 상단으로 킬 가능
      if(sk.kind==="sig") sc+=3;
      if(sk.status&&statusKey&&!opp[statusKey]) sc+=4;
      if(sk.drainPct&&lowHp) sc+=4;
      if(sk.selfShieldPct&&lowHp) sc+=3;
      if(sk.bonusVsShield&&opp.shield>0) sc+=2;
      if(sk.bonusVsStatus&&(opp.burn||opp.weaken||opp.shock)) sc+=2;
      if(sk.selfVuln&&lowHp) sc-=8;
    } else {
      if(sk.healPct) sc=(lowHp&&toKillOpp>1)?25:1;
      else if(sk.shieldPct) sc=(lowHp&&toKillOpp>1?16:4)*(f.shield>0?0.3:1);
      else if(sk.dmgCut) sc=lowHp&&toKillOpp>1?12:2;
      else if(sk.focus) sc=(!f.focusCharge&&toKillOpp>=2&&!lowHp)?8:0.5;
      else if(sk.coolAny) sc=f.cds.some((c,j)=>j!==i&&c>=2)?5:0.3;
      else if(sk.cleanse) sc=(f.burn||f.weaken||f.shock)?9:0.3;
    }
    return {i,sc:sc+rand()*0.3};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  window.__act(scored[0].i);
}
/* AI 로스터 선택: 4속성 각 1종 이상 + 나머지 2종 무작위 (중복 없음, 아키타입 혼합 선호) */
function aiPickRoster(p){
  if(S.roster[p].length===6) return;
  S.roster[p]=[];
  const archs=shuffle(["std","atk","def"]);
  shuffle(ELEMS.slice()).forEach((el,i)=>{
    const pool=ROSTER.filter(r=>r.element===el);
    S.roster[p].push((pool.find(r=>r.arch===archs[i%3])||pool[0]).id);
  });
  const rest=shuffle(ROSTER.filter(r=>!S.roster[p].includes(r.id)).map(r=>r.id));
  S.roster[p].push(rest[0],rest[1]);
  shuffle(S.roster[p]);
  applyRoster(p);
}
/* AI 휴리스틱 배치 */
function aiAutoPlace(p){
  aiPickRoster(p);
  const rows=zoneOf(p);
  const back = p===1?rows[0]:rows[2];     // 후열
  const mid  = rows[1];
  const front= p===1?rows[2]:rows[0];     // 전열
  const free=(r,c)=>r>=1&&r<=ROWS&&c>=1&&c<=COLS&&rows.includes(r)&&!at(r,c);
  const put=(x,r,c)=>{x.r=r;x.c=c;x.placed=true;};
  const mine=t=>S.pieces.filter(x=>x.owner===p&&x.type===t&&!x.placed);
  // 왕: 후열(80%) 또는 중열(20% 블러핑), 무작위 열
  const king=mine("king")[0];
  {const kr=rand()<0.8?back:mid; const cols=shuffle([1,2,3,4,5,6,7]);
   put(king,kr,cols.find(c=>free(kr,c)));}
  // 폭탄: 1~2개 왕 인접 호위, 나머지 무작위
  const bombs=mine("bomb"); let guard=0;
  for(const b of bombs){
    if(guard<2){
      const spots=shuffle([[king.r+1,king.c],[king.r-1,king.c],[king.r,king.c+1],[king.r,king.c-1]]).filter(([r,c])=>free(r,c));
      if(spots.length){put(b,spots[0][0],spots[0][1]);guard++;continue;}
    }
    aiPutRandom(b,rows,free,put);
  }
  // 함정: 전열 중앙(3~5열) 침투로
  for(const t of mine("trap")){
    const spots=shuffle([[front,3],[front,4],[front,5],[mid,3],[mid,4],[mid,5]]).filter(([r,c])=>free(r,c));
    if(spots.length) put(t,spots[0][0],spots[0][1]); else aiPutRandom(t,rows,free,put);
  }
  // 동료: 측면(1·2·6·7열) 숲 접근
  for(const a of mine("ally")){
    const spots=shuffle([[front,1],[front,2],[front,6],[front,7],[mid,1],[mid,7]]).filter(([r,c])=>free(r,c));
    if(spots.length) put(a,spots[0][0],spots[0][1]); else aiPutRandom(a,rows,free,put);
  }
  // 하수인: 전열 우선, 속성 분산 유지
  for(const m of mine("minion")){
    const spots=[];
    for(const c of shuffle([1,2,3,4,5,6,7])){ if(free(front,c)) spots.push([front,c]); }
    for(const c of shuffle([1,2,3,4,5,6,7])){ if(free(mid,c)) spots.push([mid,c]); }
    if(spots.length) put(m,spots[0][0],spots[0][1]); else aiPutRandom(m,rows,free,put);
  }
}
function aiPutRandom(x,rows,free,put){
  const cells=[]; for(const r of rows) for(let c=1;c<=COLS;c++) if(free(r,c)) cells.push([r,c]);
  shuffle(cells); put(x,cells[0][0],cells[0][1]);
}

/* #11·#36 추측 메모: 게임 중 정체 미공개 상대 말 클릭(전투 지정 경로 외) → 8종 이모지 피커 — 뷰어(PVE:0 / PVP:현재 플레이어)별 비공개, 인메모리만(로그·영구 저장 없음) */

/* ===== #26·#32·#42 첫 플레이어용 ELI5 튜토리얼 — 게임 상태 S와 완전 분리 (TUT) · 영구 저장은 localStorage 키 tutorialSeen 하나뿐 ·
   게임 내부 모달(#tutOverlay, 외부 서버·창·이미지 없음) · 10단계 한 화면 한 개념 · 단계마다 (1)~(n) 독립 카드(번호·제목·그림·결과·설명, #42 DOM 블록 구조) ·
   상황 도움말(텔레포트·버닝 타임)은 첫 발생 시 1회, 게임 상태 무변경 ===== */
const TUT_KEY="tutorialSeen";
/* #42 장면 도우미 — 카드 안의 '그림'만 만든다. 공간 도형(미니 보드·화살표·토큰·HP 막대)은 소형 인라인 SVG, 나머지 텍스트·목록·흐름은 DOM 조각.
   SVG <text>에는 이모지·기호만 넣고(한글·숫자 금지) 모든 문장은 DOM으로 렌더링해 자연 줄바꿈된다. DOM·canvas·네트워크·외부 리소스 없음 */
const TSV={
  C:{own:"#2f3a5e",op:"#5e2f3a",forest:"#23422f",mid:"#2b3140",line:"#3d475e",txt:"#e8ecf5",dim:"#9aa3b8",acc:"#5b8cff",bad:"#ff5b6e",ok:"#4fd88a",gold:"#ffd84d"},
  esc:s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"),
  /* --- SVG 조각 (viewBox는 각 그림 크기, preserveAspectRatio meet로 카드 폭·높이에 맞춰 축소만 됨 → 잘림 없음) --- */
  svg(w,h,alt,body,cls){ return `<svg class="${cls||"tut-fig"}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${TSV.esc(alt)}" focusable="false">${body}</svg>`; },
  g(x,y,s,fs,col){ return `<text x="${x}" y="${y}" font-size="${fs||13}" fill="${col||TSV.C.txt}" text-anchor="middle" dominant-baseline="middle">${s}</text>`; }, // 이모지·기호 글리프 전용
  cell(x,y,k,s,o){ s=s||22; return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="3" fill="${TSV.C[k||"mid"]}" stroke="${o&&o.st||TSV.C.line}"${o&&o.sw?` stroke-width="${o.sw}"`:""}/>`; },
  grid(x,y,cols,rows,kf,s){ s=s||22; let o=""; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) o+=TSV.cell(x+c*s,y+r*s,kf?kf(r,c):"mid",s); return o; },
  tok(cx,cy,g,side,r){ r=r||9; const f=side==="op"||side==="opghost"?"#7a3644":side==="hid"?"#3a4152":"#3a4a80"; const st=side==="me"||side==="ghost"?"#dfe6ff":"#0008";
    const dash=/ghost/.test(side)?' stroke-dasharray="3 2" opacity=".55"':""; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${st}" stroke-width="1.5"${dash}/>`+TSV.g(cx,cy+0.5,g,Math.max(10,Math.round(r*1.1))); },
  arrow(x1,y1,x2,y2,col,w,dash){ col=col||TSV.C.acc; w=w||2; const a=Math.atan2(y2-y1,x2-x1), h=6; const hx=x2-Math.cos(a)*h, hy=y2-Math.sin(a)*h;
    const p1=[hx+Math.sin(a)*4,hy-Math.cos(a)*4], p2=[hx-Math.sin(a)*4,hy+Math.cos(a)*4];
    return `<line x1="${x1}" y1="${y1}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}"${dash?' stroke-dasharray="4 3"':""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`; },
  x(cx,cy,r,col){ r=r||6; col=col||TSV.C.bad; return `<line x1="${cx-r}" y1="${cy-r}" x2="${cx+r}" y2="${cy+r}" stroke="${col}" stroke-width="2.5"/><line x1="${cx-r}" y1="${cy+r}" x2="${cx+r}" y2="${cy-r}" stroke="${col}" stroke-width="2.5"/>`; },
  hp(x,y,w,p,col){ return `<rect x="${x}" y="${y}" width="${w}" height="7" rx="3" fill="#333"/><rect x="${x}" y="${y}" width="${Math.round(w*p)}" height="7" rx="3" fill="${col||TSV.C.ok}"/>`; },
  /* --- DOM 조각 --- */
  dtok(g,side,sm){ return `<span class="tut-tok ${side}${sm?" sm":""}">${g}</span>`; },
  ico(g,side,alt,xed){ return TSV.svg(28,28,alt,TSV.tok(14,14,g,side,11)+(xed?TSV.x(14,14,8):""),"tut-ico"); }, // 엑스 표시가 필요한 토큰만 소형 SVG
  arr(col){ col=col||TSV.C.acc; return `<svg class="tut-arr" viewBox="0 0 24 12" aria-hidden="true" focusable="false">${TSV.arrow(1,6,23,6,col,2)}</svg>`; },
  lbl(s,cls){ return `<span class="tut-lbl${cls?" "+cls:""}">${s}</span>`; },
  pill(s,cls){ return `<span class="tut-pill${cls?" "+cls:""}">${s}</span>`; },
  row(){ return `<div class="tut-row">${Array.prototype.join.call(arguments,"")}</div>`; },
  stack(){ return `<div class="tut-stack">${Array.prototype.join.call(arguments,"")}</div>`; },

function tutScrollTop(){ // #42 REVISE: 새로 그린 단계는 언제나 제목(맨 위)부터 — 스크롤 컨테이너인 #tutBox는 렌더 사이에 살아남아 이전 단계의 오프셋을 물고 온다

function tutOpen(opts){

    <div class="row tut-nav" id="tutNav"></div>`;
  const nav=$("tutNav"); TUT.btns=[];

  if(last) mk("처음부터",()=>tutGo(0),{aria:"튜토리얼 처음부터 다시 보기"}); else mk("건너뛰기",tutSkip,{aria:"튜토리얼 건너뛰기"});
  /* #42 REVISE 포커스·스크롤 계약: tutOpen·tutGo(다음/이전/처음부터) 모두 tutRender를 거치므로 여기 한 곳에서만 처리한다.
     ① 하단 기본 버튼에 preventScroll로 포커스 → 브라우저가 박스를 맨 아래로 끌어내리지 않음 (200% 줌·360px 좁은 폭에서 제목·카드 1이 가려지던 회귀)
     ② 그 뒤 스크롤을 맨 위로 되돌림 → preventScroll 미지원 브라우저에서도, 그리고 이전 단계에서 남은 오프셋에서도 항상 제목부터 시작
     키보드 의미(Tab 순환·←/→·Esc)는 그대로 — Tab 이동은 기존처럼 기본 스크롤(포커스 요소 노출)을 유지한다. */
  tutFocus(primary,{preventScroll:true});

function tutKeydown(e){ // 대화상자 내부 키보드: Esc=건너뛰기 · ←/→=이전/다음 · Tab=대화상자 안에서 순환 (게임 화면에는 키 핸들러가 없어 충돌 없음)
  if(!TUT.open||!e) return false;
  const k=e.key, stop=()=>{ if(e.preventDefault) e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); };
  if(k==="Escape"){ stop(); tutSkip(); return true; }
  if(k==="ArrowRight"){ stop(); if(TUT.step<TUT_STEPS.length-1) tutNext(); return true; }
  if(k==="ArrowLeft"){ stop(); tutPrev(); return true; }
  if(k==="Tab"){
    const f=TUT.btns.filter(b=>!b.disabled); if(!f.length) return false;
    stop();
    const cur=f.indexOf(document.activeElement);
    const nx=e.shiftKey?(cur<=0?f.length-1:cur-1):(cur<0||cur>=f.length-1?0:cur+1);
    tutFocus(f[nx]); return true;
  }
  return false;
}

/* ===== 온라인 PVP — WebSocket 릴레이 + 시드 락스텝 동기화 =====
   원리: 매치 시 P1이 난수 시드를 공유 → 양쪽이 같은 시드로 같은 게임을 로컬 실행하고,
   플레이어 "입력(액션)"만 릴레이 서버로 중계·재생한다. 모든 게임 난수는 rand()(시드 RNG) 경유이고
   로직은 동기 완결이므로 두 클라이언트의 상태가 항상 일치한다 (서버는 내용 무해석 릴레이).
   숨은 정보는 시점(viewer=NET.me) 고정·비소유 모달 마스킹으로만 가린다 (프로토타입: 치팅 방지 없음). */
const NET={mode:false,me:null,ws:null,replaying:false,queue:[],modalSeq:0,syncModal:null,localOpen:false,modalOwner:null,started:false};
function netActor(){ // 지금 게임이 입력을 기다리는 플레이어
  if(!S) return null;
  if(S.phase==="setup") return S.setupPlayer;
  if(S.battle) return (actorOfPhase()==="A"?S.battle.attP:S.battle.defP).owner;
  return S.current;
}
function netLocalModal(){NET.localOpen=true;}   // 다음 modal()을 로컬 전용으로 (동기화·seq 제외)
function netModalOwner(p){NET.modalOwner=p;}    // 다음 modal()의 소유자 명시 (기본: netActor())
function netSend(m){ try{ if(NET.ws&&NET.ws.readyState===1) NET.ws.send(JSON.stringify(m)); }catch(e){} }
function netAction(a){ // 모든 상태 변경 입력의 단일 경로 — 오프라인은 즉시 적용, 온라인은 검증·송신 후 적용
  if(NET.mode&&!NET.replaying){
    if(netActor()!==NET.me){ showToast("🌐 상대 턴입니다."); return; }
    netSend({t:"a",a});
  }
  applyAction(a);
}
function applyAction(a){
  switch(a.t){
    case "cell": onCellCore(a.r,a.c); break;
    case "selTray": window.selTrayCore(a.id); break;
    case "roster": window.toggleRosterCore(a.rid); break;
    case "auto": window.autoPlaceCore(); break;
    case "clear": window.clearPlaceCore(); break;
    case "setupDone": window.setupDoneCore(); break;
    case "skipMain": S.mainUsed=true; addLog(`${pname(S.current)} 주 행동 생략`); render(); break;
    case "search": {
      const sel=S.selected&&!S.selected.tray?S.selected:null;
      const ev=sel?S.events.find(e=>e.r===sel.r&&e.c===sel.c&&!e.consumed&&S.traces[S.current].has(e.r+"_"+e.c)):null;
      if(sel&&ev&&!S.mainUsed&&sel.owner===S.current&&canSearchPiece(sel)) doSearch(sel,ev);
      break; }
    case "tele": S.teleport=S.teleport?null:{stage:1,piece:null}; S.selected=null; render(); break;
    case "endTurn": endTurn(); break;
    case "resign": { const loser=S.current; gameOver(1-loser,"resign");
      const msg=`🏳️ ${pname(loser)} 기권 — ${pname(S.winner)} 승리!`;
      addLog(msg,"imp"); showToast(msg); render(); break; }
    case "act": if(window.__actCore) window.__actCore(a.k); break;
    case "item": if(window.__useItemCore) window.__useItemCore(a.i); break;
    case "ball": if(window.__throwBallCore) window.__throwBallCore(); break;
    case "flee": if(window.__fleeCore) window.__fleeCore(); break;
    case "cap": if(window.__capCore) window.__capCore(a.m); break;
    case "modal": if(NET.syncModal&&NET.syncModal.seq===a.seq&&NET.syncModal.fns[a.i]) NET.syncModal.fns[a.i](); break;
  }
}
/* 수신 액션 큐 — 표시 계층(메시지 재생·타이머 모달)이 따라잡은 뒤에만 재생 (원격 지연·백그라운드 탭 방어) */
function netReady(a){
  if(!NET.started||!S) return false;
  if(a.t==="modal") return !!NET.syncModal&&NET.syncModal.seq===a.seq&&!MSGPLAYING;
  if(a.t==="act"||a.t==="item"||a.t==="ball"||a.t==="flee")
    return !!S.battle&&!MSGPLAYING&&S.battle.msgQ.length===0&&!!window.__actCore;
  return !MSGPLAYING;
}
function netPump(){
  if(NET.replaying) return;
  while(NET.queue.length&&netReady(NET.queue[0])){
    const a=NET.queue.shift();
    NET.replaying=true;
    try{ applyAction(a); }catch(e){ try{console.error("net replay error",e,a);}catch(_){} }
    NET.replaying=false;
  }
}
(function(){ const t=setInterval(netPump,80); if(t&&typeof t.unref==="function") t.unref(); })(); // 브라우저는 숫자 반환(무영향) · Node 하네스에서는 이벤트 루프를 붙잡지 않음 (#41 회귀: smoke 종료 지연)
/* 동기화 대상 입력의 안정 진입점 — 원본(…Core)은 applyAction만 호출 */
function onCell(r,c){ netAction({t:"cell",r,c}); }
window.selTray=id=>netAction({t:"selTray",id});
window.toggleRoster=rid=>netAction({t:"roster",rid});
window.autoPlace=()=>netAction({t:"auto"});
window.clearPlace=()=>netAction({t:"clear"});
window.setupDone=()=>netAction({t:"setupDone"});
window.__act=k=>netAction({t:"act",k});
window.__useItem=i=>netAction({t:"item",i});
window.__throwBall=()=>netAction({t:"ball"});
window.__flee=()=>netAction({t:"flee"});
window.__cap=m=>netAction({t:"cap",m});
/* modal() 래퍼: 동기화 모달은 seq 부여 + 소유자만 조작(클릭 시 인덱스 중계), 비소유자는 내용 마스킹 */
const _modalCore=modal;
modal=function(html,buttons){
  const local=NET.localOpen; NET.localOpen=false;
  const owner=(NET.modalOwner!==null&&NET.modalOwner!==undefined)?NET.modalOwner:netActor();
  NET.modalOwner=null;
  _modalCore(html,buttons);
  if(!NET.mode||local) return;
  if(!buttons||!buttons.length){ NET.syncModal=null; return; } // 전투 모달 등 — 시맨틱 액션으로 동기화
  NET.modalSeq++;
  const seq=NET.modalSeq, fns=buttons.map(b=>b[1]);
  NET.syncModal={seq,owner,fns};
  if(owner===NET.me){
    const ob=$("obBtns");
    if(ob) Array.prototype.slice.call(ob.children).forEach((btn,i)=>{
      btn.onclick=()=>{ if(!NET.replaying) netSend({t:"a",a:{t:"modal",seq,i}}); fns[i](); };
    });
  } else {
    $("overlayBox").innerHTML=`<h2>🔒 상대 선택 대기 중…</h2><p style="margin:8px 0;color:var(--dim)">상대가 행동을 선택하고 있습니다. 완료되면 자동으로 진행됩니다.</p>`;
  }
};
/* 접속·매칭·시작 */
window.netConnect=function(){
  if(NET.ws){ showToast("이미 서버에 연결 중입니다."); return; }
  const url=location.protocol.indexOf("http")===0
    ? (location.protocol==="https:"?"wss://":"ws://")+location.host
    : "ws://localhost:8080"; // file:// 로 열었을 때 폴백
  let ws;
  try{ ws=new WebSocket(url); }catch(e){ showToast("서버 연결 실패: "+url); return; }
  NET.ws=ws;
  const st=$("netStatus"); if(st){ st.style.display=""; st.textContent="🌐 서버 접속 중…"; }
  ws.onopen=()=>{ const s=$("netStatus"); if(s) s.textContent="🌐 매칭 요청…"; };
  ws.onerror=()=>{ showToast("🌐 서버 연결 오류 — 서버(npm start)가 켜져 있는지 확인하세요."); };
  ws.onclose=()=>{ NET.ws=null;
    if(NET.mode&&S&&S.phase!=="over") showToast("🌐 서버 연결이 끊겼습니다.");
    else { const s=$("netStatus"); if(s) s.textContent="연결 종료"; } };
  ws.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="waiting"){ const s=$("netStatus"); if(s) s.textContent="🌐 상대 대기 중… (상대도 온라인 PVP를 누르면 시작)"; return; }
    if(m.type==="matched"){
      NET.me=m.you==="p1"?0:1;
      if(NET.me===0){ const seed=Math.floor(Math.random()*0x7fffffff); netSend({t:"hello",seed}); netStart(seed); }
      else { const s=$("netStatus"); if(s) s.textContent="🌐 매칭 완료 — 시작 대기…"; }
      return; }
    if(m.type==="opponent_left"){
      if(NET.mode&&S&&S.phase!=="over"&&S.phase!=="menu"){
        gameOver(NET.me,"resign");
        const msg="🌐 상대 연결 끊김 — 몰수승!"; addLog(msg,"imp"); showToast(msg); render();
      } else showToast("🌐 상대가 나갔습니다.");
      return; }
    if(m.t==="hello"){ if(!NET.started) netStart(m.seed); return; }
    if(m.t==="a"){ NET.queue.push(m.a); netPump(); return; }
  };
};
function netStart(seed){
  NET.mode=true; NET.started=true; NET.queue=[]; NET.modalSeq=0; NET.syncModal=null;
  setSeed(seed); // 동일 시드 → 이벤트 배치·전투 난수까지 양쪽 완전 일치
  startMode("pvp");
  addLog(`🌐 온라인 매치 시작 — 당신은 ${NET.me===0?"P1(하단·선배치)":"P2(상단)"}입니다.`,"sys");
  showToast(`🌐 매칭 완료! 당신은 ${NET.me===0?"P1(하단)":"P2(상단)"}`);
  render();
}

/* ===== 시작: 모드 선택 화면 ===== */
newGame("pvp"); S.phase="menu";
render();
if(!tutSeen()) tutOpen({auto:true}); // #26 최초 방문 1회 자동 표시 (tutorialSeen 미저장 시)
</script>
