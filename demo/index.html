      }).join(" · ")}</div>`:""}
    </div></div>`;
  };
  const token=sid=>{ // 스테이지 토큰: 하수인 본체·대리 출전 포획 하수인은 128 전투 도트, 자산 규격이 없는 왕·동료 본체는 현행 속성색 원형 + 이모지 유지 (규격 6.3 · #91)
    const pf=sid==="A"?B.fa:B.fd, piece=sid==="A"?B.attP:B.defP;
    /* #121 계약 3.1·9: **적용된 효과는 상대에게도 공개**된다 (재고·선택만 비공개) — 그래서 버프 표시는 양측 화면에 그린다.
       시간의 수호자는 전투 전체에 걸리므로 그 버프를 쓴 side 의 토큰에 붙인다. */
    const bkey=sid==="A"?B.buffA:B.buffD;
    const bcls=bkey?" buff-"+bkey:"";
    const pos=sid===mySide?"tok-me":"tok-op", label=pf.element?ELEM_KO[pf.element]:TYPE_KO[piece.type];
    // #89/#91 지금 실제로 싸우는 전투원 기준: 본체면 그 말의 종, 대리 출전(포획·예비 하수인)이면 cap 에 기록된 종. 왕·동료 본체 그림은 없으므로 null → 이모지
    const dir=artDirOfFighter(pf,piece);
    if(artOk(dir))
      return `<div class="btok art ${pos}${bcls}" id="tok-${sid}"><img class="bsprite" src="${artUrl(dir,"battle.png")}" alt="${fighterName(sid)}" width="128" height="128" onerror="artSpriteFail('${dir}',this)"><small>${label}</small></div>`;
    const col=pf.element?`var(--${pf.element})`:"#5a6377";
    const emo=pf.element?ELEM_EMO[pf.element]:(piece.type==="king"?"👑":piece.type==="ally"?"🤝":"❔");
    return `<div class="btok ${pos}${bcls}" id="tok-${sid}" style="background:${col}">${emo}<small>${label}</small></div>`;
  };
  // #121 계약 2.3: itemRound(라운드 1회)만 실제 게이트다. itemsX·lastItemX 는 기록으로만 남아 더 이상 버튼을 막지 않는다
  const itemRound=side==="A"?B.itemRoundA:B.itemRoundD;
  const dis=aiActor||busy||(NET.mode&&ownerP!==NET.me); // 온라인: 상대 행동 차례엔 조작 불가
  let cmdBtns;
  if(f.skills){ // 4슬롯 커맨드 — 기본 공격 버튼 제거, 전 슬롯 쿨일 때만 폴백 노출
    const maskCmd=viewer!==2&&ownerP!==viewer;
    cmdBtns=f.skills.map((sid2,i)=>{
      const sk2=SKILLS[sid2], onCd=f.cds[i]>0;
      const known=!maskCmd||(f.revealedSkills&&f.revealedSkills.includes(i));
      /* #121 계약 5.3: 사신의 낫은 쿨이 아니라 **봉인**으로 막힌다. 표시도 "봉인"이고 사유를 그대로 보여 준다
         (쿨링수·냉각·전술 연계·급속 순환으로는 풀리지 않는다 — 게이트가 cds[] 와 분리되어 있다) */
      const seal=sk2.reaper?reaperWhy(side):null;
      const locked=onCd||!!seal;
      const label=known?`${skillNameKo(sid2,f.element)}${sk2.pow?" "+dmgRange(slotPow(f,sk2)):""}${onCd?` (쿨${f.cds[i]})`:seal?" (봉인)":""}`:`? ${SKIND_KO[sk2.kind]}`;
      const cross=known&&sk2.el&&f.element&&sk2.el!==f.element; // #92 본체와 다른 속성의 공격기 — 판정 속성을 설명에 덧붙여 비교 가능하게
      const tip=known?sk2.desc+(cross?` · ${ELEM_KO[sk2.el]} 속성으로 판정`:"")+(sk2.cls?` · ${SKILL_CLS_KO[sk2.cls]} 분류(상성표 밖)`:"")+(seal?` · ${seal}`:""):"";
      return `<button ${dis||locked?"disabled":""} title="${escAttr(tip)}" onclick="window.__act(${i})">${label}</button>`;
    }).join("");
    // #121 계약 5.3 폴백: 쿨이든 봉인이든 **지금 쓸 수 있는 슬롯이 하나도 없으면** 기본 공격이 나온다 (전투가 멈추지 않는다)
    if(!f.skills.some((sid2,i)=>slotUsable(f,i,side))) cmdBtns+=`<button ${dis?"disabled":""} onclick="window.__act('basic')">기본 공격 ${dmgRange(f.atk)}</button>`;
  } else { // 왕·동료 본체·구형 경로: 기본 공격 유지
    const canSkill=f.skillAtk&&f.cd===0;
    cmdBtns=`<button ${dis?"disabled":""} onclick="window.__act('basic')">기본 공격 ${dmgRange(f.atk)}</button>`
      +(f.skillAtk?`<button ${dis||!canSkill?"disabled":""} onclick="window.__act('skill')">${f.element?SKILL_KO[f.element]:"스킬"} ${dmgRange(f.skillAtk)}${f.cd?` (쿨${f.cd})`:""}</button>`:"");
  }
  // #12 볼 투척: 대상이 적 하수인·HP<30%·볼 보유·예비 슬롯 빈 상태·라운드당 1회 / #13 도망: 자기 HP<50%
  const oppPiece=side==="A"?B.defP:B.attP, thrown=side==="A"?B.ballThrowA:B.ballThrowD;
  const canThrow=oppPiece.type==="minion"&&opp.hp<opp.maxHp*0.3&&S.balls[ownerP]>0&&!S.reserve[ownerP]&&!thrown;
  const canFlee=f.hp<f.maxHp*0.5||!!f.fleeFree; // #121 계약 3.4 도망의 수호자: HP 50% 게이트만 해제 (성공률·시도 횟수·반격·교환은 불변)
  const throwWhy=oppPiece.type!=="minion"?"상대가 하수인이 아닙니다":opp.hp>=opp.maxHp*0.3?`상대 HP ${pct(opp.hp/opp.maxHp)} — 30% 미만이어야 합니다`:S.balls[ownerP]<=0?"몬스터볼이 없습니다":S.reserve[ownerP]?"예비 슬롯이 차 있습니다":thrown?"이번 라운드에 이미 던졌습니다":"";
  const fleeWhy=canFlee?"":`내 HP ${pct(f.hp/f.maxHp)} — 50% 미만이어야 합니다`;
  const fleeNote=f.fleeFree?" · 🏃 도망의 수호자 — HP 조건 해제":"";
  const ballBtn=`<button ${dis||!canThrow?"disabled":""} title="적 하수인 HP 30% 미만·볼 1개 소모·성공 시 포획 종료 (라운드당 1회)" onclick="window.__throwBall()">🔴 던지기 (성공 ${pct(BAL.enemyCapProb)})</button>`;
  const fleeBtn=`<button class="danger" ${dis||!canFlee?"disabled":""} title="자기 HP 50% 미만 시 가능(도망의 수호자는 조건 해제) · 실패 시 상대 즉시 공격 1회" onclick="window.__flee()">🏃 도망 (성공 ${pct(BAL.fleeProb)})</button>`;
  /* #121 계약 2.3: 아이템 사용 제한은 **플레이어별 라운드 1회**만 남는다 — 전투당 2회(itemPerBattle)와 연속 동일 금지(lastItem)는 제거됐다.
     두 값은 BAL 에서 Infinity / 미참조가 되었고, 여기서도 더 이상 버튼을 막지 않는다. */
  /* Saturn REVISE P1(비공개): 마스킹 기준을 **소유자 관측**으로 바꾼다. 종전 `NET.mode&&ownerP!==NET.me` 는 온라인만 가려서
     PVE 의 AI 행동 차례에 AI 의 가방·패키지 재고가 사람 화면에 그대로 보였다. viewerIsOwner() 는 온라인·PVE·핫시트를 함께 처리한다. */
  const mineView=viewerIsOwner(ownerP);
  let itemBtns=!mineView?`<small>상대 아이템 비공개</small>`:S.inv[ownerP].map((k,i)=>
    `<button ${dis||itemRound?"disabled":""} title="${ITEMS[k].desc}" onclick="window.__useItem(${i})">${ITEMS[k].ko}</button>`).join("");
  /* #121 계약 2.2·3.1 패키지: 재고·개봉 선택은 **소유자에게만** 보인다. 개봉·버프 선택은 무료 보너스 행동이라
     주 행동·전투 행동·아이템 라운드 카운터를 하나도 소모하지 않는다 (확정 순간에만 재고가 움직인다). */
  const pk=S.pkgs[ownerP], buffUsed=(side==="A"?B.buffA:B.buffD);
  /* 계약 9: 한 전투 안의 UI 표시 — 양측에 적용된 버프를 상태줄로 보여 준다 (적용된 효과는 공개 정보) */
  const buffLine=(B.buffA||B.buffD)?`<div class="status">✨ ${[B.buffA?`${fighterName("A")} ${BUFFS[B.buffA].ko}`:"",B.buffD?`${fighterName("D")} ${BUFFS[B.buffD].ko}`:""].filter(Boolean).join(" · ")}</div>`:"";
  let pkgBtns=!mineView?`<small>상대 패키지 비공개</small>`:
    [`<button ${dis||pk.itemGift<=0?"disabled":""} title="아이템 선물 패키지를 열어 회복약·쿨링수·해독제·공용 볼 중 1개를 받습니다 (행동 미소모)" onclick="window.__openPkg('itemGift')">🎁 아이템 선물 ${pk.itemGift}</button>`,
     `<button ${dis||pk.battleBuff<=0||!!buffUsed?"disabled":""} title="${buffUsed?"이번 전투에 이미 버프를 적용했습니다 (전투당 1개)":"전투 버프 패키지를 열어 힘·시간·도망 중 1개를 적용합니다 (행동 미소모)"}" onclick="window.__openPkg('battleBuff')">✨ 전투 버프 ${pk.battleBuff}</button>`].join("");
  const turnLabel=fxTurnLabel(ownerP,true); // T3: 현재 행동자 대형 표시 (#106: 핫시트 "P1 턴!", PVE·온라인 "나의 턴!/상대 턴!")
  const menu=B.menu||null; // #106 5.3 4카테고리 하위 메뉴 — 로컬 표시 상태(송신 없음). 모든 하위 패널을 그려 두고 활성 패널만 보인다
  const sub=(key,inner)=>`<div class="bsub${menu===key?"":" hidden"}" id="bsub-${key}">${inner}<div class="row"><button onclick="window.__menu(null)">← 뒤로</button></div></div>`;
  modal(`<h2 style="font-size:22px">▶ ${turnLabel}${aiActor?" 🤖":""}</h2>
    <div style="font-size:12px;color:var(--dim);margin:2px 0 6px">⚔️ 라운드 ${B.round}/${battleMaxRounds()}${B.maxRounds?" 🧭":""}</div>
    ${panel(topSide)}
    <div id="bstage">${token(topSide)}${token(mySide)}</div>
    ${buffLine}
    ${panel(mySide)}
    <div id="msgBox">${busy?"":`${fighterName(side)}의 행동을 선택하세요.`}</div>
    <div class="bmenu${menu?" hidden":""}" id="bmenu"><b style="grid-column:1/-1;font-size:12px;color:var(--dim)">${pname(ownerP)}:</b>
      <button ${dis?"disabled":""} onclick="window.__menu('fight')">⚔️ 싸우기</button><button ${dis?"disabled":""} onclick="window.__menu('bag')">🎒 가방</button>
      <button ${dis?"disabled":""} onclick="window.__menu('ball')">🔴 포획</button><button ${dis?"disabled":""} onclick="window.__menu('flee')">🏃 도망가기</button></div>
    ${sub("fight",`<small>⚔️ 싸우기 — 기술 4슬롯 (전 슬롯 쿨이면 기본 공격)</small><div class="row">${cmdBtns}</div>`)}
    ${sub("bag",`<small>🎒 가방 — 아이템은 보너스 행동 (라운드당 1회, 전투 횟수·연속 동일 제한 없음) · 사용 후 같은 행동자의 메뉴로 복귀${itemRound?" · <b>이번 라운드에 이미 사용</b>":""}</small>
      <div class="row">${itemBtns||"<small>아이템 없음</small>"}</div>
      <small>📦 패키지 — 개봉·버프 적용은 행동·아이템 카운터를 소모하지 않습니다${buffUsed?` · 적용된 버프: <b>${BUFFS[buffUsed].ko}</b>`:""}</small>
      <div class="row">${pkgBtns}</div>`)}
    ${sub("ball",`<small>🔴 포획 — 상대 하수인 HP 30% 미만 · 볼 ${mineView?`${S.balls[ownerP]}개`:"비공개"} · 성공 ${pct(BAL.enemyCapProb)}${mineView&&throwWhy?` · <b>${throwWhy}</b>`:""}</small><div class="row">${ballBtn}</div>`)}
    ${sub("flee",`<small>🏃 도망가기 — 내 HP 50% 미만 · 성공 ${pct(BAL.fleeProb)} · 실패 시 상대 즉시 공격 1회${fleeNote}${fleeWhy?` · <b>${fleeWhy}</b>`:""}</small><div class="row">${fleeBtn}</div>`)}
    <details><summary style="font-size:11px;color:var(--dim)">전투 이력</summary><div id="battleLog">${B.blog.slice(-30).join("<br>")}</div></details>`,
    []);
  window.__menu=key=>{ // 하위 메뉴 전환 — 로컬 전용(송신 0), 규칙 상태 무변경, 재렌더 없이 패널 표시만 바꾼다
    if(S.battle!==B) return; B.menu=key||null;
    try{ const root=$("bmenu"); if(root){ if(B.menu) root.classList.add("hidden"); else root.classList.remove("hidden"); }
      for(const k of ["fight","bag","ball","flee"]){ const el=$("bsub-"+k); if(el){ if(k===B.menu) el.classList.remove("hidden"); else el.classList.add("hidden"); } } }catch(e){}
  };
  /* #121 계약 2.2·3 — 패키지 개봉 선택 화면. modal() 래퍼가 온라인 동기화를 맡으므로(소유자만 조작·버튼 인덱스 중계,
     비소유자에게는 "상대 선택 대기 중" 마스킹) 여기서 별도 송신을 하지 않는다. 재고·선택 내용은 소유자에게만 보인다.
     개봉 자체는 난수를 쓰지 않는다 — 플레이어 선택이다 (계약 2.2 [추론]).
     취소는 아무것도 소모하지 않는다: 재고는 **확정 분기에서만** 움직인다. */
  window.__openPkgCore=kind=>{
    if(S.battle!==B||S.battle.phase===undefined) return;
    if(actorOfPhase()!==side) return;                       // 내 전투 행동 차례에만
    const pk=S.pkgs[ownerP]; if(!pk||pk[kind]<=0) return;
    if(kind==="battleBuff"&&(side==="A"?B.buffA:B.buffD)) return; // 계약 3.1: 플레이어별 한 전투 1개
    B.menu=null;
    if(kind==="itemGift"){
      const row=k=>`<div class="fighter"><b>${GIFT_KO[k]}</b><small>${k==="ball"?`보유 ${S.balls[ownerP]} → ${S.balls[ownerP]+1}`:ITEMS[k].desc}</small></div>`;
      modal(`<h2>🎁 아이템 선물 패키지</h2><p>하나를 골라 지금 받습니다. 취소하면 패키지는 그대로 남습니다.</p>
        ${GIFT_PICKS.map(row).join("")}`,
        GIFT_PICKS.map((k,i)=>[GIFT_KO[k],()=>window.__pkgPickCore("gift",i)]).concat([["취소",()=>{close(); battleModal();}]]));
      return;
    }
    const r1=B.round===1; // 계약 3.3: 시간의 수호자는 사용자 자기 행동의 1라운드에만
    const row=key=>`<div class="fighter"><b>${BUFFS[key].ko}</b><small>${BUFFS[key].desc}${key==="time"&&!r1?" · <b>1라운드에만 선택 가능</b>":""}</small></div>`;
    modal(`<h2>✨ 전투 버프 패키지</h2><p>하나를 골라 이번 전투에만 적용합니다. 전투당 1개이며 취소하면 패키지는 그대로 남습니다.</p>
      ${BUFF_KEYS.map(row).join("")}`,
      BUFF_KEYS.map((key,i)=>{ const no=key==="time"&&!r1; // 계약 3.3: 시간은 1라운드에만 — 문구가 아니라 실제 disabled
        return [BUFFS[key].ko+(no?" (1R 전용)":""),no?null:()=>window.__pkgPickCore("buff",i),no]; })
        .concat([["취소",()=>{close(); battleModal();}]]));
  };
  /* 확정 — 여기서만 재고가 줄고 효과가 적용된다. 온라인은 modal 래퍼가 이 콜백을 인덱스로 중계하므로 양측이 같은 분기를 탄다 */
  window.__pkgPickCore=(what,i)=>{
    if(S.battle!==B) return;
    if(actorOfPhase()!==side) return;
    const pk=S.pkgs[ownerP];
    if(what==="gift"){
      if(pk.itemGift<=0) return;
      const k=GIFT_PICKS[i]; if(!k) return;
      pk.itemGift--;                                   // 확정 순간에만 −1
      if(k==="ball") S.balls[ownerP]++;                 // 계약 2.1: 보유 상한 없음
      else S.inv[ownerP].push(k);
      close(); B.menu=null;
      /* 계약 3.1·10 비공개: **아직 쓰지 않은** 획득 종류는 상대에게 공개하지 않는다. B.blog 는 양측이 공유하는 상태라
         텍스트를 시점별로 바꿀 수 없으므로 **로그에는 중립 문구만** 쓰고, 종류는 소유자 전용 토스트로만 알린다.
         (버프 적용과 아이템 실제 사용은 "적용된 효과"라 종전처럼 공개한다.) */
      bmsg(`🎁 ${pname(ownerP)}가 선물 상자를 열었다.`,null,{key:"itemFx"}); // 계약 9: 획득 연출도 1.2초(itemFx)
      if(viewerIsOwner(ownerP)) showToast(`🎁 ${GIFT_KO[k]} 획득`);
      battleModal(); render(); return;
    }
    if(pk.battleBuff<=0) return;
    const key=BUFF_KEYS[i]; if(!key) return;
    if(side==="A"?B.buffA:B.buffD) return;              // 한 전투 1개
    if(key==="time"&&B.round!==1) return;               // 계약 3.3 R1 한정 (늦은 콜백 방어)
    pk.battleBuff--;
    /* 버프 회계의 **단일 원천은 전투 인스턴스**다 (B.buffA/B.buffD). S 에 같은 값을 또 두지 않는다 —
       중복 필드는 승패·도망·적 포획·판정 등 여러 종료 경로 중 하나만 빠져도 드리프트가 되고, 계약 3.1 의
       "전투가 끝나면 즉시 정리"를 깨뜨린다. 전투 객체가 사라지면 회계도 함께 사라진다. */
    if(side==="A") B.buffA=key; else B.buffD=key;
    if(key==="power") f.powerBuff=true;
    else if(key==="escape") f.fleeFree=true;
    else B.maxRounds=BAL.buffTimeRounds;               // 전투 인스턴스 값만 바꾼다 (BAL.maxRounds 전역 불변)
    close(); B.menu=null;
    bmsg(`${BUFFS[key].ko} — ${fighterName(side)}에게 적용!`,{flash:key==="power"?"buff":"guard",st:stFx(side,f)},{key:"itemFx"});
    if(key==="time") bmsg(`🧭 이 전투는 ${BAL.buffTimeRounds}라운드까지 — 사신의 낫은 발동할 수 없다.`);
    battleModal(); render();
  };
  window.__useItemCore=i=>{
    /* #121 계약 2.3 — 유일하게 남은 제한(플레이어별 라운드 1회)을 **규칙 경로에서** 집행한다.
       버튼 disabled 는 표시 계층이라 중복 클릭·수신 프레임·늦은 콜백을 막지 못한다. 아래 네 검사가 모두 통과해야 재고가 움직인다:
       같은 전투인가 · 지금 이 side 의 행동 차례인가 · 그 칸에 실제 아이템이 있는가 · 이번 라운드에 아직 안 썼는가.
       (전투당 2회·연속 동일 금지는 계약으로 제거됐으므로 여기서 막지 않는다.) */
    if(S.battle!==B) return;
    if(actorOfPhase()!==side) return;
    if(side==="A"?B.itemRoundA:B.itemRoundD) return;     // 라운드 1회
    const k=S.inv[ownerP][i];
    if(k===undefined||!ITEMS[k]) return;                  // 유효하지 않은 인덱스
    S.inv[ownerP].splice(i,1);
    // #121 계약 2.3: itemsX·lastItemX 는 **기록**으로만 남는다 (전투당 2회·연속 동일 금지 제한은 제거). itemRoundX 만 실제 게이트다
    if(side==="A"){B.itemsA++;B.itemRoundA=true;B.lastItemA=k;} else {B.itemsD++;B.itemRoundD=true;B.lastItemD=k;}
    if(k==="potion"){const h=Math.round(f.maxHp*BAL.itemHealPct); f.hp=Math.min(f.maxHp,f.hp+h);
      bmsg(`🧪 회복약! ${fighterName(side)}의 HP ${h} 회복.`,{float:{side,html:`<span class="pos">+${h}</span>`},hp:{side,val:f.hp,max:f.maxHp}},{key:"itemFx"});}
    if(k==="cool"){f.cd=0; if(f.skills)f.cds=[0,0,0,0]; bmsg("🧪 쿨링수 — 스킬 쿨타임 초기화!",null,{key:"itemFx"});} // 4슬롯 전체 초기화 (아이템 설명 문언 준용 — [기획 필요] 후보)
    if(k==="cure"){f.burn=0;f.weaken=0;f.shock=0;f.shockFresh=false; bmsg("🧪 해독제 — 상태이상 해제!",{st:stFx(side,f)},{key:"itemFx"});}
    B.menu=null; // 사용 연출 뒤 같은 행동자의 메뉴(루트)로 복귀 — 행동 미소모 (GDD 4.6 보너스 행동)
    battleModal();
  };
  window.__throwBallCore=()=>{ // #12 적 하수인 포획: 볼 소모(성공·실패 공통) — 성공 시 포획 종료, 실패 시 행동 소모
    if(S.battle!==B||!canThrow) return;
    S.balls[ownerP]--;
    if(side==="A")B.ballThrowA=true; else B.ballThrowD=true;
    met(ownerP,"enemyCapTries"); // #20 적 포획 시도
    B.menu=null;
    bmsg(`🔴 ${pname(ownerP)}의 몬스터볼 투척!`,null,{key:"captureFx"});
    if(rand()<BAL.enemyCapProb){ finishByCapture(side); return; }
    met(ownerP,"enemyCapFails"); // #20 적 포획 실패
    bmsg(`🔴 포획 실패! 볼이 튕겨나왔다. (남은 볼 ${S.balls[ownerP]})`,null,{key:"captureFx"});
    nextPhase();
  };
  window.__fleeCore=()=>{ // #13 도망: 성공 시 전투 즉시 종료(판정·제거 없음·battlesUsed 유지), 실패 시 행동 소모+상대 즉시 공격 1회
    if(S.battle!==B||!canFlee) return;
    met(ownerP,"fleeTries");
    B.menu=null;
    bmsg(`🏃 ${fighterName(side)}의 도망 시도!`,null,{key:"fleeFx"});
    if(rand()<BAL.fleeProb){
      met(ownerP,"fleeOks");
      const piece=side==="A"?B.attP:B.defP, oppPiece=side==="A"?B.defP:B.attP; // #114 전투 상대(former opponent)는 전투 객체가 사라진 뒤에도 교환·밀기 대상으로 보존
      bmsg(`🏃 도망 성공! 전투가 종료되었다.`);
      addLog(`🏃 ${pname(ownerP)} 도망 성공 — 전투 종료 (판정·제거 없음)`,"imp"); showToast("🏃 도망 성공 — 전투 종료");
      resetAfter(B.fa); resetAfter(B.fd);
      const q=B.msgQ.splice(0);
      S.battle=null;
      battleEndFx(q,{title:"도망 성공 — 전투 종료",cls:""},()=>{ if(!S.battle){ close(); fleeSwapPrompt(piece,oppPiece); } });
      return;
    }
    bmsg(`🏃 도망 실패! 상대의 공격이 이어진다.`);
    fleeCounter(side);
  };
  window.__actCore=kind=>{
    /* Saturn REVISE P1: 전투 커맨드의 실제 적용 지점이다. 이 클로저는 렌더 시점의 B·side·f 를 들고 있으므로
       (a) 그 전투가 아직 진행 중이고 (b) 지금이 그 side 의 행동 차례일 때만 실행한다.
       중복 클릭·늦은 콜백·수신 프레임이 다른 전투/다른 차례에 행동을 밀어 넣는 경로를 막는다. */
    if(S.battle!==B) return;
    if(actorOfPhase()!==side) return;
    // 슬롯 인덱스(0~3) + 레거시 매핑: 'basic'→슬롯0(쿨이면 순수 기본 공격 폴백), 'skill'→슬롯1, 'common'→슬롯2
    B.menu=null;
    let slot=null;
    if(typeof kind==="number"){ if(f.skills&&f.skills[kind]!==undefined) slot=kind; }
    /* Saturn P1: 'basic' 은 **쿨이 아니라 합법성**을 본다. 종전 `f.cds[0]===0` 은 슬롯0 이 봉인된 사신이어도 그 슬롯으로
       들어가, 계약 5.3 "기본 공격 폴백을 사신으로 강제 매핑하지 않는다" 를 깼다. 합법이 아니면 순수 기본 공격(-1)이다. */
    else if(kind==="basic") slot=(f.skills&&slotUsable(f,0,side))?0:-1;
    else if(kind==="skill"&&f.skills) slot=1;
    else if(kind==="common"&&f.skills) slot=2;
    if(slot!==null){ execSlot(side,slot); return; }
    if(kind!=="skill"||!f.skillAtk){ execSlot(side,-1); return; } // 왕·동료 본체: 기본 공격
    // ===== 구형 속성 스킬 경로 (로스터 미적용 하수인 전용 — 레거시 테스트 호환) =====
    const oSide=side==="A"?"D":"A", sp=skillParamsOf(f);
    const tryStatus=prob=>{ // T5-A(D10): 상태이상 부여 확률 — 지속형 100%, 그 외 statusProb (#96: 감전은 shockProb)
      if(archOf(f)==="sustain"||rand()<(prob===undefined?BAL.statusProb:prob)){S.metrics.statusApplied++; return true;}
      S.metrics.statusFailed++; bmsg("상태이상 부여 실패!"); return false;
    };
    bmsg(`${fighterName(side)}의 ${f.element?SKILL_KO[f.element]:"스킬"}!`,null,{key:"skillFx"});
    let dmg=f.skillAtk;
    if(f.atkBuff) dmg=Math.round(dmg*(1+BAL.nextBuffPct)); // #12 일시버프 (레거시 경로)
    if(BAL.dmgVar){ const roll=rand(); // #121 계약 3.2: 레거시 경로도 같은 전투원이므로 같은 분산 고정 (rand 소비 횟수 불변)
      dmg=Math.round(dmg*(f.powerBuff?(1+BAL.dmgVar):(1-BAL.dmgVar+roll*2*BAL.dmgVar))); }
    f.cd=f.cdMax||BAL.minion.cd;
    if(f.weaken>0){dmg=Math.round(dmg*(1-BAL.weakenPct)); f.weaken--;
      if(!f.weaken) bmsg(`💧 ${fighterName(side)}의 약화가 풀렸다.`,{st:stFx(side,f)});}
    if(f.element&&opp.element){
      if(BEATS[f.element]===opp.element) dmg=Math.round(dmg*BAL.advMult);
      else if(BEATS[opp.element]===f.element) dmg=Math.round(dmg*BAL.disMult);
    }
    if(f.element==="grass"){
      dmg=Math.round(dmg*sp.grassDmgMult);
      if(sp.shieldPct) f.shield=Math.round(f.maxHp*sp.shieldPct);
      const gh=Math.round(f.maxHp*sp.healPct);
      f.hp=Math.min(f.maxHp,f.hp+gh);
      bmsg(sp.shieldPct?`🌿 보호막·회복 획득!`:`🌿 회복 획득!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp},st:stFx(side,f)});
    }
    if(opp.dmgCut>0){dmg=Math.round(dmg*(1-opp.dmgCut)); opp.dmgCut=0; bmsg("상대는 자세를 낮춰 피해를 흘렸다!",{st:stFx(oSide,opp)});}
    if(opp.vulnMark){dmg=Math.round(dmg*1.15); opp.vulnMark=false; bmsg(`⚠️ 결정타의 반동 — 피격 +15%!`);}
    let absorbed=Math.min(dmg,opp.shield); opp.shield-=absorbed;
    let hpDmg=dmg-absorbed;
    const actual=Math.min(hpDmg,opp.hp); opp.hp-=actual;
    const capLeft=Math.max(0,Math.round(opp.maxHp*BAL.absorbCapPct)-opp.absorbed);
    const freeAbsorb=Math.min(absorbed,capLeft); opp.absorbed+=freeAbsorb;
    const counted=actual+(absorbed-freeAbsorb);
    addRec(side,counted);
    bmsg(`${dmg} 피해!${absorbed?` (흡수 ${absorbed})`:""} · 유효 ${counted}`,
      {shake:oSide,flash:f.element||null,float:{side:oSide,html:`<span class="neg">-${dmg}</span>${absorbed?`<span class="abs"> (흡수 ${absorbed})</span>`:""}`},
       hp:{side:oSide,val:opp.hp,max:opp.maxHp},st:stFx(oSide,opp)},{key:"damageFx"});
    if(f.element==="fire"&&!opp.burn&&tryStatus()){opp.burn=sp.burnRounds; opp.burnBy=side; bmsg(`🔥 ${fighterName(oSide)}는 화상을 입었다! (${sp.burnRounds}R)`,{st:stFx(oSide,opp)});}
    if(f.element==="water"&&!opp.weaken&&tryStatus()){opp.weaken=sp.weakenHits; bmsg(`💧 ${fighterName(oSide)}는 약화되었다! (${sp.weakenHits}회)`,{st:stFx(oSide,opp)});}
    if(f.element==="lightning"&&!opp.shock&&tryStatus(BAL.shockProb)){opp.shock=sp.shockRounds; opp.shockFresh=true; bmsg(`⚡ ${fighterName(oSide)}는 감전 — 다음 ${sp.shockRounds}라운드 후공!`,{st:stFx(oSide,opp)});}
    if(checkDeath()) return;
    nextPhase();
  };
  /* #106 5.1·5.2 표시 순서: (1) 진입 카운트다운 3·2·1·배틀 시작! (1회) → (2) 남은 메시지 재생 → (3) 행동(phase) 배너 "나의 턴!/상대 턴!" (행동마다 1회) → (4) 메뉴 활성 / AI 스케줄.
     각 단계는 끝나면 battleModal 을 다시 그려 다음 단계로 간다 — 플래그(intro·bannerKey)로 같은 단계를 두 번 재생하지 않는다. 헤드리스·sim 은 (1)(3) 이 0ms 라 종전 흐름과 같다 */
  if(!B.intro){ B.intro=true;
    if(fxLive()){ for(const t of ["3","2","1","배틀 시작!"]) fxPlay({key:"countStep",kind:"count",title:t}); fxWhenIdle(()=>{ if(S.battle===B) battleModal(); }); return; } }
  if(B.msgQ.length){ playMsgs(B.msgQ.splice(0),()=>{ if(S.battle===B) battleModal(); }); return; }
  const bkey=B.round+"-"+B.phase;
  if(B.bannerKey!==bkey){ B.bannerKey=bkey;
    if(fxLive()){ fxPlay({key:"roundBanner",kind:"banner",cls:viewerIsOwner(ownerP)&&!(S.mode==="pvp"&&!NET.mode)?"mine":"",title:turnLabel,sub:`Round ${B.round} / ${BAL.maxRounds}`}); fxWhenIdle(()=>{ if(S.battle===B) battleModal(); }); return; } }
  if(aiActor) aiScheduleBattle();
}
/* #106 5.6 전투 종료 연출 공통: 남은 메시지 재생 → 결과 배너(뷰어 기준 문구) → 닫기 콜백. 헤드리스는 즉시 */
function battleEndFx(q,banner,after){
  const run=()=>fxPlay({key:"resultBanner",kind:"result",cls:banner.cls||"",title:banner.title,sub:banner.sub||"",onEnd:after});
  if(liveBattleDom()) playMsgs(q,run); else { MSGQ.length=0; run(); }
}
function resultBannerOf(winP){ // 사망·판정 결과 문구: 핫시트 중립 "P1 승리!", PVE·온라인 뷰어 기준 "전투에서 승리!/패배,,,"
  if(S.mode==="pvp"&&!NET.mode) return {title:`${pname(winP.owner)} 승리!`,cls:""};
  return viewerIsOwner(winP.owner)?{title:"전투에서 승리!",cls:""}:{title:"전투에서 패배,,,",cls:"lose"};
}
/* ===== 4슬롯 실행 엔진 (GDD-16) — slot -1은 폴백 기본 공격, 로직은 동기 완결 ===== */
/* #121 계약 5.2 🕯 마녀의 장난 — 화상·약화·감전·풀 회복 4효과 중 **서로 다른 2개**를 100% 적용한다.
   · 조합: 4C2 = 6가지를 **균등 추첨, 공유 rand 1회**. 조합 표는 순서 고정이라 같은 시드에서 양측·AI 시뮬이 같은 조합을 얻는다.
   · 확률 게이트 없음: statusProb(70%)·shockProb(50%) 를 통과시키지 않고 **난수도 추가로 쓰지 않는다**
     (기존 시그니처 '잔류장'의 force 경로와 같은 방식 — rand 미소비).
   · 재부여는 **누적이 아니라 지속 기간 갱신**이다. 일반 효과기의 "이미 걸려 있으면 부여하지 않음"은 그대로 유지되고,
     이 예외는 마녀 전용이다.
   · 풀 회복은 **이번 공격이 상대 HP 에 실제로 입힌 피해(actual)의 100%** 를 즉시 자기 회복한다. 보호막에 흡수된 몫과
     오버킬은 actual 에 들어 있지 않으므로 자동으로 제외되고, 전부 흡수되면 actual 0 → 회복 0 이다. 자기 maxHp 가 상한.
     2라운드 지속 흡수 버프가 **아니다** (2026-09-09 CJ 결정).
   지표는 기존 statusApplied 를 쓴다 (부여 실패가 없으므로 statusFailed 는 늘지 않는다). */
const WITCH_EFFECTS=["burn","weaken","shock","grassHeal"];   // 순서 고정
const WITCH_COMBOS=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];    // 4C2 — 균등 6조합
function witchApply(side,oSide,f,opp,actual){
  const combo=WITCH_COMBOS[Math.floor(rand()*WITCH_COMBOS.length)]; // 공유 rand 1회
  for(const idx of combo){
    const eff=WITCH_EFFECTS[idx];
    if(eff==="burn"){ opp.burn=BAL.burnRounds; opp.burnBy=side; S.metrics.statusApplied++; // 갱신(누적 금지)
      bmsg(`🔥 ${fighterName(oSide)}는 화상을 입었다! (${BAL.burnRounds}R)`,{st:stFx(oSide,opp)}); }
    else if(eff==="weaken"){ opp.weaken=BAL.weakenHits; S.metrics.statusApplied++;
      bmsg(`💧 ${fighterName(oSide)}는 약화되었다! (${BAL.weakenHits}회)`,{st:stFx(oSide,opp)}); }
    else if(eff==="shock"){ opp.shock=1; opp.shockFresh=true; S.metrics.statusApplied++; // 부여 라운드는 소진하지 않는다 (현행 shockFresh 규칙)
      bmsg(`⚡ ${fighterName(oSide)}는 감전 — 다음 1라운드 후공!`,{st:stFx(oSide,opp)}); }
    else { const gh=Math.min(actual,f.maxHp-f.hp); // 풀: 실HP 피해 100% 즉시 회복 (maxHp 상한)
      if(gh>0){ f.hp+=gh;
        bmsg(`🌿 어둠의 덩굴이 생명을 빨아들인다 — HP ${gh} 회복!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp}}); }
      else bmsg(`🌿 어둠의 덩굴 — 빨아들일 생명이 없었다. (회복 0)`); }
  }
}
function execSlot(side,slot){
  const B=S.battle; if(!B) return;
  const f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa, oSide=side==="A"?"D":"A";
  const sk=(slot>=0&&f.skills)?SKILLS[f.skills[slot]]:null;
  const atkEl=atkElOf(f,sk); // #92 판정 속성: 공격기는 기술 속성, 기본 공격·시그니처(잔류장 포함)는 본체 속성 · #121 cls 기술은 null(중립)
  /* #121 계약 5.3 💀 사신의 낫 — 피해 파이프라인을 타지 않는 별도 분기다. **게이트를 여기서 최신 상태로 한 번 더 검사한다**:
     UI·AI·수신 프레임·늦은 콜백 어느 경로로 불법 슬롯이 들어와도 즉사가 새지 않는다. 불가하면 기본 공격으로 폴백해
     전투가 멈추지 않게 한다 (계약 5.3 폴백 — 기본 공격을 사신으로 강제 매핑하지 않는다).
     효과: 보호막을 무시하고 즉사. 별도 반동·VIP 면역 예외는 없고, 승패 연쇄(대리 패배 시 동료 동시 제거 · 왕 대리면 경기 패배)는
     기존 checkDeath → finishBattle 경로를 그대로 쓴다. 난수 소비 0. */
  if(sk&&sk.reaper){
    /* Saturn REVISE P1: 봉인 해제(reaperWhy)만으로는 부족하다 — **실제 쿨**과 **지금 이 side 의 행동 차례**까지 만족해야 한다.
       쿨 감소 수단으로 봉인이 풀리지 않는다는 계약(5.3)과 방향이 반대가 아니다: 봉인은 CD 와 별개의 **추가** 조건이고,
       CD 는 여느 기술과 똑같이 그대로 적용된다. actorOfPhase() 검사는 늦은 콜백·수신 프레임·옛 모달 클로저가
       상대 차례에 즉사를 내는 경로를 막는다. */
    /* Saturn P1(비공개): 거부 사유를 **공용 전투 로그(B.blog)에 쓰지 않는다.** blog 는 양측이 공유하는 상태라
       거기에 이름을 쓰면 **쓰지도 않은 미공개 기술**이 상대에게 공개된다. 사유는 소유자 화면의 토스트로만 알린다
       (표시 계층 · 규칙 상태·난수 불변). 거부된 호출은 순수 기본 공격으로 폴백해 전투가 멈추지 않는다. */
    const ownerOf=side==="A"?B.attP.owner:B.defP.owner;
    const tellOwner=msg=>{ try{ if(viewerIsOwner(ownerOf)) showToast(msg); }catch(e){} };
    if(f.cds[slot]>0){ tellOwner(`💀 사신의 낫은 쿨타임입니다 (남은 쿨 ${f.cds[slot]})`);
      execSlot(side,-1); return; }
    if(actorOfPhase()!==side) return;                       // 남의 차례에는 아무것도 하지 않는다
    const why=reaperWhy(side);
    if(why){ tellOwner(`💀 사신의 낫은 아직 봉인되어 있습니다 — ${why}`);
      execSlot(side,-1); return; }
    if(f.revealedSkills&&!f.revealedSkills.includes(slot)) f.revealedSkills.push(slot); // 사용 시 공개
    bmsg(`💀 ${fighterName(side)}의 사신의 낫!`,{sig:true},{key:"skillFx"});
    const lethal=opp.hp; opp.shield=0; opp.hp=0; addRec(side,lethal);
    bmsg(`💀 ${fighterName(oSide)}는 보호막째 베였다 — 즉사!`,
      {shake:oSide,float:{side:oSide,html:`<span class="neg">즉사</span>`},hp:{side:oSide,val:0,max:opp.maxHp},st:stFx(oSide,opp)},{key:"damageFx"});
    if(checkDeath()) return;
    nextPhase(); return;
  }
  if(sk){ f.cds[slot]=sk.cd;
    if(f.revealedSkills&&!f.revealedSkills.includes(slot)) f.revealedSkills.push(slot); } // 기술 공개: 사용 시 이름 공개
  const gate=(force,prob)=>{ // 상태 부여 — 기존 D10 경로 재사용 (효과기: 화상·약화 statusProb 70% · 감전 shockProb 50% (#96) · 잔류장 100% — force는 rand 미소비)
    if(force||rand()<(prob===undefined?BAL.statusProb:prob)){S.metrics.statusApplied++; return true;}
    S.metrics.statusFailed++; bmsg("상태이상 부여 실패!"); return false;
  };
  const applyStatus=force=>{ // 상태 종류는 판정 속성(atkEl) 기준 — 불 본체가 배운 감전 침은 감전이지 화상이 아니다 (#92)
    if(atkEl==="fire"&&!opp.burn&&gate(force)){opp.burn=BAL.burnRounds; opp.burnBy=side; bmsg(`🔥 ${fighterName(oSide)}는 화상을 입었다! (${BAL.burnRounds}R)`,{st:stFx(oSide,opp)});}
    else if(atkEl==="water"&&!opp.weaken&&gate(force)){opp.weaken=BAL.weakenHits; bmsg(`💧 ${fighterName(oSide)}는 약화되었다! (${BAL.weakenHits}회)`,{st:stFx(oSide,opp)});}
    else if(atkEl==="lightning"&&!opp.shock&&gate(force,BAL.shockProb)){opp.shock=1; opp.shockFresh=true; bmsg(`⚡ ${fighterName(oSide)}는 감전 — 다음 1라운드 후공!`,{st:stFx(oSide,opp)});}
  };
  const coolReduce=(filter,label)=>{ // 쿨 감소류: 조건 내 남은 쿨 최장 기술 1개 쿨 -1
    let pick=-1;
    for(let i=0;i<4;i++) if(f.cds[i]>0&&filter(i)&&(pick<0||f.cds[i]>f.cds[pick])) pick=i;
    if(pick<0){ if(label) bmsg(`${label} — 단축할 쿨이 없다.`); return; }
    f.cds[pick]--; bmsg(`🔄 ${SKILLS[f.skills[pick]].ko} 쿨 -1 (남은 쿨 ${f.cds[pick]})`);
  };
  const supFlash=sk&&!sk.pow?(sk.healPct?"heal":(sk.shieldPct||sk.dmgCut)?"guard":"buff"):null; // S3-A 보조 3계열
  bmsg(`${fighterName(side)}의 ${sk?sk.ko:"기본 공격"}!`,(sk&&sk.kind==="sig")?{sig:true,flash:supFlash}:(supFlash?{flash:supFlash}:null),{key:"skillFx"}); // #106 5.4 그룹1 기술 연출
  if(sk&&!sk.pow){ // 비피해 기술: 보조기·불굴 진형 — 첫 효과 메시지가 그룹2(효과 연출 damageFx)를 열고 나머지는 같은 그룹에 덧붙는다
    let effKey="damageFx"; const eb=(t,fx)=>{ bmsg(t,fx,effKey?{key:effKey}:null); effKey=null; };
    if(sk.healPct){const h=Math.round(f.maxHp*sk.healPct); f.hp=Math.min(f.maxHp,f.hp+h);
      eb(`💚 HP ${h} 회복!`,{float:{side,html:`<span class="pos">+${h}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}
    if(sk.shieldPct){f.shield=Math.max(f.shield,Math.round(f.maxHp*sk.shieldPct)); // 보호막 중첩: 최대값 갱신 (합산 금지)
      eb(`🛡 보호막 ${f.shield}!`,{st:stFx(side,f)});}
    if(sk.dmgCut){f.dmgCut=Math.max(f.dmgCut,sk.dmgCut);
      eb(`🌀 다음 피격 ${pct(sk.dmgCut)} 감소!`,{st:stFx(side,f)});}
    if(sk.focus){f.focusCharge=true; eb(`🎯 집중 — 다음 공격기 위력 +20%!`,{st:stFx(side,f)});}
    if(sk.coolAny) coolReduce(i=>i!==slot,"냉각"); // 냉각 결과 줄은 기술 그룹에 덧붙는다 (메시지 수 불변)
    if(sk.cleanse){
      if(f.burn){f.burn=0;f.burnBy=null;eb(`✨ 화상이 정화되었다!`,{st:stFx(side,f)});}
      else if(f.weaken){f.weaken=0;eb(`✨ 약화가 정화되었다!`,{st:stFx(side,f)});}
      else if(f.shock){f.shock=0;f.shockFresh=false;eb(`✨ 감전이 정화되었다!`,{st:stFx(side,f)});}
      else eb(`정화 — 제거할 상태이상이 없다.`);
    }
  } else { // 피해 기술: 공격기·시그니처·기본 공격 — 스케일 후 기존 파이프라인(분산·상성) 그대로
    let dmg=sk?slotPow(f,sk):f.atk;
    if(f.atkBuff) dmg=Math.round(dmg*(1+BAL.nextBuffPct)); // #12 일시버프
    if(f.focusCharge&&sk&&sk.kind==="attack"){dmg=Math.round(dmg*1.2); f.focusCharge=false;
      bmsg(`🎯 집중 발동 — 위력 +20%!`,{st:stFx(side,f)});}
    /* D8 피해 분산 ±20% · #121 계약 3.2 힘의 수호자: **분산 단계만** 상단 고정(×(1+dmgVar) = ×1.2).
       난수는 그대로 뽑아 버린다 — 버프 유무로 rand 소비 횟수가 달라지지 않아야 공유 시드 재현과 AI 시뮬이 어긋나지 않는다
       (계약 3.2 [추론] "양쪽 클라이언트와 AI 시뮬에서 동일"을 소비 횟수 불변으로 만족한다).
       상성·약화·감소·취약·보호막 흡수·반올림은 그대로 통과하므로 최종 실HP 피해가 항상 정확히 +20% 가 되지는 않는다. */
    if(BAL.dmgVar){ const roll=rand();
      dmg=Math.round(dmg*(f.powerBuff?(1+BAL.dmgVar):(1-BAL.dmgVar+roll*2*BAL.dmgVar))); }
    if(f.weaken>0){dmg=Math.round(dmg*(1-BAL.weakenPct)); f.weaken--;
      if(!f.weaken) bmsg(`💧 ${fighterName(side)}의 약화가 풀렸다.`,{st:stFx(side,f)});}
    if(atkEl&&opp.element){ // #92 공격 상성은 판정 속성(기술 속성) vs 상대 본체 속성 — 방어 상성은 본체 속성 그대로
      if(BEATS[atkEl]===opp.element) dmg=Math.round(dmg*BAL.advMult);
      else if(BEATS[opp.element]===atkEl) dmg=Math.round(dmg*BAL.disMult);
    }
    /* #121 계약 5.1 드래곤 숨결: 상성표가 아니라 기술 고유 배율이다. 속성이 **있는** 상대에게 항상 ×1.3,
       무속성(왕·동료 본체)에는 중립 1.0 — 현행 "상대 속성이 없으면 배율 없음" 동작을 그대로 쓴다.
       cls 기술이라 atkEl 은 null 이므로 위 상성 블록은 타지 않고, 이 한 줄만 적용된다 (난수 소비 0). */
    if(sk&&sk.dragonMult&&opp.element){ dmg=Math.round(dmg*sk.dragonMult);
      bmsg(`🐉 용의 숨결이 속성을 태운다 — ×${sk.dragonMult}!`); }
    if(sk&&sk.bonusVsShield&&opp.shield>0){dmg+=sk.bonusVsShield; bmsg(`🌊 보호막 대상 추가 위력 +${sk.bonusVsShield}!`);}
    if(sk&&sk.bonusVsStatus&&(opp.burn||opp.weaken||opp.shock)){dmg+=sk.bonusVsStatus; bmsg(`⚡ 상태이상 대상 추가 위력 +${sk.bonusVsStatus}!`);}
    if(opp.dmgCut>0){dmg=Math.round(dmg*(1-opp.dmgCut)); bmsg(`${fighterName(oSide)}는 자세를 낮춰 피해 ${pct(opp.dmgCut)} 감소!`); opp.dmgCut=0;}
    if(opp.vulnMark){dmg=Math.round(dmg*1.15); opp.vulnMark=false; bmsg(`⚠️ 결정타의 반동 — 피격 +15%!`);}
    let absorbed=Math.min(dmg,opp.shield); opp.shield-=absorbed;
    let hpDmg=dmg-absorbed;
    const actual=Math.min(hpDmg,opp.hp); opp.hp-=actual;
    const capLeft=Math.max(0,Math.round(opp.maxHp*BAL.absorbCapPct)-opp.absorbed);
    const freeAbsorb=Math.min(absorbed,capLeft); opp.absorbed+=freeAbsorb;
    const counted=actual+(absorbed-freeAbsorb);
    addRec(side,counted);
    bmsg(`${dmg} 피해!${absorbed?` (흡수 ${absorbed})`:""} · 유효 ${counted}`,
      {shake:oSide,flash:atkEl||null,float:{side:oSide,html:`<span class="neg">-${dmg}</span>${absorbed?`<span class="abs"> (흡수 ${absorbed})</span>`:""}`}, // #92 속성 플래시도 판정 속성
       hp:{side:oSide,val:opp.hp,max:opp.maxHp},st:stFx(oSide,opp)},{key:"damageFx"}); // #106 5.4 그룹2 피 깎임 연출
    if(sk){
      if(sk.drainPct&&actual>0){const gh=Math.round(actual*sk.drainPct); f.hp=Math.min(f.maxHp,f.hp+gh);
        bmsg(`🌿 흡수 — HP ${gh} 회복!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}
      if(sk.selfShieldPct){f.shield=Math.max(f.shield,Math.round(f.maxHp*sk.selfShieldPct));
        bmsg(`🌿 보호막 ${f.shield}!`,{st:stFx(side,f)});}
      if(sk.witch) witchApply(side,oSide,f,opp,actual); // #121 계약 5.2 — 피해 확정 뒤(실HP 피해 actual 기준) 2효과를 100% 적용
      if(sk.status) applyStatus(false);
      if(sk.statusSelf){ // 잔류장: 자기 속성 상태효과 100% — 풀은 대응 상태이상 부재로 흡수 회복(실피해 40%) 임시 대체 [기획 필요]
        if(f.element==="grass"){const gh=Math.round(actual*0.4); if(gh>0){f.hp=Math.min(f.maxHp,f.hp+gh);
          bmsg(`🌿 잔류 흡수 — HP ${gh} 회복!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}}
        else applyStatus(true);
      }
      if(sk.selfVuln){f.vulnMark=true; bmsg(`⚠️ ${fighterName(side)}의 자세가 무너졌다 — 다음 피격 +15%!`,{st:stFx(side,f)});}
      if(sk.coolAttack) coolReduce(i=>i!==slot&&SKILLS[f.skills[i]].kind==="attack",null); // 전술 연계
      if(sk.coolAttackLongest) coolReduce(i=>SKILLS[f.skills[i]].kind==="attack",null);   // 급속 순환
    }
  }
  if(checkDeath()) return;
  nextPhase();
}
function sideName(s){return s==="A"?"공격측":"방어측";}
function dmgRange(v){return BAL.dmgVar?Math.round(v*(1-BAL.dmgVar))+"~"+Math.round(v*(1+BAL.dmgVar)):v;} // T7: 분산 반영 표기
/* T5-B 아키타입별 스킬 파라미터: 지속형 강화(화상3R·약화3회·풀15%/15%·감전2R), 풀 속공 변형(회복 8%·보호막 없음) */
function archOf(f){const rd=f.rosterId?ROSTER.find(r=>r.id===f.rosterId):null; return rd?rd.arch:null;}
function skillParamsOf(f){
  const a=archOf(f);
  return {
    burnRounds:a==="sustain"?3:BAL.burnRounds,
    weakenHits:a==="sustain"?3:BAL.weakenHits,
    shockRounds:a==="sustain"?2:1,
    shieldPct:(f.element==="grass"&&a==="swift")?0:BAL.shieldPct,
    healPct:a==="sustain"?0.15:(f.element==="grass"&&a==="swift")?0.08:BAL.healPct,
    grassDmgMult:(f.element==="grass"&&a==="swift")?1:0.6
  };
}
const ELEM_EMO={fire:"🔥",water:"💧",grass:"🌿",lightning:"⚡"};
function fighterName(sid){
  const B=S.battle, pf=sid==="A"?B.fa:B.fd, piece=sid==="A"?B.attP:B.defP;
  return pf===piece?(piece.type==="minion"&&piece.name?piece.name:TYPE_KO[piece.type]):"포획 하수인·"+ELEM_KO[pf.element];
}
function stIcons(f){
  return [f.shield?`🛡${f.shield}`:"",f.burn?`🔥화상${f.burn}R`:"",f.weaken?`💧약화${f.weaken}회`:"",f.shock?`⚡감전${f.shock}R`:"",
    f.dmgCut?`🌀감쇠${pct(f.dmgCut)}`:"",f.focusCharge?"🎯집중":"",f.vulnMark?"⚠️피격+15%":""].filter(Boolean).join(" ")||"-";
}
/* 전투 메시지 시퀀스 — 로직은 동기 완결, 표시 계층만 타이머 재생 (헤드리스: 큐만 적재 후 즉시 소진) */
/* #106 5.4: opts.key 가 있는 메시지는 새 표시 그룹을 연다(그룹 시간 = BAL.fx[key] — skillFx·damageFx·itemFx·captureFx·fleeFx·judgeBanner·roundEndFx).
   key 없는 메시지는 직전 그룹에 줄로 덧붙는다(쿨 감소·상태 부여·약화 해제 등). 재생 시작 시점에 그룹이 없으면 msgStep(0.6초) 단독 그룹. opts.big: 큰 글씨 */
function bmsg(txt,fx,opts){const B=S.battle; if(!B) return; B.blog.push(txt); B.msgQ.push({txt,fx:fx||null,key:opts&&opts.key||null,big:!!(opts&&opts.big)});}
let MSGQ=[], MSGPLAYING=false, MSGAFTER=null;
function liveBattleDom(){ // 실제 DOM에 msgBox가 있을 때만 재생 (sim·헤드리스 스텁 제외)
  try{const mb=$("msgBox"); return S.mode!=="sim"&&!!mb&&mb.nodeType===1;}catch(e){return false;}
}
function playMsgs(q,after){ // 그룹 단위 순차 재생 (계약 5.4) — 재생 불가 환경은 즉시 완료. 재생 중은 fxLocked() (입력 잠금·수신 보류)
  MSGQ.push(...q); MSGAFTER=after||null;
  if(MSGPLAYING) return;
  if(!liveBattleDom()){ MSGQ.length=0; const fn=MSGAFTER; MSGAFTER=null; if(fn)fn(); return; }
  MSGPLAYING=true; fxSetLockClass(true);
  const gen=FX.gen;
  (function step(){
    if(FX.gen!==gen) return; // 새 게임 — 옛 세대의 step 은 아무것도 만지지 않는다: MSGQ·MSGPLAYING·MSGAFTER 는 fxReleaseAll 이 이미 비웠고 그 뒤 새 게임의 재생이 소유한다 (REVISE msg_d847280b3dba)
    const m=MSGQ.shift();
    if(!m){ MSGPLAYING=false; if(!FX.cur&&!FX.q.length) fxSetLockClass(false); const fn=MSGAFTER; MSGAFTER=null; if(fn)fn(); fxIdle(); return; }
    const lines=[m.txt]; applyFx(m.fx);
    while(MSGQ.length&&!MSGQ[0].key){ const n=MSGQ.shift(); lines.push(n.txt); applyFx(n.fx); } // 같은 그룹의 후속 줄 즉시 병합
    try{ const mb=$("msgBox"); if(mb){ mb.innerHTML=lines.join("<br>"); if(mb.classList){ if(m.big) mb.classList.add("big"); else mb.classList.remove("big"); } } }catch(e){}
    const ms=m.key?fxMs(m.key):(fxLive()?BAL.fx.msgStep:0);

}
function fleeSwap(a,b){
  const ar=a.r, ac=a.c; a.r=b.r; a.c=b.c; b.r=ar; b.c=ac; // movedPreBT 미기록·강제 전투 미적용·흔적 미기록
  healBreak(a); healBreak(b); // #106: 도망 후 교환도 자세 해제
  addLog(`🏃 도망 — 후방 말과 위치를 교환했습니다.`,"imp");
  checkKingReach();
}
function afterBattle(attacker,attackerWonAlive){
  if(S.battlesUsed===1) S.firstBattleWonByMover = (attacker===S.movedPiece && attackerWonAlive);
  drainForcedQueue(false); // #18: 스왑 둘째 말 강제 전투 — 독립 queue에서 승격 (승·패·포획 종료 공통)
  render();
  if(S.phase==="play"&&!S.battle&&isAI(S.current)) aiSchedule();
}

/* ===== AI (공정 관측 휴리스틱 — Phase 1) ===== */
/* #106 6.3: AI 는 사람과 같은 연출을 기다린다 — 잠금 중이면 idle 콜백에 등록되고 idle 뒤 aiDelay 를 기산한다. 판단·정책·난수 순서는 불변 */
function aiSchedule(){
  if(S.aiPending) return; S.aiPending=true;
  const G=S; fxWhenIdle(()=>{ if(S!==G){ return; } setTimeout(()=>{ if(S!==G) return; S.aiPending=false; aiStep(); }, S.mode==="sim"?BAL.simDelay:BAL.aiDelay); });
}
function aiScheduleBattle(){
  if(S.aiBattlePending) return; S.aiBattlePending=true;
  const G=S; fxWhenIdle(()=>{ if(S!==G){ return; } setTimeout(()=>{ if(S!==G) return; S.aiBattlePending=false; aiBattleAction(); }, S.mode==="sim"?BAL.simDelay:BAL.aiDelay); });
}
function aiStep(){
  if(!S||S.phase!=="play"||!isAI(S.current)||S.battle||S.fleePick) return; // #114: 상대(사람)의 도망 교환 선택이 끝나야 재개 (fleeResolve → done 이 재스케줄)
  const me=S.current;
  if(!S.mainUsed){ if(aiLevelOf(me)==="dan5") aiMainStrong(me); else aiMain(me); render(); aiSchedule(); return; } // #21 난이도 분기
  if(!(S.forcedTargets&&S.forcedTargets.length)) drainForcedQueue(false); // #18 안전장치
  if(S.forcedTargets&&S.forcedTargets.length){ // T1: 강제 전투 최우선 이행 (aiEvalBattles보다 우선)
    const att=S.movedPiece, def=att?alivePieces().find(e=>forcedPickOk(e)):null; // #106: 폭탄 접촉 대상도 이행
    if(att&&def){ initBattle(att,def); return; }
    S.forcedTargets=[]; // 이행 불가 조합 방어 (크래시 방지)
    if(S.forcedQueue.length){ aiSchedule(); return; } // 다음 대기 항목 처리
  }
  const pick=aiLevelOf(me)==="dan5"?aiEvalBattlesStrong(me):aiEvalBattles(me);
  if(pick){ initBattle(pick.att,pick.def); if(!S.battle) return; return; } // 동기 해결은 afterBattle 훅이 재개
  endTurn();
}
/* T6 성격 프로파일: AI별 랜덤 가중치(0.6~1.4)·ε(0.05~0.15) — 게임당 고정, sim 양측 독립 생성 */
function aiProf(me){
  if(!S.aiProfile) S.aiProfile=[null,null];
  if(!S.aiProfile[me]){
    if(aiLevelOf(me)==="dan5") S.aiProfile[me]={aggression:1,capture:1,kingRush:1,caution:1,eps:0}; // #21 5단: 고정 프로파일·ε 무작위 없음
    else {
      const r=()=>0.6+rand()*0.8;
      S.aiProfile[me]={aggression:r(),capture:r(),kingRush:r(),caution:r(),eps:0.05+rand()*0.10};
    }
  }
  return S.aiProfile[me];
}
/* T6 전멸 회피: 전투 가능 말(하수인+동료) 2 이하면 신중 가중 강화 */
function aiCaution(me){
  const n=alivePieces().filter(x=>x.owner===me&&(x.type==="minion"||x.type==="ally")).length;
  return aiProf(me).caution*(n<=2?1.6:1);
}
/* 관측: AI는 visibleTo(me)·revealed·이동 이력(논리 추론)만 사용 */
function aiVisible(me){return alivePieces().filter(e=>e.owner!==me&&visibleTo(me,e));}
function aiThreatOf(me,e){ // 상대 말 위험도 추정 (공정: 비공개면 확률 기반)
  if(e.revealed){
    if(e.type==="bomb") return "bomb";
    if(e.type==="trap") return "trap";
    return "unit";
  }
  // 폭탄 이동 상시화(GDD-13 4.5): 이동 이력은 '함정 아님'만 증명 — 폭탄 후보는 남음
  // #21 누수 제거: 엔진 내부 movedPreBT가 아니라 관측자(me)가 실제로 목격한 이동 기억(aiSeenMoved)만 사용 — 숨은 숲 내부 이동은 미기록
  return aiSeenMoved(me,e) ? "unknownMoved" : "unknownStatic";
}
function aiSeenMoved(me,e){return S.aiSeenMoved&&S.aiSeenMoved[me]&&S.aiSeenMoved[me].has(e.id);}
/* 공개 정보(제거는 전부 공개 이벤트)·목격 이동 기반 폭탄·함정 확률 추정
   moved=true: 이동 목격 미공개 말 — 폭탄 후보만 / false: 이동 미목격 — 폭탄+함정 후보 */
function aiStaticRisk(me,moved){
  const opp=1-me;
  const bombsLeft=S.pieces.filter(p=>p.owner===opp&&p.type==="bomb"&&p.alive).length; // 제거는 공개 이벤트 → 잔여 수 공개 정보
  const trapsLeft=S.pieces.filter(p=>p.owner===opp&&p.type==="trap"&&p.alive).length;
  const pool=S.pieces.filter(p=>p.owner===opp&&p.alive&&p.placed&&!p.revealed&&(moved?aiSeenMoved(me,p):!aiSeenMoved(me,p))).length;
  return ((moved?0:trapsLeft*0.5)+bombsLeft)/Math.max(1,pool);
}
function aiMain(me){
  const prof=aiProf(me), caut=aiCaution(me);
  // ε-무작위 — T6 프로파일 기반 0.05~0.15
  if(rand()<prof.eps){ if(aiRandomMove(me)) return; }
  // 1. 흔적 위 말이 있으면 탐색 (#20: 하수인·동료·왕만 — 폭탄·함정은 탐색 실행 불가)
  for(const p of alivePieces().filter(p=>p.owner===me&&canSearchPiece(p))){
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
    if(ev){ doSearch(p,ev); addLog("🤖 AI 탐색 행동","ai"); return; }
  }
  // 2. 왕 안전: 인접 적 있으면 회피 이동
  const king=alivePieces().find(p=>p.owner===me&&p.type==="king");
  if(king&&adjEnemies(king).length&&king.immobile===0){
    const opts=aiMoveOptions(king).filter(([r,c])=>!at(r,c))
      .sort((a,b)=>aiCellDanger(me,a)-aiCellDanger(me,b));
    if(opts.length&&aiCellDanger(me,[king.r,king.c])>aiCellDanger(me,opts[0])){
      doMove(king,opts[0][0],opts[0][1]); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return;
    }
  }
  // 2.5 폭탄 이동 활용(간단 휴리스틱): BT 중 왕 비인접 폭탄을 왕 인접 빈 칸으로 호위 재배치
  if(isBurning()&&king){
    const holes=[[king.r+1,king.c],[king.r-1,king.c],[king.r,king.c+1],[king.r,king.c-1]]
      .filter(([r,c])=>r>=1&&r<=ROWS&&c>=1&&c<=COLS&&!at(r,c));
    const vipAdj=(r,c)=>aiVisible(me).some(e=>e.revealed&&(e.type==="ally"||e.type==="king")&&Math.abs(e.r-r)+Math.abs(e.c-c)===1); // #106: 폭탄이 공개 동료·왕과 새로 인접하면 폭탄만 잃는다 — 회피
    for(const b of alivePieces().filter(x=>x.owner===me&&x.type==="bomb"&&x.immobile===0&&!adj(x,king)))
      for(const [r,c] of holes)
        if(canMoveTo(b,r,c)&&!vipAdj(r,c)){ doMove(b,r,c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return; }
  }
  // 3. 강한 전투 기회가 있으면 주 행동 생략(위치 보존)
  const pick=aiEvalBattles(me,true);
  if(pick&&pick.score>=18){ S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략"); return; }
  // 4. 목적 이동: 동료·왕(볼 보유·포획 미보유) → 숲 / 하수인 → 전진 (공개된 적 왕은 추격)
  // 선봉 집중: 하수인 1기를 지정해 지속 전진 (이동권 분산으로 전선이 형성되지 않는 문제 방지)
  let vg=S.aiVanguard[me];
  if(!vg||!S.pieces.find(p=>p.id===vg&&p.alive&&p.immobile===0)){
    const vcands=alivePieces().filter(p=>p.owner===me&&p.type==="minion"&&p.immobile===0);
    vcands.sort((a,b)=>((me===1?b.r-a.r:a.r-b.r)*10+Math.abs(a.c-4)-Math.abs(b.c-4)));
    vg=S.aiVanguard[me]=vcands.length?vcands[0].id:null;
  }
  const hunt=aiVisible(me).find(e=>e.type==="king"&&e.revealed);
  const cands=[];
  for(const p of alivePieces().filter(p=>p.owner===me&&p.immobile===0&&p.type!=="bomb"&&p.type!=="trap")){
    for(const [r,c] of aiMoveOptions(p)){
      let sc=0;
      const fwd = me===1 ? (r-p.r) : (p.r-r); // 전진 방향
      if(p.type==="minion"){
        sc += fwd*6*prof.aggression + (4-Math.abs(c-4));
        if(p.id===vg) sc+=12; // 선봉 우선 이동권
        if(hunt){const dNow=Math.abs(p.r-hunt.r)+Math.abs(p.c-hunt.c), dNew=Math.abs(r-hunt.r)+Math.abs(c-hunt.c); sc+=(dNow-dNew)*12;}
      }
      if(p.type==="ally"&&(p.cap||S.balls[me]===0)){
        sc += fwd*5; // 포획 완료·볼 소진 동료는 후열 소탕(폭탄 제거) 전환
        if(hunt){const dNow=Math.abs(p.r-hunt.r)+Math.abs(p.c-hunt.c), dNew=Math.abs(r-hunt.r)+Math.abs(c-hunt.c); sc+=(dNow-dNew)*10;}
      } else if(p.type==="ally"||(p.type==="king"&&!adjEnemies(p).length)){
        const targetRows = me===1?[4,5]:[9,10];
        const dNow=Math.min(...targetRows.map(tr=>Math.abs(p.r-tr)));
        const dNew=Math.min(...targetRows.map(tr=>Math.abs(r-tr)));
        sc += (dNow-dNew)*8*prof.capture;
        if(p.type==="king") sc-=4; // 왕은 소극적으로
        if((r>=4&&r<=5)||(r>=9&&r<=10)) sc+=3*prof.capture; // 숲 내부 배회(흔적 발견)
      }
      if(p.type==="king"){ // 끝줄 도달 승리 (GDD-13 4.1 개정) — 안전 회피(위 2단계)가 항상 우선
        const goal=me===0?1:ROWS;
        if(r===goal) sc+=100*prof.kingRush; // 도달 = 즉시 승리
        sc+=(Math.abs(p.r-goal)-Math.abs(r-goal))*1.5*prof.kingRush; // 상대 진영 접근 소폭 가점
      }
      const fsc=aiForcedScore(me,p,r,c); // T6 강제 전투 예측: 불리한 신규 인접 회피·유리하면 적극
      if(fsc!==null) sc+=fsc*0.8;
      sc -= aiCellDanger(me,[r,c])*3*caut;
      sc += rand()*2;
      cands.push({p,r,c,sc});
    }
  }
  cands.sort((a,b)=>b.sc-a.sc);
  const tp=aiTeleportPick(me); // #14 텔레포트 스왑: 점수 기반으로 일반 이동과 경쟁 (남용 방지)
  const hl=aiHealPick(me); // #106 6.3 권고: 가시 인접 적 없고 HP<60% 인 자기 말 — 다른 후보 점수가 낮을 때만 (난수 미소비)
  if(hl&&hl.sc>(cands.length?cands[0].sc:0)&&(!tp||hl.sc>tp.sc)&&doHeal(hl.p)){ addLog("🤖 AI 회복 행동","ai"); showToast("🤖 AI 회복 행동"); return; }
  if(tp&&tp.sc>(cands.length?cands[0].sc:0)&&doTeleportSwap(tp.a,tp.b)){ addLog("🤖 AI 주 행동","ai"); return; } // #18: 차단 시 일반 이동으로 대체
  if(cands.length){ const t=cands[0]; doMove(t.p,t.r,t.c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return; }
  S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략");
}
/* #106 5급 회복 후보: 가시 인접 적이 없고 HP<60% 인 자기 하수인·동료·왕 중 손실 비율이 가장 큰 말 (공정 관측 — 자기 말 정보만, 난수 미소비) */
function aiHealPick(me){
  const caut=aiCaution(me), vis=aiVisible(me);
  let best=null;
  for(const p of alivePieces().filter(x=>x.owner===me&&canHeal(x)&&x.hp<x.maxHp*0.6&&!vis.some(e=>adj(e,x)))){
    const sc=(1-p.hp/p.maxHp)*30*caut+(p.type==="king"?10:0);
    if(!best||sc>best.sc) best={p,sc};
  }
  return best;
}
/* T6 강제 전투 예측: (r,c) 이동 시 새로 인접하게 될 보이는 적 중 최선 전투 기대 점수 (없으면 null) */
function aiForcedScore(me,p,r,c){
  let best=null;
  for(const e of aiVisible(me)){
    if(Math.abs(e.r-r)+Math.abs(e.c-c)!==1) continue;
    if(adj(p,e)) continue; // 기존 인접은 강제 대상 아님
    if(p.type==="king"&&e.type==="king") continue; // 왕 vs 왕 불가침 — 강제 미발동
    const s=aiBattlePairScore(me,p,e);
    if(best===null||s>best) best=s;
  }
  return best;
}
/* #14 텔레포트 스왑 판단: 침투 말↔왕(왕 러시 — 도착 칸 안전할 때)·위기 왕↔후방 스왑, 2회 제한 준수 */
function aiTeleportPick(me){
  if(S.mainUsed||!teleportAvailable(me)||S.teleUsed[me]>=BAL.teleMax) return null;
  const prof=aiProf(me), caut=aiCaution(me);
  const king=alivePieces().find(x=>x.owner===me&&x.type==="king"&&x.immobile===0);
  if(!king) return null;
  let best=null;
  // 1) 왕 러시: 적진 침투 말과 스왑 — 도착 칸 인접 위협 0일 때만 (kingRush 가중)
  const goal=me===0?1:ROWS;
  for(const p of alivePieces().filter(x=>x.owner===me&&x.id!==king.id&&x.immobile===0&&zoneOf(1-me).includes(x.r))){
    if(aiCellDanger(me,[p.r,p.c])>0||teleportSwapBlock(king,p)) continue; // #18: 슬롯 초과 스왑 후보 제외
    const sc=(20+(3-Math.abs(p.r-goal))*8)*prof.kingRush;
    if(!best||sc>best.sc) best={a:king,b:p,sc};
  }
  // 2) 위기 왕 구출: 인접 적 존재 시 자기 진영의 안전한 후방 말과 스왑
  if(adjEnemies(king).length){
    const rears=alivePieces().filter(x=>x.owner===me&&x.id!==king.id&&x.immobile===0
      &&zoneOf(me).includes(x.r)&&aiCellDanger(me,[x.r,x.c])===0&&!teleportSwapBlock(king,x)); // #18
    if(rears.length){const sc=24*caut; if(!best||sc>best.sc) best={a:king,b:rears[0],sc};}
  }
  return best;
}
function aiMoveOptions(p){
  const out=[];
  for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]])
    for(const k of (isBurning()?[1,2]:[1])){ // BT 중 직선 2칸 후보 포함
      const r=p.r+dr*k,c=p.c+dc*k;
      if(r<1||r>ROWS||c<1||c>COLS) continue;
      if(canMoveTo(p,r,c)) out.push([r,c]);
    }
  return out;
}
function aiCellDanger(me,[r,c]){ // 그 칸에 인접한 (보이는) 적 유닛 수
  return aiVisible(me).filter(e=>Math.abs(e.r-r)+Math.abs(e.c-c)===1&&aiThreatOf(me,e)!=="trap").length;
}
function aiRandomMove(me){
  const ps=shuffle(alivePieces().filter(p=>p.owner===me&&p.immobile===0&&p.type!=="bomb"&&p.type!=="trap"));
  for(const p of ps){ const o=aiMoveOptions(p); if(o.length){const [r,c]=o[Math.floor(rand()*o.length)]; doMove(p,r,c); addLog("🤖 AI 이동","ai"); showToast("🤖 AI 이동"); return true;} }
  return false;
}
function aiEvalBattles(me,peek){
  let best=null;
  for(const att of alivePieces().filter(p=>p.owner===me)){
    for(const def of adjEnemies(att)){
      if(!visibleTo(me,def)) continue;
      if(!canBattle(att,def)) continue;
      const sc=aiBattlePairScore(me,att,def);
      if(!best||sc>best.score) best={att,def,score:sc};
    }
  }
  if(!best||best.score<6) return null;
  return peek?best:best;
}
/* T6: 전투 쌍 기대 점수 — aiEvalBattles·강제 전투 예측(aiForcedScore) 공용, 프로파일 가중 포함 */
function aiBattlePairScore(me,att,def){
  const prof=aiProf(me);
  const th=aiThreatOf(me,def);
  const pressure=(S.turnCount/BAL.maxTurns)*14; // 후반 공세 압력 (무승부 방지)
  let sc=0;
  if(th==="bomb"){ sc = (att.type==="ally") ? 30 : (att.type==="king"? -100 : -100); }
  else if(th==="trap"){ sc = att.type==="minion" ? -15 : -30; }
  else if(th==="unknownStatic"||th==="unknownMoved"){ // 비공개: 이동/미이동 풀별 폭탄·함정 확률 추정 후 계산된 위험 감수
    // 폭탄 트레이드는 하수인 1 ↔ 폭탄 1 교환(왕 호위 해체)이라 EV가 크게 나쁘지 않음
    const risk=aiStaticRisk(me,th==="unknownMoved");
    sc = att.type==="ally" ? 18+pressure
       : att.type==="king" ? -100
       : 8 - 18*risk + pressure;
  } else if(aiVipPair(att,def)){ // #114 전투가 아닌 밀기: 중립/왕 손실 평가를 그대로 반환 (전투 HP·공세·끝줄 공격 보너스 제외)
    return aiPushScore(att,def);
  } else { // 유닛 (공개)
    if(def.type==="king") sc=45;
    else if(def.type==="ally") sc=25;
    else { sc=10;
      if(att.element&&def.element){
        if(BEATS[att.element]===def.element) sc+=20;
        else if(BEATS[def.element]===att.element) sc-=20;
      }
      sc += (att.hp-def.hp)/5;
    }
    if(att.type==="king") sc-=25; // 왕은 웬만하면 싸우지 않음
    if(att.type==="ally"&&!att.cap) sc-=15;
  }
  sc += att.hp/20;
  sc = sc>0 ? sc*prof.aggression : sc*aiCaution(me); // T6: 공세 점수×aggression·위험 페널티×caution(전멸 위기 강화)

  if(th!=="bomb"&&th!=="trap"&&Math.abs(def.r-(me===0?ROWS:1))<=1) sc+=40;

}
/* #114 AI 밀기 평가 (5급·5단 공용, 공정 관측 — def 는 revealed 동료/왕일 때만 호출).

function aiPushScore(att,def){

}
/* #121 계약 2.2·3·9: AI 전투 중 패키지 사용 — 무료 보너스 행동이라 **행동을 소모하지 않는다**.

function aiPkgAction(side){
  const B=S.battle; if(!B) return false;

  if(pk.battleBuff>0&&!(side==="A"?B.buffA:B.buffD)){
    const myPc=side==="A"?B.attP:B.defP, vipBody=(myPc.type==="ally"||myPc.type==="king")&&f===myPc;
    const losing=f.hp/f.maxHp<opp.hp/opp.maxHp;
    let key="power";                                       // 기본: 피해 상단 고정
    if(B.round===1&&losing&&vipBody) key="time";            // 본체 VIP 가 밀리면 3라운드로 끊어 판정 승부로
    else if(vipBody&&f.hp<f.maxHp*0.5) key="escape";        // 본체 VIP 가 위험하면 도망 조건 해제
    if(key==="time"&&B.round!==1) key="power";              // 계약 3.3 R1 한정 — 불법 선택을 만들지 않는다

  /* 2) 아이템 선물 개봉 — 지금 쓸모 있는 자원을 고른다. 라운드 1회 제한에 막혀도 개봉 자체는 이득이다 */
  if(pk.itemGift>0){

    else if(f.hp>f.maxHp*0.7&&opp.hp<opp.maxHp*0.4&&!S.reserve[ownerP]) want="ball"; // 포획 기회가 가까우면 볼

function aiBattleAction(){
  const B=S.battle; if(!B) return;
  const side=actorOfPhase(), f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa;
  const ownerP=side==="A"?B.attP.owner:B.defP.owner;
  if(!isAI(ownerP)) return;
  if(aiLevelOf(ownerP)==="dan5"){ aiBattleActionStrong(side); return; } // #21 5단 전투 행동 (기대치 기반)
  const prof=aiProf(ownerP), caut=aiCaution(ownerP); // T6 전투 성향 프로파일
  if(aiPkgAction(side)) return; // #121 계약 2.2·3: 무료 패키지 개봉·버프를 먼저 (행동 미소모 — 코어가 재고를 줄여 루프가 생기지 않는다)
  // 보너스 아이템 — 사용 임계 프로파일화 (신중할수록 일찍 회복)
  // #121 계약 2.3: 전투당 2회(itemPerBattle)·연속 동일 금지(lastItem) 제한 제거 — 라운드 1회(itemRound)만 남는다
  const itemRound=side==="A"?B.itemRoundA:B.itemRoundD;
  if(!itemRound){
    const inv=S.inv[ownerP];
    let use=-1;
    if(f.hp<f.maxHp*(0.25+0.15*caut)&&inv.includes("potion")) use=inv.indexOf("potion");
    else if((f.burn||f.weaken)&&inv.includes("cure")) use=inv.indexOf("cure");
    if(use>=0){ window.__useItem(use); return; } // 모달 재렌더 → 재스케줄
  }
  // #12 적 하수인 포획: 게이트 충족 시 확률적 투척 (capture 프로파일 가중)
  const oppPc=side==="A"?B.defP:B.attP, thrown=side==="A"?B.ballThrowA:B.ballThrowD;
  if(oppPc.type==="minion"&&opp.hp<opp.maxHp*0.3&&S.balls[ownerP]>0&&!S.reserve[ownerP]&&!thrown
     &&rand()<0.4+0.4*prof.capture){ window.__throwBall(); return; }
  // #13 도망: 동료·왕 본체 또는 열세 전투원 (caution 가중)
  const myPc=side==="A"?B.attP:B.defP;
  if(f.hp<f.maxHp*0.5||f.fleeFree){ // #121 계약 3.4: 도망의 수호자로 HP 조건 해제
    const vipBody=(myPc.type==="ally"||myPc.type==="king")&&f===myPc;
    const losing=f.hp/f.maxHp<opp.hp/opp.maxHp-0.15;
    if((vipBody||losing)&&rand()<(vipBody?0.5:0.25)*caut){ window.__flee(); return; }
  }
  // 행동 선택 — 4슬롯 점수화 (킬 가능>시그니처>효과기>안정기, 저HP 시 회복/방어) + T6 프로파일 가중·확률 혼합
  // 공정 관측: 자기 기술·상대의 공개 전투 정보(HP·보호막·상태·속성)만 사용, 상대 미공개 기술 미참조
  if(!f.skills){
    if(f.skillAtk&&f.cd===0&&rand()<0.5){ window.__act("skill"); return; } // 구형 경로 잔여
    window.__act("basic"); return;
  }
  // #121 계약 5.3: 쿨만이 아니라 **봉인·조건 미충족**도 불법이다. AI 는 slotUsable 로 합법 슬롯만 본다 (불법 선택 금지)
  const usable=f.skills.map((sid,i)=>({i,sk:SKILLS[sid]})).filter(x=>slotUsable(f,x.i,side));
  if(!usable.length){ window.__act("basic"); return; } // 쓸 수 있는 슬롯이 없으면 폴백 기본 공격 (사신으로 강제 매핑하지 않는다)
  const multOf=el=>{ // #92 기대 피해 상성은 기술 속성(공격기) 기준 — 기본 공격·시그니처는 본체 속성
    const adv=el&&opp.element&&BEATS[el]===opp.element, disadv=el&&opp.element&&BEATS[opp.element]===el;

      if(sk.bonusVsShield&&opp.shield>0) sc+=3;
      if(sk.bonusVsStatus&&(opp.burn||opp.weaken||opp.shock)) sc+=3;
      if(sk.selfVuln&&lowHp) sc-=6; // 저HP에 결정타 반동 위험
      sc*=prof.aggression;
    } else { // 보조기·불굴 진형
      if(sk.healPct) sc=lowHp?20+10*caut:2;
      else if(sk.shieldPct) sc=(lowHp?14:5)*(f.shield>0?0.3:1);
      else if(sk.dmgCut) sc=lowHp?10:3;
      else if(sk.focus) sc=(!f.focusCharge&&!lowHp)?7:1;
      else if(sk.coolAny) sc=f.cds.some((c,j)=>j!==i&&c>=2)?6:0.5;
      else if(sk.cleanse) sc=(f.burn||f.weaken||f.shock)?9:0.5;
      if(lowHp) sc*=caut;
    }
    return {i,sc:sc+rand()*3}; // T6 확률 혼합 유지 (결정적 패턴 해소)
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const pick=(scored.length>1&&rand()<0.10)?scored[1]:scored[0]; // ε 차선 혼합
  window.__act(pick.i);

/* #121 계약 6·9: AI 포획 방법 선택 — 볼 보유량과 신중함(T6)만 본다. 수령 말·후보 종은 호출자가 정한다 */
function aiCapMode(own,p){
  const b=S.balls[own], caut=aiCaution(own); // T6: 신중할수록 공격 포획(실패 피해) 회피
  if(b>=2) return "safe";
  if(b===1&&p.hp>p.maxHp*Math.min(0.9,0.5*caut)) return "attack";
  return null; // 포기
}
/* #121 계약 4.2·9: AI 기술 교체 계획 — 4슬롯 어디든, 합법 선택만. 공정 관측 문제는 없다(전부 자기 말 정보).
   · 대상: 내 최초 하수인 6명 중 **살아 있고 그 기술이 없는** 말. HP 비율이 높은(오래 살) 말을 선호한다.
   · 기술: 드래곤(안정적 고위력) > 마녀(상태 2종 확정) > 사신(조건부 즉사 — 전투 후반 역전용이라 가치를 낮게 본다).
   · 슬롯: 보조기·시그니처는 남기고 위력이 가장 낮은 공격기부터 바꾼다. 공격기가 둘 다 더 강하면 보조기 중 쿨이 가장 긴 슬롯.
   난수를 쓰지 않는다(결정적) — 탐색 시점 rand 1회(후보 종) 외에 AI 경로가 시드를 더 소비하지 않게 한다. */
function aiRecruitPlan(own){
  const order=["dragon_breath","witch_prank","reaper_scythe"];
  for(const sid of order){
    const cands=rosterMinions(own).filter(m=>m.alive&&m.placed&&m.skills&&!m.skills.includes(sid));
    if(!cands.length) continue;
    cands.sort((a,b)=>(b.hp/b.maxHp)-(a.hp/a.maxHp)||a.id-b.id);
    const m=cands[0], pow=SKILLS[sid].pow||0;

    for(let i=0;i<4;i++){ const sk=SKILLS[m.skills[i]]; if(!sk||sk.kind!=="attack") continue;
      if((sk.pow||0)<worst){ worst=sk.pow||0; slot=i; } }
    if(slot<0||(pow>0&&pow<worst)){ // 공격기를 바꿀 이유가 없으면 보조기 계열 중 쿨이 가장 긴 슬롯
      let alt=-1, longest=-1;
      for(let i=0;i<4;i++){ const sk=SKILLS[m.skills[i]]; if(!sk||sk.kind==="attack") continue;
        if(sk.cd>longest){ longest=sk.cd; alt=i; } }
      if(alt>=0) slot=alt;
    }
    if(slot>=0) return {skill:sid,targetId:m.id,slot};
  }
  return null;
}
/* #121 계약 4·6·9: AI 탐색 보상 해결 — 사람과 **같은 코어**(window.__recruitCore)를 타서 규칙·검사·순서가 한 곳에만 있다.
   무한 무료 행동 루프가 생기지 않도록 각 단계를 한 번씩만 전진시키고, 불법 선택은 코어가 이미 거부한다. */
function aiRecruitResolve(own,p){
  const recv=capReceivers(own), mode=recv.length?aiCapMode(own,p):null;
  const plan=aiRecruitPlan(own);
  const prof=aiProf(own);
  /* 포획과 기술 교체가 모두 가능하면 capture 성향으로 고른다. 포획은 예비 전력이고 기술 교체는 지속 강화라 둘 다 가치가 있다 */
  const wantCap=!!mode&&(!plan||rand()<0.35+0.35*prof.capture);
  if(wantCap){
    window.__recruitCore("cap",0);
    const idx=recv.reduce((best,x,i)=>(x.type==="ally"&&recv[best].type!=="ally")?i:best,0); // 왕보다 동료에게 먼저 (왕 위험 분산)
    window.__recruitCore("recv",idx);
    window.__recruitCore("mode",CAP_MODES.indexOf(mode));
    return;
  }
  if(plan){
    window.__recruitCore("skills",0);
    window.__recruitCore("skill",NEW_SKILLS.indexOf(plan.skill));
    const ms=rosterMinions(own);
    window.__recruitCore("target",ms.findIndex(m=>m.id===plan.targetId));
    window.__recruitCore("slot",plan.slot);
    return;
  }
  window.__recruitCore("giveup",0); // 둘 다 불가 — 이벤트는 이미 소모됐고 턴 종료 판정으로 넘어간다
}
/* ===== #21 5단 — 탐색·추론 기반 강AI (공정 관측: 결정 시점에 고정한 가시 적 집합 V·revealed·공개 제거 집계·목격 이동 기억만 사용) =====
   구조: 후보 행동(이동·텔레포트 스왑·탐색·생략) → 1-ply 위치 평가(+강제 전투 기대치·공격 기회) → 상위 K 후보에 대해
   2-ply: 보이는 적의 최선 응수(공격·이동)로 내 평가가 얼마나 나빠지는지 감점 → 최종 = 0.4·1-ply + 0.6·최악 응수 후 평가.
   판단 시간 상한(BAL.aiStrongBudgetMs) 초과 시 남은 후보는 1-ply 순위로 처리. 반복 완화: 최근 이력 칸 복귀 감점. */
function aiLevelOf(p){return (S.aiLevel&&S.aiLevel[p])||"grade5";}
function aiUnitValue(x,me){ // 말 가치 (자기 말 또는 공개된 적 말) — 적의 포획 하수인 보유(cap)는 비공개 정보라 자기 말만 반영
  if(x.type==="king") return 200;
  if(x.type==="ally") return 40+(x.cap&&x.owner===me?25:0);
  if(x.type==="minion") return 26+(x.hp/x.maxHp)*24;
  if(x.type==="bomb") return 18;
  if(x.type==="trap") return 10;
  return 20;
}
function aiWinProb(att,def,me){ // 공개 스탯 기반 승률 추정 — 포획 하수인(cap) 출전은 자기 말(owner===me)만 가정, 적의 cap은 비공개
  const fa=(att.owner===me&&att.cap)?att.cap:att, fd=(def.owner===me&&def.cap)?def.cap:def;
  let p=0.5;
  if(fa.element&&fd.element){ if(BEATS[fa.element]===fd.element) p+=0.18; else if(BEATS[fd.element]===fa.element) p-=0.18; }
  p+=((fa.hp/fa.maxHp)-(fd.hp/fd.maxHp))*0.3;
  p+=((fa.atk||0)-(fd.atk||0))/60;
  if(!fa.skills&&(att.type==="king"||att.type==="ally")) p-=0.1; // 본체 출전은 기술 없음
  if(!fd.skills&&(def.type==="king"||def.type==="ally")) p+=0.1;
  if(att.nextBattleBuff) p+=0.05;
  return Math.max(0.08,Math.min(0.92,p));
}
/* 전투 기대치 (me 관점, 양수=유리): 미공개 적은 목격 이동 여부별 폭탄·함정 확률 혼합 */
function aiBattleEV(me,att,def){
  if(att.type==="trap") return null;
  if(att.type==="bomb"){ // #106 4.4.2: 폭탄이 새로 인접하면 발동 — 하수인 추정 대상은 교환 이득, 동료·왕은 폭탄 손실, 폭탄·함정은 0. 공정 관측(revealed·목격 이동 기억만)
    const th=aiThreatOf(me,def);
    if(th==="bomb"||th==="trap") return 0;
    if(th==="unit") return def.type==="minion"?aiUnitValue(def,me)-18:-18;
    return (1-Math.min(1,aiStaticRisk(me,th==="unknownMoved")))*2; // 미공개: 하수인·동료·왕 혼합 기대치 — 소폭 양수
  }
  if(att.type==="king"&&def.type==="king") return null; // 불가침
  const th=aiThreatOf(me,def), va=aiUnitValue(att,me);
  const bombEV=att.type==="minion"?-va+16:22, trapEV=-10;
  if(th==="bomb") return bombEV;
  if(th==="trap") return trapEV;
  const edgeGuard=Math.abs(def.r-(me===0?ROWS:1))<=1?45:0; // 끝줄 저지: 내 최후방 1칸 이내 적은 우선 제거 (왕 끝줄 승리 차단)
  const pressure=Math.min(1,S.turnCount/BAL.maxTurns)*8; // 후반 공세 압력 (무승부 방지)
  if(th==="unit"){
    if(aiVipPair(att,def)) return aiPushScore(att,def); // #114 동료/왕끼리는 밀기 (전투 없음)
    const p=aiWinProb(att,def,me);
    let ev=p*(aiUnitValue(def,me)+(def.type==="king"?400:0))-(1-p)*va;
    if(att.type==="king"&&!att.cap) ev-=(1-p)*400; // 왕 본체 패배 = 경기 패배
    else ev+=4; // 선제 보너스: 인접 적은 어차피 다음 턴 나를 칠 수 있음 — 공격측 선공 이득
    return ev+edgeGuard+pressure;
  }
  const r=Math.min(1,aiStaticRisk(me,th==="unknownMoved")), trapShare=th==="unknownMoved"?0:0.35;

/* 위치 평가 — V: 결정 시점 고정 가시 적 목록 (가상 이동 중 새로 인접해도 숨은 말은 절대 참조하지 않음) */
function aiEvalPos(me,V){
  const my=alivePieces().filter(x=>x.owner===me);
  const king=my.find(x=>x.type==="king");
  const units=V.filter(e=>!(e.revealed&&(e.type==="bomb"||e.type==="trap")));
  const dist=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c);
  let v=0;
  for(const x of my) v+=aiUnitValue(x,me);
  for(const e of S.pieces.filter(e=>e.owner!==me&&e.alive&&e.placed)) v-=e.revealed?aiUnitValue(e,me):28; // 잔여 수는 공개 정보(제거 공개), 정체는 공개 시만
  const goal=me===0?1:ROWS, last=me===0?ROWS:1;
  if(king){
    const danger=units.filter(e=>dist(e,king)===1).length, near=units.filter(e=>dist(e,king)===2).length;
    v-=danger*48+near*10;
    v+=my.filter(b=>b.type==="bomb"&&dist(b,king)===1).length*6;
    if(inForest(king)) v+=3;
    const dg=Math.abs(king.r-goal);
    if(dg===0) v+=1000;
    else v+=(12-dg)*(danger===0&&near===0?4:1);
    if(zoneOf(1-me).includes(king.r)&&danger) v-=40;
  }
  const eking=V.find(e=>e.type==="king"&&e.revealed);
  for(const e of units){ // 끝줄 저지: 내 최후방 접근 적은 큰 감점, 내 말이 붙어 있으면 완화
    const d=Math.abs(e.r-last);
    if(d<=2){ v-=(3-d)*18; if(d<=1){ v-=30; if(my.some(x=>x.type!=="bomb"&&x.type!=="trap"&&dist(x,e)===1)) v+=28; } }
  }
  for(const x of my){
    if(x.type==="minion"){ v+=(me===1?x.r:ROWS+1-x.r)*1.2+(4-Math.abs(x.c-4))*0.5; if(eking) v+=(10-Math.min(10,dist(x,eking)))*3; }
    if(x.type==="ally"){ if(eking) v+=(10-Math.min(10,dist(x,eking)))*2; }
    if(canSearchPiece(x)){
      const ev=S.events.find(e=>e.r===x.r&&e.c===x.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));
      if(ev) v+=10;
      if((x.type==="ally"||x.type==="king")&&S.balls[me]>0&&!x.cap&&!S.reserve[me]){
        const df=Math.min(...(me===1?[4,5]:[9,10]).map(tr=>Math.abs(x.r-tr)));
        v+=(5-Math.min(5,df))*(x.type==="king"?0.8:2);
      }
    }
    if(x.type==="bomb"){ if(units.some(e=>e.type!=="king"&&dist(e,x)===1)) v+=5; if(x.revealed) v-=6; }
    if(x.type!=="bomb"&&x.type!=="trap"&&x.type!=="king") // 접촉 압력(불리한 인접은 감점) — 상세 응수는 2-ply가 처리
      for(const e of units) if(dist(x,e)===1){ const p=aiWinProb(x,e.revealed?e:{element:null,hp:100,maxHp:100,atk:22,type:"minion"},me); v+=(p-0.5)*10; }
  }
  v+=S.balls[me]*3+(S.reserve[me]?15:0)+S.inv[me].length*2;
  return v;
}
/* 2-ply: 보이는 적의 최선 응수(내 말 공격 또는 1칸 이동) 후 내 평가의 최악값 */
function aiWorstReply(me,V,deadline){
  const my=alivePieces().filter(x=>x.owner===me), occ=(r,c)=>my.some(x=>x.r===r&&x.c===c)||V.some(e=>e.r===r&&e.c===c);
  const base=aiEvalPos(me,V);
  let worst=base, n=0;
  for(const e of V){
    if(e.revealed&&(e.type==="bomb"||e.type==="trap")) continue;
    if(e.immobile>0) continue;
    for(const x of my){ // 공격 응수: 내 말 x를 e가 공격 (내 관점 EV 부호 반전은 x가 방어자)
      if(Math.abs(e.r-x.r)+Math.abs(e.c-x.c)!==1) continue;
      if(x.type==="bomb"||x.type==="trap") continue; // 적이 내 폭탄·함정을 치면 나에게 이득 → 최선 응수 아님
      if(e.type==="king"&&e.revealed&&x.type==="king") continue;
      if(e.revealed&&(e.type==="ally"||e.type==="king")&&(x.type==="ally"||x.type==="king")) continue; // #114 공개 동료/왕이 내 동료/왕을 치면 전투가 아니라 밀기 — 손실 응수로 세지 않는다
      const p=1-aiWinProb(e.revealed?e:{element:null,hp:100,maxHp:100,atk:22,type:"minion"},x,me);
      const harm=(1-p)*(aiUnitValue(x,me)+(x.type==="king"?400:0))-p*(e.revealed?aiUnitValue(e,me):28);
      worst=Math.min(worst,base-harm); n++;
    }
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ // 이동 응수
      const r=e.r+dr,c=e.c+dc; if(r<1||r>ROWS||c<1||c>COLS||occ(r,c)) continue;
      const or=e.r,oc=e.c; e.r=r;e.c=c;
      worst=Math.min(worst,aiEvalPos(me,V)); n++;
      e.r=or;e.c=oc;
      if(n>=BAL.aiStrongReplyCap||Date.now()>deadline) return worst;
    }
  }
  return worst;
}
function aiMainStrong(me){

  const hist=S.aiHist[me]||(S.aiHist[me]=[]);
  const cands=[];
  const virt=(fn)=>{ // 가상 적용 → 평가 → 복원

  };

    let best=0;
    for(const x of my) for(const e of V){ if(x.type==="bomb"||Math.abs(e.r-x.r)+Math.abs(e.c-x.c)!==1) continue;
      const ev=aiBattleEV(me,x,e); if(ev!==null&&ev>best) best=ev; }
    return best*0.8;
  };
  const adjIds=p=>new Set(V.filter(e=>Math.abs(e.r-p.r)+Math.abs(e.c-p.c)===1).map(e=>e.id));
  const hiddenLeft=S.pieces.filter(e=>e.owner!==me&&e.alive&&e.placed).length-V.length; // 아직 보이지 않는 적 말 수 (공개 정보: 총 잔여 − 가시)
  const unseenForestAdj=(r,c,mover)=>{ // (r,c)에 인접한 숲 칸 중 내 다른 말이 인접하지 않아 관측되지 않는 칸 수
    let n=0;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const fr=r+dr,fc=c+dc;
      if(fr<1||fr>ROWS||fc<1||fc>COLS||!inForest({r:fr,c:fc})) continue;
      if(my.some(x=>x!==mover&&Math.abs(x.r-fr)+Math.abs(x.c-fc)<=1)) continue;
      n++; }
    return n;
  };

    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed&&S.traces[me].has(e.r+"_"+e.c));

    cands.push({kind:"heal",p,s1:aiEvalPos(me,V)+(1-p.hp/p.maxHp)*24+(p.type==="king"?8:0)+attackOpp(),desc:"회복",noTie:true});

    for(const [r,c] of aiMoveOptions(p)){

      { const or=p.r,oc=p.c; p.r=r;p.c=c; s1+=forcedGain(p,before)+attackOpp(); p.r=or;p.c=oc; } // 강제 전투 기대치·공격 기회

      const s1=virt(()=>{const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac;})
        +(()=>{const ar=a.r,ac=a.c; a.r=b.r;a.c=b.c; b.r=ar;b.c=ac; const g=forcedGain(a,ba)+forcedGain(b,bb)+attackOpp(); b.r=a.r;b.c=a.c; a.r=ar;a.c=ac; return g;})()
        -8; // 기존 주 행동 소모 비용

  }

  for(const c of top){ // 실행 (텔레포트 차단 시 다음 후보)
    if(c.kind==="search"){ doSearch(c.p,c.ev); addLog("🤖 AI 탐색 행동","ai"); return; }
    if(c.kind==="heal"){ if(doHeal(c.p)){ addLog("🤖 AI 회복 행동","ai"); return; } continue; }
    if(c.kind==="move"){ hist.push({id:c.p.id,r:c.p.r,c:c.p.c}); if(hist.length>6) hist.shift();

    if(c.kind==="tele"){ if(doTeleportSwap(c.a,c.b)){ addLog("🤖 AI 주 행동","ai"); return; } continue; }
    S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai"); showToast("🤖 AI 주 행동 생략"); return;
  }
  S.mainUsed=true; addLog("🤖 AI 주 행동 생략","ai");

/* 5단 전투 개시 선택: 기대치 기반 (canBattle·가시 대상만) */
function aiEvalBattlesStrong(me){

/* 5단 전투 중 행동: 킬 가능·피해 경쟁(누가 먼저 쓰러지는가) 기반으로 아이템·볼 투척·도망·기술을 결정 — 상대 미공개 기술은 참조하지 않고 공개 스탯(atk)·속성만 사용 */
function aiBattleActionStrong(side){

    const adv=el&&opp.element&&BEATS[el]===opp.element, disadv=el&&opp.element&&BEATS[opp.element]===el;

  const usable=f.skills?f.skills.map((sid,i)=>({i,sk:SKILLS[sid]})).filter(x=>slotUsable(f,x.i,side)):[]; // #121 계약 5.3: 봉인 포함 합법 슬롯만

  // 아이템: 사망 위기면 회복약(다음 피격 생존), 상태이상이면 해독제 — #121 계약 2.3: 라운드 1회만 남는다

  const thrown=side==="A"?B.ballThrowA:B.ballThrowD;
  if(oppPc.type==="minion"&&opp.hp<opp.maxHp*0.3&&S.balls[ownerP]>0&&!S.reserve[ownerP]&&!thrown&&(!killNow||f.hp>f.maxHp*0.6)){ window.__throwBall(); return; }

      if(sk.selfVuln&&lowHp) sc-=8;
    } else {
      if(sk.healPct) sc=(lowHp&&toKillOpp>1)?25:1;
      else if(sk.shieldPct) sc=(lowHp&&toKillOpp>1?16:4)*(f.shield>0?0.3:1);
      else if(sk.dmgCut) sc=lowHp&&toKillOpp>1?12:2;
      else if(sk.focus) sc=(!f.focusCharge&&toKillOpp>=2&&!lowHp)?8:0.5;
      else if(sk.coolAny) sc=f.cds.some((c,j)=>j!==i&&c>=2)?5:0.3;
      else if(sk.cleanse) sc=(f.burn||f.weaken||f.shock)?9:0.3;
    }
    return {i,sc:sc+rand()*0.3};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  window.__act(scored[0].i);
}
/* AI 로스터 선택: 4속성 각 1종 이상 + 나머지 2종 무작위 (중복 없음, 아키타입 혼합 선호) */
function aiPickRoster(p){
  if(S.roster[p].length===6) return;
  S.roster[p]=[];
  const archs=shuffle(["std","atk","def"]);
  shuffle(ELEMS.slice()).forEach((el,i)=>{
    const pool=ROSTER.filter(r=>r.element===el);
    S.roster[p].push((pool.find(r=>r.arch===archs[i%3])||pool[0]).id);
  });
  const rest=shuffle(ROSTER.filter(r=>!S.roster[p].includes(r.id)).map(r=>r.id));
  S.roster[p].push(rest[0],rest[1]);
  shuffle(S.roster[p]);
  applyRoster(p);
}
/* AI 휴리스틱 배치 */
function aiAutoPlace(p){
  aiPickRoster(p);
  const rows=zoneOf(p);
  const back = p===1?rows[0]:rows[2];     // 후열
  const mid  = rows[1];
  const front= p===1?rows[2]:rows[0];     // 전열
  const free=(r,c)=>r>=1&&r<=ROWS&&c>=1&&c<=COLS&&rows.includes(r)&&!at(r,c);
  const put=(x,r,c)=>{x.r=r;x.c=c;x.placed=true;};
  const mine=t=>S.pieces.filter(x=>x.owner===p&&x.type===t&&!x.placed);
  // 왕: 후열(80%) 또는 중열(20% 블러핑), 무작위 열
  const king=mine("king")[0];
  {const kr=rand()<0.8?back:mid; const cols=shuffle([1,2,3,4,5,6,7]);
   put(king,kr,cols.find(c=>free(kr,c)));}
  // 폭탄: 1~2개 왕 인접 호위, 나머지 무작위
  const bombs=mine("bomb"); let guard=0;
  for(const b of bombs){
    if(guard<2){
      const spots=shuffle([[king.r+1,king.c],[king.r-1,king.c],[king.r,king.c+1],[king.r,king.c-1]]).filter(([r,c])=>free(r,c));
      if(spots.length){put(b,spots[0][0],spots[0][1]);guard++;continue;}
    }
    aiPutRandom(b,rows,free,put);
  }
  // 함정: 전열 중앙(3~5열) 침투로
  for(const t of mine("trap")){
    const spots=shuffle([[front,3],[front,4],[front,5],[mid,3],[mid,4],[mid,5]]).filter(([r,c])=>free(r,c));
    if(spots.length) put(t,spots[0][0],spots[0][1]); else aiPutRandom(t,rows,free,put);
  }
  // 동료: 측면(1·2·6·7열) 숲 접근
  for(const a of mine("ally")){
    const spots=shuffle([[front,1],[front,2],[front,6],[front,7],[mid,1],[mid,7]]).filter(([r,c])=>free(r,c));
    if(spots.length) put(a,spots[0][0],spots[0][1]); else aiPutRandom(a,rows,free,put);
  }
  // 하수인: 전열 우선, 속성 분산 유지
  for(const m of mine("minion")){
    const spots=[];
    for(const c of shuffle([1,2,3,4,5,6,7])){ if(free(front,c)) spots.push([front,c]); }
    for(const c of shuffle([1,2,3,4,5,6,7])){ if(free(mid,c)) spots.push([mid,c]); }
    if(spots.length) put(m,spots[0][0],spots[0][1]); else aiPutRandom(m,rows,free,put);
  }
}
function aiPutRandom(x,rows,free,put){
  const cells=[]; for(const r of rows) for(let c=1;c<=COLS;c++) if(free(r,c)) cells.push([r,c]);
  shuffle(cells); put(x,cells[0][0],cells[0][1]);
}

/* ===== 모달·핸드오프 ===== */
/* #11·#36 추측 메모 UI 상태 (게임 상태 S와 분리) — btns/piece: 테스트·포커스용.
   #94 token: 지금 오버레이를 소유한 메모 피커의 토큰(다른 modal()/close()가 오면 null) · seq: 피커 발급 번호 · overlayOpen: 오버레이 표시 여부 */
const MEMO_UI={btns:[],piece:null,token:null,seq:0,overlayOpen:false};
function modal(html,buttons){
  MEMO_UI.token=null; MEMO_UI.overlayOpen=true; // #94 새 모달이 오버레이를 가져간다 — 열려 있던 메모 피커 콜백은 무효
  $("overlayBox").innerHTML=html+`<div class="row" id="obBtns"></div>`;
  const ob=$("obBtns");
  /* 버튼 튜플은 [문구, 콜백] 또는 [문구, 콜백, disabled] 다. Saturn REVISE P2: "선택 불가"를 문구로만 알리지 않고
     실제 disabled 를 건다 — 키보드·스크린리더·중복 클릭·동기화 중계 모두에서 같은 의미가 된다.
     disabled 버튼은 콜백을 걸지 않으므로 온라인 인덱스 중계로도 눌릴 수 없다. */
  for(const [txt,fn,dis] of buttons){const b=document.createElement("button"); b.textContent=txt;
    if(dis){ b.disabled=true; b.setAttribute("aria-disabled","true"); }
    else b.onclick=()=>{ if(fxLocked()) return; fn(); };
    b.className="primary"; ob.appendChild(b);} // #106: 연출 잠금 중 모달 버튼 무시
  $("overlay").classList.remove("hidden");
}
function close(){MEMO_UI.token=null; MEMO_UI.overlayOpen=false; $("overlay").classList.add("hidden");}
/* #11·#36 추측 메모: 게임 중 정체 미공개 상대 말 클릭(전투 지정 경로 외) → 8종 이모지 피커 — 뷰어(PVE:0 / PVP:현재 플레이어)별 비공개, 인메모리만(로그·영구 저장 없음)
   #94 상대 턴·AI 턴에도 뷰어가 고정된 모드(온라인 NET.me · PVE 0)에서는 로컬로 연다 — 진입은 onCell → memoClickTarget (네트워크·RNG·selected·게임 로그 무변화) */
function memoSet(v,pid,key){ // key: MEMO_OPTS 키 또는 null(삭제). 그 외 값은 무시 — 상대 말·게임 중에만
  const pc=S.pieces.find(x=>x.id===pid); if(!pc||pc.owner===v||(v!==0&&v!==1)) return false;
  if(key===null||key===undefined){ delete S.memos[v][pid]; return true; }
  if(!memoOpt(key)) return false;
  S.memos[v][pid]=key; return true;
}
/* #94 메모 대상 자격 — 살아 있고 배치된, 미공개, 뷰어가 볼 수 있는 상대 말 (죽은 말·비가시·자기 말·공개된 말은 불가) */
function memoTargetOk(v,pc){ return !!pc&&pc.alive&&pc.placed&&!pc.revealed&&pc.owner!==v&&visibleTo(v,pc); }
/* #94 이 셀 클릭이 "순수 로컬 메모"인가 — 맞으면 대상 말, 아니면 null(현행 netAction 경로 그대로).
   (a) 상대 턴·AI 턴 — 뷰어 고정 모드(온라인 NET.me · PVE 0)에서 뷰어가 볼 수 있는 상대 말. 공개된 말도 여기로 와서 memoModal의 기존 안내 토스트를 받는다.
       핫시트 PVP는 뷰어=현재 플레이어라 "상대 턴"이 없다(상대 메모 세트 오염 방지) · sim은 대상 아님.
   (b) 자기 턴 — onCellCore의 우선순위(강제 전투 대상 → 텔레포트 → 자기 말 선택 → 인접 전투 지정)를 그대로 흉내 내어,
       원래 memoModal 분기에 도달할 클릭만 로컬 처리(송신 0). 이동·전투·탐색·텔레포트 권한 가드는 건드리지 않는다.
   오버레이가 열려 있으면(전투 모달·상대 선택 대기·이미 열린 피커) 로컬 분기를 쓰지 않는다 — 원격 모달 권한·대기 큐를 가리지 않는다. */
function memoClickTarget(r,c){
  if(!S||S.phase!=="play"||S.battle||NET.replaying||MEMO_UI.overlayOpen) return null;
  if(fxLocked()) return null; // #106 3.2: 배너·연출 잠금 중에는 메모 피커도 열지 않는다 (잠금이 풀리면 종전대로)
  const v=humanViewer(); if(v!==0&&v!==1) return null;
  const p=at(r,c); if(!p||p.owner===v||!visibleTo(v,p)) return null;
  if(S.fleePick) return (NET.mode&&S.fleePick.owner!==NET.me)?p:null; // #114 도망 교환 선택 중: 소유자 클릭은 규칙 경로(cell 액션), 온라인 대기자는 로컬 메모만
  const myTurn=NET.mode?netActor()===NET.me:!isAI(S.current);
  if(!myTurn) return (NET.mode||S.mode==="pve")?p:null; // (a)
  if(S.teleport) return null;
  if(forcedPickOk(p)) return null;
  if(p.owner===S.current) return null;
  const s=S.selected&&!S.selected.tray?S.selected:null;
  if(s&&adj(s,p)&&canBattle(s,p)) return null;
  return p; // (b)
}
function memoModal(pc){
  if(S.phase!=="play"||!pc) return;
  if(NET.replaying) return; // 온라인: 상대 클릭 재생 시 내 메모 팝업 금지 (메모는 뷰어 전용·비동기화)
  const v=humanViewer();
  if(pc.owner===v) return;
  if(!pc.alive||!pc.placed||!visibleTo(v,pc)) return; // #94 죽은 말·비가시 말은 대상이 아니다
  if(pc.revealed){ showToast(`이미 공개된 말: ${idLabel(v,pc)}`); return; } // 실제 정체가 우선 — 추측 불필요
  const cur=S.memos[v][pc.id]||null;
  /* #94 오래된 콜백 무효: 이 피커의 토큰이 오버레이 소유권을 잃었거나(다른 모달·close·새 게임) 대상이 공개·사망·비가시가 되면
     저장·삭제·닫기 콜백은 메모 세트를 바꾸지 않는다. 소유권을 잃은 경우에는 close()·render()도 하지 않는다 — 새 모달(전투·상대 선택 대기)을 가리지 않는다. */
  const tk={game:S,piece:pc.id,viewer:v,seq:++MEMO_UI.seq};
  const live=()=>MEMO_UI.token===tk&&S===tk.game;
  const commit=key=>{ if(!live()) return; MEMO_UI.token=null;
    const cur2=S.pieces.find(x=>x.id===pc.id);
    if(S.phase==="play"&&memoTargetOk(v,cur2)) memoSet(v,pc.id,key); else showToast("대상 말의 상태가 바뀌어 추측을 적용하지 않았습니다.");
    close(); render(); };
  const dismiss=()=>{ if(!live()) return; MEMO_UI.token=null; close(); };
  netLocalModal(); // 메모 피커는 로컬 전용 모달
  modal(`<h2>📝 정체 추측 — ? (${pc.r}행 ${pc.c}열)</h2>
    <small>이 물음표 말이 무엇일지 골라 두세요. 나만 보이는 메모이며 상대·AI에게는 보이지 않아요.</small>
    <div class="memo-grid" id="memoOpts" role="group" aria-label="정체 추측 선택"></div>`,
    [["추측 삭제",()=>commit(null)],["닫기",dismiss]]);
  MEMO_UI.token=tk; // modal()이 토큰을 비운 뒤에 이 피커가 오버레이를 소유한다
  const grid=$("memoOpts"); MEMO_UI.btns=[]; MEMO_UI.piece=pc.id;
  for(const o of MEMO_OPTS){
    const b=document.createElement("button"); b.className="memo-opt"; b.innerHTML=`<span class="ico" aria-hidden="true">${o.emoji}</span><span>${o.ko}</span>`;
    b.setAttribute("type","button"); b.setAttribute("aria-label",`${o.ko} ${o.emoji} 추측`); b.setAttribute("aria-pressed",o.key===cur?"true":"false"); b.dataset.key=o.key;
    b.onclick=()=>commit(o.key);
    grid.appendChild(b); MEMO_UI.btns.push(b);
  }
  const del=$("obBtns").children[0]; if(del) del.disabled=!cur;
  const focusTo=MEMO_UI.btns.find(b=>b.dataset.key===cur)||MEMO_UI.btns[0]; try{ if(focusTo) focusTo.focus(); }catch(e){}
}
function handoff(title,after){
  if(NET.mode){after();return;} // 온라인: 기기 넘김 불필요 — 즉시 진행
  clearToasts();

    [["확인 — 시작",()=>{close();after();}]]);
}

/* ===== #26·#32·#42 첫 플레이어용 ELI5 튜토리얼 — 게임 상태 S와 완전 분리 (TUT) · 영구 저장은 localStorage 키 tutorialSeen 하나뿐 ·

   SVG <text>에는 이모지·기호만 넣고(한글·숫자 금지) 모든 문장은 DOM으로 렌더링해 자연 줄바꿈된다. DOM·canvas·네트워크·외부 리소스 없음 */
const TSV={
  C:{own:"#2f3a5e",op:"#5e2f3a",forest:"#23422f",mid:"#2b3140",line:"#3d475e",txt:"#e8ecf5",dim:"#9aa3b8",acc:"#5b8cff",bad:"#ff5b6e",ok:"#4fd88a",gold:"#ffd84d"},
  esc:s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"),
  /* --- SVG 조각 (viewBox는 각 그림 크기, preserveAspectRatio meet로 카드 폭·높이에 맞춰 축소만 됨 → 잘림 없음) --- */
  svg(w,h,alt,body,cls){ return `<svg class="${cls||"tut-fig"}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${TSV.esc(alt)}" focusable="false">${body}</svg>`; },
  g(x,y,s,fs,col){ return `<text x="${x}" y="${y}" font-size="${fs||13}" fill="${col||TSV.C.txt}" text-anchor="middle" dominant-baseline="middle">${s}</text>`; }, // 이모지·기호 글리프 전용
  cell(x,y,k,s,o){ s=s||22; return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="3" fill="${TSV.C[k||"mid"]}" stroke="${o&&o.st||TSV.C.line}"${o&&o.sw?` stroke-width="${o.sw}"`:""}/>`; },
  grid(x,y,cols,rows,kf,s){ s=s||22; let o=""; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) o+=TSV.cell(x+c*s,y+r*s,kf?kf(r,c):"mid",s); return o; },
  tok(cx,cy,g,side,r){ r=r||9; const f=side==="op"||side==="opghost"?"#7a3644":side==="hid"?"#3a4152":"#3a4a80"; const st=side==="me"||side==="ghost"?"#dfe6ff":"#0008";
    const dash=/ghost/.test(side)?' stroke-dasharray="3 2" opacity=".55"':""; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="${st}" stroke-width="1.5"${dash}/>`+TSV.g(cx,cy+0.5,g,Math.max(10,Math.round(r*1.1))); },
  arrow(x1,y1,x2,y2,col,w,dash){ col=col||TSV.C.acc; w=w||2; const a=Math.atan2(y2-y1,x2-x1), h=6; const hx=x2-Math.cos(a)*h, hy=y2-Math.sin(a)*h;
    const p1=[hx+Math.sin(a)*4,hy-Math.cos(a)*4], p2=[hx-Math.sin(a)*4,hy+Math.cos(a)*4];
    return `<line x1="${x1}" y1="${y1}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${col}" stroke-width="${w}"${dash?' stroke-dasharray="4 3"':""}/><polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${col}"/>`; },
  x(cx,cy,r,col){ r=r||6; col=col||TSV.C.bad; return `<line x1="${cx-r}" y1="${cy-r}" x2="${cx+r}" y2="${cy+r}" stroke="${col}" stroke-width="2.5"/><line x1="${cx-r}" y1="${cy+r}" x2="${cx+r}" y2="${cy-r}" stroke="${col}" stroke-width="2.5"/>`; },
  hp(x,y,w,p,col){ return `<rect x="${x}" y="${y}" width="${w}" height="7" rx="3" fill="#333"/><rect x="${x}" y="${y}" width="${Math.round(w*p)}" height="7" rx="3" fill="${col||TSV.C.ok}"/>`; },
  /* --- DOM 조각 --- */
  dtok(g,side,sm){ return `<span class="tut-tok ${side}${sm?" sm":""}">${g}</span>`; },
  ico(g,side,alt,xed){ return TSV.svg(28,28,alt,TSV.tok(14,14,g,side,11)+(xed?TSV.x(14,14,8):""),"tut-ico"); }, // 엑스 표시가 필요한 토큰만 소형 SVG
  arr(col){ col=col||TSV.C.acc; return `<svg class="tut-arr" viewBox="0 0 24 12" aria-hidden="true" focusable="false">${TSV.arrow(1,6,23,6,col,2)}</svg>`; },
  lbl(s,cls){ return `<span class="tut-lbl${cls?" "+cls:""}">${s}</span>`; },

/* #42 단계별 카드 목록 — 카드 = {t:제목, vis:그림(HTML 조각), res:결과 한 줄(선택), tone:ok|bad(선택)}. 설명 문장은 TUT_STEPS.lines[k]가 k번 카드에 1:1로 붙는다 */
const TUT_SCENES={

function tutRender(){

function tutKeydown(e){ // 대화상자 내부 키보드: Esc=건너뛰기 · ←/→=이전/다음 · Tab=대화상자 안에서 순환 (게임 화면에는 키 핸들러가 없어 충돌 없음)
  if(!TUT.open||!e) return false;
  const k=e.key, stop=()=>{ if(e.preventDefault) e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); };
  if(k==="Escape"){ stop(); tutSkip(); return true; }
  if(k==="ArrowRight"){ stop(); if(TUT.step<TUT_STEPS.length-1) tutNext(); return true; }
  if(k==="ArrowLeft"){ stop(); tutPrev(); return true; }
  if(k==="Tab"){
    const f=TUT.btns.filter(b=>!b.disabled); if(!f.length) return false;
    stop();
    const cur=f.indexOf(document.activeElement);
    const nx=e.shiftKey?(cur<=0?f.length-1:cur-1):(cur<0||cur>=f.length-1?0:cur+1);
    tutFocus(f[nx]); return true;
  }
  return false;
}

const NET_ADDR_HINT="🌐 접속할 수 없는 주소입니다 — 이 데모는 localhost·127.0.0.1 이나 같은 내부망의 사설 IP 주소(예: 192.168.x.x:8080)로만 접속합니다. 도메인 이름·공인 주소는 지원하지 않습니다.";
/* #66 하위 프로토콜 협상 실패 안내 — 고정 문구 하나다. 선택된 값도, 접속 코드도, 마커도 담지 않는다.
   우리가 제시한 토큰은 [공개 마커, 접속 코드] 둘이므로, 마커가 아닌 값이 선택돼 돌아왔다면 그 값은

const NET_PROTO_FAIL="🌐 접속을 끊었습니다 — 서버와 하위 프로토콜 협상이 맞지 않습니다. 서버 버전을 확인한 뒤 다시 시도하세요 (접속 코드를 다시 묻습니다).";
/* 판정만 한다. 어떤 실패 경로에서도 입력값 자체를 되돌리거나 남기지 않는다 (토스트·상태 배지·로그·예외 메시지 포함). */
function netCodeValid(c){
  return typeof c==="string"&&c.length>=NET_CODE_MIN&&c.length<=NET_CODE_MAX
