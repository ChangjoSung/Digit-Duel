<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Dual — HTML 프로토타입 데모</title>
<style>
  :root{
    --bg:#12151c; --panel:#1c2130; --panel2:#242b3d; --line:#333c52;
    --txt:#e8ecf5; --dim:#8a93a8; --accent:#5b8cff; --danger:#ff5b6e; --ok:#4fd88a;
    --zoneA:#2a3350; --zoneB:#502a33; --forest:#1f3a2a; --mid:#2a2f3d;
    --fire:#ff7a4d; --water:#4da3ff; --grass:#5fd06b; --lightning:#ffd84d;
    --heal:#4fd88a; --guard:#4da3ff; --buff:#ffd84d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px;}
  #app{display:flex; gap:12px; padding:12px; max-width:1200px; margin:0 auto;}
  h1{font-size:16px; margin-bottom:6px;}
  h2{font-size:14px; margin:8px 0 4px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px;}
  #left{flex:0 0 auto; position:relative;}
  #toasts{position:absolute; top:44px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; z-index:40; pointer-events:none; width:max-content; max-width:92%;}
  .toast{background:#000d; border:1px solid var(--line); border-radius:8px; padding:6px 14px; font-size:12px; color:var(--txt); animation:toastFade 2.2s forwards;}
  @keyframes toastFade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0}}
  #right{flex:1; min-width:300px; display:flex; flex-direction:column; gap:10px;}
  #board{display:grid; grid-template-columns:repeat(7,52px); grid-auto-rows:52px; gap:2px; user-select:none;}
  .cell{position:relative; border:1px solid #2a3040; border-radius:4px; background:var(--mid);
    display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cell.zA{background:var(--zoneA);} .cell.zB{background:var(--zoneB);}
  .cell.forest{background:var(--forest);}
  .cell.hl-move{outline:2px solid var(--accent); outline-offset:-2px;}
  .cell.hl-attack{outline:2px solid var(--danger); outline-offset:-2px;}
  .cell.hl-sel{outline:2px solid #fff; outline-offset:-2px;}
  .cell .trace{position:absolute; top:1px; right:2px; font-size:11px;}
  /* #36 추측 이모지: 물음표 자리에 뷰어 전용 반투명 표시 — 실제 공개 말과 구별 (점선 테두리·opacity .5) */
  .pc.memo-guess{border-style:dashed; border-color:#fff8;}
  .pc.memo-guess .guess{font-size:20px; opacity:.5; line-height:1;}
  .memo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0;}
  .memo-opt{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:12px; min-height:56px;}
  .memo-opt .ico{font-size:22px; line-height:1;}
  .memo-opt[aria-pressed="true"]{background:var(--accent); border-color:#fff; box-shadow:0 0 0 1px #fff8; color:#fff;}
  .memo-opt:focus-visible{outline:2px solid #fff; outline-offset:1px;}
  .pc{width:42px; height:42px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; font-weight:bold; border:2px solid #0008; line-height:1.05; text-align:center;}
  .pc.own{box-shadow:0 0 0 2px #ffffff33;}
  .pc.p0{background:#33406e;} .pc.p1{background:#6e3340;}
  .pc.hiddenId{background:#3a4152;}
  .pc .el{font-size:9px; font-weight:normal;}
  .pc .nm{font-size:9px; max-width:40px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rosterCard{display:flex; flex-direction:column; gap:1px; padding:4px 6px; border:1px solid var(--line); border-radius:6px;
    cursor:pointer; font-size:10px; background:var(--panel2); color:var(--dim);}
  .rosterCard b{font-size:12px;}
  .rosterCard.on{border-color:#fff; box-shadow:0 0 0 1px #fff5;}
  .el-fire{color:var(--fire);} .el-water{color:var(--water);} .el-grass{color:var(--grass);} .el-lightning{color:var(--lightning);}
  .pc.immob{border-color:var(--danger);}
  .badge{display:inline-block; padding:1px 6px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); font-size:12px; margin:1px;}
  button{background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px;}
  button:hover{border-color:var(--accent);}
  button:disabled{opacity:.35; cursor:default;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.big{font-size:16px; padding:12px 20px;}
  button.danger{border-color:var(--danger); color:var(--danger);}
  #log{height:170px; overflow-y:auto; font-size:12px; line-height:1.5; color:var(--dim);}
  #log .imp{color:var(--txt);}
  #log .sys{color:var(--accent);}
  #log .ai{color:#c9a25b;}
  .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0;}
  .overlay{position:fixed; inset:0; background:#000c; display:flex; align-items:center; justify-content:center; z-index:50;}
  .overlay .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; max-width:560px; width:92%;
    max-height:92vh; overflow-y:auto;}
  .hidden{display:none !important;}
  .fighter{display:flex; gap:10px; align-items:center; background:var(--panel2); border-radius:8px; padding:8px; margin:4px 0; position:relative;}
  .hpbar{height:10px; background:#333; border-radius:5px; overflow:hidden; width:180px;}
  .hpbar>div{height:100%; background:var(--ok); transition:width .3s;}
  .dmgfloat{position:absolute; right:14px; top:2px; font-weight:bold; font-size:15px; pointer-events:none; animation:floatUp 1s ease-out forwards; text-shadow:0 1px 2px #000;}
  .dmgfloat .neg{color:var(--danger);}
  .dmgfloat .pos{color:var(--ok);}
  .dmgfloat .abs{color:var(--water); font-size:12px;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
  .dmgbar{height:6px; background:#333; border-radius:3px; overflow:hidden; width:180px; margin-top:2px;}
  .dmgbar>div{height:100%; background:var(--danger);}
  .status{font-size:11px; color:var(--dim);}
  #battleLog{height:120px; overflow-y:auto; font-size:12px; background:#0006; border-radius:6px; padding:6px; margin:6px 0; line-height:1.5;}
  /* 전투 스테이지 (포켓몬식 개편 — #6) */
  #bstage{position:relative; height:180px; border-radius:8px; margin:6px 0; overflow:hidden;
    background:linear-gradient(160deg,#1a2030,#242b3d); transition:box-shadow .3s;}
  .btok{position:absolute; width:88px; height:88px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-size:26px; border:3px solid #0006; box-shadow:0 4px 14px #0008; transition:opacity .6s;}
  .btok small{font-size:12px; color:#fffd; font-weight:bold;}
  .btok.tok-me{bottom:14px; left:30px;} .btok.tok-op{top:14px; right:30px;}
  .btok.shake{animation:bshake .5s;}
  @keyframes bshake{0%,100%{margin-left:0}20%{margin-left:-8px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:3px}}
  .btok.ko{opacity:0;}
  #bstage.sigblink{animation:sigblink .7s;}
  @keyframes sigblink{0%,100%{box-shadow:none}25%{box-shadow:inset 0 0 0 4px #fff8, inset 0 0 60px #ffd84d55}55%{box-shadow:inset 0 0 0 2px #fff5}}
  .btok .dmgfloat{left:50%; top:-18px; right:auto; margin-left:-18px;}
  #msgBox{min-height:46px; background:#000a; border:1px solid var(--line); border-radius:6px; padding:8px 10px;
    font-size:14px; line-height:1.6; margin:6px 0;}
  .tray{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
  .trayItem{display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px; border:1px solid var(--line); border-radius:6px; cursor:pointer;}
  .trayItem.sel{border-color:#fff;}
  small{color:var(--dim);}
  a.simlink{color:var(--dim); font-size:11px; text-decoration:underline; cursor:pointer;}
  /* ===== #26 튜토리얼 모달·상황 도움말 (게임 모달 #overlay z50 위 z60 · 도움말은 z45로 게임 모달 아래) ===== */
  .tutBtn{width:26px; height:26px; padding:0; border-radius:50%; font-size:14px; font-weight:bold; margin-left:6px; vertical-align:middle; line-height:1;}
  #tutOverlay{position:fixed; inset:0; background:#000d; display:flex; align-items:center; justify-content:center; z-index:60; padding:12px;}
  #tutBox{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 16px 14px; width:100%; max-width:420px;
    max-height:92vh; max-height:92dvh; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:8px; outline:none;
    /* #42 카드 레이아웃 간격·크기는 이 변수들로만 관리 (절대좌표 없음). 폭·높이가 모자라면 auto-fit 열 수가 줄고 박스 내부 세로 스크롤로 reflow */
    --tut-gap:8px; --tut-card-pad:10px; --tut-card-min:220px; --tut-vis-h:80px; --tut-fs:14px; --tut-lh:1.55; --tut-h3:14px;}
  #tutBox:focus-visible{box-shadow:0 0 0 2px var(--accent);}
  .tut-head{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--dim);}
  #tutTitle{font-size:19px; text-align:center; margin:0; line-height:1.3;}
  #tutBox>*{flex-shrink:0;} /* 내용이 max-height를 넘으면 카드를 찌그러뜨리지 않고 박스 내부 스크롤 */
  /* ===== #42 장면 = 단계별 (1)~(n) 독립 카드 격자. 카드 = 번호 배지 · 제목 · 그림(공간 도형만 소형 SVG/DOM) · 결과 · 설명(DOM 자연 줄바꿈) ===== */
  .tut-scene{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--tut-card-min)),1fr)); gap:var(--tut-gap); align-items:stretch; min-width:0;}
  .tut-banner{grid-column:1/-1; justify-self:center; background:var(--zoneB); border:1px solid var(--line); border-radius:999px; padding:4px 14px; font-size:13px; font-weight:bold; text-align:center; overflow-wrap:anywhere;}
  .tut-card{display:flex; flex-direction:column; gap:6px; min-width:0; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:var(--tut-card-pad);}
  .tut-card-h{display:flex; align-items:center; gap:8px; min-width:0;}
  .tut-card-h h3{font-size:var(--tut-h3); line-height:1.3; margin:0; min-width:0; overflow-wrap:anywhere;}
  .tut-sn{flex:0 0 22px; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; font-weight:bold; line-height:1; display:grid; place-items:center;}
  .tut-vis{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:var(--tut-vis-h); min-width:0;}
  .tut-vis svg{display:block; font-family:inherit;}
  .tut-vis svg.tut-fig{width:100%; height:var(--tut-vis-h);}
  .tut-vis svg.tut-ico{height:28px; width:auto; flex:0 0 auto;} .tut-vis svg.tut-ico.lg{height:46px;}
  .tut-arr{width:22px; height:12px; flex:0 0 auto;}
  .tut-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; min-width:0; font-size:12.5px;}
  .tut-stack{display:flex; flex-direction:column; align-items:stretch; gap:5px; min-width:0; width:100%;}
  .tut-stack .tut-row{justify-content:flex-start;}
  .tut-tok{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-size:14px; line-height:1; border:1.5px solid #0008; background:#3a4a80; flex:0 0 auto;}
  .tut-tok.me{border-color:#dfe6ff;} .tut-tok.op{background:#7a3644;} .tut-tok.hid{background:#3a4152;}
  .tut-tok.sm{width:22px; height:22px; font-size:12px;}
  .tut-lbl{color:var(--dim);} .tut-lbl.ok{color:var(--ok);} .tut-lbl.bad{color:var(--danger);} .tut-lbl.gold{color:var(--lightning);} .tut-lbl.txt{color:var(--txt);}
  .tut-big{font-size:20px; line-height:1;}
  .tut-pill{display:inline-block; padding:3px 10px; border-radius:999px; background:var(--mid); border:1px solid var(--line); font-size:12px; line-height:1.3; text-align:center; overflow-wrap:anywhere;}
  .tut-pill.acc{background:var(--accent); border-color:transparent; color:#fff;} .tut-pill.op{background:var(--zoneB);} .tut-pill.own{background:var(--zoneA); border-color:var(--accent);}
  .tut-hp{width:52px; height:7px; border-radius:4px; background:#333; overflow:hidden; flex:0 0 auto;} .tut-hp i{display:block; height:100%; background:var(--ok);} .tut-hp.bad i{background:var(--danger);} .tut-hp.gold i{background:var(--lightning);}
  .tut-sep{width:1px; align-self:stretch; background:var(--line); flex:0 0 auto;}
  .tut-strike{text-decoration:line-through; text-decoration-color:var(--danger); text-decoration-thickness:2px;}
  .tut-plist{display:grid; grid-template-columns:auto 1fr; gap:3px 8px; align-items:center; font-size:12px; width:100%; min-width:0;}
  .tut-toks{display:flex; flex-wrap:wrap; gap:2px;}
  .tut-gifts{display:grid; grid-template-columns:repeat(auto-fit,minmax(50px,1fr)); gap:4px; width:100%; text-align:center; font-size:11.5px; color:var(--dim);}
  .tut-gifts span{display:block;} .tut-gifts .tut-big{margin-bottom:2px;}
  .tut-flow{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;}
  .tut-flow-box{border:1px solid var(--line); border-radius:6px; background:var(--mid); padding:5px 8px; font-size:12px; font-weight:bold; text-align:center; overflow-wrap:anywhere;}
  .tut-flow-box small{display:block; color:var(--dim); font-size:10.5px; font-weight:normal;}
  .tut-flow-box.acc{background:var(--accent); border-color:transparent; color:#fff;}
  .tut-legend{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--dim);}
  .tut-sw{display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid var(--line); vertical-align:-2px; margin-right:4px;}
  .tut-sw.op{background:#5e2f3a;} .tut-sw.forest{background:#23422f;}
  .tut-res{font-size:12.5px; line-height:1.4; color:var(--dim); text-align:center; margin:0; overflow-wrap:anywhere;}
  .tut-res.ok{color:var(--ok);} .tut-res.bad{color:var(--danger);}
  .tut-txt{font-size:var(--tut-fs); line-height:var(--tut-lh); margin:0; overflow-wrap:anywhere; border-top:1px solid var(--line); padding-top:6px; margin-top:auto;}
  .tut-txt b{color:#fff;}
  .tut-dots{display:flex; justify-content:center; gap:6px; margin:2px 0;}
  .tut-dots span{width:8px; height:8px; border-radius:50%; background:var(--line); display:inline-block;}
  .tut-dots span.on{background:var(--accent);}
  .tut-nav{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 0;}
  .tut-nav button{min-height:42px; flex:1 1 26%; font-size:14px;} /* #42 26+36+26% + gap → 세 버튼이 한 줄 */
  .tut-nav button.primary{flex:2 1 36%;}
  .tut-nav button:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  #tutHint{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:45; width:min(94vw,440px);
    background:#0b0e14f2; border:1px solid var(--accent); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5;
    display:flex; gap:8px; align-items:flex-start; box-shadow:0 6px 24px #000a;}
  #tutHint .tut-hint-icon{font-size:22px; line-height:1;}
  #tutHint .tut-hint-text{flex:1;}
  #tutHint .tut-hint-ok{padding:4px 8px; font-size:12px; white-space:nowrap;}
  @media (max-width:480px){
    #tutOverlay{padding:8px; align-items:flex-end;}
    #tutBox{padding:14px 12px 12px; max-height:calc(100vh - 16px); max-height:calc(100dvh - 16px); border-radius:12px 12px 8px 8px; --tut-card-pad:8px; --tut-vis-h:72px;}
    #tutTitle{font-size:17px;}
  }
  /* ===== #42 PC 가독성 우선: 팝업 폭 확대(1080px) → 카드 최소 210px로 3~4열. 폭·높이가 모자라면 2열/1열 + 박스 내부 세로 스크롤
     (600px부터 적용: 1280×720 200% 줌 = CSS 640px에서도 2열로 reflow) ===== */
  @media (min-width:600px){
    #tutOverlay{padding:24px;}
    #tutBox{max-width:1080px; padding:22px 28px 20px; gap:10px; --tut-gap:10px; --tut-card-pad:12px; --tut-card-min:210px; --tut-vis-h:88px; --tut-fs:14.5px; --tut-lh:1.6; --tut-h3:15px;}
    .tut-dots{gap:8px; margin:4px 0;}
    .tut-nav{gap:12px; margin:6px 0 0;}
  }
  @media (min-width:1400px) and (min-height:960px){ /* 큰 PC 화면(예: 1920×1080·2048×1054): 한 단계 더 여유 — 1440×900 같은 낮은 화면은 위 단계 유지 */
    #tutBox{max-width:1200px; padding:30px 36px 26px; gap:14px; --tut-gap:12px; --tut-card-pad:14px; --tut-card-min:230px; --tut-vis-h:100px; --tut-fs:15.5px; --tut-lh:1.7; --tut-h3:16px;}
    #tutTitle{font-size:22px;}
    .tut-nav{gap:14px; margin:8px 0 0;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="left" class="panel">
    <h1>Digit Dual <small id="phaseLabel"></small> <button id="tutBtn" class="tutBtn" type="button" aria-label="튜토리얼 다시 보기" title="튜토리얼 다시 보기" onclick="tutOpen()">?</button></h1>
    <div id="toasts"></div>
    <div id="board"></div>
    <div class="row" id="turnBar"></div>
  </div>
  <div id="right">
    <div class="panel" id="sidePanel"></div>
    <div class="panel"><h2>로그</h2><div id="log"></div></div>
    <div class="panel"><h2>지표 (GDD-12 연동 스캐폴드)</h2><div id="metrics" style="font-size:12px;color:var(--dim)"></div></div>
    <div class="panel" style="font-size:11px;color:var(--dim)">
      기준: GDD-13 v0.7 확정 규칙 · 수치는 [DATA] 전투 수치 v0.1 제안값(승인 전 임시) ·
      AI: 공정 관측(플레이어와 동일한 정보 제한, 이동 이력 기반 논리 추론만 사용) ·
      기술 4슬롯 체계: GDD-16 v1.0 (S1~S3 A안) ·
      간소화: PVP 대리 출전 순차 블라인드, 후퇴-탐색 금지·제한 시간 미구현, 마지막 목격 칸 미표시(A/B는 v0.3.0)
    </div>
  </div>
</div>
<div id="overlay" class="overlay hidden"><div class="box" id="overlayBox"></div></div>
<!-- #26 상황 도움말(비모달, 1회) · 튜토리얼 모달(게임 내부, 외부 창·서버 없음) -->
<div id="tutHint" class="hidden" role="status" aria-live="polite"></div>
<div id="tutOverlay" class="hidden" aria-hidden="true"><div id="tutBox" role="dialog" aria-modal="true" aria-labelledby="tutTitle" aria-describedby="tutBody" tabindex="-1"></div></div>

<script>
"use strict";
/* ===== 상수 — [DATA] 전투 수치 v0.1 제안값 (승인 전 임시) ===== */
const COLS=7, ROWS=13;
const BAL={
  minion:{hp:100,atk:22,skill:35,cd:2},
  ally:{hp:100,atk:16}, king:{hp:100,atk:16},
  captured:{hp:100,atk:20,skill:30,cd:2},
  advMult:1.3, disMult:0.75,
  burnPct:0.05, burnRounds:2, weakenPct:0.2, weakenHits:2,
  shieldPct:0.15, healPct:0.10, absorbCapPct:0.30,

const isAI=p=>(S.mode==="pve"&&p===1)||S.mode==="sim";
const humanViewer=()=> NET.mode ? NET.me : (S.mode==="pvp" ? (S.phase==="setup"?S.setupPlayer:S.current) : 0); // 온라인: 항상 내 시점 고정
const alivePieces=()=>S.pieces.filter(p=>p.alive&&p.placed);
const at=(r,c)=>alivePieces().find(p=>p.r===r&&p.c===c);
const inForest=p=>(p.r>=4&&p.r<=5)||(p.r>=9&&p.r<=10);
const zoneOf=p=> p===0 ? [11,12,13] : [1,2,3];
const adj=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
/* 버닝 타임 (GDD-13 4.11): 표시 턴 65부터 직선 2칸 이동 강화 (폭탄 포함·함정 제외) */
const isBurning=()=>S.turnCount+1>=BAL.burnStart;
/* 원정 구역 = 자기 기준 상대 측 숲+상대 진영 (BT 2칸 이동 불가 구역) */
const expedZone=(owner,r)=> owner===0 ? r<=5 : r>=9;
function adjEnemies(p){return alivePieces().filter(e=>e.owner!==p.owner&&adj(p,e));}
function visibleTo(viewer,e){
  if(e.owner===viewer) return true;
  if(!inForest(e)) return true;
  if(S.tempReveal.has(e.id)) return true;
  return alivePieces().some(m=>m.owner===viewer&&adj(m,e));
}
function idLabel(viewer,p){
  if(p.owner===viewer||p.revealed||viewer===2) return (p.type==="minion"&&p.name?p.name:TYPE_KO[p.type])+(p.element?"·"+ELEM_KO[p.element]:"");
  return "?";
}
function addLog(msg,cls){S.log.push({msg,cls:cls||""}); renderLog();}
function showToast(msg,kind){
  try{
    const box=$("toasts"); if(!box||!box.appendChild) return;
    while(box.children&&box.children.length>=3) box.removeChild(box.firstChild);
    const t=document.createElement("div"); t.className="toast"+(kind?" "+kind:""); t.textContent=msg;
    box.appendChild(t);
    setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},2300);
  }catch(e){}
}
function clearToasts(){try{const box=$("toasts"); if(box) box.innerHTML="";}catch(e){}}
function pct(n){return Math.round(n*100)+"%";}

/* ===== 렌더 ===== */
const $=id=>document.getElementById(id);
function render(){
  $("phaseLabel").textContent = S.phase==="menu" ? ""
    : S.phase==="setup" ? `— 배치: ${pname(S.setupPlayer)}`
    : S.phase==="play" ? `— ${pname(S.current)} 턴 ${S.turnCount+1}${isBurning()?" 🔥BT":""}` : S.phase==="over"?"— 종료":"";
  renderBoard(); renderSide(); renderTurnBar(); renderMetrics();
}
function renderBoard(){
  const bd=$("board"); bd.innerHTML="";
  const viewer = S.phase==="menu"?0 : (S.mode==="sim"||S.phase==="over")?2 : humanViewer(); // #11 종료 리빌: over 시 전체 공개 시점
  for(let r=1;r<=ROWS;r++) for(let c=1;c<=COLS;c++){
    const cell=document.createElement("div");
    cell.className="cell"+(r<=3?" zA":r<=5?" forest":r<=8?"":r<=10?" forest":" zB");
    cell.dataset.r=r; cell.dataset.c=c;
    if(S.phase!=="menu"){
      const ev=S.events.find(e=>e.r===r&&e.c===c&&!e.consumed);
      if(ev&&viewer!==2&&S.traces[viewer]&&S.traces[viewer].has(ev.r+"_"+ev.c)){const t=document.createElement("span");t.className="trace";t.textContent="🔍";cell.appendChild(t);}
      const p=at(r,c);
      if(p&&(viewer===2||visibleTo(viewer,p))){
        const chip=document.createElement("div");
        const known = viewer===2||p.owner===viewer||p.revealed;
        chip.className="pc p"+p.owner+(p.owner===viewer?" own":"")+(known?"":" hiddenId")+(p.immobile>0?" immob":"");
        const g=!known&&S.phase==="play"&&viewer!==2?memoOpt(S.memos[viewer][p.id]):null; // #36 뷰어 전용 추측 — 실제 공개(known)면 실제 렌더 우선
        chip.innerHTML = known
          ? `<span${p.type==="minion"&&p.name?' class="nm"':""}>${p.type==="minion"&&p.name?p.name:TYPE_KO[p.type]}</span>`+(p.element?`<span class="el el-${p.element}">${ELEM_KO[p.element]}</span>`:"")
            +((p.owner===viewer||viewer===2||p.revealed)&&(p.type==="minion"||p.type==="ally"||p.type==="king")?`<span class="el">${p.hp}</span>`:"")
          : g ? `<span class="guess" aria-hidden="true">${g.emoji}</span>` : "?";
        if(g){ chip.className+=" memo-guess"; chip.setAttribute("title",`추측: ${g.ko} (내 메모 · 정체 미공개)`); chip.setAttribute("aria-label",`정체 미공개 상대 말 — 내 추측: ${g.ko}`); }
        cell.appendChild(chip);
      }
      if(S.selected&&!isAI(S.current)&&(!NET.mode||netActor()===NET.me)){ // 온라인: 상대 선택 하이라이트 비노출 (숨은 말 위치 누출 방지)
        const s=S.selected;
        if(S.phase==="setup"&&s.tray&&zoneOf(S.setupPlayer).includes(r)&&!at(r,c)) cell.classList.add("hl-move");
        if(S.phase==="play"&&!s.tray){
          if(s.id&&p&&p.id===s.id) cell.classList.add("hl-sel");
          if(canMoveTo(s,r,c)) cell.classList.add("hl-move");
          if(p&&p.owner!==s.owner&&adj(s,p)&&visibleTo(viewer===2?0:viewer,p)&&canBattle(s,p)) cell.classList.add("hl-attack");
        }
      }
      if(S.phase==="play"&&!isAI(S.current)&&(!NET.mode||S.current===NET.me)){ // 온라인: 상대 턴 강제 대상·텔레포트 하이라이트 비노출
        if(S.forcedTargets&&S.forcedTargets.length&&p&&S.forcedTargets.includes(p.id)) cell.classList.add("hl-attack"); // T1 강제 대상
        if(S.teleport){ // #14 스왑형: 자기 말 2개 선택 하이라이트
          if(S.teleport.stage===1){ if(p&&p.owner===S.current&&p.immobile===0) cell.classList.add("hl-move"); }
          else { if(p&&p.owner===S.current&&p.immobile===0&&p.id!==S.teleport.piece.id) cell.classList.add("hl-move");
            if(p&&S.teleport.piece&&p.id===S.teleport.piece.id) cell.classList.add("hl-sel"); }
        }
      }
    }
    cell.onclick=()=>onCell(r,c);
    bd.appendChild(cell);
  }
}
function canMoveTo(p,r,c){
  if(S.phase!=="play"||S.mainUsed||p.owner!==S.current) return false;
  if(p.type==="trap") return false; // 함정은 상시 고정 (GDD-13 4.5 개정 — 폭탄만 이동 상시화)
  if(p.immobile>0) return false;
  const d=Math.abs(p.r-r)+Math.abs(p.c-c);
  if(d!==1){
    // BT 이동 강화: 직선 2칸 (폭탄 포함·함정 제외, 출발·경유·도착이 원정 구역이면 불가)
    if(d!==2||(p.r!==r&&p.c!==c)||!isBurning()) return false;
    if(expedZone(p.owner,p.r)||expedZone(p.owner,(p.r+r)/2)||expedZone(p.owner,r)) return false;
    const m=at((p.r+r)/2,(p.c+c)/2);
    if(m&&visibleTo(p.owner,m)) return false; // 경유 칸의 보이는 말 차단 (숨은 적 충돌은 doMove가 해석)
  }
  const o=at(r,c);
  if(o&&o.owner===p.owner) return false;
  if(o&&visibleTo(p.owner,o)) return false;
  return true;
}
function canBattle(att,def){
  if(S.phase!=="play"||att.owner!==S.current||S.battlesUsed>=2) return false;
  if(att.type==="bomb"||att.type==="trap") return false;
  if(att.type==="king"&&def.type==="king"){return false;} // 왕 vs 왕 불가침
  if(S.forcedTargets&&S.forcedTargets.length&&(att!==S.movedPiece||!S.forcedTargets.includes(def.id))) return false; // T1: 강제 대상 외 전투 봉쇄
  if(S.battlesUsed===1){
    // #14: 텔레포트 스왑 둘째 말의 승계 강제 전투는 연쇄(첫 전투 승리) 조건 면제
    const forcedOk=S.forcedTargets&&S.forcedTargets.length&&att===S.movedPiece&&S.forcedTargets.includes(def.id);
    if(!forcedOk){
      if(!S.firstBattleWonByMover||!att.alive||att!==S.movedPiece) return false;
      if(!S.contactSet.includes(def.id)) return false;
    }
  }
  return true;
}
function renderTurnBar(){
  const tb=$("turnBar"); tb.innerHTML="";
  if(S.phase!=="play") return;
  const aiTurn=isAI(S.current)||(NET.mode&&S.current!==NET.me); // 온라인: 상대 턴이면 조작 불가
  const mk=(txt,fn,dis,cls)=>{const b=document.createElement("button");b.textContent=txt;b.onclick=fn;b.disabled=!!dis||aiTurn;if(cls)b.className=cls;tb.appendChild(b);};
  mk("주 행동 생략",()=>netAction({t:"skipMain"}),S.mainUsed);
  const sel=S.selected&&!S.selected.tray?S.selected:null;
  const ev=sel?S.events.find(e=>e.r===sel.r&&e.c===sel.c&&!e.consumed&&S.traces[S.current].has(e.r+"_"+e.c)):null;
  mk("탐색",()=>netAction({t:"search"}),!(sel&&ev&&!S.mainUsed&&sel.owner===S.current&&canSearchPiece(sel))); // #20: 폭탄·함정은 탐색 실행 불가
  const teleDis=S.mainUsed||!teleportAvailable(S.current)||S.teleUsed[S.current]>=BAL.teleMax;
  mk(S.teleport?"텔레포트 취소":`텔레포트 ${BAL.teleMax-S.teleUsed[S.current]}회`,()=>netAction({t:"tele"}),teleDis); // #14 스왑형·2회 제한
  if(!teleDis&&!aiTurn&&S.mode!=="sim") tutHint("teleport"); // #26 사람 턴에 텔레포트가 처음 가능해질 때 1회 도움말 (게임 상태 무변경)
  const forced=S.forcedTargets&&S.forcedTargets.length>0;
  mk("턴 종료",()=>netAction({t:"endTurn"}),forced,"primary");
  mk("기권",confirmResign,false,"danger");
  if(forced){const s=document.createElement("span");s.className="badge";s.textContent="⚔️ 강제 전투 대상 선택";tb.appendChild(s);}
  if(aiTurn){const s=document.createElement("span");s.className="badge";s.textContent=(NET.mode&&!isAI(S.current))?"🌐 상대 턴 진행 중…":"🤖 AI 행동 중…";tb.appendChild(s);}
}

    return;

  let h=`<h2>${pname(p)}</h2>
  <div class="row"><span class="badge">몬스터볼 ${S.balls[p]}</span>

  if(S.selected&&!S.selected.tray&&!isAI(S.current)&&(!NET.mode||S.current===NET.me)){ // 온라인: 상대가 선택한 말 정보(HP 등) 비노출
    const s=S.selected;
    h+=`<h2>선택: ${idLabel(p,s)}</h2><div class="status">HP ${s.hp}/${s.maxHp}${s.immobile>0?` · 이동 불가 ${s.immobile}턴`:""}${s.cap?` · 포획 하수인(${ELEM_KO[s.cap.element]}) HP ${s.cap.hp}/${s.cap.maxHp}`:""}${s.nextBattleBuff?` · ✨다음 전투 공격+${pct(BAL.nextBuffPct)}`:""}</div>

  } else if(!isAI(S.current)) h+=`<small>자기 말을 클릭해 선택하세요.</small>`;
  if(S.teleport&&!isAI(S.current)&&(!NET.mode||S.current===NET.me)) h+=`<h2>🌀 텔레포트 스왑</h2><small>${S.teleport.stage===1?"교환할 첫 번째 자기 말을 클릭하세요 (이동 불가 말 제외).":"교환할 두 번째 자기 말을 클릭하세요. (첫 말 재클릭 시 선택 취소)"}</small>`;

    }).filter(Boolean).join("");
    if(mm) h+=`<h2>📝 추측 메모</h2>${mm}<small>물음표 말 클릭으로 변경·삭제</small>`;

function renderSetup(sp){
  const p=S.setupPlayer;
  if(NET.mode&&p!==NET.me){ // 온라인: 상대 배치 화면(로스터·배치 상황) 비노출
    sp.innerHTML=`<h2>🌐 상대 배치 중…</h2><small>상대가 로스터 선택과 비공개 배치를 진행하고 있습니다. 완료되면 자동으로 진행됩니다.</small>`;
    return;
  }
  const sel=S.roster[p], rosterDone=sel.length===6;
  const unplaced=S.pieces.filter(x=>x.owner===p&&!x.placed);
  let h=`<h2>${pname(p)} 로스터 선택 (${sel.length}/6)</h2>
  <small>20종 중 6종을 중복 없이 선택 (카드 클릭 → 정보 팝업에서 선택). 속성은 종에 고정.</small>`;
  for(const el of ELEMS){
    h+=`<div class="row">`;
    for(const rd of ROSTER.filter(r=>r.element===el))
      h+=`<div class="rosterCard ${sel.includes(rd.id)?"on":""}" onclick="rosterInfo('${rd.id}')">
        <b class="el-${rd.element}">${rd.name}</b>
        <small>${ELEM_KO[rd.element]}·${ARCH_KO[rd.arch]} · HP${rd.hp} 공${rd.atk} · ${archSkills(rd.arch,rd.element).map(s=>SKILLS[s].ko).join("·")}</small></div>`;
    h+=`</div>`;
  }
  h+=`<h2>비공개 배치 (${14-unplaced.length}/14)</h2>
  <small>말을 클릭 → 자기 진영 칸 클릭. 배치된 말 클릭 시 회수.${rosterDone?"":" <b>하수인은 로스터 6종 선택 후 활성됩니다.</b>"}</small>
  <div class="tray">`;
  for(const x of unplaced){
    if(x.type==="minion"&&!rosterDone) continue;
    h+=`<div class="trayItem ${S.selected&&S.selected.id===x.id?"sel":""}" onclick="selTray(${x.id})">
      <div class="pc p${p}"><span${x.name?' class="nm"':""}>${x.type==="minion"&&x.name?x.name:TYPE_KO[x.type]}</span>${x.element?`<span class="el el-${x.element}">${ELEM_KO[x.element]}</span>`:""}</div>
    </div>`;
  }
  h+=`</div><div class="row">
    <button onclick="autoPlace()">무작위 배치</button>
    <button onclick="clearPlace()">전체 회수</button>
    <button class="primary" onclick="setupDone()" ${unplaced.length||!rosterDone?"disabled":""}>배치 완료</button></div>`;
  sp.innerHTML=h;
}

  const el=$("log");
  el.innerHTML=S.log.slice(-60).map(l=>`<div class="${l.cls}">${l.msg}</div>`).join("");
  el.scrollTop=el.scrollHeight;
}
function renderMetrics(){
  if(S.phase==="menu"){$("metrics").textContent="모드를 선택하면 지표 수집을 시작합니다.";return;}
  const m=S.metrics;
  const total=`[${S.mode.toUpperCase()}] 턴 ${S.turnCount} · 선공 ${m.firstPlayer===null?"-":pname(m.firstPlayer)} · 전투 ${m.battles} (판정 ${m.judged}·동률 ${m.ties}) · 공격측 승 ${m.attackerWins}/방어측 승 ${m.defenderWins} · 밀어내기 ${m.pushes} · 강제 전투 ${m.forcedBattles} · 텔레포트 ${m.teleports} · 상태 부여 ${m.statusApplied}/실패 ${m.statusFailed} · 적진 진입 ${m.minionInvades} · 탐색 ${m.searches} · 하수인 탐색 ${m.minionSearches} · 중립 포획 ${m.captures}(실패 ${m.captureFails}) · 적 포획 시도 ${m.enemyCapTries}/성공 ${m.enemyCaptures}/실패 ${m.enemyCapFails} · 도망 ${m.fleeOks}/${m.fleeTries} · 폭탄 이동 ${m.bombMoves} · 함정 발동 ${m.trapTriggers} · 폭탄: 하수인 소모 ${m.bombHitsMinion}/VIP 제거 ${m.bombClearedByVip} · 왕 숲 체류 ${m.kingForestTurns}턴 · 전투 회피 ${m.battleRefusals} · ${m.btReached?`🔥BT 진입 턴 ${m.btEnterTurn}`:"BT 미도달"}${S.phase==="over"?` · 종료 턴 ${m.endTurn}${m.winType?` · 승리 유형 ${WINTYPE_KO[m.winType]}`:""} · 승자 ${S.winner===null?"없음(무승부)":pname(S.winner)}`:""}`;
  // #20 플레이어별 핵심 행동 (합산과 이중 집계 정합: 각 키의 [0]+[1] = 합산)
  const per=[0,1].map(p=>`<div style="margin-top:3px"><b>${pname(p)}</b>${p===m.firstPlayer?" (선공)":""}${S.phase==="over"&&S.winner===p?" 🏆승자":""}: `+
    PLAYER_METRIC_KEYS.map(k=>`${PLAYER_METRIC_KO[k]} ${m.byPlayer[p][k]||0}`).join(" · ")+`</div>`).join("");
  $("metrics").innerHTML=total+per;
}
/* #20 지표 저장용 스냅샷 (합산 + 플레이어별 + 승자·선공·승리 유형) — 헤드리스·리포트 공용 */
function metricsSnapshot(){
  const m=S.metrics;
  return {mode:S.mode,aiLevel:S.aiLevel.slice(),turn:S.turnCount,phase:S.phase,firstPlayer:m.firstPlayer,winner:S.winner,winType:m.winType,endTurn:m.endTurn,
    total:Object.fromEntries(Object.keys(m).filter(k=>k!=="byPlayer").map(k=>[k,m[k]])),
    byPlayer:[Object.assign({},m.byPlayer[0]),Object.assign({},m.byPlayer[1])]};
}
window.metricsSnapshot=metricsSnapshot;

/* ===== 모드 시작 ===== */
window.startMode=(mode,opts)=>{

function beginPlay(){

/* ===== 배치 ===== */
window.selTrayCore=id=>{S.selected={tray:true,id}; render();};
window.toggleRosterCore=rid=>{ // 로스터 선택 토글 — 중복 불가·최대 6종, 변경 시 하수인 회수 후 스탯 재주입
  const p=S.setupPlayer, sel=S.roster[p], i=sel.indexOf(rid);

  else if(sel.length<6) sel.push(rid);

  for(const x of S.pieces.filter(x=>x.owner===p&&x.type==="minion")) x.placed=false;
  applyRoster(p); S.selected=null; render();
};
window.rosterInfo=rid=>{ // 로스터 정보 팝업 — [선택하기]/[선택 해제]는 toggleRoster와 동일 동작 (6/6·중복 불가 유지)
  const rd=ROSTER.find(r=>r.id===rid); if(!rd) return;

  }).join("");
  netLocalModal(); // 로스터 정보 팝업은 로컬 전용 — 선택 확정(toggleRoster)만 동기화
  modal(`<h2 class="el-${rd.element}">${rd.name}</h2>
    <div class="row"><span class="badge el-${rd.element}">${ELEM_KO[rd.element]}</span><span class="badge">${ARCH_KO[rd.arch]}형</span>${on?`<span class="badge">✔ 선택됨</span>`:""}</div>
    <div class="status" style="margin:6px 0">HP ${rd.hp} · 공격 ${rd.atk} (기술 위력 = 표기 위력 × 공격/${SKILL_ATK_BASE})</div>
    ${rows}`,
    [[on?"선택 해제":"선택하기",()=>{close(); toggleRoster(rid);}],["닫기",close]]);
};
function fillRosterRandom(p){ // 미선택분을 무작위 종으로 채움 (중복 없음)
  const rest=shuffle(ROSTER.filter(r=>!S.roster[p].includes(r.id)).map(r=>r.id));
  while(S.roster[p].length<6) S.roster[p].push(rest.pop());
  applyRoster(p);
}
window.autoPlaceCore=()=>{
  const p=S.setupPlayer, rows=zoneOf(p);
  if(S.roster[p].length<6) fillRosterRandom(p);
  const cells=[]; for(const r of rows) for(let c=1;c<=COLS;c++) cells.push([r,c]);
  shuffle(cells);
  for(const x of S.pieces.filter(x=>x.owner===p&&!x.placed)){
    const cell=cells.find(([r,c])=>!at(r,c)); x.r=cell[0];x.c=cell[1];x.placed=true;
  }
  S.selected=null; render();
};
window.clearPlaceCore=()=>{for(const x of S.pieces.filter(x=>x.owner===S.setupPlayer)){x.placed=false;} S.selected=null; render();};
window.setupDoneCore=()=>{
  const p=S.setupPlayer;
  if(S.roster[p].length!==6||S.pieces.some(x=>x.owner===p&&!x.placed)){
    showToast("로스터 6종 선택과 14개 배치를 모두 완료하세요."); return;}
  S.selected=null;
  if(S.mode==="pvp"){
    if(p===0){S.setupPlayer=1; handoff(pname(1)+" 배치", render);}
    else beginPlay();
  } else { // pve: 인간(0) 배치 완료 → AI 배치
    aiAutoPlace(1);
    addLog("AI 배치 완료.","ai");
    beginPlay();
  }
};

/* ===== 턴 진행 ===== */
function startTurn(){
  S.mainUsed=false; S.battlesUsed=0; S.movedPiece=null; S.contactSet=[]; S.firstBattleWonByMover=false;
  S.forcedTargets=[]; S.teleport=null; S.forcedQueue=[];
  S.selected=null; S.tempReveal.clear();
  for(const v of [0,1]) for(const id in S.memos[v]) // #11: 제거된 말의 메모 정리
    if(!S.pieces.some(x=>x.id===Number(id)&&x.alive&&x.placed)) delete S.memos[v][id];
  const tmsg=`— ${pname(S.current)} 턴 ${S.turnCount+1} —`;
  addLog(tmsg,"sys"); showToast(tmsg,"sys");
  if(isBurning()&&!S.metrics.btReached){ // BT 진입 1회 고지
    S.metrics.btReached=true; S.metrics.btEnterTurn=S.turnCount+1;
    const bt="🔥 버닝 타임! 직선 2칸 이동 강화 개시 (폭탄 포함·함정 제외)";
    addLog(bt,"imp"); showToast(bt);
    if(S.mode!=="sim") tutHint("burning"); // #26 버닝 타임 첫 진입 1회 도움말 (게임 상태 무변경)
  }
}
function endTurn(){
  if(!(S.forcedTargets&&S.forcedTargets.length)) drainForcedQueue(false); // #18: 대기 중인 강제 전투가 있으면 먼저 꺼냄
  if(S.forcedTargets&&S.forcedTargets.length){ // T1: 강제 전투 미이행 시 턴 종료 불가
    if(!isAI(S.current)){showToast("⚔️ 강제 전투 대상과 전투해야 턴을 마칠 수 있습니다."); return;}
    S.forcedTargets=[]; S.forcedQueue=[]; // AI 안전장치 (이행 불가 상태 해소)
  }
  for(const x of alivePieces()) if(x.owner===S.current&&x.immobile>0) x.immobile--;
  // #20 정확도: 왕 숲 체류는 자기 턴 종료 시 자기 왕만 1회 집계 (양측 턴마다 이중 집계하던 오류 수정)
  for(const k of alivePieces()) if(k.owner===S.current&&k.type==="king"&&inForest(k)) met(S.current,"kingForestTurns");
  // #20 오탐 제거: 실제 canBattle 가능(보이는 대상·전투 규칙 충족)한 인접 대상이 있었는데 전투하지 않은 경우만 회피로 집계
  if(S.battlesUsed===0 && alivePieces().some(x=>x.owner===S.current&&adjEnemies(x).some(e=>visibleTo(S.current,e)&&canBattle(x,e)))) met(S.current,"battleRefusals");
  S.turnCount++;
  if(S.mode==="sim"&&S.turnCount>=BAL.simMaxTurns){gameOver(null,"draw");
    const dmsg=`${BAL.simMaxTurns}턴 도달 — 무승부`; addLog(dmsg,"imp"); showToast(dmsg); render(); return;}
  S.current=1-S.current; startTurn();
  if(S.mode==="pvp") handoff(pname(S.current)+" 턴 시작", render);
  else { render(); if(isAI(S.current)) aiSchedule(); }
}
function confirmResign(){
  if(S.phase!=="play"||isAI(S.current)) return;
  if(NET.mode&&S.current!==NET.me) return; // 온라인: 자기 턴에만 기권
  netLocalModal(); // 확인 모달은 로컬 전용 — 확정만 동기화
  modal(`<h2>🏳️ 기권</h2><p>정말 기권하시겠습니까?</p>`,
    [["기권 확정",()=>{close(); netAction({t:"resign"});}],
     ["취소",close]]);
}
function onCellCore(r,c){ // 원본 셀 클릭 로직 — 온라인은 onCell 래퍼가 동기화 후 호출
  if(S.phase==="setup"){
    const p=at(r,c);
    if(S.selected&&S.selected.tray&&zoneOf(S.setupPlayer).includes(r)&&!p){
      const x=S.pieces.find(z=>z.id===S.selected.id); x.r=r;x.c=c;x.placed=true; S.selected=null; render(); return;
    }
    if(p&&p.owner===S.setupPlayer){p.placed=false; S.selected=null; render();}
    return;
  }
  if(S.phase!=="play"||S.battle||isAI(S.current)) return;
  const p=at(r,c);
  if(S.teleport){ // #14 스왑형: 자기 말 2개 선택 → 위치 교환
    if(S.teleport.stage===1){ if(p&&p.owner===S.current&&p.immobile===0){S.teleport={stage:2,piece:p}; render();} return; }
    if(p&&p.id===S.teleport.piece.id){ S.teleport={stage:1,piece:null}; render(); } // 첫 말 재클릭 — 선택 취소
    else if(p&&p.owner===S.current&&p.immobile===0){ doTeleportSwap(S.teleport.piece,p); }
    return;
  }
  if(S.forcedTargets&&S.forcedTargets.length&&p&&S.forcedTargets.includes(p.id)&&S.movedPiece&&canBattle(S.movedPiece,p)){ initBattle(S.movedPiece,p); return; } // T1: 강제 대상 직접 클릭
  if(p&&p.owner===S.current){S.selected=p; render(); return;}
  const s=S.selected&&!S.selected.tray?S.selected:null;
  if(p&&p.owner!==S.current&&visibleTo(humanViewer(),p)){
    if(s&&adj(s,p)&&canBattle(s,p)){ initBattle(s,p); return; } // 전투 대상 지정 경로
    memoModal(p); return; // #11: 그 외 상대 말 클릭 — 추측 메모
  }
  if(!s) return;
  if(canMoveTo(s,r,c)) doMove(s,r,c);
}
/* #21 공개 관측 기억: 상대(관측자)가 볼 수 있는 상태에서 일어난 BT 이전 이동만 기록 — 숨은 숲 내부 이동은 사람에게 보이지 않으므로 AI도 알 수 없다 */
function observeMove(p,visBefore){
  if(isBurning()) return; // '함정 아님' 추론은 BT 이전 이동만 유효 (기존 movedPreBT 의미 유지)
  const obs=1-p.owner;
  if(visBefore||visibleTo(obs,p)) S.aiSeenMoved[obs].add(p.id);
}
function doMove(p,r,c){
  S.mainUsed=true; p.movedEver=true;
  if(!isBurning()) p.movedPreBT=true; // 실제 이동 이력(엔진 내부 사실) — AI 추론은 공개 관측 기억(aiSeenMoved)만 사용 (#21 누수 제거)
  if(p.type==="bomb") met(p.owner,"bombMoves"); // #20 폭탄 이동 카운터
  const visBefore=visibleTo(1-p.owner,p); // #21 이동 전 관측 가능 여부
  const pr=p.r, beforeAdj=new Set(adjEnemies(p).map(e=>e.id)); // T1: 이동 전 인접 집합
  if(Math.abs(p.r-r)+Math.abs(p.c-c)===2){ // BT 2칸: 1칸째부터 단계 해석 → 충돌 규칙 자연 적용
    const mr=(p.r+r)/2, mc=(p.c+c)/2;
    if(at(mr,mc)){ r=mr; c=mc; } // 경유 칸의 숨은 말 → 그 칸 진입 시도로 전환
    else { p.r=mr; p.c=mc; }
  }
  const hidden=at(r,c);
  if(hidden){ // 숲 충돌: 직전 칸 정지 + 양측 일시 공개
    S.tempReveal.add(hidden.id); S.tempReveal.add(p.id);
    observeMove(p,visBefore); // 충돌 공개 → 이동 목격
    S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
    const cmsg=`${pname(p.owner)} 이동 중 숨은 말과 충돌! 위치가 일시 공개되었습니다.`;
    addLog(cmsg,"imp"); showToast(cmsg);
    if(p.type==="minion"&&zoneOf(1-p.owner).includes(p.r)&&!zoneOf(1-p.owner).includes(pr)) met(p.owner,"minionInvades");
    if(applyForced(p,beforeAdj)) return;
    render(); return;
  }
  p.r=r; p.c=c;
  observeMove(p,visBefore); // #21 이동 후 보이면 목격
  S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
  if(p.type==="minion"&&zoneOf(1-p.owner).includes(r)&&!zoneOf(1-p.owner).includes(pr)) met(p.owner,"minionInvades"); // 지표: 하수인 적진 진입
  if(checkKingReach()) return;
  const ev=S.events.find(e=>e.r===r&&e.c===c&&!e.consumed);
  if(ev){S.traces[p.owner].add(ev.r+"_"+ev.c);
    if(!isAI(p.owner)){addLog("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)","imp");
      showToast("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)");}}
  if(applyForced(p,beforeAdj)) return;
  render();
}
/* T1 강제 전투: 이동·텔레포트로 새로 인접한 적과는 반드시 전투 (canBattle 불가 조합 제외 — 왕vs왕 등, 폭탄·함정 포함) */
function applyForced(p,beforeAdj,list){
  S.forcedTargets=[];
  if(!list) list=adjEnemies(p).filter(e=>!beforeAdj.has(e.id)&&canBattle(p,e)).map(e=>e.id);
  if(!list.length) return false;
  S.forcedTargets=list;
  if(list.length===1){
    const def=alivePieces().find(e=>e.id===list[0]);
    const fmsg="⚔️ 신규 인접 — 강제 전투!";
    addLog(fmsg,"imp"); showToast(fmsg);
    render();
    if(!isAI(p.owner)&&def) initBattle(p,def); // 사람: 확인 없이 즉시 개시 (왕·동료는 기존 모달 흐름) · AI: aiStep이 최우선 개시
    return true;
  }
  S.selected=p;
  const fmsg=`⚔️ 강제 전투 — 신규 인접 대상 ${list.length}개 중 하나를 선택하세요.`;
  addLog(fmsg,"imp"); if(!isAI(p.owner)) showToast(fmsg);
  render();
  return true;
}
/* #14 텔레포트 스왑형: 자기 말이 상대 진영에 있는 동안, 주 행동으로 자기 말 2개의 위치를 교환 (왕·폭탄·함정 포함).
   경기당 플레이어별 BAL.teleMax(2)회 · 교환된 두 말 모두 신규 인접 검사→강제 전투 · movedPreBT 미기록 유지 */
function teleportAvailable(p){
  return S.phase==="play"&&alivePieces().some(x=>x.owner===p&&zoneOf(1-p).includes(x.r));
}
/* #18 강제 전투 적격 (연쇄 규칙 무관 — 텔레포트 강제 전투는 첫 전투 승리 조건 면제): 폭탄·함정은 공격 불가, 왕 vs 왕 불가침 */
function forcedEligible(att,def){
  if(att.type==="bomb"||att.type==="trap") return false;
  if(att.type==="king"&&def.type==="king") return false;
  return true;
}
/* #18 스왑 후 새로 인접할 적격 적 목록: p가 (r,c)로 이동했을 때, 기존 인접(before)이 아닌 적 */
function newAdjAt(p,r,c,before){
  return alivePieces().filter(e=>e.owner!==p.owner&&adj({r,c},e)&&!before.has(e.id)&&forcedEligible(p,e)).map(e=>e.id);
}
/* #18 스왑 사전 검사: 새 강제 전투 수가 남은 전투 슬롯(턴당 2회)을 초과하면 실행 전에 차단 (조용한 누락 금지) */
function teleportSwapBlock(a,b){
  const beforeA=new Set(adjEnemies(a).map(e=>e.id)), beforeB=new Set(adjEnemies(b).map(e=>e.id));
  const need=(newAdjAt(a,b.r,b.c,beforeA).length?1:0)+(newAdjAt(b,a.r,a.c,beforeB).length?1:0);
  const remain=Math.max(0,2-S.battlesUsed);
  if(need>remain) return `새 강제 전투 ${need}회 > 남은 전투 ${remain}회 (턴당 최대 2회)`;
  return null;
}
function doTeleportSwap(a,b){
  if(S.teleUsed[S.current]>=BAL.teleMax) return false; // 2회 제한 방어
  const block=teleportSwapBlock(a,b);
  if(block){ // #18: 실행 전 차단 + 이유 안내 (텔레포트 횟수·주 행동 미소모)
    const bmsg=`🌀 텔레포트 스왑 차단 — ${block}`;
    addLog(bmsg,"imp"); if(!isAI(S.current)) showToast(bmsg);
    if(S.teleport) S.teleport={stage:1,piece:null};
    S.selected=null; render(); return false;
  }
  const beforeA=new Set(adjEnemies(a).map(e=>e.id)), beforeB=new Set(adjEnemies(b).map(e=>e.id));
  S.mainUsed=true; met(S.current,"teleports"); S.teleUsed[S.current]++; S.teleport=null; S.selected=null;
  const ar=a.r, ac=a.c; a.r=b.r; a.c=b.c; b.r=ar; b.c=ac; // movedEver/movedPreBT 미설정 — 걷는 이동이 아님 (폭탄 재배치 위장 유지)
  if(S.mode==="pve"&&a.owner===0){addLog(`🌀 텔레포트 스왑: ${idLabel(0,a)} ↔ ${idLabel(0,b)}`,"imp"); showToast("🌀 텔레포트 완료");}
  else {addLog("상대가 텔레포트를 사용했습니다","imp"); showToast("상대가 텔레포트를 사용했습니다");} // 대상·위치 비공개 (중립 문구)
  for(const p of [a,b]){ // 도착 칸 이벤트 흔적
    const ev=S.events.find(e=>e.r===p.r&&e.c===p.c&&!e.consumed);
    if(ev){S.traces[p.owner].add(ev.r+"_"+ev.c);
      if(!isAI(p.owner)){addLog("탐색 가능한 흔적을 발견했습니다. (다음 턴에 탐색 가능)","imp");}}
  }
  if(checkKingReach()) return true; // 왕 포함 스왑 — 끝줄 도달 즉시 승리
  // #18: 두 말의 강제 전투를 독립 queue에 적재 — 첫 전투의 결과(승·패·도주)와 무관하게 게임이 끝나지 않으면 둘째 실행
  S.forcedQueue=[];
  for(const [p,before] of [[a,beforeA],[b,beforeB]]){
    const list=adjEnemies(p).filter(e=>!before.has(e.id)&&forcedEligible(p,e)).map(e=>e.id);
    if(list.length) S.forcedQueue.push({pid:p.id,targets:list});
  }
  if(!drainForcedQueue(true)) render();
  return true;
}
/* #18 강제 전투 queue 소비: 대기 항목 하나를 꺼내 forcedTargets로 승격. 전투 종료 지점(승·패·포획·도주·폭탄·함정·밀어내기)마다 호출.
   autoStart: 사람·단일 대상이면 즉시 개시(스왑 직후) / false면 대상 표시만(전투 연출 종료 직후 — 클릭으로 개시).
   대상·말 소멸이나 전투 횟수 소진으로 이행 불가하면 반드시 로그로 면제 사유를 남긴다 (조용한 누락 금지). */
function drainForcedQueue(autoStart){
  if(!S.forcedQueue) S.forcedQueue=[];
  while(S.forcedQueue.length&&S.phase==="play"&&!S.battle&&!(S.forcedTargets&&S.forcedTargets.length)){
    const n=S.forcedQueue.shift();
    const p=alivePieces().find(x=>x.id===n.pid);
    if(!p){ addLog("⚔️ 강제 전투 면제 — 해당 말이 제거되었습니다.","imp"); continue; }
    if(S.battlesUsed>=2){ addLog("⚔️ 강제 전투 면제 — 이번 턴 전투 횟수(2회)를 모두 사용했습니다.","imp"); if(!isAI(p.owner)) showToast("⚔️ 강제 전투 면제 — 전투 횟수 소진"); continue; }
    const list=adjEnemies(p).filter(e=>n.targets.includes(e.id)&&forcedEligible(p,e)).map(e=>e.id);
    if(!list.length){ addLog("⚔️ 강제 전투 면제 — 신규 인접 대상이 사라졌습니다.","imp"); continue; }
    S.movedPiece=p; S.contactSet=adjEnemies(p).map(e=>e.id);
    if(autoStart){ applyForced(p,null,list); return true; }
    S.forcedTargets=list; S.selected=p;
    const fmsg=list.length===1?"⚔️ 텔레포트 스왑 — 남은 말도 강제 전투! (빨간 표시 대상을 클릭)":`⚔️ 텔레포트 스왑 — 남은 말도 강제 전투! 대상 ${list.length}개 중 하나를 선택하세요.`;
    addLog(fmsg,"imp"); if(!isAI(p.owner)) showToast(fmsg);
    return true;
  }
  return false;
}
/* #20 경기 종료 공통: 승자(null=무승부)·승리 유형·종료 턴을 지표에 저장 */
function gameOver(winner,type){
  S.phase="over"; S.winner=winner; S.metrics.endTurn=S.turnCount; S.metrics.winType=type; S.metrics.winner=winner;
}
/* T4 전멸 패배: 하수인 6+동료 2 전원 사망 → 즉시 패배. 말 제거가 발생하는 모든 지점 후 호출 */
function checkWipe(){
  if(S.phase!=="play") return false;
  for(const p of [0,1]){
    if(!S.pieces.some(x=>x.owner===p&&x.alive&&x.placed&&(x.type==="minion"||x.type==="ally"))){
      gameOver(1-p,"wipe");
      const msg=`💀 ${pname(p)} 전투 가능 말 전멸 — ${pname(1-p)} 승리!`;
      addLog(msg,"imp"); showToast(msg); render(); return true;
    }
  }
  return false;
}

/* 왕 끝줄 도달 즉시 승리 (GDD-13 4.1 개정) — 왕 위치가 바뀌는 모든 지점 직후 호출 */
function checkKingReach(){
  if(S.phase!=="play") return false;
  const k=alivePieces().find(p=>p.type==="king"&&((p.owner===0&&p.r===1)||(p.owner===1&&p.r===ROWS)));
  if(!k) return false;
  k.revealed=true;
  gameOver(k.owner,"edge");
  const msg=`👑 왕이 적진 최후방에 도달 — ${pname(k.owner)} 승리!`;
  addLog(msg,"imp"); showToast(msg); render();
  return true;
}

/* ===== 탐색·이벤트·포획 ===== */
/* #20 탐색 실행 가능 말 — GDD 역할대로 하수인·동료·왕만. 폭탄·함정은 흔적 발견·칸 점유는 가능하나 탐색 실행 불가 (cap·버프 사장 방지) */
function canSearchPiece(p){return !!p&&(p.type==="minion"||p.type==="ally"||p.type==="king");}
function doSearch(p,ev){
  if(!canSearchPiece(p)){ if(!isAI(p.owner)) showToast("폭탄·함정은 탐색할 수 없습니다."); return false; }
  if(!ev||ev.consumed||ev.r!==p.r||ev.c!==p.c) return false;
  S.mainUsed=true; ev.consumed=true; met(p.owner,"searches");
  const ai=isAI(p.owner), own=p.owner;
  const smsg=ai?`상대가 숲 이벤트를 발생시켰습니다.`:`${pname(own)} 숲 이벤트 발생`;
  addLog(smsg, ai?"":"imp"); showToast(smsg);
  if(p.type==="minion") met(own,"minionSearches"); // #12·#20: 하수인 탐색 (구 '하수인 이벤트')
  if(ev.kind==="buff"){ // #12 일시버프 — 소비 말 종류 무관 그대로 획득 (다음 전투 동안 공격 +15%, 1회성)
    p.nextBattleBuff=true;
    if(!ai) modal(`<h2>✨ 일시 버프 획득</h2><p>${idLabel(own,p)} — 다음 전투 동안 공격 +${pct(BAL.nextBuffPct)} (1회성)</p>`,[["확인",close]]);
  } else if(ev.kind==="ball"){ // #12·#17 몬스터볼: 소비 말 종류 무관(하수인 포함) 플레이어 공용 볼 +1, 상한 BAL.ballMax(3) 초과 시 획득 없음
    const gained=S.balls[own]<BAL.ballMax;
    if(gained) S.balls[own]++;
    const rmsg=gained?`🔴 몬스터볼 +1 (보유 ${S.balls[own]}/${BAL.ballMax})`:`🔴 몬스터볼 상한(${BAL.ballMax}) — 이미 최대 보유, 획득하지 못했습니다.`;
    if(!ai){ showToast(rmsg); // GDD-13 4.7: 공용 로그에는 이벤트 종류·보유량을 남기지 않는다 (generic 숲 이벤트 로그만) — 토스트·모달은 소비자 전용
      modal(`<h2>${gained?"몬스터볼 획득":"몬스터볼 상한"}</h2><p>${rmsg}</p>`,[["확인",close]]);}
  } else if(ev.kind!=="recruit"&&p.type==="minion"){ // #12 하수인의 아이템류(회복약·쿨링수·해독제) 소비 — 대체 보상: 자기 기술 쿨 전체 초기화
    p.cd=0; if(p.skills) p.cds=[0,0,0,0];
    if(!ai) modal(`<h2>이벤트 소모</h2><p>하수인은 아이템 대신 자기 기술 쿨타임이 전체 초기화됩니다.</p>`,[["확인",close]]);
  } else if(ev.kind!=="recruit"){ // #12 회복약·쿨링수·해독제 — 동료·왕: 해당 아이템 획득
    if(S.inv[own].length<BAL.invMax){S.inv[own].push(ev.kind);
      if(!ai) modal(`<h2>아이템 획득</h2><p>${ITEMS[ev.kind].ko} — ${ITEMS[ev.kind].desc}</p>`,[["확인",close]]);}
    else if(!ai) modal(`<h2>인벤토리 가득</h2><p>아이템을 획득하지 못했습니다 (최대 ${BAL.invMax}).</p>`,[["확인",close]]);
  } else {
    if(p.type==="minion"){
      // [임시 대체 — 기획 확정 전] 보조기 슬롯(슬롯2)을 무작위 다른 보조기로 교체 제안 (구 공용 스킬 교체 대체)
      if(p.skills){
        const cur=p.skills[2];
        const alt=shuffle(Object.keys(SKILLS).filter(k=>SKILLS[k].kind==="support"&&k!==cur))[0];
        const swap=()=>{p.skills[2]=alt; p.cds[2]=0; if(p.revealedSkills) p.revealedSkills=p.revealedSkills.filter(i=>i!==2);};
        if(ai){ if(rand()<0.5) swap(); }
        else modal(`<h2>공용 하수인 발견</h2><p>이 하수인의 보조기를 교체할까요?<br>현재: ${SKILLS[cur].ko} → ${SKILLS[alt].ko}<small> (${SKILLS[alt].desc})</small></p>`,
          [["교체",()=>{swap();close();render();}],["유지",close]]);
      }
    } else if(p.cap){ if(!ai) modal(`<h2>공용 하수인 발견</h2><p>이미 포획 하수인을 보유 중입니다 (각 1개 제한).</p>`,[["확인",close]]); }
    else { if(ai) aiCapture(p); else captureModal(p); }
  }
  render();
}
function tryCapture(p,mode){
  const cost=mode==="safe"?2:1; S.balls[p.owner]-=cost;
  const roll=rand();
  const ok= mode==="safe" || (mode==="risky"&&roll<0.5) || (mode==="attack"&&roll<0.7);
  if(ok){
    const el=shuffle(ELEMS.slice())[0], cb=BAL.captured;
    // 포획 하수인: 해당 속성 표준형 세트 적용 (추론 — GDD-16 4장 템플릿 준용)
    p.cap={element:el,hp:cb.hp,maxHp:cb.hp,atk:cb.atk,skillAtk:cb.skill,cd:0,cdMax:cb.cd, // 숲 공용 하수인 포획: 100/100 유지 (#20)
      skills:archSkills("std",el),cds:[0,0,0,0],revealedSkills:[]};
    met(p.owner,"captures");
    return {ok:true,el};
  }
  met(p.owner,"captureFails");
  let dmg=0;
  if(mode==="attack"){dmg=Math.round(p.maxHp*BAL.captureAtkFailPct); p.hp=Math.max(1,p.hp-dmg);}
  return {ok:false,dmg};
}
function captureModal(p){
  const b=S.balls[p.owner];
  const opt=(name,cost,rate,risk,fn)=>`<div class="fighter"><b>${name}</b><small>볼 ${cost} · 성공 ${rate}${risk?" · "+risk:""}</small>
    <button ${b<cost?"disabled":""} onclick="window.__cap('${fn}')">시도</button></div>`;
  window.__capCore=mode=>{
    const r=tryCapture(p,mode);
    if(r.ok) modal(`<h2>포획 성공!</h2><p>포획 하수인(${ELEM_KO[r.el]}) 확보 — 대리 출전 가능</p>`,[["확인",close]]);
    else modal(`<h2>포획 실패</h2><p>공용 하수인이 사라졌습니다.${r.dmg?`<br>탐색 말이 최대 HP 25% 피해 (HP ${p.hp})`:""}</p>`,[["확인",close]]);
    render();
  };
  modal(`<h2>포획 시도 (몬스터볼 ${b})</h2><small>공격 포획 실패 시 최대 HP 25% 피해 경고!</small>
    ${opt("안전 포획",2,"100%","", "safe")}${opt("위험 포획",1,"50%","실패 시 소멸","risky")}${opt("공격 포획",1,"70%","실패 시 소멸+HP 25% 피해","attack")}`,
    [["포기",close]]);
}

/* ===== 전투 ===== */
function initBattle(att,def){
  if(S.forcedTargets&&S.forcedTargets.length&&S.forcedTargets.includes(def.id)){S.forcedTargets=[]; met(att.owner,"forcedBattles");} // T1: 강제 이행
  if(def.type==="bomb"){
    S.battlesUsed++; met(att.owner,"battles");
    def.alive=false;
    if(att.type==="minion"){att.alive=false; met(def.owner,"bombHitsMinion"); // #20: 폭탄 소유자 기준
      addLog(`💥 폭탄 발동! 공격한 말과 폭탄이 모두 제거되었습니다.`,"imp");
      showToast(`💥 폭탄 발동! 공격한 말과 폭탄이 모두 제거되었습니다.`);}
    else {met(def.owner,"bombClearedByVip");
      addLog(`💥 폭탄 발동! 폭탄만 제거되고 공격한 말은 생존했습니다. (정체 비공개 유지)`,"imp");
      showToast(`💥 폭탄 발동! 폭탄만 제거되고 공격한 말은 생존했습니다. (정체 비공개 유지)`);}
    if(checkWipe()) return; // T4: 폭탄 동귀 후 전멸 판정
    afterBattle(att,false); return;
  }
  if(def.type==="trap"){
    S.battlesUsed++; met(att.owner,"battles"); met(def.owner,"trapTriggers"); // #20: 함정 발동은 함정 소유자 기준
    def.alive=false; att.immobile=2;
    addLog(`🪤 함정 발동! 함정은 제거되고 대상 말은 소유자 기준 2턴 이동 불가. (정체 비공개 유지)`,"imp");
    showToast(`🪤 함정 발동! 함정은 제거되고 대상 말은 소유자 기준 2턴 이동 불가. (정체 비공개 유지)`);
    afterBattle(att,false); render(); return;
  }
  const needA=(att.type==="ally"||att.type==="king"), needD=(def.type==="ally"||def.type==="king");
  if(needA||needD){ vipChoice(att,def); return; }
  startRounds(att,def,att,def);
}
function vipChoice(att,def){
  const choices={};
  const ask=(side,piece,next)=>{
    const res=(!piece.cap&&S.reserve[piece.owner])?S.reserve[piece.owner]:null; // #12: cap 없고 예비(포획 하수인) 있으면 대리 출전 가능
    if(!(piece.type==="ally"||piece.type==="king")||(!piece.cap&&!res)){choices[side]="body"; next(); return;}
    const useRes=()=>{piece.cap=S.reserve[piece.owner]; S.reserve[piece.owner]=null;}; // 사용 시 reserve 소모 → 해당 전투원의 cap
    if(isAI(piece.owner)){if(res)useRes(); choices[side]="cap"; next(); return;} // AI: 보유 시 항상 대리 (진짜 비공개 선택)
    netModalOwner(piece.owner); // 온라인: 이 비공개 선택의 주인은 해당 말 소유자 (방어자 포함)
    modal(`<h2>🔒 ${pname(piece.owner)}만 확인${S.mode==="pvp"&&!NET.mode?" (상대는 시선 회피)":""}</h2>
      <p>${TYPE_KO[piece.type]} 출전 선택 — 어느 쪽이 패배해도 ${piece.type==="king"?"경기 패배":"동료·포획 하수인 동시 제거"}입니다.</p>`,
      [["본체 출전",()=>{choices[side]="body";close();next();}],
       res?[`예비 하수인(${ELEM_KO[res.element]}) HP ${res.hp}/${res.maxHp} 대리 출전`,()=>{useRes();choices[side]="cap";close();next();}]
          :[`포획 하수인(${ELEM_KO[piece.cap.element]}) HP ${piece.cap.hp}/${piece.cap.maxHp} 출전`,()=>{choices[side]="cap";close();next();}]]);
  };
  ask("A",att,()=>ask("D",def,()=>{
    att.revealed=true; def.revealed=true;
    const fa=choices.A==="cap"?att.cap:att, fd=choices.D==="cap"?def.cap:def;
    const aIsBody=(att.type==="ally"||att.type==="king")&&choices.A!=="cap";
    const dIsBody=(def.type==="ally"||def.type==="king")&&choices.D!=="cap";
    if(aIsBody&&dIsBody){ doPush(att,def); return; } // Q2-b C안
    const desc=`공격: ${fa===att?TYPE_KO[att.type]:"포획 하수인("+ELEM_KO[fa.element]+")"} vs 방어: ${fd===def?TYPE_KO[def.type]:"포획 하수인("+ELEM_KO[fd.element]+")"}`;
    if(S.mode==="sim"){ addLog("출전 공개 — "+desc,"ai"); startRounds(att,def,fa,fd); return; }
    modal(`<h2>출전 공개</h2><p>${desc}</p>`,[["전투 시작",()=>{close();startRounds(att,def,fa,fd);}]]);
  }));
}
function doPush(att,def){
  S.battlesUsed++; met(att.owner,"battles"); met(att.owner,"pushes");
  const dr=def.r-att.r, dc=def.c-att.c, nr=def.r+dr, nc=def.c+dc;
  let msg;
  if(nr<1||nr>ROWS||nc<1||nc>COLS||at(nr,nc)) msg="밀 수 없는 위치 — 제자리 유지.";
  else {def.r=nr; def.c=nc; msg=`방어자가 1칸 밀려났습니다 (${nr}행 ${nc}열).`;}
  addLog(`🤜 양측 본체 출전 → 밀어내기! ${msg}`,"imp");
  showToast(`🤜 양측 본체 출전 → 밀어내기! ${msg}`);
  if(checkKingReach()) return; // 밀어내기로 끝줄 진입도 승리 인정
  if(isAI(S.current)){ afterBattle(att,false); render(); return; }
  modal(`<h2>밀어내기 (Q2-b)</h2><p>양측 모두 본체로 출전해 전투 대신 위치 판정. ${msg}</p>`,[["확인",()=>{close();afterBattle(att,false);render();}]]);
}
function startRounds(attP,defP,fa,fd){
  S.battlesUsed++; met(attP.owner,"battles");
  attP.revealed=true; defP.revealed=true;
  S.battle={attP,defP,fa,fd,round:1,phase:0,
    recA:0,recD:0, itemsA:0,itemsD:0, itemRoundA:false,itemRoundD:false, lastItemA:null,lastItemD:null,
    ballThrowA:false, ballThrowD:false, // #12: 볼 투척 라운드당 1회
    blog:[], msgQ:[], dispHpA:fa.hp, dispHpD:fd.hp};
  resetBattleTemps(fa); resetBattleTemps(fd);
  for(const [piece,f,sd] of [[attP,fa,"A"],[defP,fd,"D"]]) // #12 일시버프: 다음 전투 개시 시 소진·전투 내내 유지
    if(piece.nextBattleBuff){piece.nextBattleBuff=false; f.atkBuff=true;
      bmsg(`✨ ${fighterName(sd)} 일시 버프 — 이번 전투 공격 +${pct(BAL.nextBuffPct)}!`);}
  bmsg(`⚔️ ${fighterName("A")} vs ${fighterName("D")} — 전투 개시!`);
  battleModal();
}
function resetBattleTemps(f){f.burn=0;f.burnBy=null;f.weaken=0;f.shield=0;f.absorbed=0;f.shock=0;f.shockFresh=false;f.focusCharge=false;f.vulnMark=false;f.dmgCut=0;f.atkBuff=false;} // 쿨(cds)은 전투 간 유지 (HP와 동일)
function actorOfPhase(){
  const B=S.battle;
  let firstIsAtt = B.round%2===1;
  if(firstIsAtt && B.fa.shock) firstIsAtt=false;
  if(!firstIsAtt && B.fd.shock) firstIsAtt=true;
  return B.phase===0 ? (firstIsAtt?"A":"D") : (firstIsAtt?"D":"A");
}

    }

    if(f.element==="fire"&&!opp.burn&&tryStatus()){opp.burn=sp.burnRounds; opp.burnBy=side; bmsg(`🔥 ${fighterName(oSide)}는 화상을 입었다! (${sp.burnRounds}R)`,{st:{side:oSide,text:stIcons(opp)}});}

/* ===== 4슬롯 실행 엔진 (GDD-16) — slot -1은 폴백 기본 공격, 로직은 동기 완결 ===== */
function execSlot(side,slot){
  const B=S.battle; if(!B) return;
  const f=side==="A"?B.fa:B.fd, opp=side==="A"?B.fd:B.fa, oSide=side==="A"?"D":"A";
  const sk=(slot>=0&&f.skills)?SKILLS[f.skills[slot]]:null;
  if(sk){ f.cds[slot]=sk.cd;
    if(f.revealedSkills&&!f.revealedSkills.includes(slot)) f.revealedSkills.push(slot); } // 기술 공개: 사용 시 이름 공개
  const gate=force=>{ // 상태 부여 — 기존 D10 경로 재사용 (효과기 70%·잔류장 100%)
    if(force||rand()<BAL.statusProb){S.metrics.statusApplied++; return true;}
    S.metrics.statusFailed++; bmsg("상태이상 부여 실패!"); return false;
  };
  const applyStatus=force=>{
    if(f.element==="fire"&&!opp.burn&&gate(force)){opp.burn=BAL.burnRounds; opp.burnBy=side; bmsg(`🔥 ${fighterName(oSide)}는 화상을 입었다! (${BAL.burnRounds}R)`,{st:{side:oSide,text:stIcons(opp)}});}
    else if(f.element==="water"&&!opp.weaken&&gate(force)){opp.weaken=BAL.weakenHits; bmsg(`💧 ${fighterName(oSide)}는 약화되었다! (${BAL.weakenHits}회)`,{st:{side:oSide,text:stIcons(opp)}});}
    else if(f.element==="lightning"&&!opp.shock&&gate(force)){opp.shock=1; opp.shockFresh=true; bmsg(`⚡ ${fighterName(oSide)}는 감전 — 다음 1라운드 후공!`,{st:{side:oSide,text:stIcons(opp)}});}
  };
  const coolReduce=(filter,label)=>{ // 쿨 감소류: 조건 내 남은 쿨 최장 기술 1개 쿨 -1
    let pick=-1;
    for(let i=0;i<4;i++) if(f.cds[i]>0&&filter(i)&&(pick<0||f.cds[i]>f.cds[pick])) pick=i;
    if(pick<0){ if(label) bmsg(`${label} — 단축할 쿨이 없다.`); return; }
    f.cds[pick]--; bmsg(`🔄 ${SKILLS[f.skills[pick]].ko} 쿨 -1 (남은 쿨 ${f.cds[pick]})`);
  };
  const supFlash=sk&&!sk.pow?(sk.healPct?"heal":(sk.shieldPct||sk.dmgCut)?"guard":"buff"):null; // S3-A 보조 3계열
  bmsg(`${fighterName(side)}의 ${sk?sk.ko:"기본 공격"}!`,(sk&&sk.kind==="sig")?{sig:true,flash:supFlash}:(supFlash?{flash:supFlash}:null));
  if(sk&&!sk.pow){ // 비피해 기술: 보조기·불굴 진형
    if(sk.healPct){const h=Math.round(f.maxHp*sk.healPct); f.hp=Math.min(f.maxHp,f.hp+h);
      bmsg(`💚 HP ${h} 회복!`,{float:{side,html:`<span class="pos">+${h}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}
    if(sk.shieldPct){f.shield=Math.max(f.shield,Math.round(f.maxHp*sk.shieldPct)); // 보호막 중첩: 최대값 갱신 (합산 금지)
      bmsg(`🛡 보호막 ${f.shield}!`,{st:{side,text:stIcons(f)}});}
    if(sk.dmgCut){f.dmgCut=Math.max(f.dmgCut,sk.dmgCut);
      bmsg(`🌀 다음 피격 ${pct(sk.dmgCut)} 감소!`,{st:{side,text:stIcons(f)}});}
    if(sk.focus){f.focusCharge=true; bmsg(`🎯 집중 — 다음 공격기 위력 +20%!`,{st:{side,text:stIcons(f)}});}
    if(sk.coolAny) coolReduce(i=>i!==slot,"냉각");
    if(sk.cleanse){
      if(f.burn){f.burn=0;f.burnBy=null;bmsg(`✨ 화상이 정화되었다!`,{st:{side,text:stIcons(f)}});}
      else if(f.weaken){f.weaken=0;bmsg(`✨ 약화가 정화되었다!`,{st:{side,text:stIcons(f)}});}
      else if(f.shock){f.shock=0;f.shockFresh=false;bmsg(`✨ 감전이 정화되었다!`,{st:{side,text:stIcons(f)}});}
      else bmsg(`정화 — 제거할 상태이상이 없다.`);
    }
  } else { // 피해 기술: 공격기·시그니처·기본 공격 — 스케일 후 기존 파이프라인(분산·상성) 그대로
    let dmg=sk?slotPow(f,sk):f.atk;
    if(f.atkBuff) dmg=Math.round(dmg*(1+BAL.nextBuffPct)); // #12 일시버프
    if(f.focusCharge&&sk&&sk.kind==="attack"){dmg=Math.round(dmg*1.2); f.focusCharge=false;
      bmsg(`🎯 집중 발동 — 위력 +20%!`,{st:{side,text:stIcons(f)}});}
    if(BAL.dmgVar) dmg=Math.round(dmg*(1-BAL.dmgVar+rand()*2*BAL.dmgVar)); // D8 피해 분산 ±20%
    if(f.weaken>0){dmg=Math.round(dmg*(1-BAL.weakenPct)); f.weaken--;
      if(!f.weaken) bmsg(`💧 ${fighterName(side)}의 약화가 풀렸다.`,{st:{side,text:stIcons(f)}});}
    if(f.element&&opp.element){
      if(BEATS[f.element]===opp.element) dmg=Math.round(dmg*BAL.advMult);
      else if(BEATS[opp.element]===f.element) dmg=Math.round(dmg*BAL.disMult);
    }
    if(sk&&sk.bonusVsShield&&opp.shield>0){dmg+=sk.bonusVsShield; bmsg(`🌊 보호막 대상 추가 위력 +${sk.bonusVsShield}!`);}
    if(sk&&sk.bonusVsStatus&&(opp.burn||opp.weaken||opp.shock)){dmg+=sk.bonusVsStatus; bmsg(`⚡ 상태이상 대상 추가 위력 +${sk.bonusVsStatus}!`);}
    if(opp.dmgCut>0){dmg=Math.round(dmg*(1-opp.dmgCut)); bmsg(`${fighterName(oSide)}는 자세를 낮춰 피해 ${pct(opp.dmgCut)} 감소!`); opp.dmgCut=0;}
    if(opp.vulnMark){dmg=Math.round(dmg*1.15); opp.vulnMark=false; bmsg(`⚠️ 결정타의 반동 — 피격 +15%!`);}
    let absorbed=Math.min(dmg,opp.shield); opp.shield-=absorbed;
    let hpDmg=dmg-absorbed;
    const actual=Math.min(hpDmg,opp.hp); opp.hp-=actual;
    const capLeft=Math.max(0,Math.round(opp.maxHp*BAL.absorbCapPct)-opp.absorbed);
    const freeAbsorb=Math.min(absorbed,capLeft); opp.absorbed+=freeAbsorb;
    const counted=actual+(absorbed-freeAbsorb);
    addRec(side,counted);
    bmsg(`${dmg} 피해!${absorbed?` (흡수 ${absorbed})`:""} · 유효 ${counted}`,
      {shake:oSide,flash:f.element||null,float:{side:oSide,html:`<span class="neg">-${dmg}</span>${absorbed?`<span class="abs"> (흡수 ${absorbed})</span>`:""}`},
       hp:{side:oSide,val:opp.hp,max:opp.maxHp},st:{side:oSide,text:stIcons(opp)}});
    if(sk){
      if(sk.drainPct&&actual>0){const gh=Math.round(actual*sk.drainPct); f.hp=Math.min(f.maxHp,f.hp+gh);
        bmsg(`🌿 흡수 — HP ${gh} 회복!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}
      if(sk.selfShieldPct){f.shield=Math.max(f.shield,Math.round(f.maxHp*sk.selfShieldPct));
        bmsg(`🌿 보호막 ${f.shield}!`,{st:{side,text:stIcons(f)}});}
      if(sk.status) applyStatus(false);
      if(sk.statusSelf){ // 잔류장: 자기 속성 상태효과 100% — 풀은 대응 상태이상 부재로 흡수 회복(실피해 40%) 임시 대체 [기획 필요]
        if(f.element==="grass"){const gh=Math.round(actual*0.4); if(gh>0){f.hp=Math.min(f.maxHp,f.hp+gh);
          bmsg(`🌿 잔류 흡수 — HP ${gh} 회복!`,{float:{side,html:`<span class="pos">+${gh}</span>`},hp:{side,val:f.hp,max:f.maxHp}});}}
        else applyStatus(true);
      }
      if(sk.selfVuln){f.vulnMark=true; bmsg(`⚠️ ${fighterName(side)}의 자세가 무너졌다 — 다음 피격 +15%!`,{st:{side,text:stIcons(f)}});}
      if(sk.coolAttack) coolReduce(i=>i!==slot&&SKILLS[f.skills[i]].kind==="attack",null); // 전술 연계
      if(sk.coolAttackLongest) coolReduce(i=>SKILLS[f.skills[i]].kind==="attack",null);   // 급속 순환
    }
  }
  if(checkDeath()) return;
  nextPhase();
}
function sideName(s){return s==="A"?"공격측":"방어측";}
function dmgRange(v){return BAL.dmgVar?Math.round(v*(1-BAL.dmgVar))+"~"+Math.round(v*(1+BAL.dmgVar)):v;} // T7: 분산 반영 표기
/* T5-B 아키타입별 스킬 파라미터: 지속형 강화(화상3R·약화3회·풀15%/15%·감전2R), 풀 속공 변형(회복 8%·보호막 없음) */
function archOf(f){const rd=f.rosterId?ROSTER.find(r=>r.id===f.rosterId):null; return rd?rd.arch:null;}
function skillParamsOf(f){

  return {
    burnRounds:a==="sustain"?3:BAL.burnRounds,
    weakenHits:a==="sustain"?3:BAL.weakenHits,

    healPct:a==="sustain"?0.15:(f.element==="grass"&&a==="swift")?0.08:BAL.healPct,

  };
}
const ELEM_EMO={fire:"🔥",water:"💧",grass:"🌿",lightning:"⚡"};
function fighterName(sid){
  const B=S.battle, pf=sid==="A"?B.fa:B.fd, piece=sid==="A"?B.attP:B.defP;
  return pf===piece?(piece.type==="minion"&&piece.name?piece.name:TYPE_KO[piece.type]):"포획 하수인·"+ELEM_KO[pf.element];

function stIcons(f){
  return [f.shield?`🛡${f.shield}`:"",f.burn?`🔥화상${f.burn}R`:"",f.weaken?`💧약화${f.weaken}회`:"",f.shock?`⚡감전${f.shock}R`:"",
    f.dmgCut?`🌀감쇠${pct(f.dmgCut)}`:"",f.focusCharge?"🎯집중":"",f.vulnMark?"⚠️피격+15%":""].filter(Boolean).join(" ")||"-";
}
/* 전투 메시지 시퀀스 — 로직은 동기 완결, 표시 계층만 타이머 재생 (헤드리스: 큐만 적재 후 즉시 소진) */
function bmsg(txt,fx){const B=S.battle; if(!B) return; B.blog.push(txt); B.msgQ.push({txt,fx:fx||null});}
let MSGQ=[], MSGPLAYING=false, MSGAFTER=null;
function liveBattleDom(){ // 실제 DOM에 msgBox가 있을 때만 재생 (sim·헤드리스 스텁 제외)
  try{const mb=$("msgBox"); return S.mode!=="sim"&&!!mb&&mb.nodeType===1;}catch(e){return false;}
}
function playMsgs(q,after){ // 0.6초 간격 순차 재생 — 재생 불가 환경은 즉시 완료
  MSGQ.push(...q); MSGAFTER=after||null;
  if(MSGPLAYING) return;
  if(!liveBattleDom()){ MSGQ.length=0; const fn=MSGAFTER; MSGAFTER=null; if(fn)fn(); return; }
  MSGPLAYING=true;
  (function step(){
    const m=MSGQ.shift();
    if(!m){ MSGPLAYING=false; const fn=MSGAFTER; MSGAFTER=null; if(fn)fn(); return; }
    try{ const mb=$("msgBox"); if(mb) mb.innerHTML=m.txt; applyFx(m.fx); }catch(e){}
    setTimeout(step,600);
  })();
}
function applyFx(fx){ // CSS 이펙트(흔들림·속성 플래시·피해 팝·HP바·상태 아이콘) — 실패는 조용히 무시
  if(!fx) return;
  try{
    if(fx.hp){ if(S.battle) S.battle["dispHp"+fx.hp.side]=fx.hp.val;
      const bar=$("hpfill-"+fx.hp.side); if(bar) bar.style.width=Math.max(0,fx.hp.val/fx.hp.max*100)+"%";
      const t=$("hptxt-"+fx.hp.side); if(t) t.textContent=fx.hp.val; }
    if(fx.st){ const s=$("bst-"+fx.st.side); if(s) s.textContent=fx.st.text; }
    if(fx.shake){ const t=$("tok-"+fx.shake); if(t){t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");} }
    if(fx.flash){ const st=$("bstage"); if(st){st.style.boxShadow=`inset 0 0 70px var(--${fx.flash})`;
      setTimeout(()=>{try{st.style.boxShadow="";}catch(e){}},380);} }
    if(fx.sig){ const st=$("bstage"); if(st&&st.classList){st.classList.remove("sigblink"); void st.offsetWidth; st.classList.add("sigblink");
      setTimeout(()=>{try{st.classList.remove("sigblink");}catch(e){}},750);} } // 시그니처 전용 강조 (테두리 점멸)
    if(fx.float){ const t=$("tok-"+fx.float.side); if(t&&t.appendChild){const d=document.createElement("div");
      d.className="dmgfloat"; d.innerHTML=fx.float.html; t.appendChild(d);
      setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},1100);} }
    if(fx.ko){ const t=$("tok-"+fx.ko); if(t) t.classList.add("ko"); }
  }catch(e){}
}
function addRec(side,amount){
  const B=S.battle;
  if(side==="A") B.recA=Math.min(B.fd.maxHp,B.recA+amount);
  else B.recD=Math.min(B.fa.maxHp,B.recD+amount);
}
function nextPhase(){
  const B=S.battle;
  if(B.phase===0){B.phase=1; battleModal(); return;}
  for(const [f,side] of [[B.fa,"A"],[B.fd,"D"]]){
    if(f.burn>0){const d=Math.min(f.hp,Math.round(f.maxHp*BAL.burnPct)); f.hp-=d; f.burn--;
      addRec(f.burnBy,d);
      bmsg(`🔥 ${fighterName(side)}는 화상 피해 ${d}!`,{shake:side,float:{side,html:`<span class="neg">-${d}</span>`},hp:{side,val:f.hp,max:f.maxHp},st:{side,text:stIcons(f)}});
      if(!f.burn) bmsg(`🔥 ${fighterName(side)}의 화상이 해제되었다.`,{st:{side,text:stIcons(f)}});
      if(checkDeath()) return;}
    if(f.cd>0)f.cd--; if(f.skills)for(let i=0;i<4;i++)if(f.cds[i]>0)f.cds[i]--; // 슬롯별 개별 쿨 감소 (라운드 종료 시)
    if(f.shockFresh) f.shockFresh=false; // 감전은 부여 라운드가 아닌 다음 라운드부터 소진
    else if(f.shock>0){f.shock--; if(!f.shock) bmsg(`⚡ ${fighterName(side)}의 감전이 풀렸다.`,{st:{side,text:stIcons(f)}});}
  }
  B.itemRoundA=false; B.itemRoundD=false;
  B.ballThrowA=false; B.ballThrowD=false; // #12: 볼 투척 라운드당 1회 리셋
  B.round++;
  if(B.round>BAL.maxRounds){judge(); return;}
  B.phase=0; battleModal();
}
function checkDeath(){
  const B=S.battle;
  if(B.fd.hp<=0){finishBattle("A","즉사"); return true;}
  if(B.fa.hp<=0){finishBattle("D","즉사"); return true;}
  return false;
}
function judge(){
  const B=S.battle; S.metrics.judged++;
  const ra=B.recA/B.fd.maxHp, rd=B.recD/B.fa.maxHp;
  if(ra>rd) finishBattle("A",`판정 ${pct(ra)} vs ${pct(rd)}`);
  else if(rd>ra) finishBattle("D",`판정 ${pct(rd)} vs ${pct(ra)}`);
  else {S.metrics.ties++; finishBattle("D","동률 — 방어자 승");}
}
function finishBattle(winSide,how){
  const B=S.battle;
  const winP=winSide==="A"?B.attP:B.defP, loseP=winSide==="A"?B.defP:B.attP;
  const loseF=winSide==="A"?B.fd:B.fa, loseSide=winSide==="A"?"D":"A";
  if(winSide==="A")S.metrics.attackerWins++; else S.metrics.defenderWins++;
  bmsg(`${fighterName(loseSide)}는(은) 쓰러졌다!`,{ko:loseSide,shake:loseSide,hp:{side:loseSide,val:Math.max(0,loseF.hp),max:loseF.maxHp}});
  bmsg(`${how} — ${pname(winP.owner)} 승!`);
  let msg;
  if(loseF===loseP){ loseP.alive=false; msg=`${TYPE_KO[loseP.type]} 패배(${how}) — 제거`; }
  else { loseP.cap=null; loseP.alive=false;
    msg=`포획 하수인 패배(${how}) — ${TYPE_KO[loseP.type]} 동시 ${loseP.type==="king"?"패배":"제거"}`; }
  addLog(`⚔️ 전투 종료: ${pname(winP.owner)} 승 — ${msg}`,"imp");
  showToast(`⚔️ 전투 종료: ${pname(winP.owner)} 승 — ${msg}`);
  resetAfter(B.fa); resetAfter(B.fd);
  const attacker=B.attP;
  const q=B.msgQ.splice(0);
  S.battle=null;
  // 연출: 남은 메시지 재생 후 0.8초 지연 닫힘 — 헤드리스·sim은 기존처럼 즉시 닫힘
  if(liveBattleDom()) playMsgs(q,()=>setTimeout(()=>{if(!S.battle)close();},800));
  else close();
  if(loseP.type==="king"){gameOver(winP.owner,"king");
    const gmsg=`🏁 경기 종료 — ${pname(winP.owner)} 승리!`; addLog(gmsg,"imp"); showToast(gmsg);
    render(); return;}
  if(checkWipe()) return; // T4: 전투 제거(대리 동시 제거 포함) 후 전멸 판정
  afterBattle(attacker, winSide==="A"&&attacker.alive);
  render();
}
function resetAfter(f){f.burn=0;f.burnBy=null;f.weaken=0;f.shield=0;f.absorbed=0;f.shock=0;f.shockFresh=false;f.focusCharge=false;f.vulnMark=false;f.dmgCut=0;f.atkBuff=false;}
/* #12 포획 종료: 적 하수인 즉시 제거 + S.reserve 저장 — 누적 판정 없이 전투 즉시 종료 (포획으로 승리) */
function finishByCapture(side){
  const B=S.battle;
  const winP=side==="A"?B.attP:B.defP, loseP=side==="A"?B.defP:B.attP, loseSide=side==="A"?"D":"A";
  const p=winP.owner, cb=BAL.captured;
  const el=loseP.element||shuffle(ELEMS.slice())[0], arch=archOf(loseP)||"std";
  S.reserve[p]={element:el,hp:BAL.enemyCapHp,maxHp:cb.hp,atk:cb.atk,skillAtk:cb.skill,cd:0,cdMax:cb.cd, // #20: 전투 중 적 포획만 HP 70/maxHP 100
    skills:archSkills(arch,el),cds:[0,0,0,0],revealedSkills:[]}; // 포획 하수인 규격 준용 (속성·아키타입은 대상 승계)
  met(p,"enemyCaptures");

  showToast(`🔴 포획 종료 — 적 하수인 포획! (예비 HP ${BAL.enemyCapHp}/${cb.hp})`);
  resetAfter(B.fa); resetAfter(B.fd);

  S.battle=null;
  if(liveBattleDom()) playMsgs(q,()=>setTimeout(()=>{if(!S.battle)close();},800));
  else close();
  if(checkWipe()) return; // 제거이므로 전멸 판정 기여
