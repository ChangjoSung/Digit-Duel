<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2220" viewBox="0 0 1800 2220" role="img" aria-label="상점 · 가방 · 성장"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#087e82"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b5761d"/></marker></defs><g font-family="Malgun Gothic, 맑은 고딕, sans-serif"><rect x="0" y="0" width="1800" height="2220" rx="0" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="60" y="48" font-size="18" fill="#087e82" font-weight="700">DIGIT DUEL   /   UI·UX SYSTEM FLOW   /   v0.4.11</text><text x="60" y="99" font-size="36" fill="#172b3c" font-weight="700">02  상점 · 가방 · 성장</text><text x="60" y="139" font-size="19" fill="#586c79" font-weight="400">정기 상점: 20 / 40 / 60 / 80턴 해결 후. 상품 5행과 필드 6칸·가방 3칸을 한 팝업에 둡니다.</text><text x="60" y="2167" font-size="17" fill="#586c79" font-weight="400">범례  ━ 화면   ┄ 모달/복귀선   ◆ 조건   ● 시작·종료   녹색 시스템   * 원문 제안·충돌판단</text><text x="60" y="2197" font-size="16" fill="#586c79" font-weight="400">Earth · 2026-09-16 · GDD23 직접 조회 기준 / 밝은 문서 + 어두운 게임 UI / 시각 배치는 설계 제안</text><rect x="60" y="190" width="610" height="760" rx="16" fill="#17212e" stroke="#52657a" stroke-width="2" /><text x="80" y="220" font-size="20" fill="#f4f6fa" font-weight="700">M01 · 상점 팝업 / 소유자 전용</text><text x="82" y="258" font-size="22" fill="#f4f6fa" font-weight="700">내 코인 4     남은 시간 01:12</text><text x="82" y="292" font-size="18" fill="#b9d4d8" font-weight="400">하수인   |   아이템   |   버프   |   티켓</text><rect x="82" y="312" width="566" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="345.5" font-size="16" fill="#f4f6fa" font-weight="400">① 새끼 화룡  ★1 → ★2</text><rect x="526" y="323" width="103" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="538" y="346" font-size="16" fill="#fff" font-weight="600">구매 1</text><rect x="82" y="377" width="566" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="410.5" font-size="16" fill="#f4f6fa" font-weight="400">② 물방울 요정  ★2</text><rect x="526" y="388" width="103" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="538" y="411" font-size="16" fill="#fff" font-weight="600">구매 2</text><rect x="82" y="442" width="566" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="475.5" font-size="16" fill="#f4f6fa" font-weight="400">③ 번개 여우  ★3 → ★4</text><rect x="526" y="453" width="103" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="538" y="476" font-size="16" fill="#fff" font-weight="600">차액 1</text><rect x="82" y="507" width="566" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="540.5" font-size="16" fill="#f4f6fa" font-weight="400">④ 판매함 · 이번 상점 구매 불가</text><rect x="82" y="572" width="566" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="605.5" font-size="16" fill="#f4f6fa" font-weight="400">⑤ 빈 상품칸 · 새로 고침으로 보충</text><text x="82" y="668" font-size="18" fill="#f4f6fa" font-weight="400">필드 6칸 · 살아 있는 하수인만 교체</text><rect x="82" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="720" font-size="16" fill="#f4f6fa" font-weight="400">필드 1</text><rect x="177" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="186" y="720" font-size="16" fill="#f4f6fa" font-weight="400">필드 2</text><rect x="272" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="281" y="720" font-size="16" fill="#f4f6fa" font-weight="400">필드 3</text><rect x="367" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="376" y="720" font-size="16" fill="#f4f6fa" font-weight="400">필드 4</text><rect x="462" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="471" y="720" font-size="16" fill="#f4f6fa" font-weight="400">사망 ×</text><rect x="557" y="688" width="86" height="52" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="566" y="720" font-size="16" fill="#f4f6fa" font-weight="400">필드 6</text><text x="82" y="778" font-size="18" fill="#f4f6fa" font-weight="400">가방 3칸 · 일반 / 전설 / 포획 공용</text><rect x="82" y="798" width="138" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="91" y="831.5" font-size="16" fill="#f4f6fa" font-weight="400">가방 1</text><rect x="232" y="798" width="138" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="241" y="831.5" font-size="16" fill="#f4f6fa" font-weight="400">가방 2</text><rect x="382" y="798" width="138" height="55" rx="6" fill="#253448" stroke="#63768b" stroke-width="2" /><text x="391" y="831.5" font-size="16" fill="#f4f6fa" font-weight="400">가방 3</text><rect x="82" y="885" width="120" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="94" y="908" font-size="16" fill="#fff" font-weight="600">판매</text><rect x="214" y="885" width="233" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="226" y="908" font-size="16" fill="#fff" font-weight="600">새로 고침 1코인</text><rect x="465" y="885" width="183" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="477" y="908" font-size="16" fill="#fff" font-weight="600">완료</text><text x="720" y="208" font-size="20" fill="#087e82" font-weight="700">사용자 동작 / 모달</text><text x="1250" y="202" font-size="20" fill="#087e82" font-weight="700">시스템 판정</text><rect x="805" y="230" width="270" height="42" rx="21" fill="#087e82" stroke="none" stroke-width="2" /><text text-anchor="middle" x="940" y="258" font-size="18" fill="#fff" font-weight="700">시작 · 상품행 구매 누름</text><path d="M 1475 282 L 1730 352 L 1475 422 L 1220 352 Z" fill="#fff4da" stroke="#b5761d" stroke-width="2"/><text text-anchor="middle" x="1475" y="345" font-size="15" fill="#b5761d" font-weight="700">D11</text><text text-anchor="middle" x="1475" y="374" font-size="19" fill="#172b3c" font-weight="700">잔액·잠금·신규 공간 통과?</text><polyline points="1075,251 1475,251 1475,282" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1186" y="220" width="100" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1190" y="239" font-size="17" fill="#087e82" font-weight="600">구매 요청</text><rect x="735" y="320" width="405" height="135" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" /><text x="753" y="347" font-size="15" fill="#087e82" font-weight="700">M02 / 오버레이</text><text x="753" y="378" font-size="23" fill="#172b3c" font-weight="700">구매 불가 안내</text><text x="753" y="402" font-size="17.5" fill="#586c79" font-weight="400">코인 부족 / 판매함 → M01</text><text x="753" y="426" font-size="17.5" fill="#586c79" font-weight="400">신규 종만: 가방 가득이면 구매 불가</text><polyline points="1220,352 1140,352" fill="none" stroke="#b5761d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#back)"/><rect x="1147" y="315" width="64" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1151" y="334" font-size="17" fill="#b5761d" font-weight="600">아니오</text><rect x="1220" y="485" width="510" height="155" rx="12" fill="#e7f0ed" stroke="#a1bbb4" stroke-width="2" /><text x="1238" y="512" font-size="15" fill="#087e82" font-weight="700">Y11 / 시스템</text><text x="1238" y="543" font-size="23" fill="#172b3c" font-weight="700">신규 구매 / 자동 승급 분기</text><text x="1238" y="567" font-size="17.5" fill="#586c79" font-weight="400">신규 종: 가방 빈칸 1개 필요</text><text x="1238" y="591" font-size="17.5" fill="#586c79" font-weight="400">동종: 새 칸 없이 제자리 승급</text><text x="1238" y="615" font-size="17.5" fill="#586c79" font-weight="400">가방이 가득 차도 동종 승급 가능</text><polyline points="1475,422 1475,485" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1488" y="437" width="28" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1492" y="456" font-size="17" fill="#087e82" font-weight="600">예</text><rect x="735" y="510" width="405" height="150" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" stroke-dasharray="7 4"/><text x="753" y="537" font-size="15" fill="#087e82" font-weight="700">M03 / 모달</text><text x="753" y="568" font-size="23" fill="#172b3c" font-weight="700">승급 확인 · 한 번</text><text x="753" y="592" font-size="17.5" fill="#586c79" font-weight="400">기존 별 → 결과 별 / 실제 비용</text><text x="753" y="616" font-size="17.5" fill="#586c79" font-weight="400">새 슬롯·HP 회복을 미리 표시</text><text x="753" y="640" font-size="17.5" fill="#586c79" font-weight="400">취소: M01 / 승인: 거래 요청</text><polyline points="1220,565 1140,565" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1148" y="528" width="46" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1152" y="547" font-size="17" fill="#087e82" font-weight="600">동종</text><rect x="1220" y="715" width="510" height="175" rx="12" fill="#e7f0ed" stroke="#a1bbb4" stroke-width="2" /><text x="1238" y="742" font-size="15" fill="#087e82" font-weight="700">Y12 / 시스템</text><text x="1238" y="773" font-size="23" fill="#172b3c" font-weight="700">거래 수락 · 전부 적용*</text><text x="1238" y="797" font-size="17.5" fill="#586c79" font-weight="400">코인 차감 + 누적 지불액 가산</text><text x="1238" y="821" font-size="17.5" fill="#586c79" font-weight="400">신규 → 가방 / 승급 → 제자리</text><text x="1238" y="845" font-size="17.5" fill="#586c79" font-weight="400">정기 상점: 산 상품행은 빈칸</text><text x="1238" y="869" font-size="17.5" fill="#586c79" font-weight="400">판매 이력 종: 기록 HP 비율 우선*</text><polyline points="1140,625 1180,625 1180,770 1220,770" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1106" y="681" width="46" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1110" y="700" font-size="17" fill="#087e82" font-weight="600">승인</text><polyline points="1730,560 1755,560 1755,685 1475,685 1475,715" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1536" y="658" width="82" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1540" y="677" font-size="17" fill="#087e82" font-weight="600">신규 종</text><polyline points="1220,835 710,835 710,973 365,973 365,950" fill="none" stroke="#b5761d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#back)"/><rect x="753" y="941" width="370" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="757" y="960" font-size="17" fill="#b5761d" font-weight="600">성공 / 거부 안내 후 M01로 복귀</text><rect x="60" y="1010" width="610" height="240" rx="16" fill="#17212e" stroke="#52657a" stroke-width="2" /><text x="80" y="1040" font-size="20" fill="#f4f6fa" font-weight="700">M03 · 승급 확인 / 배치 예시</text><text x="85" y="1075" font-size="24" fill="#f4f6fa" font-weight="700">새끼 화룡  ★1 → ★2</text><text x="85" y="1113" font-size="19" fill="#f4f6fa" font-weight="400">1코인 · 스킬 1칸 개방 · 최대 HP 회복*</text><rect x="85" y="1180" width="230" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="97" y="1203" font-size="16" fill="#fff" font-weight="600">취소</text><rect x="339" y="1180" width="305" height="34" rx="6" fill="#246e78" stroke="none" stroke-width="2" /><text x="351" y="1203" font-size="16" fill="#fff" font-weight="600">1코인으로 승급</text><rect x="730" y="1010" width="1000" height="172" rx="12" fill="#fff" stroke=" #d7ded9" stroke-width="2" /><text x="748" y="1040" font-size="21" fill="#172b3c" font-weight="700">승급 가격과 등장 제한</text><text x="748" y="1072" font-size="18" fill="#586c79" font-weight="400">차액 = 진열 등급가 − 현재 등급가* · 동급 합성은 진열 정가로 한 등급 상승</text><text x="748" y="1100" font-size="18" fill="#586c79" font-weight="400">★1 → ★4는 3코인 추가 / ★2 + ★2는 2코인 지불 → ★3, 누적 4코인</text><text x="748" y="1128" font-size="18" fill="#586c79" font-weight="400">보유 동종 하위 등급·최대 등급(일반★4 / 전설★5)은 진열 제외</text><text x="748" y="1156" font-size="18" fill="#586c79" font-weight="400">후보 고갈*: 같은 회차 다른 등급 재추첨 → 두 등급 모두 없으면 빈칸</text><text x="60" y="1300" font-size="27" fill="#172b3c" font-weight="700">상점 안에서 이어지는 세 가지 조작</text><rect x="60" y="1340" width="450" height="155" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" stroke-dasharray="7 4"/><text x="78" y="1367" font-size="15" fill="#087e82" font-weight="700">M04 / 모달</text><text x="78" y="1398" font-size="23" fill="#172b3c" font-weight="700">교체 대상 선택</text><text x="78" y="1422" font-size="17.5" fill="#586c79" font-weight="400">가방 말 → 살아 있는 필드 말</text><text x="78" y="1446" font-size="17.5" fill="#586c79" font-weight="400">사망 칸·왕·동료 대상 불가</text><text x="78" y="1470" font-size="17.5" fill="#586c79" font-weight="400">선택 취소 → M01</text><path d="M 725 1350 L 885 1415 L 725 1480 L 565 1415 Z" fill="#fff4da" stroke="#b5761d" stroke-width="2"/><text text-anchor="middle" x="725" y="1408" font-size="15" fill="#b5761d" font-weight="700">D12</text><text text-anchor="middle" x="725" y="1437" font-size="19" fill="#172b3c" font-weight="700">생존 하수인?</text><polyline points="510,1414 565,1414" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="512" y="1376" width="46" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="516" y="1395" font-size="17" fill="#087e82" font-weight="600">선택</text><rect x="960" y="1340" width="770" height="155" rx="12" fill="#e7f0ed" stroke="#a1bbb4" stroke-width="2" /><text x="978" y="1367" font-size="15" fill="#087e82" font-weight="700">Y13 / 시스템</text><text x="978" y="1398" font-size="23" fill="#172b3c" font-weight="700">1:1 교체 후 M01</text><text x="978" y="1422" font-size="17.5" fill="#586c79" font-weight="400">같은 보드 위치 · HP 동결, 회복 없음 · 횟수 제한 없음</text><text x="978" y="1446" font-size="17.5" fill="#586c79" font-weight="400">공개된 말은 공개 유지 / 새 비공개 말은 교체 표식만</text><text x="978" y="1470" font-size="17.5" fill="#586c79" font-weight="400">사망 칸은 회복·충원 불가 / 시너지는 들어온 말로 집계</text><polyline points="885,1414 960,1414" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="903" y="1376" width="28" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="907" y="1395" font-size="17" fill="#087e82" font-weight="600">예</text><polyline points="720,1480 720,1520 286,1520 286,1495" fill="none" stroke="#b5761d" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#back)"/><rect x="372" y="1492" width="208" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="376" y="1511" font-size="17" fill="#b5761d" font-weight="600">아니오 → 다시 선택</text><rect x="60" y="1570" width="450" height="170" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" stroke-dasharray="7 4"/><text x="78" y="1597" font-size="15" fill="#087e82" font-weight="700">M05 / 모달</text><text x="78" y="1628" font-size="23" fill="#172b3c" font-weight="700">가방 말 판매 확인</text><text x="78" y="1652" font-size="17.5" fill="#586c79" font-weight="400">필드 말은 먼저 M04에서 교체</text><text x="78" y="1676" font-size="17.5" fill="#586c79" font-weight="400">판매가 = 누적 지불액 100%*</text><text x="78" y="1700" font-size="17.5" fill="#586c79" font-weight="400">포획 원장 0 / 전설 10코인</text><text x="78" y="1724" font-size="17.5" fill="#586c79" font-weight="400">취소 → M01 / 승인 → 판매</text><rect x="590" y="1570" width="1140" height="170" rx="12" fill="#e7f0ed" stroke="#a1bbb4" stroke-width="2" /><text x="608" y="1597" font-size="15" fill="#087e82" font-weight="700">Y14 / 시스템</text><text x="608" y="1628" font-size="23" fill="#172b3c" font-weight="700">환급 · 같은 오픈 잠금 · 다음 오픈 HP 기록*</text><text x="608" y="1652" font-size="17.5" fill="#586c79" font-weight="400">가방에서 제거 + 환급 → M01. 해당 종은 이번 오픈 진열·재구매 금지</text><text x="608" y="1676" font-size="17.5" fill="#586c79" font-weight="400">이미 진열된 상품행도 즉시 “판매함” 잠금. 새로 고침으로 풀리지 않음</text><text x="608" y="1700" font-size="17.5" fill="#586c79" font-weight="400">판매 당시 HP 비율 기록 → 이후 재구매 HP = 새 최대 HP × 기록 비율, 반올림</text><text x="608" y="1724" font-size="17.5" fill="#586c79" font-weight="400">다음 오픈에는 다시 구매 가능. 이후 정상 승급은 최대 HP로 회복*</text><polyline points="510,1655 590,1655" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="517" y="1619" width="46" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="521" y="1638" font-size="17" fill="#087e82" font-weight="600">승인</text><rect x="60" y="1810" width="450" height="180" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" stroke-dasharray="7 4"/><text x="78" y="1837" font-size="15" fill="#087e82" font-weight="700">M06 / 모달</text><text x="78" y="1868" font-size="23" fill="#172b3c" font-weight="700">새로 고침 / 티켓 확인</text><text x="78" y="1892" font-size="17.5" fill="#586c79" font-weight="400">새로 고침: 1코인, 횟수 무제한</text><text x="78" y="1916" font-size="17.5" fill="#586c79" font-weight="400">티켓: 생존 왕·동료만 대상</text><text x="78" y="1940" font-size="17.5" fill="#586c79" font-weight="400">현재와 다른 속성 선택 → 확인</text><text x="78" y="1964" font-size="17.5" fill="#586c79" font-weight="400">티켓 취소 → M01</text><rect x="590" y="1810" width="560" height="180" rx="12" fill="#e7f0ed" stroke="#a1bbb4" stroke-width="2" /><text x="608" y="1837" font-size="15" fill="#087e82" font-weight="700">Y15 / 시스템</text><text x="608" y="1868" font-size="23" fill="#172b3c" font-weight="700">잔액·대상 검사 후 M01</text><text x="608" y="1892" font-size="17.5" fill="#586c79" font-weight="400">새로 고침: 진열 전부 교체*</text><text x="608" y="1916" font-size="17.5" fill="#586c79" font-weight="400">시작만: 지출 뒤 코인 ≥ 빈 필드 수</text><text x="608" y="1940" font-size="17.5" fill="#586c79" font-weight="400">티켓: 속성+스킬 변경, HP 유지</text><text x="608" y="1964" font-size="17.5" fill="#586c79" font-weight="400">부적합·잔액 부족: 적용 없이 복귀</text><polyline points="510,1890 590,1890" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="520" y="1854" width="46" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="524" y="1873" font-size="17" fill="#087e82" font-weight="600">누름</text><rect x="1220" y="1810" width="510" height="180" rx="12" fill="#fff" stroke="#087e82" stroke-width="2" /><text x="1238" y="1837" font-size="15" fill="#087e82" font-weight="700">M07 / 오버레이</text><text x="1238" y="1868" font-size="23" fill="#172b3c" font-weight="700">완료 · 마감 · 연결 끊김</text><text x="1238" y="1892" font-size="17.5" fill="#586c79" font-weight="400">완료 → 상대 완료까지 대기</text><text x="1238" y="1916" font-size="17.5" fill="#586c79" font-weight="400">만료 → 미확정 취소 / 확정 보존</text><text x="1238" y="1940" font-size="17.5" fill="#586c79" font-weight="400">재연결 → 수락 상태 복구*</text><text x="1238" y="1964" font-size="17.5" fill="#586c79" font-weight="400">이미 닫혔으면 보드 / 몰수면 결과</text><rect x="1325" y="2030" width="300" height="42" rx="21" fill="#087e82" stroke="none" stroke-width="2" /><text text-anchor="middle" x="1475" y="2058" font-size="18" fill="#fff" font-weight="700">종료 · S03 보드 / S04 결과</text><polyline points="1475,1990 1475,2030" fill="none" stroke="#087e82" stroke-width="2.5"  marker-end="url(#arr)"/><rect x="1506" y="1996" width="190" height="26" rx="3" fill="#f7f5ef" stroke="none" stroke-width="2" /><text x="1510" y="2015" font-size="17" fill="#087e82" font-weight="600">양측 닫힘 / 몰수</text><text x="60" y="2050" font-size="18" fill="#586c79" font-weight="400">시스템 주석*: 온라인 요청 ID·진열 번호 검증 / 서버 시각 마감 / 수락 전에는 확정 아님 / 연타 즉시 잠금.</text><text x="60" y="2084" font-size="18" fill="#586c79" font-weight="400">M01 어디서든 완료·시간 초과는 M07. 연결 끊김 시 기존 이탈 규칙; 수락 거래 유지 → 몰수 판정 → 종료.</text></g></svg>
